# Robô de testes do Simplificando: roda a cada mudança enviada ao GitHub.
# Se tudo passar na main, move o ramo "aprovado" para esta versão; o "Atualizar agora" do painel só instala o que está em "aprovado".
# Se algo falhar, a versão não é aprovada (não chega ao site) e o relatório com as fotos fica em Actions › esta rodada › Artifacts.
name: Robô de testes
on:
  push:
    branches-ignore: [aprovado]
  pull_request:
  workflow_dispatch:
    inputs:
      atualizar_fotos:
        description: 'Tirar de novo as fotos das telas (use quando uma tela mudou de propósito)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: robo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  robo:
    name: Robô de testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: testes/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: O site gerado bate com o código (src/ → site/)
        run: |
          python3 tools/build_site.py
          python3 tools/build_painel_teste.py
          git diff --exit-code -- site produto src VERSAO.txt || (echo "::error::O site não foi gerado de novo depois de mudar src/ (rode tools/build_site.py)"; exit 1)
      - name: Instala o robô
        working-directory: testes
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: emulador-firebase-15.34.2
      - name: Tira as fotos novas das telas (só quando pedido) e guarda no projeto
        if: github.event_name == 'workflow_dispatch' && inputs.atualizar_fotos
        working-directory: testes
        run: |
          npm run fotos
          git config user.name "Robô de testes"
          git config user.email "robo@simplificandoeduca.com"
          git add fotos
          git diff --cached --quiet || (git commit -m "Robô: fotos novas das telas" && git push origin HEAD:${{ github.ref_name }})
      - name: Roda o robô (app do aluno, painel, regras do Firebase, servidor de avisos e fotos das telas)
        working-directory: testes
        run: php -v && npm test
      - name: Guarda o relatório e as fotos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-do-robo
          path: |
            testes/relatorio
            testes/resultados
          retention-days: 14
      - name: Aprova esta versão (o site só instala versão aprovada)
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: git push --force origin HEAD:refs/heads/aprovado
      # Atualização automática: com a chave salva nos Secrets do GitHub (ATUALIZAR_CHAVE, a mesma que o painel gerou em
      # Ajustes), o GitHub chama o atualizar.php e o site instala sozinho a versão que acabou de ser aprovada.
      # Sem a chave, não faz nada (o site espera o botão "Atualizar agora"). Se o site não responder, só avisa: o robô continua verde.
      - name: Atualiza o site sozinho (atualização automática)
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CHAVE: ${{ secrets.ATUALIZAR_CHAVE }}
        run: |
          if [ -z "$CHAVE" ]; then echo "Sem a chave ATUALIZAR_CHAVE nos Secrets do GitHub: o site espera o botão Atualizar agora."; exit 0; fi
          sleep 20
          for i in 1 2 3; do
            R=$(curl -sS -m 150 -X POST --data-urlencode "chave=$CHAVE" "https://simplificandoeduca.com/atualizar.php?acao=atualizar" || true)
            if echo "$R" | grep -q '"ok":true'; then echo "Site atualizado: $R"; exit 0; fi
            echo "Tentativa $i: $R"; sleep 70
          done
          echo "::warning::Não deu para atualizar o site sozinho. Use o botão Atualizar agora no painel (Ajustes)."
