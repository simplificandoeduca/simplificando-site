<title>Play Space Horas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: trilho de vidro à esquerda (barra embaixo no celular), faixa listrada de menta no topo de cada tela,
   cartões creme sobre fundo creme, folhas que sobem de baixo como no iPhone; no desktop largo, o painel "Hoje" na direita. */
:root {
  --creme: #FAF3E9; --creme-2: #FFFBF4; --menta: #DBE8DA; --menta-risco: #EEF3EA; --pessego: #F5BEA9; --pessego-2: #FCE3D8;
  --mostarda: #F0BB5F; --mostarda-2: #FBECC8; --coral: #E25B3F; --coral-2: #F9D9D0; --verde-agua: #8FBFB0; --verde-agua-2: #DDEEE8;
  --tinta: #3B3B3B; --tinta-2: #6B655E; --apagado: #A39B91; --borda: rgba(59, 59, 59, .09); --borda-2: rgba(59, 59, 59, .16);
  --card: #FFFBF4; --vidro: rgba(255, 251, 244, .78); --vidro-borda: rgba(255, 255, 255, .9); --sobre-tile: #3B3B3B;
  --ok: #3F8F5E; --ok-bg: #DDEFE3; --aviso: #A86A0A; --aviso-bg: #FBECC8; --erro: #B8402A; --erro-bg: #F9D9D0;
  --sombra: 0 1px 2px rgba(59, 59, 59, .04), 0 16px 40px rgba(120, 80, 50, .10); --escurece: rgba(59, 50, 40, .38);
  --display: "Poppins", "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --texto: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --raio: 22px; --ios: cubic-bezier(.32, .72, 0, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --creme: #221E1B; --creme-2: #2C2724; --menta: #2E3A32; --menta-risco: #37453B; --pessego: #8A5A4A; --pessego-2: #3A2C27;
    --mostarda: #C99A3F; --mostarda-2: #3B3222; --coral: #F07A5E; --coral-2: #44302A; --verde-agua: #6FA394; --verde-agua-2: #28352F;
    --tinta: #F3ECE2; --tinta-2: #BDB3A7; --apagado: #857C72; --borda: rgba(255, 255, 255, .09); --borda-2: rgba(255, 255, 255, .16);
    --card: #2C2724; --vidro: rgba(44, 39, 36, .82); --vidro-borda: rgba(255, 255, 255, .1); --sobre-tile: #F3ECE2;
    --ok: #7FD19A; --ok-bg: #263A2E; --aviso: #F0C068; --aviso-bg: #3B3222; --erro: #F49A86; --erro-bg: #44302A;
    --sombra: 0 16px 40px rgba(0, 0, 0, .45); --escurece: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --creme: #221E1B; --creme-2: #2C2724; --menta: #2E3A32; --menta-risco: #37453B; --pessego: #8A5A4A; --pessego-2: #3A2C27;
  --mostarda: #C99A3F; --mostarda-2: #3B3222; --coral: #F07A5E; --coral-2: #44302A; --verde-agua: #6FA394; --verde-agua-2: #28352F;
  --tinta: #F3ECE2; --tinta-2: #BDB3A7; --apagado: #857C72; --borda: rgba(255, 255, 255, .09); --borda-2: rgba(255, 255, 255, .16);
  --card: #2C2724; --vidro: rgba(44, 39, 36, .82); --vidro-borda: rgba(255, 255, 255, .1); --sobre-tile: #F3ECE2;
  --ok: #7FD19A; --ok-bg: #263A2E; --aviso: #F0C068; --aviso-bg: #3B3222; --erro: #F49A86; --erro-bg: #44302A;
  --sombra: 0 16px 40px rgba(0, 0, 0, .45); --escurece: rgba(0, 0, 0, .55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--creme); color: var(--tinta); font: 15px/1.45 var(--texto); -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
body.travado { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
svg { display: block; }
.tap { transition: transform .35s var(--spring), background .2s, opacity .2s; }
.tap:active { transform: scale(.965); }

/* ---------- casca ---------- */
.app { display: flex; min-height: 100%; }
.trilho { display: none; }
.conteudo { flex: 1; min-width: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 120px; }
.miolo { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.hoje { display: none; }
@media (min-width: 820px) {
  .trilho { display: block; position: sticky; top: 0; height: 100vh; flex: none; padding: 18px 0 18px max(18px, env(safe-area-inset-left, 0px)); }
  .trilho nav { width: 92px; height: 100%; border-radius: 30px; background: var(--vidro); border: 1px solid var(--vidro-borda); box-shadow: var(--sombra); backdrop-filter: blur(20px); display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 0 14px; }
  .trilho .logo { width: 46px; height: 46px; margin-bottom: 8px; }
  .trilho .ab { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; color: var(--tinta-2); position: relative; }
  .trilho .ab:hover { background: var(--menta); }
  .trilho .ab[aria-current] { background: var(--tinta); color: var(--creme); }
  .trilho .ab b { position: absolute; top: 6px; right: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--coral); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; font-family: var(--display); }
  .trilho .espaco { flex: 1; }
  .trilho .av-eu { width: 44px; height: 44px; border-radius: 50%; background: var(--mostarda); color: #3B3B3B; font-weight: 800; display: grid; place-items: center; font-family: var(--display); }
  .conteudo { padding-left: 32px; padding-right: 32px; padding-block: 26px 60px; }
  .barra { display: none !important; }
}
@media (min-width: 1360px) {
  .hoje { display: block; position: sticky; top: 0; height: 100vh; flex: none; width: 340px; padding: 18px max(18px, env(safe-area-inset-right, 0px)) 18px 0; }
  .hoje > div { height: 100%; border-radius: 30px; background: var(--vidro); border: 1px solid var(--vidro-borda); box-shadow: var(--sombra); backdrop-filter: blur(20px); padding: 22px 18px; display: flex; flex-direction: column; gap: 14px; overflow: auto; }
}
.barra { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; padding: 8px max(8px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); background: var(--vidro); border-top: 1px solid var(--vidro-borda); backdrop-filter: blur(20px); display: flex; justify-content: space-around; }
.barra button { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 700; color: var(--tinta-2); padding: 6px 4px; border-radius: 14px; position: relative; flex: 1; max-width: 86px; }
.barra button[aria-current] { color: var(--tinta); background: var(--menta); }
.barra button b { position: absolute; top: 1px; right: calc(50% - 22px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--coral); color: #fff; font-size: 10px; display: grid; place-items: center; }
.fab { position: fixed; z-index: 21; right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 20px; background: var(--coral); color: #fff; display: grid; place-items: center; box-shadow: 0 12px 28px rgba(226, 91, 63, .35); }
@media (min-width: 820px) { .fab { bottom: 28px; } }
.fab[hidden] { display: none; }
.toast { position: fixed; z-index: 60; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--tinta); color: var(--creme); padding: 11px 18px; border-radius: 999px; font-weight: 700; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .3s, transform .45s var(--spring); max-width: calc(100% - 32px); text-align: center; display: flex; align-items: center; gap: 14px; }
.toast.ve { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { color: var(--mostarda); font-weight: 800; white-space: nowrap; padding: 4px 2px; }
.toast span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
@media (min-width: 820px) { .toast { bottom: 32px; } }

/* ---------- faixa listrada de menta (como os posts) ---------- */
.faixa { border-radius: var(--raio); padding: 18px 20px; background: repeating-linear-gradient(180deg, var(--menta) 0 22px, var(--menta-risco) 22px 26px); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; box-shadow: var(--sombra); }
.faixa .logo { width: 56px; height: 56px; flex: none; }
.faixa .tit { flex: 1; min-width: 160px; }
.faixa small { display: block; font-weight: 700; color: var(--tinta-2); font-size: 12.5px; text-transform: uppercase; letter-spacing: .08em; }
.faixa h1 { font-size: clamp(26px, 5vw, 36px); font-weight: 800; line-height: 1.05; }
.faixa .versao { display: inline-flex; align-items: center; gap: 6px; vertical-align: middle; margin-left: 10px; padding: 4px 10px 4px 9px; border-radius: 999px; background: var(--tinta); color: var(--creme); font: 800 11.5px/1.3 var(--display); letter-spacing: .04em; transform: translateY(-3px); white-space: nowrap; }
.faixa .versao svg { width: 13px; height: 13px; }
.faixa .versao.nova { background: var(--coral); color: #fff; }
.faixa .versao.nova svg { animation: gira 1.6s linear infinite; }
.faixa .versao.ocupado svg { animation: gira .9s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--coral); color: #fff; font-weight: 700; font-size: 13px; white-space: nowrap; }
.chip.suave { background: var(--creme-2); color: var(--tinta); border: 1px solid var(--borda); }
.chip .pt { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); animation: pulsa 1.6s infinite; flex: none; }
.chip .pt.off { background: var(--erro); box-shadow: 0 0 0 3px var(--erro-bg); animation: none; }
@keyframes pulsa { 50% { box-shadow: 0 0 0 6px transparent; } }

/* ---------- blocos de resumo ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 2px; min-width: 0; text-align: left; color: var(--sobre-tile); }
.tile small { font-weight: 700; font-size: 12.5px; opacity: .8; }
.tile b { font-family: var(--display); font-size: 30px; font-weight: 800; line-height: 1.1; }
.tile span { font-size: 12.5px; opacity: .75; }
.t-pessego { background: var(--pessego); } .t-mostarda { background: var(--mostarda); } .t-menta { background: var(--menta); color: var(--tinta); } .t-coral { background: var(--coral); color: #fff; }

/* ---------- seções e cartões ---------- */
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sec-cab h2 { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
.sec-cab h2 i { width: 10px; height: 10px; border-radius: 50%; background: var(--coral); display: inline-block; flex: none; }
.link { color: var(--coral); font-weight: 800; font-size: 13.5px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.card { background: var(--card); border: 1px solid var(--borda); border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; text-align: left; }
.card.vazio { align-items: center; text-align: center; color: var(--tinta-2); padding: 26px 16px; gap: 6px; }
.linha { display: flex; align-items: center; gap: 12px; min-width: 0; }
.linha .txt { flex: 1; min-width: 0; }
.linha .txt b { display: block; font-family: var(--display); font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.linha .txt span { display: block; font-size: 13px; color: var(--tinta-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 15px; color: #3B3B3B; flex: none; }
.av.g { width: 64px; height: 64px; font-size: 22px; }
.cron { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; text-align: right; flex: none; }
.cron small { display: block; font-family: var(--texto); font-weight: 700; font-size: 11.5px; color: var(--tinta-2); margin-top: 3px; }
.pill { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 800; white-space: nowrap; flex: none; }
.p-ok { background: var(--ok-bg); color: var(--ok); } .p-aviso { background: var(--aviso-bg); color: var(--aviso); } .p-erro { background: var(--erro-bg); color: var(--erro); } .p-neutro { background: var(--menta); color: var(--tinta); }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; }
.bt { height: 40px; padding: 0 14px; border-radius: 14px; background: var(--menta); font-weight: 800; font-size: 13.5px; display: inline-flex; align-items: center; gap: 7px; transition: transform .35s var(--spring), opacity .2s; white-space: nowrap; }
.bt:active { transform: scale(.96); }
.bt.forte { background: var(--coral); color: #fff; }
.bt.claro { background: var(--creme-2); border: 1px solid var(--borda); }
.bt.largo { width: 100%; justify-content: center; height: 48px; font-size: 15px; border-radius: 16px; }
.bt svg { width: 16px; height: 16px; flex: none; }
.bt[disabled] { opacity: .45; pointer-events: none; }

/* ---------- banco de horas em bloquinhos (o logo é feito de blocos) ---------- */
.blocos { display: flex; gap: 4px; flex-wrap: wrap; }
.blocos i { width: 22px; height: 22px; border-radius: 6px; background: var(--menta-risco); border: 1px solid var(--borda); position: relative; }
.blocos i.u { border-color: transparent; }
.blocos i.u:nth-child(4n+1) { background: var(--coral); } .blocos i.u:nth-child(4n+2) { background: var(--mostarda); } .blocos i.u:nth-child(4n+3) { background: var(--pessego); } .blocos i.u:nth-child(4n) { background: var(--verde-agua); }
.blocos i.meio { background: linear-gradient(90deg, var(--pessego) var(--pct, 50%), var(--menta-risco) var(--pct, 50%)); }
.blocos i.agora { outline: 2px solid var(--coral); outline-offset: 1px; animation: pisca 1.4s infinite; }
@keyframes pisca { 50% { outline-color: transparent; } }
.saldo { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--tinta-2); }
.saldo b { font-family: var(--display); font-size: 17px; color: var(--tinta); }

/* ---------- registro de rostos / histórico ---------- */
.hoje h2 { font-size: 18px; font-weight: 800; }
.reg { display: flex; flex-direction: column; }
.reg .ev { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--borda-2); align-items: start; }
.reg .ev:last-child { border-bottom: 0; }
.reg time { font-family: var(--display); font-weight: 600; font-size: 14px; color: var(--tinta-2); }
.reg .ev b { font-weight: 800; }
.reg .ev span { display: block; font-size: 12.5px; color: var(--tinta-2); }
.reg .ev.ent b::before, .reg .ev.sai b::before, .reg .ev.venda b::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; background: var(--ok); }
.reg .ev.sai b::before { background: var(--coral); } .reg .ev.venda b::before { background: var(--mostarda); }
.marca { display: flex; align-items: center; gap: 10px; background: var(--menta); border-radius: 14px; padding: 10px 12px; font-size: 13.5px; text-align: left; }
.marca input { width: 20px; height: 20px; accent-color: var(--coral); flex: none; }
.marca svg { flex: none; }

/* ---------- agenda ---------- */
.cal-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal-cab h2 { font-size: 19px; font-weight: 800; text-transform: capitalize; }
.cal-cab .nav { display: flex; gap: 4px; }
.cal-cab .nav button { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--menta); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal .sem { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--apagado); text-align: center; font-weight: 800; padding-bottom: 2px; }
.cal .d { aspect-ratio: 1; border-radius: 12px; background: var(--creme); border: 1px solid var(--borda); padding: 5px 6px; font-size: 12.5px; font-weight: 700; color: var(--tinta-2); display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow: hidden; text-align: left; }
.cal .d.hoje-d { border-color: var(--coral); color: var(--coral); }
.cal .d.sel { background: var(--tinta); color: var(--creme); border-color: var(--tinta); }
.cal .d.fora { opacity: .3; pointer-events: none; }
.cal .d em { font-style: normal; height: 5px; border-radius: 3px; display: block; }
.cal .d .pts { display: flex; flex-direction: column; gap: 2px; margin-top: auto; }
.oficina { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--borda); border-radius: 16px; padding: 10px 14px; text-align: left; width: 100%; }
.oficina i { width: 10px; height: 10px; border-radius: 50%; background: var(--coral); flex: none; }
.oficina small { display: block; color: var(--tinta-2); font-size: 12.5px; }
.oficina b { font-family: var(--display); font-weight: 600; font-size: 16px; }
.oficina .q { margin-left: auto; font-weight: 800; color: var(--tinta-2); font-size: 13px; white-space: nowrap; }
.oficina .txt { flex: 1; min-width: 0; }

/* ---------- WhatsApp ---------- */
.zap { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 900px) { .zap { grid-template-columns: 340px 1fr; } .zap .conversas, .zap .papo { display: flex !important; } .papo .volta { display: none; } }
.conversas { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.conv { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 16px; background: var(--card); border: 1px solid var(--borda); text-align: left; width: 100%; }
.conv.ativa { background: var(--menta); }
.conv .txt b { display: block; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .conv .txt span { display: block; font-size: 13px; color: var(--tinta-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv .txt { flex: 1; min-width: 0; }
.conv .h { font-size: 12px; color: var(--apagado); font-weight: 700; white-space: nowrap; }
.conv .n { min-width: 20px; height: 20px; border-radius: 10px; background: var(--coral); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; padding: 0 6px; }
.papo { background: var(--card); border: 1px solid var(--borda); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-height: 420px; min-width: 0; }
.papo .cab { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--borda); }
.papo .cab .txt { flex: 1; min-width: 0; } .papo .cab b { font-weight: 800; display: block; } .papo .cab span { display: block; font-size: 12.5px; color: var(--tinta-2); }
.papo .volta { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--menta); flex: none; }
.msgs { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.msg { max-width: 80%; padding: 9px 13px; border-radius: 16px; font-size: 14px; line-height: 1.4; animation: surge .35s var(--ios); overflow-wrap: anywhere; }
@keyframes surge { from { opacity: 0; transform: translateY(8px) scale(.98); } }
.msg.ela { align-self: flex-start; background: var(--menta); border-bottom-left-radius: 6px; }
.msg.nos { align-self: flex-end; background: var(--pessego-2); border-bottom-right-radius: 6px; }
.msg time { display: block; font-size: 11px; color: var(--apagado); margin-top: 3px; text-align: right; }
.sug { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 8px; }
.sug button { border: 1px dashed var(--borda-2); border-radius: 14px; padding: 8px 12px; font-size: 13px; background: var(--creme); text-align: left; max-width: 100%; }
.sug small { width: 100%; font-weight: 800; font-size: 11.5px; color: var(--tinta-2); text-transform: uppercase; letter-spacing: .06em; }

/* ---------- WhatsApp ---------- */
const convDe = id => S.conversas.find(x => x.id === +id);
function sugestoes(conv) {
  const c = crianca(conv.crianca), r = hm(restante(c)), ultima = conv.msgs[conv.msgs.length - 1];
  const s = [];
  if (c.entrou) s.push(`${c.nome} está aqui desde ${hora(c.entrou)} e ainda tem ${r} no pacote. Fica tranquila!`);
  else s.push(`Oi, ${c.resp}! ${c.nome} ainda tem ${r} no pacote. Quando quiser vir, é só chegar e olhar para a câmera.`);
  if (restante(c) <= 120) s.push(`${c.resp}, o pacote de ${c.nome} está com ${r}. Quer renovar? Temos ${S.cfg.pacotes.map(p => p.h + 'h por ' + brl(p.v)).join(', ')}.`);
  if (ultima && /pacote|quanto|pre[çc]o/i.test(ultima.txt)) s.push(`Nossos pacotes: ${S.cfg.pacotes.map(p => p.h + 'h por ' + brl(p.v)).join(' · ')}. As horas não vencem e somam ao que já tem.`);
  if (ultima && /ficar|at[ée]|tr[âa]nsito/i.test(ultima.txt)) s.push(`Pode sim! Se passar do tempo do pacote a gente te avisa por aqui, combinado? 💛`);
  return s.slice(0, 3);
}
function telaZap() {
  const conv = convDe(S.zapAberta) || S.conversas[0];
  const lista = S.conversas.slice().sort((a, b) => b.msgs[b.msgs.length - 1].h - a.msgs[a.msgs.length - 1].h).map(x => { const c = crianca(x.crianca), u = x.msgs[x.msgs.length - 1]; return `<button class="conv tap ${x.id === conv.id ? 'ativa' : ''}" data-act="conversa" data-id="${x.id}">${avatar(c)}<div class="txt"><b>${esc(c.resp)} (${esc(c.rel)} de ${esc(c.nome)})</b><span>${u.de === 'nos' ? 'Você: ' : ''}${esc(u.txt)}</span></div><span class="h">${hora(u.h)}</span>${x.lidas ? '' : `<span class="n">${x.msgs.filter(m => m.de === 'ela').length}</span>`}</button>`; }).join('');
  const c = crianca(conv.crianca);
  return faixa('WhatsApp', 'Conversas com os responsáveis', `<span class="chip suave"><i class="pt"></i>Conectado · (11) 9 1234-5678</span>`) + `
  <div class="zap" data-modo="${S.zapModo}">
    <div class="conversas">${lista}</div>
    <div class="papo">
      <div class="cab"><button class="volta tap" data-act="zap-lista" aria-label="Voltar">${ic(IC.volta, 18)}</button>${avatar(c)}<div class="txt"><b>${esc(c.resp)}</b><span>${esc(c.rel)} de ${esc(c.nome)} · ${c.pacote}h compradas, restam ${hm(restante(c))}</span></div><button class="pill ${c.entrou ? 'p-ok' : 'p-neutro'} tap" data-act="ficha" data-id="${c.id}">${c.entrou ? `${esc(c.nome)} está aqui` : 'Ver ficha'}</button></div>
      <div class="msgs" id="msgs">${conv.msgs.map(m => `<div class="msg ${m.de}">${esc(m.txt)}<time>${hora(m.h)}</time></div>`).join('')}</div>
      <div class="sug"><small>Sugestões de resposta</small>${sugestoes(conv).map(s => `<button class="tap" data-act="sugestao">${esc(s)}</button>`).join('')}</div>
      <div class="escreve"><textarea id="zap-texto" rows="1" placeholder="Escreva para ${esc(c.resp)}" aria-label="Mensagem"></textarea><button class="tap" data-act="enviar" aria-label="Enviar">${ic(IC.envia, 20)}</button></div>
    </div>
  </div>`;
}
function enviar(txt) {
  const conv = convDe(S.zapAberta); if (!conv || !txt.trim()) return;
  conv.msgs.push({ de: 'nos', txt: txt.trim(), h: new Date() }); conv.lidas = true; desenhar();
  const m = $('#msgs'); if (m) m.lastElementChild.scrollIntoView({ block: 'nearest' });
}

/* ---------- Agenda ---------- */
function telaAgenda() {
  const { y, m } = S.mes, prim = new Date(y, m, 1).getDay(), dias = new Date(y, m + 1, 0).getDate(), hojeStr = isoDia(agora);
  const doMes = S.compromissos.filter(x => x.dia.startsWith(`${y}-${p2(m + 1)}`));
  let cel = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map(s => `<div class="sem">${s}</div>`).join('');
  for (let i = 0; i < prim; i++) cel += '<div class="d fora"></div>';
  for (let d = 1; d <= dias; d++) { const dia = `${y}-${p2(m + 1)}-${p2(d)}`, its = doMes.filter(x => x.dia === dia); cel += `<button class="d tap ${dia === hojeStr ? 'hoje-d' : ''} ${dia === S.diaSel ? 'sel' : ''}" data-act="dia-sel" data-dia="${dia}" aria-label="${d} de ${MESES[m]}, ${its.length} itens">${d}<div class="pts">${its.slice(0, 3).map(x => `<em style="background:${TIPOS[x.tipo][1]}"></em>`).join('')}</div></button>`; }
  const sel = new Date(S.diaSel + 'T12:00'), doDia = S.compromissos.filter(x => x.dia === S.diaSel).sort((a, b) => a.hora.localeCompare(b.hora));
  const semana = (() => { const d0 = new Date(sel); d0.setDate(d0.getDate() - d0.getDay()); const d6 = new Date(d0); d6.setDate(d0.getDate() + 6); return S.compromissos.filter(x => x.dia >= isoDia(d0) && x.dia <= isoDia(d6) && x.dia !== S.diaSel).sort((a, b) => (a.dia + a.hora).localeCompare(b.dia + b.hora)); })();
  const item = x => `<button class="oficina tap" data-act="comp" data-id="${x.id}"><i style="background:${TIPOS[x.tipo][1]}"></i><div class="txt"><small>${esc(x.sub || TIPOS[x.tipo][0])}</small><b>${esc(x.titulo)}</b></div><span class="q">${x.dia === S.diaSel ? x.hora : SEMANA[new Date(x.dia + 'T12:00').getDay()].slice(0, 3) + ' ' + +x.dia.slice(8) + ' · ' + x.hora}</span></button>`;
  return faixa('Agenda', 'Oficinas, festas e compromissos', `<button class="chip tap" data-act="novo-comp">${ic(IC.mais, 16, 2.6)} Novo</button>`) + `
  <div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
    <div class="card"><div class="cal-cab"><h2>${MESES[m]} ${y}</h2><div class="nav"><button class="tap" data-act="mes" data-n="-1" aria-label="Mês anterior">${ic(IC.volta, 18)}</button><button class="tap" data-act="mes" data-n="0" aria-label="Hoje" style="width:auto;padding:0 10px;font-weight:800;font-size:13px">Hoje</button><button class="tap" data-act="mes" data-n="1" aria-label="Próximo mês">${ic(IC.vai, 18)}</button></div></div><div class="cal">${cel}</div>
      <div class="acoes" style="gap:12px;font-size:12.5px;color:var(--tinta-2);font-weight:700">${Object.entries(TIPOS).map(([k, [n, cor]]) => `<span style="display:inline-flex;align-items:center;gap:6px"><i style="width:9px;height:9px;border-radius:50%;background:${cor};display:inline-block"></i>${n}</span>`).join('')}</div></div>
    <div class="sec sobe" id="agenda-dia"><div class="sec-cab"><h2><i></i>${S.diaSel === hojeStr ? 'Hoje' : SEMANA[sel.getDay()]}, ${sel.getDate()} de ${MESES[sel.getMonth()]}</h2><button class="link tap" data-act="novo-comp">Marcar neste dia</button></div>
      ${doDia.length ? doDia.map(item).join('') : `<div class="card vazio">${ic(IC.agenda, 26)}<b>Dia livre</b><span>Toque em "Marcar neste dia" para criar uma oficina, festa ou compromisso.</span></div>`}
      ${semana.length ? `<div class="sec-cab" style="margin-top:8px"><h2 style="font-size:16px"><i style="background:var(--mostarda)"></i>Também nesta semana</h2></div>${semana.map(item).join('')}` : ''}
    </div>
  </div>`;
}

function telaEsteira() {
  const prontosHoje = S.pedidos.filter(p => p.etapa === 3).length;
  const col = (t, i) => { const itens = S.pedidos.filter(p => p.etapa === i); return `<div class="col ${i === 3 ? 'pronto' : ''}" data-col="${i}"><h3>${t}<b>${itens.length}</b></h3>${itens.length ? itens.map(p => `<button class="brq tap ${p.novo ? 'novo' : ''}" data-act="pedido" data-id="${p.id}">${BRQ[i === 3 ? 'presente' : p.brq]}<div class="txt"><b>${esc(p.nome)}</b><span>${esc(p.cliente)}${p.obs ? ' · ' + esc(p.obs) : ''}</span></div></button>`).join('') : '<div class="nada">Nada por aqui</div>'}<div class="correia"></div></div>`; };

    <div class="dois"><div class="campo"><label for="p-cli">Cliente</label><input id="p-cli" value="${esc(p ? p.cliente : '')}" placeholder="Nome"></div><div class="campo"><label for="p-obs">Observação</label><input id="p-obs" value="${esc(p ? p.obs : '')}" placeholder="Retirada, entrega, laço…"></div></div>

function festejar(colIdx) {
  const col = $(`.col[data-col="${colIdx}"]`); if (!col) return;
  const alvo = col.getBoundingClientRect().height - 70;
  const urso = document.createElement('div'); urso.className = 'queda'; urso.style.setProperty('--ate', alvo + 'px'); urso.innerHTML = BRQ.urso; col.appendChild(urso);
  const cores = ['var(--coral)', 'var(--mostarda)', 'var(--pessego)', 'var(--verde-agua)'];
  for (let i = 0; i < 14; i++) { const c = document.createElement('i'); c.className = 'confete'; c.style.cssText = `left:${35 + Math.random() * 30}%;top:30px;background:${cores[i % 4]};--dx:${(Math.random() - .5) * 220}px;--dy:${80 + Math.random() * 160}px;animation-delay:${Math.random() * .15}s`; col.appendChild(c); }
  setTimeout(() => { urso.remove(); $$('.confete', col).forEach(x => x.remove()); }, 1400);
}

  const exemplo = min => `${hm(min)} → cobra ${hm(cobrar(min))}`;
  return faixa('Ajustes', 'Como a loja funciona', chipIdface()) + `
  <div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
    <div class="card"><div class="sec-cab"><h2 style="font-size:18px">${ic(IC.horas, 20)} Regra das horas</h2></div>
      <p class="explica">Como o tempo da criança vira débito no pacote. Vale para a leitura do rosto e para as saídas à mão.</p>
      <div class="campo"><label>Arredondamento</label>${seg('arredonda', ARREDONDA.map(([v, n]) => [v, n]), cfg.arredonda)}<span class="explica">${ARREDONDA.find(a => a[0] === cfg.arredonda)[2]}</span></div>
      <div class="campo"><label>Cortesia na entrada</label>${seg('cortesia', [[0, 'Nenhuma'], [5, '5 min'], [10, '10 min'], [15, '15 min']], cfg.cortesia)}<span class="explica">Os primeiros minutos não contam, para a criança tirar o sapato e se acomodar.</span></div>
      <div class="campo"><label>Tempo mínimo por visita</label>${seg('minimo', [[0, 'Nenhum'], [30, '30 min'], [60, '1 hora']], cfg.minimo)}<span class="explica">Mesmo uma passada rápida debita pelo menos isso.</span></div>
      <div class="campo"><label>Avisar quando restar</label>${seg('aviso', [[30, '30 min'], [60, '1 hora'], [120, '2 horas']], cfg.aviso)}<span class="explica">O pacote fica marcado como "Acabando" e a equipe pode avisar o responsável.</span></div>
      <div class="marca">${ic(IC.sino, 18)}<span><b>Na prática, hoje:</b> ${exemplo(8)} · ${exemplo(47)} · ${exemplo(95)} · ${exemplo(130)}</span></div>
    </div>
    <div class="sec">
      <div class="card"><div class="sec-cab"><h2 style="font-size:18px">${ic(IC.presente, 20)} Pacotes de horas</h2><button class="link tap" data-act="pacote-novo">Novo pacote</button></div>
        <div class="grupo">${cfg.pacotes.map((p, i) => `<div class="it"><div class="txt"><b>${p.h} horas</b><span>${brl(Math.round(p.v / p.h))} por hora</span></div><div class="campo" style="width:120px"><input type="number" inputmode="numeric" aria-label="Preço do pacote de ${p.h} horas" value="${p.v}" data-preco="${i}" style="min-height:40px;text-align:right"></div><button class="fechar tap" data-act="pacote-apagar" data-i="${i}" aria-label="Apagar pacote">${ic(IC.x, 16, 2.4)}</button></div>`).join('')}</div>
      </div>
      <div class="card"><div class="sec-cab"><h2 style="font-size:18px">${ic(IC.rosto, 20)} iDFace</h2><span class="pill ${cfg.idface.ligado ? 'p-ok' : 'p-erro'}">${cfg.idface.ligado ? 'Lendo' : 'Desligado'}</span></div>
        <button class="grupo tap" data-act="idface" style="width:100%"><div class="it"><div class="txt"><b>${esc(cfg.idface.nome)} · ${esc(cfg.idface.ip)}</b><span>Toque para configurar, baixar o conector ou simular um rosto</span></div><span class="vai">${ic(IC.vai, 18)}</span></div></button>
      </div>
      <div class="card"><div class="sec-cab"><h2 style="font-size:18px">Equipe</h2><button class="link tap" data-act="equipe-novo">Nova pessoa</button></div>
        <div class="grupo">${S.equipe.map(u => `<button class="it tap" data-act="equipe-editar" data-id="${u.id}"><span class="av" style="background:${CORES[u.id % CORES.length]};width:38px;height:38px;font-size:13px">${esc(u.nome.split(' ').map(n => n[0]).slice(0, 2).join(''))}</span><div class="txt"><b>${esc(u.nome)}</b><span>${esc(u.papel)} · entra como ${esc(u.login)}</span></div><span class="vai">${ic(IC.vai, 18)}</span></button>`).join('')}</div>
        <p class="explica">Gerente vê tudo e mexe nos ajustes. Recepção vende horas e cadastra crianças. Monitor só acompanha quem está no espaço.</p>
      </div>
      <div class="card"><div class="sec-cab"><h2 style="font-size:18px">Aparência</h2></div>${seg('tema', [['sistema', 'Como o celular'], ['claro', 'Claro'], ['escuro', 'Escuro']], cfg.tema)}</div>
    </div>
  </div>
  <p class="rodape"><b>Play Space Horas</b> v${VERSAO} · protótipo</p>`;
}
function folhaEquipe(u) {
  abrirFolha(u ? 'Editar pessoa' : 'Nova pessoa', `
    <div class="campo"><label for="e-nome">Nome</label><input id="e-nome" value="${esc(u ? u.nome : '')}"></div>
    <div class="dois"><div class="campo"><label for="e-login">Entra como</label><input id="e-login" value="${esc(u ? u.login : '')}" placeholder="apelido curto" autocapitalize="off"></div><div class="campo"><label for="e-papel">Papel</label><select id="e-papel">${['Gerente', 'Recepção', 'Monitor'].map(p => `<option ${u && u.papel === p ? 'selected' : ''}>${p}</option>`).join('')}</select></div></div>
    ${u ? '' : '<div class="campo"><label for="e-senha">Senha inicial</label><input id="e-senha" type="password" placeholder="Ela troca no primeiro acesso"></div>'}
    <div class="acoes"><button class="bt forte tap" data-act="equipe-salvar" data-id="${u ? u.id : ''}" style="flex:1;justify-content:center">${ic(IC.check)} Salvar</button>${u ? `<button class="bt claro tap" data-act="equipe-apagar" data-id="${u.id}" style="color:var(--erro)">Remover</button>` : ''}</div>`);
}

/* ---------- desenhar e reagir ---------- */
function desenhar() {
  nav();
  $('#miolo').innerHTML = ({ horas: telaHoras, zap: telaZap, agenda: telaAgenda, esteira: telaEsteira, ajustes: telaAjustes })[S.tela]();
  $('#hoje').innerHTML = painelHoje();
  $('#fab').hidden = S.tela !== 'horas';
  if (S.tela === 'zap') { const m = $('#msgs'); if (m && m.lastElementChild) m.lastElementChild.scrollIntoView({ block: 'nearest' }); }
}
const val = id => ($('#' + id) || { value: '' }).value.trim();
const ACOES = {
  ficha: el => folhaFicha(el.dataset.id),
  atualizar: () => ATU.nova ? folhaAtualizar() : conferirAtualizacao(true),
  'atualizar-agora': el => atualizarAgora(el),
  desfazer: () => { if (DESFAZ) { DESFAZ(); DESFAZ = null; } $('#toast').classList.remove('ve'); fecharFolha(); desenhar(); setTimeout(() => toast('Desfeito'), 50); },
  'saida-rapida': el => { saida(crianca(el.dataset.id), 'mão'); desenhar(); },
  'entrada-rapida': el => { entrada(crianca(el.dataset.id), 'mão'); desenhar(); },
  vender: el => folhaVender(el.dataset.id),
  'vender-ok': el => { vender(crianca(el.dataset.id), S.cfg.pacotes[+el.dataset.i]); fecharFolha(); desenhar(); },
  entrada: el => { entrada(crianca(el.dataset.id), 'mão'); fecharFolha(); desenhar(); },
  saida: el => { saida(crianca(el.dataset.id), 'mão'); fecharFolha(); desenhar(); },
  simular: el => { const c = crianca(el.dataset.id); if (c.entrou) saida(c); else entrada(c); fecharFolha(); desenhar(); },
  avisar: el => { const c = crianca(el.dataset.id); let conv = S.conversas.find(x => x.crianca === c.id); if (!conv) { conv = { id: novoId(), crianca: c.id, lidas: true, msgs: [] }; S.conversas.push(conv); } S.zapAberta = conv.id; S.zapModo = 'papo'; fecharFolha(); trocarTela('zap'); const t = $('#zap-texto'); if (t) { t.value = c.entrou ? `Oi, ${c.resp}! ${c.nome} está aqui desde ${hora(c.entrou)} e ainda tem ${hm(restante(c))} no pacote.` : `Oi, ${c.resp}! O pacote de ${c.nome} está com ${hm(restante(c))}. Quer renovar?`; t.focus(); } },
  rosto: el => { const c = crianca(el.dataset.id); c.rosto = true; toast(`${c.nome} mandada para o iDFace. Agora é só olhar para a câmera.`, () => { c.rosto = false; }); fecharFolha(); desenhar(); },
  editar: el => folhaCrianca(crianca(el.dataset.id)),
  nova: () => folhaCrianca(null),
  'salvar-crianca': el => {
    const nome = val('f-nome'); if (!nome) { toast('Falta o nome da criança'); $('#f-nome').focus(); return; }
    if (el.dataset.id) { const c = crianca(el.dataset.id); Object.assign(c, { nome, idade: +val('f-idade') || c.idade, resp: val('f-resp') || c.resp, rel: val('f-rel'), tel: val('f-tel'), obs: val('f-obs') }); toast('Cadastro salvo'); }
    else { const pac = S.cfg.pacotes[+val('f-pacote')] || S.cfg.pacotes[0], c = { id: novoId(), nome, idade: +val('f-idade') || 5, resp: val('f-resp') || 'Responsável', rel: val('f-rel'), tel: val('f-tel'), obs: val('f-obs'), pacote: pac.h, usado: 0, entrou: null, rosto: $('#f-idface').checked, visitas: [] }; S.criancas.push(c); registrar('venda', c.nome, `Pacote de ${pac.h}h vendido · ${brl(pac.v)}`); toast(c.rosto ? `${nome} cadastrada. Em até 1 minuto o nome aparece no iDFace.` : `${nome} cadastrada`); }
    fecharFolha(); desenhar();
  },
  dia: () => folhaDia(), todas: () => folhaLista(), acabando: () => folhaLista('acabando'),
  idface: () => folhaIdface(),
  'idface-salvar': () => { S.cfg.idface.ip = val('i-ip'); S.cfg.idface.nome = val('i-nome') || 'Recepção'; toast('iDFace salvo'); fecharFolha(); desenhar(); },
  'idface-toggle': () => { S.cfg.idface.ligado = !S.cfg.idface.ligado; toast(S.cfg.idface.ligado ? 'Leitura ligada' : 'Leitura desligada'); fecharFolha(); desenhar(); },
  'idface-bat': () => toast('No sistema de verdade, baixa o conector com IP e chave já preenchidos'),
  conta: () => abrirFolha('Camila Duarte', `<div class="marca">${ic(IC.check, 18)}<span><b>Gerente</b> · entrou hoje às 09:02 pelo celular</span></div><div class="acoes"><button class="bt tap" data-act="ir-ajustes">${ic(IC.ajustes)} Ajustes</button><button class="bt claro tap" data-act="fechar">Sair da conta</button></div>`),
  'ir-ajustes': () => { fecharFolha(); trocarTela('ajustes'); }, fechar: () => fecharFolha(),
  conversa: el => { const c = convDe(el.dataset.id); c.lidas = true; S.zapAberta = c.id; S.zapModo = 'papo'; desenhar(); $('.papo').animate([{ opacity: 0, transform: 'translateX(24px)' }, { opacity: 1, transform: 'none' }], { duration: 360, easing: 'cubic-bezier(.32,.72,0,1)' }); },
  'zap-lista': () => { S.zapModo = 'lista'; desenhar(); },
  sugestao: el => { const t = $('#zap-texto'); t.value = el.textContent; t.focus(); t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; },
  enviar: () => { const t = $('#zap-texto'); enviar(t.value); toast('Enviado no WhatsApp'); },
  'dia-sel': el => { S.diaSel = el.dataset.dia; desenhar(); },
  mes: el => { const n = +el.dataset.n; if (n === 0) { S.mes = { y: agora.getFullYear(), m: agora.getMonth() }; S.diaSel = isoDia(agora); } else { const d = new Date(S.mes.y, S.mes.m + n, 1); S.mes = { y: d.getFullYear(), m: d.getMonth() }; S.diaSel = isoDia(d); } desenhar(); $('.cal').animate([{ opacity: .3, transform: `translateX(${n * 18}px)` }, { opacity: 1, transform: 'none' }], { duration: 340, easing: 'cubic-bezier(.32,.72,0,1)' }); },
  comp: el => folhaComp(el.dataset.id), 'novo-comp': () => folhaNovoComp(null),
  'comp-editar': el => { const x = S.compromissos.find(c => c.id === +el.dataset.id); fecharFolha(); setTimeout(() => folhaNovoComp(x), 200); },
  'comp-apagar': el => { S.compromissos = S.compromissos.filter(c => c.id !== +el.dataset.id); toast('Apagado'); fecharFolha(); desenhar(); },
  'comp-zap': el => { const x = S.compromissos.find(c => c.id === +el.dataset.id); toast(`"${x.titulo}" pronto para mandar aos responsáveis`); fecharFolha(); },
  'comp-salvar': el => {
    const titulo = val('c-tit'); if (!titulo) { toast('Falta dizer o quê'); $('#c-tit').focus(); return; }
    const tipo = ($('#c-tipo [aria-pressed="true"]') || {}).dataset.seg || 'oficina', dia = val('c-dia') || S.diaSel, hora_ = val('c-hora') || '15:00', obs = val('c-obs');
    if (el.dataset.id) Object.assign(S.compromissos.find(c => c.id === +el.dataset.id), { titulo, tipo, dia, hora: hora_, obs }); else S.compromissos.push({ id: novoId(), titulo, tipo, dia, hora: hora_, obs, sub: TIPOS[tipo][0] });
    S.diaSel = dia; const d = new Date(dia + 'T12:00'); S.mes = { y: d.getFullYear(), m: d.getMonth() }; toast('Marcado na agenda'); fecharFolha(); desenhar();
  },
  pedido: el => folhaPedido(el.dataset.id), 'novo-pedido': () => folhaNovoPedido(null),
  'pedido-editar': el => { const p = S.pedidos.find(x => x.id === +el.dataset.id); fecharFolha(); setTimeout(() => folhaNovoPedido(p), 200); },
  'pedido-salvar': el => {
    const nome = val('p-nome'); if (!nome) { toast('Falta dizer o que é'); $('#p-nome').focus(); return; }
    const brq = ($('#p-brq [aria-pressed="true"]') || {}).dataset.seg || 'urso';
    if (el.dataset.id) Object.assign(S.pedidos.find(x => x.id === +el.dataset.id), { nome, brq, cliente: val('p-cli'), obs: val('p-obs') }); else S.pedidos.push({ id: novoId(), nome, brq, cliente: val('p-cli') || 'Cliente', obs: val('p-obs'), etapa: 0, novo: true });
    toast(el.dataset.id ? 'Pedido salvo' : 'Na esteira!'); fecharFolha(); desenhar();
  },
  etapa: el => { const p = S.pedidos.find(x => x.id === +el.dataset.id), e = +el.dataset.e; if (e === p.etapa) return; p.etapa = e; p.novo = true; fecharFolha(); desenhar(); if (e === 3) { festejar(3); toast(`${p.nome} virou presente! Avise ${p.cliente}.`); } },
  entregue: el => { const p = S.pedidos.find(x => x.id === +el.dataset.id); S.pedidos = S.pedidos.filter(x => x.id !== p.id); toast(`${p.nome} entregue para ${p.cliente}`); fecharFolha(); desenhar(); },
  'pedido-zap': el => { const p = S.pedidos.find(x => x.id === +el.dataset.id); toast(`Mensagem pronta para ${p.cliente}: "${p.nome} está pronto!"`); fecharFolha(); },
  'pacote-novo': () => { S.cfg.pacotes.push({ h: 30, v: 1100 }); S.cfg.pacotes.sort((a, b) => a.h - b.h); toast('Pacote de 30h criado, ajuste o preço'); desenhar(); },
  'pacote-apagar': el => { if (S.cfg.pacotes.length <= 1) { toast('Deixe pelo menos um pacote'); return; } S.cfg.pacotes.splice(+el.dataset.i, 1); desenhar(); },
  'equipe-novo': () => folhaEquipe(null), 'equipe-editar': el => folhaEquipe(S.equipe.find(u => u.id === +el.dataset.id)),
  'equipe-salvar': el => { const nome = val('e-nome'); if (!nome) { toast('Falta o nome'); return; } const d = { nome, login: val('e-login') || nome.split(' ')[0].toLowerCase(), papel: val('e-papel') }; if (el.dataset.id) Object.assign(S.equipe.find(u => u.id === +el.dataset.id), d); else S.equipe.push({ id: novoId(), ...d }); toast('Equipe atualizada'); fecharFolha(); desenhar(); },
  'equipe-apagar': el => { S.equipe = S.equipe.filter(u => u.id !== +el.dataset.id); toast('Removida da equipe'); fecharFolha(); desenhar(); },
};
document.addEventListener('click', e => {
  const ir = e.target.closest('[data-ir]'); if (ir) { if (ir.dataset.ir !== S.tela) trocarTela(ir.dataset.ir); return; }
  if (e.target.closest('#fab')) { ACOES.nova(); return; }
  const seg = e.target.closest('.seg[data-cfg] button'); if (seg) { const k = seg.closest('.seg').dataset.cfg, v = seg.dataset.v; S.cfg[k] = isNaN(+v) ? v : +v; if (k === 'tema') { guardar('ps-tema', v); aplicarTema(); } desenhar(); return; }
  const segLocal = e.target.closest('[data-seg]'); if (segLocal && !segLocal.dataset.act) { const pai = segLocal.parentElement; $$('[data-seg]', pai).forEach(b => { b.setAttribute('aria-pressed', b === segLocal); b.style.borderColor = ''; b.style.background = ''; }); if (pai.id === 'p-brq') { segLocal.style.borderColor = 'var(--coral)'; segLocal.style.background = 'var(--coral-2)'; } return; }
  const act = e.target.closest('[data-act]'); if (act && ACOES[act.dataset.act]) { ACOES[act.dataset.act](act); return; }
  const f = e.target.closest('[data-fecha]'); if (f && (f.tagName === 'BUTTON' || e.target === f)) fecharFolha();
});
document.addEventListener('input', e => {
  if (e.target.id === 'busca') { const q = e.target.value.toLowerCase(); $('#lista-criancas').innerHTML = itensLista(S.criancas.filter(c => (c.nome + ' ' + c.resp).toLowerCase().includes(q))); }
  if (e.target.dataset.preco != null) { S.cfg.pacotes[+e.target.dataset.preco].v = +e.target.value || 0; const it = e.target.closest('.it'); $('span', it).textContent = brl(Math.round((+e.target.value || 0) / S.cfg.pacotes[+e.target.dataset.preco].h)) + ' por hora'; }
  if (e.target.id === 'zap-texto') { e.target.style.height = 'auto'; e.target.style.height = Math.min(120, e.target.scrollHeight) + 'px'; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') fecharFolha();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'zap-texto') { e.preventDefault(); ACOES.enviar(); }
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (ABAS.some(a => a[0] === h) && h !== S.tela) trocarTela(h); });
setInterval(() => {
  agora.setTime(Date.now());
  $$('[data-cron]').forEach(el => { const c = crianca(el.dataset.cron); if (c && c.entrou) el.innerHTML = cronometro(c); });
  $$('[data-cron-txt]').forEach(el => { const c = crianca(el.dataset.cronTxt); if (c && c.entrou) el.textContent = hm(minDentro(c)); });
}, 1000);
desenhar();
conferirAtualizacao(false);
</script>
