<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1712">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<!-- Página independente do painel do personal: login, dados e atualização próprios. -->
<meta name="description" content="Controle pessoal de finanças.">
<title>Simplificando · Finanças</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="fb/firebase-app-compat.js"></script>
<script src="fb/firebase-auth-compat.js"></script>
<script src="fb/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&display=swap">
<style>
/* Finanças pessoais: página independente (login, dados e atualização próprios), com a mesma família visual do site.
   Uma página só: Resumo, Gastos, Irmão e Ajustes, com o botão grande de lançar gasto sempre à mão. */
:root{
  --ink:#0F1712;--cream:#F6F5EF;--lime:#C8F542;--brand:#FF4646;--on-brand:#0F1712;--water:#5AB8FF;--ok:#8EE85F;--warn:#FF9A2E;--bad:#FF7A72;
  --bg:#0F1712;--fg:#F6F5EF;--muted:#A9B0AA;--card:#172019;--card-line:transparent;--sep:#2E3931;--ctl:#253028;--ctl-fg:#F6F5EF;
  --seg-on:#F6F5EF;--seg-on-fg:#0F1712;--input:#0F1712;--accent:var(--lime);--on-accent:#0F1712;--focus:#F6F5EF;--danger:#FF7A72;
  --tab-bg:#F6F5EF;--tab-fg:#5B625D;--tab-on:#0F1712;--tab-on-fg:#F6F5EF;--tab-shadow:0 14px 40px rgba(0,0,0,.55);
  --toast-bg:#F6F5EF;--toast-fg:#0F1712;--sheet:#172019;--scrim:rgba(0,0,0,.62);--r:26px;
  /* cores dos cartões (escolhidas no Ajustes); passam no teste de daltonismo sobre o fundo escuro */
  --c0:#FF4646;--c1:#5AB8FF;--c2:#FF9A2E;--c3:#B794FF;--c4:#8EE85F;--c5:#F5D04C;--c6:#FF7AB6;--c7:#A9B0AA;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --spring:cubic-bezier(.3,1.5,.5,1);--ease:cubic-bezier(.2,.9,.25,1);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#FFFFFF;--fg:#0F1712;--muted:#5B625D;--card:#F4F4F1;--card-line:rgba(15,23,18,.08);--sep:#E0E0DA;--ctl:#E8E8E3;--ctl-fg:#0F1712;
  --seg-on:#FFFFFF;--seg-on-fg:#0F1712;--input:#FFFFFF;--focus:#0F1712;--danger:#C8302F;--accent:#0F1712;--on-accent:#F6F5EF;
  --tab-bg:#FFFFFF;--tab-shadow:0 10px 30px rgba(15,23,18,.14),0 0 0 1px rgba(15,23,18,.07);
  --toast-bg:#0F1712;--toast-fg:#FFFFFF;--sheet:#FFFFFF;--scrim:rgba(15,23,18,.38);
  --c0:#D62E2E;--c1:#2B7FD6;--c2:#D97A12;--c3:#8A5CE6;--c4:#3E9E3E;--c5:#B8960B;--c6:#D2467F;--c7:#6B726D;
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#FFFFFF;--fg:#0F1712;--muted:#5B625D;--card:#F4F4F1;--card-line:rgba(15,23,18,.08);--sep:#E0E0DA;--ctl:#E8E8E3;--ctl-fg:#0F1712;
  --seg-on:#FFFFFF;--seg-on-fg:#0F1712;--input:#FFFFFF;--focus:#0F1712;--danger:#C8302F;--accent:#0F1712;--on-accent:#F6F5EF;
  --tab-bg:#FFFFFF;--tab-shadow:0 10px 30px rgba(15,23,18,.14),0 0 0 1px rgba(15,23,18,.07);
  --toast-bg:#0F1712;--toast-fg:#FFFFFF;--sheet:#FFFFFF;--scrim:rgba(15,23,18,.38);
  --c0:#D62E2E;--c1:#2B7FD6;--c2:#D97A12;--c3:#8A5CE6;--c4:#3E9E3E;--c5:#B8960B;--c6:#D2467F;--c7:#6B726D;
  color-scheme:light;
}
/* blocos de cor cheia: texto sempre tinta */
.blk-lime,.blk-ok,.blk-warn,.blk-bad,.blk-water{--card-line:transparent;--fg:#0F1712;--muted:rgba(15,23,18,.72);--ctl:rgba(15,23,18,.12);--sep:rgba(15,23,18,.26);--ctl-fg:#0F1712;--accent:#0F1712;--on-accent:#F6F5EF;--seg-on:#F6F5EF;--seg-on-fg:#0F1712;--focus:#0F1712;--input:rgba(246,245,239,.62);--danger:#0F1712}
.blk-lime{--card:var(--lime)}.blk-ok{--card:var(--ok)}.blk-warn{--card:var(--warn)}.blk-bad{--card:var(--bad)}.blk-water{--card:var(--water)}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,label,select,input,textarea,a,[data-a]{touch-action:manipulation}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* topo */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.top .logo{width:30px;height:30px}
.top h1{margin:0;font-size:19px;font-weight:900;letter-spacing:-.04em;flex:1;display:flex;align-items:baseline;gap:4px}
.top h1 small{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)}.dot.busy{background:var(--warn);animation:pulse 1s infinite}.dot.off{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
.mnav{display:flex;align-items:center;justify-content:center;gap:4px;padding:2px max(16px,env(safe-area-inset-right,0px)) 10px}
.mnav button{border:0;background:var(--ctl);color:var(--ctl-fg);min-width:40px;height:40px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center}
.mnav .mlab{flex:1;max-width:260px;font-weight:800;letter-spacing:-.02em;font-size:16px}
.mnav .mlab.hoje{background:transparent}

main{max-width:720px;margin:0 auto;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(120px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.view{display:flex;flex-direction:column;gap:12px}
.view[hidden]{display:none}
.eyebrow{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);color:var(--fg);box-shadow:inset 0 0 0 1px var(--card-line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;position:relative;min-width:0}
.card h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em}
.card .hd{display:flex;align-items:center;gap:10px}
.card .hd h2{flex:1}
.big{font-size:38px;font-weight:900;letter-spacing:-.05em;line-height:1.05;font-variant-numeric:tabular-nums;margin:0;word-break:break-word}
.big small{font-size:18px;letter-spacing:-.01em;font-weight:800;margin-right:3px}
.sub{margin:0;color:var(--muted);font-size:13.5px;line-height:1.4}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0;background:var(--card);box-shadow:inset 0 0 0 1px var(--card-line);color:var(--fg);border:0;text-align:left}
.kpi b{font-size:24px;font-weight:900;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:12.5px;line-height:1.3;color:var(--muted)}
.kpi.neg b{color:var(--danger)}
@media (min-width:560px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.kpi b{font-size:22px}}

.pill{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--ctl);color:var(--fg);white-space:nowrap}
.pill .sw{width:8px;height:8px;border-radius:50%;background:var(--sw,var(--muted))}
.btn{min-height:44px;padding:0 18px;border:0;border-radius:999px;background:var(--ctl);color:var(--ctl-fg);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700;letter-spacing:-.01em;transition:transform .2s var(--spring),background .2s,opacity .2s;user-select:none;-webkit-user-select:none;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1.5px var(--danger)}
.btn.sm{min-height:36px;padding:0 14px;font-size:13.5px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px}
.chips.scroll::-webkit-scrollbar{display:none}
.opt{min-height:40px;padding:0 14px;border:0;border-radius:999px;background:var(--ctl);color:var(--ctl-fg);font-size:14px;font-weight:600;transition:transform .2s var(--spring),background .2s;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.opt .sw{width:9px;height:9px;border-radius:50%;background:var(--sw,var(--muted));flex:none}
.opt.on{background:var(--accent);color:var(--on-accent);font-weight:800}
.opt.on .sw{box-shadow:0 0 0 2px var(--on-accent)}
.opt:active{transform:scale(.95)}
.seg{display:flex;background:var(--ctl);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;color:var(--ctl-fg);min-height:38px;border-radius:999px;font-weight:700;font-size:14px;opacity:.75}
.seg button.on{background:var(--seg-on);color:var(--seg-on-fg);opacity:1}

.list{background:var(--card);box-shadow:inset 0 0 0 1px var(--card-line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:11px 16px;border:0;background:none;color:var(--fg);text-align:left;position:relative;transition:background .2s;font:inherit}
.row+.row,.row+.gh,.gh+.row{border-top:1px solid var(--sep)}
button.row:active{background:var(--ctl)}
.row .sw{width:10px;height:10px;border-radius:50%;background:var(--sw,var(--muted));flex:none}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .tx b{font-weight:700;font-size:15px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tx span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .val{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap;text-align:right}
.row .val small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.row .val.in{color:var(--ok)}
:root[data-theme="light"] .row .val.in,:root:not([data-theme="dark"]) .row .val.in{color:#2E7D32}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .row .val.in{color:var(--ok)}}
.gh{padding:12px 16px 4px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.gh b{font-weight:800;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.tag{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--warn);color:#0F1712;text-transform:uppercase;letter-spacing:.04em}
.tag.me{background:var(--ctl);color:var(--fg)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty b{color:var(--fg);font-size:17px;letter-spacing:-.02em}

/* barras por cartão: rótulo direto em cada barra, cor segue o cartão */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:flex;flex-direction:column;gap:5px;border:0;background:none;color:inherit;padding:0;text-align:left;width:100%;font:inherit}
.bar .l{display:flex;align-items:center;gap:8px;font-size:14px}
.bar .l b{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .l .v{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bar .l .v small{color:var(--muted);font-weight:600;font-size:12px;margin-left:6px}
.bar .t{height:10px;border-radius:999px;background:var(--ctl);overflow:hidden;display:flex;gap:2px}
.bar .t i{display:block;height:100%;background:var(--sw);border-radius:999px;min-width:0;transition:width .4s var(--ease)}
.bar .t i.ir{opacity:.45}
.bar .n{font-size:12px;color:var(--muted)}

/* campos */
.field{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:700}
.field input,.field select,.field textarea{min-height:48px;padding:0 14px;border:0;border-radius:16px;background:var(--input);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--sep);font-weight:500;font-size:15px;width:100%;outline:0}
.field textarea{padding:12px 14px;min-height:70px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{box-shadow:inset 0 0 0 2px var(--focus)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inline{display:flex;align-items:center;gap:10px}
.inline .field{flex:1}

/* abas de baixo + botão de lançar */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--tab-bg);border-radius:999px;padding:6px;display:flex;align-items:center;gap:2px;box-shadow:var(--tab-shadow);max-width:calc(100% - 24px)}
.tab{border:0;background:transparent;color:var(--tab-fg);min-width:60px;height:52px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:800;letter-spacing:.02em;padding:0 8px}
.tab .i{width:21px;height:21px}
.tab.on{background:var(--tab-on);color:var(--tab-on-fg)}
.fab{border:0;background:var(--brand);color:#0F1712;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 4px;box-shadow:0 8px 22px rgba(255,70,70,.4);transition:transform .2s var(--spring)}
.fab:active{transform:scale(.92)}
.fab .i{width:28px;height:28px;stroke-width:2.6}

/* folha (modal de baixo) */
.sheet-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim);animation:fade .2s}
.sheet-wrap[hidden]{display:none}
.sheet{background:var(--sheet);color:var(--fg);width:100%;max-width:560px;max-height:calc(100dvh - 24px);overflow-y:auto;border-radius:28px 28px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .28s var(--ease);overscroll-behavior:contain}
@media (min-width:600px){.sheet-wrap{align-items:center}.sheet{border-radius:28px;max-height:calc(100dvh - 60px)}}
.sheet .grab{width:44px;height:5px;border-radius:999px;background:var(--sep);margin:0 auto 2px}
.sheet .hd{display:flex;align-items:center;gap:10px}
.sheet .hd h2{margin:0;font-size:20px;font-weight:900;letter-spacing:-.03em;flex:1}
.sheet .x{border:0;background:var(--ctl);color:var(--ctl-fg);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.amt{text-align:center;padding:6px 0 2px}
.amt .v{font-size:46px;font-weight:900;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.amt .v.zero{color:var(--muted)}
.amt .v.neg{color:var(--danger)}
.amt .h{font-size:12.5px;color:var(--muted);margin-top:4px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{border:0;background:var(--ctl);color:var(--ctl-fg);height:52px;border-radius:16px;font-size:22px;font-weight:700;transition:transform .15s var(--spring)}
.pad button:active{transform:scale(.94);background:var(--sep)}
.pad button.soft{font-size:16px}
.lbl{margin:0;font-size:12.5px;font-weight:700;color:var(--muted)}
.sheet .sec{display:flex;flex-direction:column;gap:8px}

/* porta de entrada */
.gate{position:fixed;inset:0;z-index:200;background:var(--bg);color:var(--fg);overflow-y:auto;overscroll-behavior:contain}
.gate-in{max-width:440px;margin:0 auto;min-height:100%;min-height:100dvh;display:flex;flex-direction:column;gap:14px;padding:calc(32px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.gate-logo{width:72px;height:72px}.gate-logo svg{width:100%;height:100%}
.gate-eb{margin:8px 0 0;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.gate h1{margin:0;font-size:40px;font-weight:900;letter-spacing:-.05em;line-height:1}
.gate h1 .pt{display:inline-block;width:.2em;height:.2em;border-radius:50%;background:var(--lime);margin-left:.04em}
.gate-sub{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.gate form{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.gate label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.gate-f{display:flex;align-items:center;gap:6px;height:58px;padding:0 6px 0 16px;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--sep)}
.gate-f:focus-within{box-shadow:inset 0 0 0 2px var(--fg)}
.gate-f input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:16px;font-weight:500;height:100%}
.gate-eye{border:0;background:transparent;color:var(--muted);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.gate-keep{flex-direction:row !important;align-items:center;gap:10px;font-weight:600 !important;font-size:14px}
.gate-keep input{width:20px;height:20px;accent-color:var(--lime)}
.gate-msg{margin:0;min-height:20px;font-size:14px;color:var(--danger);font-weight:600}
.gate-msg.ok{color:var(--muted)}
.gate-go{height:56px;font-size:16px}
.gate-link{border:0;background:none;color:var(--muted);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:6px 0;align-self:flex-start}
.gate-note{margin:auto 0 0;color:var(--muted);font-size:13px;line-height:1.45}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--toast-bg);color:var(--toast-fg);padding:12px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:150;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--spring);max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.banner{background:var(--warn);color:#0F1712;border-radius:16px;padding:10px 14px;font-size:13.5px;font-weight:600}
.sw-pick{display:flex;gap:8px;flex-wrap:wrap}
.sw-pick button{width:34px;height:34px;border-radius:50%;border:0;background:var(--sw);transition:transform .2s var(--spring)}
.sw-pick button.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--fg);transform:scale(1.05)}
.set-item{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--sep)}
.set-item:first-of-type{border-top:0;padding-top:0}
.set-item .inline input{min-height:44px}

<script>
(() => {
'use strict';
/* ========== utilidades ========== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL = new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL' });
const fmt = c => BRL.format((c || 0) / 100);
const fmtBig = c => { const s = fmt(c); return '<small>R$</small>' + esc(s.replace(/^R\$\s?/, '')); };
const p2 = n => String(n).padStart(2, '0');
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36);
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); };
const nowKey = () => todayISO().slice(0, 7);
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d || 1); };
const addMonths = (iso, k) => { const [y, m, d] = iso.split('-').map(Number); const t = new Date(y, m - 1 + k, 1); const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate(); return t.getFullYear() + '-' + p2(t.getMonth() + 1) + '-' + p2(Math.min(d || 1, last)); };
const monthLabel = key => { const d = parseISO(key + '-01'); const t = d.toLocaleDateString('pt-BR', { month:'long', year:'numeric' }); return t.charAt(0).toUpperCase() + t.slice(1); };
const dayLabel = iso => {
  const t = todayISO(); if (iso === t) return 'Hoje';
  const y = new Date(); y.setDate(y.getDate() - 1); if (iso === y.getFullYear() + '-' + p2(y.getMonth() + 1) + '-' + p2(y.getDate())) return 'Ontem';
  return parseISO(iso).toLocaleDateString('pt-BR', { weekday:'short', day:'numeric', month:'short' }).replace('.', '');
};
const shortDate = iso => iso.slice(8, 10) + '/' + iso.slice(5, 7);
const whenLabel = ms => { const d = new Date(ms); return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + ' às ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); };
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
const toast = (() => { let t; return msg => { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(t); t = setTimeout(() => el.classList.remove('show'), 2400); }; })();
const I = {
  plus:'<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',

  wallet:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/></svg>',
  mic:'<svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>',
  refresh:'<svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8"/><path d="M20 3v5h-5"/></svg>'
};
function logo(){
  const arc = (d, c) => '<path d="' + d + '" fill="none" stroke="' + c + '" stroke-width="3.8"/>';
  return '<svg viewBox="-50 -50 100 100" role="img" aria-label="Simplificando" width="100%" height="100%"><circle r="50" fill="#0F1712"/>' +
    arc('M0 -44.3A44.3 44.3 0 0 1 44.3 0.31', '#B794FF') + arc('M44.3 0A44.3 44.3 0 0 1 -0.31 44.3', '#C8F542') +
    arc('M0 44.3A44.3 44.3 0 0 1 -44.3 -0.31', '#5AB8FF') + arc('M-44.3 0A44.3 44.3 0 0 1 0.31 -44.3', '#FF4646') +

$('#logo').innerHTML = logo(); document.querySelector('.top .mic').innerHTML = I.mic;

/* ========== estado ========== */
const FINV = '9 nov · 6'; // Versão do Finanças: 9 nov · 6
const DONO = { nome:'Eduardo Matias', iniciais:'EM' }; // perfil único desta página
const LS = 'simplificando-financas', LST = 'simplificando-financas-tema';
const CATS = ['Mercado', 'Comida', 'Transporte', 'Casa', 'Lazer', 'Saúde', 'Roupas', 'Assinaturas', 'Outros'];
function fresh(){
  return {
    v:1, em:0,
    fontes:[{ id:'f1', nome:'Emprego 1' }, { id:'f2', nome:'Emprego 2' }],
    cartoes:[{ id:'c1', nome:'Cartão 1', cor:0, tipo:'credito', fecha:null }, { id:'c2', nome:'Cartão 2', cor:1, tipo:'credito', fecha:null }, { id:'conta', nome:'Conta (débito / Pix)', cor:4, tipo:'conta', fecha:null }],

  };
}
let S = fresh();
function normalize(o){
  const d = fresh(); if (!o || typeof o !== 'object') return d;
  for (const k of ['fontes', 'cartoes', 'receitas', 'gastos', 'pagamentos', 'saldos', 'cats', 'fixos']) if (!Array.isArray(o[k])) o[k] = d[k];

const ls = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };

const theme = ls.get(LST); if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;

const UI = { tab:'resumo', mes:nowKey(), fCart:'', fQuem:'', cartao:'', xQuem:'' };
const cartao = id => S.cartoes.find(c => c.id === id) || { id, nome:'(cartão apagado)', cor:7, tipo:'credito' };

const inMes = x => (x.data || '').slice(0, 7) === UI.mes;
const gastosMes = () => S.gastos.filter(inMes);
const ccHTML = (c, extra) => `<div class="cc" style="--ga:var(--g${(c.cor ?? 7) % 8});--gb:var(--h${(c.cor ?? 7) % 8})"><div class="chip"></div><div class="lg">${c.tipo === 'conta' ? 'Conta' : 'Crédito'}</div><div class="nm">${esc(c.nome.replace(/\s*\(.*?\)\s*/g, ' ').trim())}</div><div class="no">${extra || (c.tipo === 'conta' ? 'Débito · Pix' : c.fecha ? 'Fecha dia ' + c.fecha : '')}</div></div>`;
const EMO = { mercado:'🛒', comida:'🍔', transporte:'🚗', casa:'🏠', lazer:'🎉', saude:'💊', roupas:'👕', assinaturas:'📺', outros:'💳' };
const emoji = g => EMO[String(g.cat || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()] || (g.fixo ? '🔁' : '💳');
const needsSetup = () => S.fontes.some(f => /^Emprego \d$/.test(f.nome)) || S.cartoes.some(c => /^Cartão \d$/.test(c.nome));

/* ========== nuvem ========== */
const Cloud = (() => {
  const cfg = window.SIMPLIFICANDO_FIREBASE, fb = window.firebase;
  if (!cfg || !fb || !fb.initializeApp) return null;
  try { fb.initializeApp(cfg); } catch(e){ return null; }
  const auth = fb.auth(), db = fb.firestore();
  let ref = null, unsub = null, timer = null, dirty = false, saving = false;
  const dot = st => { const d = $('#sync'); d.className = 'dot ' + st; d.title = { ok:'Salvo na nuvem', busy:'Salvando…', off:'Sem conexão: salvo só neste aparelho' }[st] || ''; };
  async function ownerUid(){ const d = await db.collection('financas').doc('dono').get(); return d.exists ? (d.data() || {}).uid || null : null; }
  async function claim(uid){ await db.collection('financas').doc('dono').set({ uid, nome:DONO.nome, criadoEm:new Date().toISOString() }); }
  function apply(remote){
    try { const o = normalize(JSON.parse(remote.s || 'null')); o.em = +remote.em || o.em; S = o; ls.set(LS, JSON.stringify(S)); render(); } catch(e){}
  }
  async function connect(user){
    ref = db.collection('financas').doc('dados'); dot('busy');
    try {
      const snap = await ref.get(); const r = snap.exists ? snap.data() : null;
      if (r && (+r.em || 0) > (S.em || 0)) apply(r);
      else if (!r || (S.em || 0) > (+r.em || 0)) await push();
      dot('ok');
    } catch(e){ dot('off'); }
    unsub = ref.onSnapshot(snap => {
      if (snap.metadata.hasPendingWrites || !snap.exists) return;
      const r = snap.data(); if ((+r.em || 0) > (S.em || 0)) apply(r);
    }, () => dot('off'));
    window.addEventListener('online', () => { if (dirty) push(); });
  }
  async function push(){
    if (!ref) return; saving = true; dirty = false; dot('busy');
    try { await ref.set({ s:JSON.stringify(S), em:S.em || Date.now() }); dot('ok'); }
    catch(e){ dirty = true; dot('off'); }
    saving = false; if (dirty) schedule();
  }
  function schedule(){ dirty = true; clearTimeout(timer); timer = setTimeout(push, 700); }
  return { auth, db, ownerUid, claim, connect, save:schedule, dot };
})();

function save(){
  S.em = Date.now(); ls.set(LS, JSON.stringify(S));
  if (Cloud) Cloud.save();
}

/* ========== contas ========== */
function saldoAtual(){
  if (!S.saldos.length) return null;
  const last = S.saldos[S.saldos.length - 1];
  const rec = sum(S.receitas.filter(r => (r.cr || 0) > last.cr), r => r.valor);
  const pag = sum(S.pagamentos.filter(p => (p.cr || 0) > last.cr), p => p.valor);
  const gas = sum(S.gastos.filter(g => (g.cr || 0) > last.cr && cartao(g.cartao).tipo === 'conta'), g => g.valor);
  return { last, rec, pag, gas, est:last.valor + rec + pag - gas };
}
function irmaoPendente(){
  const gasto = sum(S.gastos.filter(g => g.quem === 'irmao'), g => g.valor);
  const pago = sum(S.pagamentos, p => p.valor);
  return { gasto, pago, deve:gasto - pago };
}
function faturaDe(c){ // período da fatura que fecha no mês escolhido: do dia seguinte ao fechamento anterior até o fechamento deste mês
  if (!c.fecha) return null;
  const ultimo = new Date(+UI.mes.slice(0, 4), +UI.mes.slice(5, 7), 0).getDate();
  const fim = UI.mes + '-' + p2(Math.min(c.fecha, ultimo));
  const d = parseISO(addMonths(fim, -1)); d.setDate(d.getDate() + 1);
  const ini = d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
  const itens = S.gastos.filter(g => g.cartao === c.id && g.data >= ini && g.data <= fim);
  return { ini, fim, total:sum(itens, g => g.valor), irmao:sum(itens.filter(g => g.quem === 'irmao'), g => g.valor) };
}

function aplicarFixos(){ // cria o gasto de cada fixo no dia certo do mês atual (uma vez só, mesmo que depois seja apagado)
  const mes = nowKey(), hoje = todayISO(), ultimo = new Date(+mes.slice(0, 4), +mes.slice(5, 7), 0).getDate();
  let n = 0;
  for (const f of S.fixos) {
    if (f.ativo === false) continue;
    const key = f.id + '|' + mes; if (S.fixosFeitos[key]) continue;
    const data = mes + '-' + p2(Math.min(Math.max(1, f.dia || 1), ultimo)); if (data > hoje) continue;
    S.gastos.push({ id:uid(), cr:Date.now() + n, valor:f.valor, data, cartao:f.cartao, quem:f.quem === 'irmao' ? 'irmao' : 'eu', desc:f.nome, cat:f.cat || '', fixo:f.id });
    S.fixosFeitos[key] = true; n++;
  }
  return n;
}

/* ========== telas ========== */
function render(){
  if (aplicarFixos()) { save(); toast('Gastos fixos do mês lançados.'); }
  $('#mlab').textContent = monthLabel(UI.mes);
  $('#mlab').classList.toggle('hoje', UI.mes === nowKey());
  $('#mnav').hidden = UI.tab === 'ajustes';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.k === UI.tab || (UI.tab === 'cartao' && t.dataset.k === 'resumo')));
  for (const k of ['resumo', 'gastos', 'irmao', 'ajustes']) $('#v-' + k).hidden = k !== UI.tab && !(k === 'resumo' && UI.tab === 'cartao');
  ({ resumo:rResumo, gastos:rGastos, irmao:rIrmao, ajustes:rAjustes, cartao:rCartao })[UI.tab]();
}

function rResumo(){
  const gm = gastosMes(), rm = S.receitas.filter(inMes);
  const recebido = sum(rm, r => r.valor), meus = sum(gm.filter(g => g.quem !== 'irmao'), g => g.valor), doIrmao = sum(gm.filter(g => g.quem === 'irmao'), g => g.valor);
  const sobrou = recebido - meus, pend = irmaoPendente(), sa = saldoAtual();
  const maxC = Math.max(1, ...S.cartoes.map(c => sum(gm.filter(g => g.cartao === c.id), g => g.valor)));
  let h = '';
  if (needsSetup()) h += `<div class="card blk-lime"><p class="eyebrow">Comece por aqui</p><h2>Dê nome aos seus empregos e cartões</h2><p class="sub">Leva um minuto. Depois é só lançar os gastos pelo botão <b>+</b> aí embaixo.</p><div class="btns"><button type="button" class="btn primary" data-a="tab" data-k="ajustes">Abrir ajustes</button></div></div>`;
  // saldo
  h += `<div class="card ${sa && sa.est < 0 ? 'blk-bad' : 'blk-water'}"><div class="hd"><p class="eyebrow">Saldo na conta</p>${sa ? `<span class="pill">informado ${esc(whenLabel(sa.last.cr))}</span>` : ''}</div>`;
  if (!sa) h += `<p class="big">—</p><p class="sub">Veja o saldo no banco uma vez e anote aqui. Depois, a página acompanha sozinha com o que você lançar.</p><div class="btns"><button type="button" class="btn primary" data-a="saldo">Informar saldo de hoje</button></div>`;
  else {
    const mov = [];
    if (sa.rec) mov.push('+' + fmt(sa.rec) + ' recebidos'); if (sa.pag) mov.push('+' + fmt(sa.pag) + ' do ' + esc(S.irmao.nome)); if (sa.gas) mov.push('−' + fmt(sa.gas) + ' gastos na conta');
    h += `<p class="big">${fmtBig(sa.est)}</p><p class="sub">${mov.length ? 'Você informou ' + fmt(sa.last.valor) + '. Desde então: ' + mov.join(' · ') + '.' : 'Nada lançado na conta desde que você informou.'}</p><div class="btns"><button type="button" class="btn primary" data-a="saldo">${I.refresh}Atualizar saldo</button></div>`;
  }
  h += `</div>`;
  // kpis
  h += `<div class="kpis">
    <button type="button" class="kpi" data-a="scroll" data-k="rec"><b>${esc(fmt(recebido))}</b><span>Recebi no mês</span></button>
    <button type="button" class="kpi" data-a="tab" data-k="gastos"><b>${esc(fmt(meus))}</b><span>Gastei (só o meu)</span></button>
    <div class="kpi ${sobrou < 0 ? 'neg' : ''}"><b>${esc(fmt(sobrou))}</b><span>${sobrou < 0 ? 'Gastei mais do que recebi' : 'Sobrou no mês'}</span></div>
    <button type="button" class="kpi" data-a="tab" data-k="irmao"><b>${esc(fmt(pend.deve))}</b><span>${esc(S.irmao.nome)} te deve</span></button>
  </div>`;
  // receitas
  h += `<div class="card" id="sec-rec"><div class="hd"><h2>Recebido no mês</h2><button type="button" class="btn sm primary" data-a="nova-receita">${I.plus}Receita</button></div><div class="bars">`;
  const maxF = Math.max(1, ...S.fontes.map(f => sum(rm.filter(r => r.fonte === f.id), r => r.valor)));
  for (const f of S.fontes) { const v = sum(rm.filter(r => r.fonte === f.id), r => r.valor); h += `<div class="bar" style="--sw:var(--ok)"><div class="l"><b>${esc(f.nome)}</b><span class="v">${esc(fmt(v))}</span></div><div class="t"><i style="width:${Math.round(v / maxF * 100)}%"></i></div></div>`; }
  const outras = rm.filter(r => !S.fontes.some(f => f.id === r.fonte)); if (outras.length) h += `<p class="n sub">Outras: ${esc(fmt(sum(outras, r => r.valor)))}</p>`;
  h += `</div>`;
  if (rm.length) { h += `<div class="list" style="margin:0 -6px">`; for (const r of rm.slice().sort((a, b) => b.data.localeCompare(a.data))) h += `<button type="button" class="row" data-a="ed-receita" data-k="${r.id}"><span class="tx"><b>${esc(fonte(r.fonte).nome)}${r.obs ? ' · ' + esc(r.obs) : ''}</b><span>${esc(dayLabel(r.data))}</span></span><span class="val in">+${esc(fmt(r.valor))}</span></button>`; h += `</div>`; }
  else h += `<p class="sub">Nenhum recebimento lançado em ${esc(monthLabel(UI.mes))}.</p>`;
  h += `</div>`;
  // cartões: lista com miniatura (toque abre o extrato)
  const totCart = Math.max(1, meus + doIrmao), n = esc(S.irmao.nome);
  h += `<div class="card" style="padding:0;gap:0"><div class="hd" style="padding:18px 16px 8px"><h2>Meus cartões</h2><span class="pill">${esc(fmt(meus + doIrmao))}</span></div>`;
  for (const c of S.cartoes) {
    const its = gm.filter(g => g.cartao === c.id), v = sum(its, g => g.valor), vi = sum(its.filter(g => g.quem === 'irmao'), g => g.valor), f = faturaDe(c);
    const sub = (c.tipo === 'conta' ? 'Débito e Pix' : 'Crédito' + (c.fecha ? ' · fecha dia ' + c.fecha : '')) + (vi ? ' · ' + n + ' ' + esc(fmt(vi)) : '');
    h += `<button type="button" class="rc" data-a="ver-cartao" data-k="${c.id}" style="--ga:var(--g${(c.cor ?? 7) % 8});--gb:var(--h${(c.cor ?? 7) % 8})"><span class="mini"></span><span class="tx"><b>${esc(c.nome)}</b><span>${sub}</span><span class="bar2"><i style="width:${Math.round((v - vi) / totCart * 100)}%"></i>${vi ? `<i class="ir" style="width:${Math.round(vi / totCart * 100)}%"></i>` : ''}</span></span><span class="v">${esc(fmt(f ? f.total : v))}<small>${f ? 'fatura' : 'no mês'}</small></span><span class="chev">${I.chev}</span></button>`;
  }
  h += `<button type="button" class="rc novo" data-a="add-cartao-resumo">${I.plus}Novo cartão</button></div>`;
  h += `<p class="sub" style="text-align:center">${gm.length ? 'Toque num cartão para ver o extrato. A barra mostra quanto cada um pesa no mês' + (doIrmao ? '; a parte clara é do ' + n : '') + '.' : 'Nenhum gasto em ' + esc(monthLabel(UI.mes)) + '. Toque no <b>+</b> para lançar.'}</p>`;
  $('#v-resumo').innerHTML = h;
}

function rCartao(){
  const c = cartao(UI.cartao), its0 = gastosMes().filter(g => g.cartao === c.id), f = faturaDe(c), n = esc(S.irmao.nome);
  const tot = sum(its0, g => g.valor), meu = sum(its0.filter(g => g.quem !== 'irmao'), g => g.valor), ir = tot - meu;
  let its = UI.xQuem ? its0.filter(g => (g.quem === 'irmao' ? 'irmao' : 'eu') === UI.xQuem) : its0;
  its.sort((a, b) => b.data.localeCompare(a.data) || (b.cr || 0) - (a.cr || 0));
  let h = `<div class="xhd"><button type="button" class="back" data-a="tab" data-k="resumo" aria-label="Voltar">${I.back}</button><h2>${esc(c.nome)}</h2><span class="pill">${esc(monthLabel(UI.mes))}</span></div>`;
  h += ccHTML(c, f ? 'Fecha dia ' + c.fecha : undefined);
  h += `<div class="kp3"><div><b>${esc(fmt(tot))}</b><span>No mês</span></div><div><b>${esc(fmt(meu))}</b><span>Meu</span></div><div><b>${esc(fmt(ir))}</b><span>${n}</span></div></div>`;
  if (tot) h += `<div class="bar" style="--sw:var(--c${(c.cor ?? 7) % 8})"><div class="t"><i style="width:${Math.round(meu / tot * 100)}%"></i>${ir ? `<i class="ir" style="width:${Math.round(ir / tot * 100)}%"></i>` : ''}</div></div>`;
  if (f) h += `<p class="sub">Fatura que fecha em ${esc(shortDate(f.fim))}: <b>${esc(fmt(f.total))}</b> (${esc(shortDate(f.ini))} a ${esc(shortDate(f.fim))})${f.irmao ? ' · ' + n + ' ' + esc(fmt(f.irmao)) : ''}</p>`;
  h += `<div class="seg"><button type="button" class="${!UI.xQuem ? 'on' : ''}" data-a="x-quem" data-k="">Tudo</button><button type="button" class="${UI.xQuem === 'eu' ? 'on' : ''}" data-a="x-quem" data-k="eu">Meus</button><button type="button" class="${UI.xQuem === 'irmao' ? 'on' : ''}" data-a="x-quem" data-k="irmao">${n}</button></div>`;
  if (!its.length) h += `<div class="list"><div class="empty"><b>Nada neste cartão</b><span>Nenhum gasto em ${esc(monthLabel(UI.mes))}${UI.xQuem ? ' com esse filtro' : ''}.</span></div></div>`;
  else {
    h += `<div class="list">`; let dia = '';
    for (const g of its) {
      if (g.data !== dia) { dia = g.data; h += `<div class="gh"><span>${esc(dayLabel(dia))}</span><b>${esc(fmt(sum(its.filter(x => x.data === dia), x => x.valor)))}</b></div>`; }
      h += `<button type="button" class="row" data-a="ed-gasto" data-k="${g.id}"><span class="ic">${emoji(g)}</span><span class="tx"><b>${esc(g.desc || g.cat || 'Gasto')}</b><span>${esc(g.cat || '')}${g.parc ? ' · ' + esc(g.parc) : ''}${g.fixo ? ' · fixo' : ''}</span></span>${g.quem === 'irmao' ? `<span class="tag">${n}</span>` : ''}<span class="val">${esc(fmt(g.valor))}</span></button>`;
    }
    h += `</div>`;
  }
  h += `<button type="button" class="btn primary wide" data-a="novo-gasto-cartao" data-k="${c.id}">${I.plus}Lançar neste cartão</button>`;
  $('#v-resumo').innerHTML = h;
}

function rGastos(){
  let its = gastosMes();
  if (UI.fCart) its = its.filter(g => g.cartao === UI.fCart);
  if (UI.fQuem) its = its.filter(g => (g.quem === 'irmao' ? 'irmao' : 'eu') === UI.fQuem);
  its.sort((a, b) => b.data.localeCompare(a.data) || (b.cr || 0) - (a.cr || 0));
  let h = `<div class="chips scroll" style="margin:0;padding:0"><button type="button" class="opt ${!UI.fCart ? 'on' : ''}" data-a="f-cart" data-k="">Todos</button>`;
  for (const c of S.cartoes) h += `<button type="button" class="opt ${UI.fCart === c.id ? 'on' : ''}" data-a="f-cart" data-k="${c.id}" style="--sw:${swOf(c)}"><span class="sw"></span>${esc(c.nome)}</button>`;
  h += `</div><div class="seg"><button type="button" class="${!UI.fQuem ? 'on' : ''}" data-a="f-quem" data-k="">Todos</button><button type="button" class="${UI.fQuem === 'eu' ? 'on' : ''}" data-a="f-quem" data-k="eu">Meus</button><button type="button" class="${UI.fQuem === 'irmao' ? 'on' : ''}" data-a="f-quem" data-k="irmao">${esc(S.irmao.nome)}</button></div>`;
  if (!its.length) h += `<div class="list"><div class="empty"><b>Nada por aqui</b><span>${gastosMes().length ? 'Nenhum gasto com esse filtro.' : 'Nenhum gasto lançado em ' + esc(monthLabel(UI.mes)) + '.'}</span><button type="button" class="btn primary" data-a="novo-gasto">${I.plus}Lançar gasto</button></div></div>`;
  else {
    h += `<div class="list">`; let dia = '';
    for (const g of its) {
      if (g.data !== dia) { dia = g.data; const tot = sum(its.filter(x => x.data === dia), x => x.valor); h += `<div class="gh"><span>${esc(dayLabel(dia))}</span><b>${esc(fmt(tot))}</b></div>`; }
      const c = cartao(g.cartao);
      h += `<button type="button" class="row" data-a="ed-gasto" data-k="${g.id}"><span class="sw" style="--sw:${swOf(c)}"></span><span class="tx"><b>${esc(g.desc || g.cat || 'Gasto')}</b><span>${esc(c.nome)}${g.cat && g.desc ? ' · ' + esc(g.cat) : ''}${g.parc ? ' · ' + esc(g.parc) : ''}${g.fixo ? ' · fixo' : ''}</span></span>${g.quem === 'irmao' ? `<span class="tag">${esc(S.irmao.nome)}</span>` : ''}<span class="val">${esc(fmt(g.valor))}</span></button>`;
    }
    h += `</div><p class="sub" style="text-align:center">Total: <b>${esc(fmt(sum(its, g => g.valor)))}</b> em ${its.length} ${its.length === 1 ? 'gasto' : 'gastos'}. Toque num gasto para editar ou apagar.</p>`;
  }
  $('#v-gastos').innerHTML = h;
}

function rIrmao(){
  const p = irmaoPendente(), n = esc(S.irmao.nome);
  const gm = S.gastos.filter(g => g.quem === 'irmao' && inMes(g)).sort((a, b) => b.data.localeCompare(a.data));

    <div class="btns"><button type="button" class="btn primary" data-a="cobranca">${I.copy}Copiar cobrança</button>${S.irmao.zap ? `<button type="button" class="btn" data-a="zap">${I.zap}WhatsApp</button>` : ''}<button type="button" class="btn" data-a="novo-pag">${I.plus}${n} pagou</button></div></div>`;
  h += `<div class="card"><div class="hd"><h2>Gastos de ${n} em ${esc(monthLabel(UI.mes))}</h2><span class="pill">${esc(fmt(sum(gm, g => g.valor)))}</span></div>`;
  if (!gm.length) h += `<p class="sub">Nenhum gasto marcado como do ${n} neste mês. Ao lançar um gasto, toque em "${n}" em "Quem gastou".</p>`;

  h += `</div>`;
  h += `<div class="card"><div class="hd"><h2>Pagamentos de ${n}</h2></div>`;
  if (!pm.length) h += `<p class="sub">Quando ${n} te pagar, toque em "${n} pagou" e anote o valor. O que falta é calculado sozinho.</p>`;
  else { h += `<div class="list" style="margin:0 -6px">`; for (const x of pm) h += `<button type="button" class="row" data-a="ed-pag" data-k="${x.id}"><span class="tx"><b>${esc(x.obs || 'Pagamento')}</b><span>${esc(dayLabel(x.data))}</span></span><span class="val in">+${esc(fmt(x.valor))}</span></button>`; h += `</div>`; }
  h += `</div>`;
  $('#v-irmao').innerHTML = h;
}

function rAjustes(){
  const t = document.documentElement.dataset.theme || 'auto';
  let h = `<div class="card"><div class="hd"><h2>Renda</h2><button type="button" class="btn sm" data-a="add-fonte">${I.plus}Fonte</button></div><p class="sub">Seus empregos ou de onde vem o dinheiro.</p>`;

/* ========== atualizar a página (atualizar.php desta pasta baixa só /financas do GitHub) ========== */
const ATU = { st:'', nova:'', msg:'' };
function atuCheck(){
  if (ATU.st || !Cloud) return; ATU.st = 'vendo';
  fetch('atualizar.php?acao=ver', { cache:'no-store' }).then(r => r.ok ? r.json() : Promise.reject()).then(j => { ATU.st = 'ok'; ATU.nova = (j && j.nova) || ''; if (UI.tab === 'ajustes') render(); })
    .catch(() => { ATU.st = 'sem'; if (UI.tab === 'ajustes') render(); });
}
function atuCard(){
  atuCheck();
  if (!Cloud || ATU.st === 'sem') return '';
  const vnum = v => +((String(v || '').match(/·\s*(\d+)/) || [])[1] || 0), nova = ATU.nova && vnum(ATU.nova) > vnum(FINV), indo = ATU.st === 'indo';
  return `<div class="card ${nova ? 'blk-lime' : ''}"><h2>Atualizar esta página</h2><p class="sub">Versão no ar: <b>${esc(FINV)}</b>${ATU.st === 'vendo' ? ' · procurando versão nova…' : nova ? ' · <b>versão nova pronta: ' + esc(ATU.nova) + '</b>' : ATU.nova ? ' · já é a mais nova' : ''}</p>
    <div class="btns"><button type="button" class="btn ${nova ? 'primary' : ''}" data-a="atu-go" ${indo ? 'disabled' : ''}>${I.refresh}${indo ? 'Atualizando…' : 'Atualizar agora'}</button></div>
    ${ATU.msg ? `<p class="sub" style="color:var(--danger)">${esc(ATU.msg)}</p>` : ''}<p class="sub">Baixa do GitHub só a pasta do Finanças e coloca no ar. Não mexe no app nem no painel do personal.</p></div>`;
}
async function atuGo(){
  if (ATU.st === 'indo' || !Cloud || !Cloud.auth.currentUser) return; ATU.st = 'indo'; ATU.msg = ''; render();
  try {
    const t = await Cloud.auth.currentUser.getIdToken(); const f = new FormData(); f.append('token', t);
    const r = await fetch('atualizar.php?acao=atualizar', { method:'POST', cache:'no-store', body:f, headers:{ Authorization:'Bearer ' + t } });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.erro || 'Não deu para atualizar agora.');
    toast('Atualizado: ' + (j.arquivos || 0) + ' arquivos. Recarregando…'); setTimeout(() => location.reload(), 1500);
  } catch(e){ ATU.st = 'ok'; ATU.msg = e.message || 'Não deu para atualizar agora.'; render(); }
}

/* ========== voz: ouvir e entender ========== */
const Voz = (() => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; let rec = null;
  function start(onResult, onState){
    if (!SR) { toast('Este navegador não tem ditado. Use o microfone do teclado do celular.'); return false; }
    stop(); rec = new SR(); rec.lang = 'pt-BR'; rec.interimResults = true; rec.maxAlternatives = 1; rec.continuous = false;
    let fin = '';
    rec.onresult = e => { let parcial = ''; for (let i = e.resultIndex; i < e.results.length; i++) { const t = e.results[i][0].transcript; if (e.results[i].isFinal) fin += t; else parcial += t; } onState('parcial', (fin + ' ' + parcial).trim()); };
    rec.onerror = e => { onState('erro', e.error || ''); };
    rec.onend = () => { rec = null; onState('fim', fin.trim()); if (fin.trim()) onResult(fin.trim()); };
    try { rec.start(); onState('ouvindo', ''); } catch(e){ rec = null; toast('Não deu para ligar o microfone.'); return false; }
    return true;
  }
  function stop(){ if (rec) { try { rec.onend = null; rec.onresult = null; rec.abort(); } catch(e){} rec = null; } }
  const erroMsg = k => k === 'not-allowed' || k === 'service-not-allowed' ? 'Permita o microfone para este site e tente de novo.' : k === 'no-speech' ? 'Não ouvi nada. Toque e fale de novo.' : k === 'network' ? 'O ditado precisa de internet.' : 'Não deu para ouvir (' + k + ').';
  return { ok:!!SR, start, stop, erroMsg };
})();
const semAcento = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

function numerosPorExtenso(t){ // "cento e vinte reais" -> "120 reais"; "um" sozinho só vira número antes de real/mil/conto
  const w = t.split(' '), out = []; let i = 0;

    const base = { cartao:s.cartao, quem:s.quem === 'irmao' ? 'irmao' : 'eu', desc:val('s-desc').trim(), cat:s.cat || '' };
    if (s.id) { const g = S.gastos.find(x => x.id === s.id); if (g) Object.assign(g, base, { valor:v, data }); }
    else {
      const n = Math.max(1, parseInt(val('s-parc') || '1', 10) || 1), cr = Date.now(), grp = n > 1 ? uid() : undefined;
      const parte = Math.floor(v / n), resto = v - parte * n;
      for (let k = 0; k < n; k++) S.gastos.push(Object.assign({ id:uid(), cr:cr + k, valor:parte + (k === 0 ? resto : 0), data:addMonths(data, k), grp, parc:n > 1 ? (k + 1) + '/' + n : undefined }, base));
      S.ult.cartao = s.cartao;
    }
    const np = parseInt(val('s-parc') || '1', 10) || 1, msg = s.id ? 'Gasto atualizado.' : (base.quem === 'irmao' ? S.irmao.nome + ': ' : '') + fmt(v) + ' no ' + cartao(s.cartao).nome + (np > 1 ? ' em ' + np + '×' : '') + '. Salvo!';
    save(); Sheet.close(); render(); toast(msg);
  }
  if (a === 'repetir-gasto') { const g = S.gastos.find(x => x.id === s.id); if (!g) return; S.gastos.push({ id:uid(), cr:Date.now(), valor:g.valor, data:todayISO(), cartao:g.cartao, quem:g.quem, desc:g.desc, cat:g.cat }); save(); Sheet.close(); render(); toast('Repetido hoje: ' + fmt(g.valor) + '.'); }
  if (a === 'apagar-gasto') { if (!confirm('Apagar este gasto?')) return; S.gastos = S.gastos.filter(x => x.id !== s.id); save(); Sheet.close(); render(); toast('Gasto apagado.'); }
  if (a === 'salvar-receita') {
    const v = cents(), data = val('s-data'); if (v <= 0) return toast('Digite o valor recebido.'); if (!okData(data)) return toast('Confira a data.');
    const o = { fonte:s.fonte, valor:v, data, obs:val('s-obs').trim() };
    if (s.id) { const r = S.receitas.find(x => x.id === s.id); if (r) Object.assign(r, o); } else S.receitas.push(Object.assign({ id:uid(), cr:Date.now() }, o));
    save(); Sheet.close(); render(); toast('Receita salva: ' + fmt(v) + '.');
  }
  if (a === 'apagar-receita') { if (!confirm('Apagar esta receita?')) return; S.receitas = S.receitas.filter(x => x.id !== s.id); save(); Sheet.close(); render(); }
  if (a === 'salvar-saldo') { if (!(s.dig || '').length) return toast('Digite o saldo.'); const v = cents(); S.saldos.push({ valor:v, cr:Date.now() }); if (S.saldos.length > 60) S.saldos = S.saldos.slice(-60); save(); Sheet.close(); render(); toast('Saldo anotado: ' + fmt(v) + '.'); }
  if (a === 'salvar-pag') {
    const v = cents(), data = val('s-data'); if (v <= 0) return toast('Digite o valor pago.'); if (!okData(data)) return toast('Confira a data.');
    const o = { valor:v, data, obs:val('s-obs').trim() };
    if (s.id) { const x = S.pagamentos.find(y => y.id === s.id); if (x) Object.assign(x, o); } else S.pagamentos.push(Object.assign({ id:uid(), cr:Date.now() }, o));
    save(); Sheet.close(); render(); toast('Pagamento anotado: ' + fmt(v) + '.');
  }
  if (a === 'apagar-pag') { if (!confirm('Apagar este pagamento?')) return; S.pagamentos = S.pagamentos.filter(x => x.id !== s.id); save(); Sheet.close(); render(); }
});
async function copiar(t){
  try { await navigator.clipboard.writeText(t); toast('Copiado! Cole no WhatsApp.'); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Copiado!'); } catch(e2){ toast('Não deu para copiar. Selecione o texto e copie.'); } ta.remove(); }
}

document.addEventListener('click', ev => {

  if (a === 'voz') sheetVoz();

  if (a === 'ed-gasto') { const g = S.gastos.find(x => x.id === k); if (g) sheetGasto(g); }
  if (a === 'nova-receita') sheetReceita();
  if (a === 'ed-receita') { const r = S.receitas.find(x => x.id === k); if (r) sheetReceita(r); }
  if (a === 'saldo') sheetSaldo();
  if (a === 'novo-pag') sheetPag();
  if (a === 'ed-pag') { const x = S.pagamentos.find(y => y.id === k); if (x) sheetPag(x); }
  if (a === 'cobranca') sheetCobranca();
  if (a === 'zap') window.open(zapURL(textoCobranca()), '_blank', 'noopener');
  if (a === 'ver-cartao') { UI.tab = 'cartao'; UI.cartao = k; UI.xQuem = ''; window.scrollTo({ top:0 }); render(); }
  if (a === 'x-quem') { UI.xQuem = k; render(); }
  if (a === 'novo-gasto-cartao') sheetGasto({ cartao:k });
  if (a === 'add-cartao-resumo') { UI.tab = 'ajustes'; S.cartoes.push({ id:uid(), nome:'Novo cartão', cor:S.cartoes.length % 8, tipo:'credito', fecha:null }); save(); window.scrollTo({ top:0 }); render(); toast('Cartão criado. Dê o nome e a cor aqui embaixo.'); }
  if (a === 'f-cart') { UI.fCart = k; render(); }
  if (a === 'f-quem') { UI.fQuem = k; render(); }
  if (a === 'scroll') { const el = $('#sec-rec'); if (el) el.scrollIntoView({ behavior:'smooth', block:'start' }); }
  // ajustes
  if (a === 'add-fonte') { S.fontes.push({ id:uid(), nome:'Nova fonte' }); save(); render(); }
  if (a === 'del-fonte') { if (S.fontes.length <= 1) return toast('Deixe pelo menos uma fonte.'); const used = S.receitas.some(r => r.fonte === k); if (used && !confirm('Há receitas lançadas nessa fonte. Apagar mesmo assim? (as receitas continuam, sem nome)')) return; S.fontes = S.fontes.filter(f => f.id !== k); save(); render(); }
  if (a === 'add-cartao') { S.cartoes.push({ id:uid(), nome:'Novo cartão', cor:S.cartoes.length % 8, tipo:'credito', fecha:null }); save(); render(); }
  if (a === 'del-cartao') { if (S.cartoes.length <= 1) return toast('Deixe pelo menos um cartão.'); const used = S.gastos.some(g => g.cartao === k); if (used && !confirm('Há gastos lançados nesse cartão. Apagar mesmo assim? (os gastos continuam, sem nome)')) return; S.cartoes = S.cartoes.filter(c => c.id !== k); if (S.ult.cartao === k) S.ult.cartao = S.cartoes[0].id; save(); render(); }
  if (a === 'tipo-cartao') { const c = cartao(k); c.tipo = b.dataset.v; if (c.tipo === 'conta') c.fecha = null; save(); render(); }
  if (a === 'cor-cartao') { cartao(k).cor = +b.dataset.v; save(); render(); }
  if (a === 'add-cat') { const n = prompt('Nome da categoria:'); if (n && n.trim()) { if (!S.cats.includes(n.trim())) S.cats.push(n.trim()); save(); render(); } }
  if (a === 'del-cat') { if (!confirm('Apagar a categoria "' + k + '"?')) return; S.cats = S.cats.filter(c => c !== k); save(); render(); }
  if (a === 'tema') { if (k === 'auto') { delete document.documentElement.dataset.theme; ls.set(LST, ''); } else { document.documentElement.dataset.theme = k; ls.set(LST, k); } render(); }
  if (a === 'exportar') { const blob = new Blob([JSON.stringify(S, null, 1)], { type:'application/json' }); const u = URL.createObjectURL(blob); const l = document.createElement('a'); l.href = u; l.download = 'financas-' + todayISO() + '.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); }
  if (a === 'atu-go') atuGo();
  if (a === 'sair' && Cloud) { if (confirm('Sair da conta neste aparelho?')) Cloud.auth.signOut().finally(() => location.reload()); }
});

document.addEventListener('change', ev => {
  const el = ev.target.closest('[data-f="importar"]'); if (!el || !el.files[0]) return;
  const fr = new FileReader();
  fr.onload = () => { try { const o = normalize(JSON.parse(fr.result)); if (!confirm('Substituir tudo pela cópia (' + o.gastos.length + ' gastos, ' + o.receitas.length + ' receitas)?')) return; S = o; save(); render(); toast('Cópia restaurada.'); } catch(e){ toast('Esse arquivo não é uma cópia válida.'); } el.value = ''; };
  fr.readAsText(el.files[0]);

document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#sheet').hidden) Sheet.close(); });

/* ========== porta de entrada (conta própria desta página; a primeira a entrar vira a dona) ========== */
function gate(){
  const g = $('#gate'); if (!Cloud) { $('#banner').hidden = false; $('#banner').textContent = 'Modo local: os dados ficam só neste aparelho. No site, com seu login, tudo vai para a nuvem.'; render(); return; }
  const A = Cloud.auth, P_ = window.firebase.auth.Auth.Persistence; const st = { first:false, busy:false, show:false, msg:'' };
  const within = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code:'timeout' }), ms))]);
  const okMail = u => /^\S+@\S+\.\S+$/.test(u);
  function msgOf(e){
    const k = e && e.code || '';
    if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(k)) return 'E-mail ou senha incorretos.';
    if (k === 'auth/too-many-requests') return 'Muitas tentativas. Espere alguns minutos e tente de novo.';
    if (k === 'auth/network-request-failed') return 'Sem internet. Confira a conexão e tente de novo.';
    if (k === 'auth/weak-password') return 'Senha fraca: use pelo menos 6 caracteres.';
    if (k === 'auth/invalid-email') return 'Esse e-mail não parece válido.';
    if (k === 'auth/operation-not-allowed') return 'No Firebase, ative o login por E-mail/senha (Authentication, Método de login).';
    if (k === 'permission-denied') return 'O banco recusou o acesso. Publique o REGRAS-FIRESTORE.txt (bloco "financas") no Firebase.';
    if (k === 'timeout' || k === 'unavailable') return 'O banco online não respondeu. Confira a internet.';
    return 'Não deu para entrar agora (' + (k || 'erro') + '). Tente de novo.';
  }
  const say = (m, ok) => { const el = g.querySelector('.gate-msg'); if (el) { el.textContent = m; el.classList.toggle('ok', !!ok); } };
  function open(){
    g.hidden = false; document.body.classList.add('locked');
    g.innerHTML = `<div class="gate-in"><span class="gate-logo">${logo()}</span><p class="gate-eb">Simplificando · área pessoal</p><h1>Finanças<span class="pt"></span></h1>
      <div class="cc dark tilt"><div class="chip"></div><div class="lg">R$</div><div class="nm">${esc(DONO.nome)}</div><div class="no">${st.first ? 'Primeiro acesso' : 'Perfil único'}</div></div>
      <p class="gate-sub">${st.first ? 'Crie o e-mail e a senha de ' + esc(DONO.nome) + '. Este é o único perfil da página: depois de criado, ninguém mais consegue entrar.' : 'Entre com o e-mail e a senha de ' + esc(DONO.nome) + '.'}</p>
      <form novalidate><label>E-mail<span class="gate-f"><input id="g-u" type="email" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" value="${esc(ls.get('simplificando-financas-mail') || '')}" required></span></label>
      <label>Senha<span class="gate-f"><input id="g-p" type="password" autocomplete="${st.first ? 'new-password' : 'current-password'}" required><button type="button" class="gate-eye" data-gate="eye" aria-label="Mostrar senha">${I.eye}</button></span></label>
      ${st.first ? `<label>Repita a senha<span class="gate-f"><input id="g-p2" type="password" autocomplete="new-password" required></span></label>` : ''}
      <label class="gate-keep"><input id="g-keep" type="checkbox" checked>Continuar conectado neste aparelho</label>
      <p class="gate-msg" role="alert">${esc(st.msg || '')}</p>
      <button type="submit" class="btn primary gate-go">${st.first ? 'Criar o acesso de ' + esc(DONO.nome) : 'Entrar como ' + esc(DONO.nome)}</button>
      ${st.first ? '' : `<button type="button" class="gate-link" data-gate="forgot">Esqueci a senha</button>`}</form>
      <p class="gate-note">Os dados ficam na nuvem do Simplificando, visíveis só para a conta dona desta página. O login, os dados e a atualização são separados do painel do personal.</p></div>`;
  }
  function loading(){ g.hidden = false; g.innerHTML = `<div class="gate-in"><span class="gate-logo">${logo()}</span><p class="gate-sub" role="status">Conectando…</p></div>`; }
  function close(){ g.hidden = true; g.innerHTML = ''; document.body.classList.remove('locked'); }
  async function enter(user, fresh){
    let owner = null;
    try { owner = await within(Cloud.ownerUid(), 12000); if (!owner) { await within(Cloud.claim(user.uid), 12000); owner = user.uid; } }
    catch(e){ st.msg = msgOf(e); try { await A.signOut(); } catch(e2){} open(); return; }
    if (owner !== user.uid) { try { await A.signOut(); } catch(e){} st.first = false; st.msg = 'Esta conta não é a de ' + DONO.nome + '. Só o perfil dele entra aqui.'; open(); return; }
    ls.set('simplificando-financas-mail', user.email || ''); st.msg = ''; close(); render(); Cloud.connect(user); if (fresh) toast(st.first ? 'Acesso criado. Bem-vindo, ' + DONO.nome.split(' ')[0] + '.' : 'Bem-vindo de volta, ' + DONO.nome.split(' ')[0] + '.');
  }
  g.addEventListener('click', async ev => {
    const b = ev.target.closest('[data-gate]'); if (!b) return;
    if (b.dataset.gate === 'eye') { st.show = !st.show; g.querySelectorAll('#g-p,#g-p2').forEach(i => { i.type = st.show ? 'text' : 'password'; }); }
    if (b.dataset.gate === 'forgot') { const u = ($('#g-u') || {}).value || ''; if (!okMail(u)) { say('Digite seu e-mail acima e toque em "Esqueci a senha" de novo.'); return; } try { await A.sendPasswordResetEmail(u.trim()); say('Pronto. Se este e-mail for o desta página, chega um link para criar uma senha nova.', true); } catch(e){ say(msgOf(e)); } }
  });
  g.addEventListener('submit', async ev => {
    ev.preventDefault(); if (st.busy) return;
    const u = $('#g-u').value.trim(), p = $('#g-p').value, keep = $('#g-keep').checked;
    if (!okMail(u)) { say('Digite um e-mail válido.'); return; }
    if (st.first) { const p2 = ($('#g-p2') || {}).value || ''; if (p.length < 6) { say('A senha precisa ter pelo menos 6 caracteres.'); return; } if (p !== p2) { say('As duas senhas não são iguais.'); return; } }
    else if (!p) { say('Digite sua senha.'); return; }
    st.busy = true; const go = g.querySelector('.gate-go'); go.disabled = true; say('Entrando…', true);
    try {
      await A.setPersistence(keep ? P_.LOCAL : P_.SESSION);
      let cred;
      if (st.first) { try { cred = await A.createUserWithEmailAndPassword(u, p); } catch(e){ if (e && e.code === 'auth/email-already-in-use') cred = await A.signInWithEmailAndPassword(u, p); else throw e; } }
      else cred = await A.signInWithEmailAndPassword(u, p);
      await enter(cred.user, true);
    } catch(e){ say(msgOf(e)); }
    finally { st.busy = false; if (go.isConnected) go.disabled = false; }
  });
  loading();
  within(Cloud.ownerUid(), 10000).then(o => { st.first = !o; }).catch(e => { st.first = false; st.msg = msgOf(e); }).finally(() => {
    const un = A.onAuthStateChanged(u => { un(); if (u) enter(u, false); else open(); });
  });
}
window.__fin = { entender, estado:() => S }; // para testes
render(); gate();
})();
