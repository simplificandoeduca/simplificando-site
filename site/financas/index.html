<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1712">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<!-- Página independente do painel do personal: login, dados e atualização próprios. -->
<meta name="description" content="Controle pessoal de finanças.">
<title>Simplificando · Finanças</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="fb/firebase-app-compat.js"></script>
<script src="fb/firebase-auth-compat.js"></script>
<script src="fb/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&display=swap">
<style>
/* Finanças pessoais: página independente (login, dados e atualização próprios), com a mesma família visual do site.
   Uma página só: Resumo, Gastos, Irmão e Ajustes, com o botão grande de lançar gasto sempre à mão. */
:root{
  --ink:#0F1712;--cream:#F6F5EF;--lime:#C8F542;--brand:#FF4646;--on-brand:#0F1712;--water:#5AB8FF;--ok:#8EE85F;--warn:#FF9A2E;--bad:#FF7A72;
  --bg:#0F1712;--fg:#F6F5EF;--muted:#A9B0AA;--card:#172019;--card-line:transparent;--sep:#2E3931;--ctl:#253028;--ctl-fg:#F6F5EF;
  --seg-on:#F6F5EF;--seg-on-fg:#0F1712;--input:#0F1712;--accent:var(--lime);--on-accent:#0F1712;--focus:#F6F5EF;--danger:#FF7A72;
  --tab-bg:#F6F5EF;--tab-fg:#5B625D;--tab-on:#0F1712;--tab-on-fg:#F6F5EF;--tab-shadow:0 14px 40px rgba(0,0,0,.55);
  --toast-bg:#F6F5EF;--toast-fg:#0F1712;--sheet:#172019;--scrim:rgba(0,0,0,.62);--r:26px;
  /* cores dos cartões (escolhidas no Ajustes); passam no teste de daltonismo sobre o fundo escuro */
  --c0:#FF4646;--c1:#5AB8FF;--c2:#FF9A2E;--c3:#B794FF;--c4:#8EE85F;--c5:#F5D04C;--c6:#FF7AB6;--c7:#A9B0AA;
  --pad-line:rgba(142,232,95,.55);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --spring:cubic-bezier(.3,1.5,.5,1);--ease:cubic-bezier(.2,.9,.25,1);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --pad-line:rgba(62,158,62,.55);
  --bg:#FFFFFF;--fg:#0F1712;--muted:#5B625D;--card:#F4F4F1;--card-line:rgba(15,23,18,.08);--sep:#E0E0DA;--ctl:#E8E8E3;--ctl-fg:#0F1712;
  --seg-on:#FFFFFF;--seg-on-fg:#0F1712;--input:#FFFFFF;--focus:#0F1712;--danger:#C8302F;--accent:#0F1712;--on-accent:#F6F5EF;
  --tab-bg:#FFFFFF;--tab-shadow:0 10px 30px rgba(15,23,18,.14),0 0 0 1px rgba(15,23,18,.07);
  --toast-bg:#0F1712;--toast-fg:#FFFFFF;--sheet:#FFFFFF;--scrim:rgba(15,23,18,.38);
  --c0:#D62E2E;--c1:#2B7FD6;--c2:#D97A12;--c3:#8A5CE6;--c4:#3E9E3E;--c5:#B8960B;--c6:#D2467F;--c7:#6B726D;
  color-scheme:light;
}}
:root[data-theme="light"]{
  --pad-line:rgba(62,158,62,.55);
  --bg:#FFFFFF;--fg:#0F1712;--muted:#5B625D;--card:#F4F4F1;--card-line:rgba(15,23,18,.08);--sep:#E0E0DA;--ctl:#E8E8E3;--ctl-fg:#0F1712;
  --seg-on:#FFFFFF;--seg-on-fg:#0F1712;--input:#FFFFFF;--focus:#0F1712;--danger:#C8302F;--accent:#0F1712;--on-accent:#F6F5EF;
  --tab-bg:#FFFFFF;--tab-shadow:0 10px 30px rgba(15,23,18,.14),0 0 0 1px rgba(15,23,18,.07);
  --toast-bg:#0F1712;--toast-fg:#FFFFFF;--sheet:#FFFFFF;--scrim:rgba(15,23,18,.38);
  --c0:#D62E2E;--c1:#2B7FD6;--c2:#D97A12;--c3:#8A5CE6;--c4:#3E9E3E;--c5:#B8960B;--c6:#D2467F;--c7:#6B726D;
  color-scheme:light;
}
/* blocos de cor cheia: texto sempre tinta */
.blk-lime,.blk-ok,.blk-warn,.blk-bad,.blk-water{--card-line:transparent;--fg:#0F1712;--muted:rgba(15,23,18,.72);--ctl:rgba(15,23,18,.12);--sep:rgba(15,23,18,.26);--ctl-fg:#0F1712;--accent:#0F1712;--on-accent:#F6F5EF;--seg-on:#F6F5EF;--seg-on-fg:#0F1712;--focus:#0F1712;--input:rgba(246,245,239,.62);--danger:#0F1712}
.blk-lime{--card:var(--lime)}.blk-ok{--card:var(--ok)}.blk-warn{--card:var(--warn)}.blk-bad{--card:var(--bad)}.blk-water{--card:var(--water)}

*{box-sizing:border-box}
html,body{min-height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,textarea{font-size:16px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,label,select,input,textarea,a,[data-a]{touch-action:manipulation}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* topo */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.top .logo{width:30px;height:30px}
.top h1{margin:0;font-size:19px;font-weight:900;letter-spacing:-.04em;flex:1;display:flex;align-items:baseline;gap:4px}
.top h1 small{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)}.dot.busy{background:var(--warn);animation:pulse 1s infinite}.dot.off{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
.mnav{display:flex;align-items:center;justify-content:center;gap:4px;padding:2px max(16px,env(safe-area-inset-right,0px)) 10px}
.mnav button{border:0;background:var(--ctl);color:var(--ctl-fg);min-width:40px;height:40px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center}
.mnav .mlab{flex:1;max-width:260px;font-weight:800;letter-spacing:-.02em;font-size:16px}
.mnav .mlab.hoje{background:transparent}

main{max-width:720px;margin:0 auto;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(120px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.view{display:flex;flex-direction:column;gap:12px}
.view[hidden]{display:none}
.eyebrow{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);color:var(--fg);box-shadow:inset 0 0 0 1px var(--card-line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;position:relative;min-width:0}
.card h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em}
.card .hd{display:flex;align-items:center;gap:10px}
.card .hd h2{flex:1}
.big{font-size:38px;font-weight:900;letter-spacing:-.05em;line-height:1.05;font-variant-numeric:tabular-nums;margin:0;word-break:break-word}
.big small{font-size:18px;letter-spacing:-.01em;font-weight:800;margin-right:3px}
.sub{margin:0;color:var(--muted);font-size:13.5px;line-height:1.4}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0;background:var(--card);box-shadow:inset 0 0 0 1px var(--card-line);color:var(--fg);border:0;text-align:left}
.kpi b{font-size:24px;font-weight:900;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:12.5px;line-height:1.3;color:var(--muted)}
.kpi.neg b{color:var(--danger)}
@media (min-width:560px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.kpi b{font-size:22px}}

.pill{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--ctl);color:var(--fg);white-space:nowrap}
.pill .sw{width:8px;height:8px;border-radius:50%;background:var(--sw,var(--muted))}
.btn{min-height:44px;padding:0 18px;border:0;border-radius:999px;background:var(--ctl);color:var(--ctl-fg);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700;letter-spacing:-.01em;transition:transform .2s var(--spring),background .2s,opacity .2s;user-select:none;-webkit-user-select:none;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1.5px var(--danger)}
.btn.sm{min-height:36px;padding:0 14px;font-size:13.5px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.small{gap:6px}.chips.small .opt{min-height:34px;padding:0 11px;font-size:13px;gap:5px}
.opt{min-height:40px;padding:0 14px;border:0;border-radius:999px;background:var(--ctl);color:var(--ctl-fg);font-size:14px;font-weight:600;transition:transform .2s var(--spring),background .2s;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.opt .sw{width:9px;height:9px;border-radius:50%;background:var(--sw,var(--muted));flex:none}
.opt.on{background:var(--accent);color:var(--on-accent);font-weight:800}
.opt.on .sw{box-shadow:0 0 0 2px var(--on-accent)}
.opt:active{transform:scale(.95)}
.seg{display:flex;background:var(--ctl);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;color:var(--ctl-fg);min-height:38px;border-radius:999px;font-weight:700;font-size:14px;opacity:.75}
.seg button.on{background:var(--seg-on);color:var(--seg-on-fg);opacity:1}

.list{background:var(--card);box-shadow:inset 0 0 0 1px var(--card-line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:11px 16px;border:0;background:none;color:var(--fg);text-align:left;position:relative;transition:background .2s;font:inherit}
.row+.row,.row+.gh,.gh+.row{border-top:1px solid var(--sep)}
button.row:active{background:var(--ctl)}
.row .sw{width:10px;height:10px;border-radius:50%;background:var(--sw,var(--muted));flex:none}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .tx b{font-weight:700;font-size:15px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tx span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .val{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap;text-align:right}
.row .val small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.row .val.in{color:var(--ok)}
:root[data-theme="light"] .row .val.in,:root:not([data-theme="dark"]) .row .val.in{color:#2E7D32}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .row .val.in{color:var(--ok)}}
.gh{padding:12px 16px 4px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.gh b{font-weight:800;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.tag{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--warn);color:#0F1712;text-transform:uppercase;letter-spacing:.04em}
.tag.me{background:var(--ctl);color:var(--fg)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty b{color:var(--fg);font-size:17px;letter-spacing:-.02em}

/* barras por cartão: rótulo direto em cada barra, cor segue o cartão */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:flex;flex-direction:column;gap:5px;border:0;background:none;color:inherit;padding:0;text-align:left;width:100%;font:inherit}
.bar .l{display:flex;align-items:center;gap:8px;font-size:14px}
.bar .l b{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .l .v{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bar .l .v small{color:var(--muted);font-weight:600;font-size:12px;margin-left:6px}
.bar .t{height:10px;border-radius:999px;background:var(--ctl);overflow:hidden;display:flex;gap:2px}
.bar .t i{display:block;height:100%;background:var(--sw);border-radius:999px;min-width:0;transition:width .4s var(--ease)}
.bar .t i.ir{opacity:.45}
.bar .n{font-size:12px;color:var(--muted)}

/* campos */
.field{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:700}
.field input,.field select,.field textarea{min-height:48px;padding:0 14px;border:0;border-radius:16px;background:var(--input);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--sep);font-weight:500;font-size:16px;width:100%;outline:0}
.field textarea{padding:12px 14px;min-height:70px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{box-shadow:inset 0 0 0 2px var(--focus)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inline{display:flex;align-items:center;gap:10px}
.inline .field{flex:1}

/* abas de baixo + botão de lançar */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--tab-bg);border-radius:999px;padding:6px;display:flex;align-items:center;gap:2px;box-shadow:var(--tab-shadow);max-width:calc(100% - 24px)}
.tab{border:0;background:transparent;color:var(--tab-fg);min-width:60px;height:52px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:800;letter-spacing:.02em;padding:0 8px}
.tab .i{width:21px;height:21px}
.tab.on{background:var(--tab-on);color:var(--tab-on-fg)}
.fab{border:0;background:var(--brand);color:#0F1712;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 4px;box-shadow:0 8px 22px rgba(255,70,70,.4);transition:transform .2s var(--spring)}
.fab:active{transform:scale(.92)}
.fab .i{width:28px;height:28px;stroke-width:2.6}

/* folha (modal de baixo) */
.sheet-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim);animation:fade .2s}
.sheet-wrap[hidden]{display:none}
.sheet .sec{gap:6px}.sheet .lbl{font-size:12px}
.lbl-in{display:flex;align-items:baseline;gap:6px}.lbl-in small{font-weight:500;color:var(--muted);font-size:12px}
.fav{display:inline-flex;align-items:center}.fav .opt{padding-right:6px}.fav .xf{border:0;background:none;color:var(--muted);width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-left:2px}.fav .xf .i{width:13px;height:13px}
.btn.add{min-height:32px;padding:0 12px;font-size:13px;background:#0F1712;color:#F6F5EF;align-self:flex-start;box-shadow:inset 0 0 0 1.5px rgba(246,245,239,.28)}
.sheet{background:var(--sheet);color:var(--fg);width:100%;max-width:560px;max-height:calc(100dvh - 24px);overflow-y:auto;border-radius:28px 28px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .28s var(--ease);overscroll-behavior:contain}
@media (min-width:600px){.sheet-wrap{align-items:center}.sheet{border-radius:28px;max-height:calc(100dvh - 60px)}}
.sheet .grab{width:44px;height:5px;border-radius:999px;background:var(--sep);margin:0 auto 2px}
.sheet .hd{display:flex;align-items:center;gap:10px}
.sheet .hd h2{margin:0;font-size:20px;font-weight:900;letter-spacing:-.03em;flex:1}
.sheet .x{border:0;background:var(--ctl);color:var(--ctl-fg);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.amt{text-align:center;padding:0}
.amt .v{font-size:38px;font-weight:900;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.amt .v.zero{color:var(--muted)}
.amt .v.neg{color:var(--danger)}
.amt .h{font-size:12px;color:var(--muted);margin-top:2px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad button{border:1px solid var(--pad-line);background:var(--ctl);color:var(--ctl-fg);height:46px;border-radius:14px;font-size:21px;font-weight:700;transition:transform .15s var(--spring)}
.pad button:active{transform:scale(.94);background:var(--sep)}
.pad button.soft{font-size:16px}
.lbl{margin:0;font-size:12.5px;font-weight:700;color:var(--muted)}
.sheet .sec{display:flex;flex-direction:column;gap:8px}

/* porta de entrada */
.gate{position:fixed;inset:0;z-index:200;background:var(--bg);color:var(--fg);overflow-y:auto;overscroll-behavior:contain}
.gate-in{max-width:440px;margin:0 auto;min-height:100%;min-height:100dvh;display:flex;flex-direction:column;gap:14px;padding:calc(32px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.gate-logo{width:72px;height:72px}.gate-logo svg{width:100%;height:100%}
.gate-eb{margin:8px 0 0;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.gate h1{margin:0;font-size:40px;font-weight:900;letter-spacing:-.05em;line-height:1}
.gate h1 .pt{display:inline-block;width:.2em;height:.2em;border-radius:50%;background:var(--lime);margin-left:.04em}
.gate-sub{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.gate form{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.gate label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.gate-f{display:flex;align-items:center;gap:6px;height:58px;padding:0 6px 0 16px;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--sep)}
.gate-f:focus-within{box-shadow:inset 0 0 0 2px var(--fg)}
.gate-f input{flex:1;min-width:0;border:0;background:transparent;outline:0;font-size:16px;font-weight:500;height:100%}
.gate-eye{border:0;background:transparent;color:var(--muted);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.gate-keep{flex-direction:row !important;align-items:center;gap:10px;font-weight:600 !important;font-size:14px}
.gate-keep input{width:20px;height:20px;accent-color:var(--lime)}
.gate-msg{margin:0;min-height:20px;font-size:14px;color:var(--danger);font-weight:600}
.gate-msg.ok{color:var(--muted)}
.gate-go{height:56px;font-size:16px}
.gate-link{border:0;background:none;color:var(--muted);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:6px 0;align-self:flex-start}
.gate-note{margin:auto 0 0;color:var(--muted);font-size:13px;line-height:1.45}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--toast-bg);color:var(--toast-fg);padding:12px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:150;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--spring);max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.banner{background:var(--warn);color:#0F1712;border-radius:16px;padding:10px 14px;font-size:13.5px;font-weight:600}
.sw-pick{display:flex;gap:8px;flex-wrap:wrap}
.sw-pick button{width:34px;height:34px;border-radius:50%;border:0;background:var(--sw);transition:transform .2s var(--spring)}
.sw-pick button.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--fg);transform:scale(1.05)}
.set-item{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--sep)}
.set-item:first-of-type{border-top:0;padding-top:0}
.set-item .inline input{min-height:44px}
.x-sm{border:0;background:var(--ctl);color:var(--ctl-fg);width:40px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;white-space:pre-wrap;word-break:break-word;background:var(--input);border-radius:16px;padding:12px;box-shadow:inset 0 0 0 1.5px var(--sep);max-height:220px;overflow:auto;margin:0}
.mic{border:0;background:var(--lime);color:#0F1712;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;transition:transform .2s var(--spring)}
.mic:active{transform:scale(.92)}
.mic .i{width:20px;height:20px;stroke-width:2.2}
.mic.sm{width:36px;height:36px}.mic.sm .i{width:17px;height:17px}
.mic.ghost{background:var(--ctl);color:var(--ctl-fg)}
.mic.on{background:var(--brand);animation:pulse 1s infinite}
.voz{display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 0 4px;text-align:center}
.voz .mic{width:76px;height:76px}.voz .mic .i{width:34px;height:34px}
.voz .txt{margin:0;font-size:17px;font-weight:600;min-height:24px;line-height:1.35}
.voz .txt.muted{color:var(--muted);font-weight:500}
.ent{background:var(--card);box-shadow:inset 0 0 0 1px var(--card-line);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ent .big{font-size:34px}
.ent .det{margin:0;font-size:14px;color:var(--muted)}
.ent .det b{color:var(--fg)}
.fx{display:flex;align-items:center;gap:10px}
.perfil{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:inset 0 0 0 1px var(--card-line)}
.perfil .av{width:56px;height:56px;border-radius:50%;background:var(--lime);color:#0F1712;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;letter-spacing:-.04em;flex:none}
.perfil .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.perfil .tx b{font-size:17px;font-weight:800;letter-spacing:-.02em}
.perfil .tx span{font-size:12.5px;color:var(--muted)}
/* cartão desenhado (igual ao print): reto, chip, etiqueta, nome e fechamento */
:root{--g0:#FFB199;--g1:#BFE3FF;--g2:#FFD9A8;--g3:#D6B4FF;--g4:#D5FFB0;--g5:#FFF1A8;--g6:#FFC3DD;--g7:#F6F5EF;
--h0:#FF4646;--h1:#4FA8F0;--h2:#FF9A2E;--h3:#7C3AED;--h4:#6FD13F;--h5:#E6B91C;--h6:#FF5FA2;--h7:#B9BDB6}
.cc{position:relative;aspect-ratio:2.6;border-radius:18px;background:linear-gradient(135deg,var(--ga),var(--gb));box-shadow:0 14px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.45);overflow:hidden;color:#0F1712;container-type:inline-size}
.cc::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,0) 45%,rgba(255,255,255,0) 60%,rgba(255,255,255,.15) 100%);pointer-events:none}
.cc .chip{position:absolute;left:9%;top:24%;width:13%;aspect-ratio:1.25;border-radius:4px;background:linear-gradient(135deg,#f4d98a,#c9a23a);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.cc .chip::after{content:"";position:absolute;inset:30% 20%;border:1px solid rgba(0,0,0,.25);border-radius:2px}
.cc .lg{position:absolute;right:8%;top:16%;font-weight:900;font-size:clamp(9px,3.6cqw,13px);letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.cc .nm{position:absolute;left:9%;bottom:16%;font-weight:900;font-size:clamp(11px,4.6cqw,17px);letter-spacing:.03em;text-transform:uppercase;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc .no{position:absolute;right:8%;bottom:17%;font-weight:800;font-size:clamp(8px,3.2cqw,12px);letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.cc.dark{--ga:#1b2a20;--gb:#0F1712;color:#F6F5EF;box-shadow:0 20px 40px rgba(0,0,0,.5),inset 0 0 0 1px rgba(200,245,66,.35)}
.cc.dark .lg{color:var(--lime);opacity:1}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--card);border-radius:22px;padding:14px 14px 12px;box-shadow:inset 0 0 0 1px var(--card-line);display:flex;flex-direction:column;gap:10px;border:0;color:var(--fg);text-align:left;font:inherit;min-width:0;transition:transform .2s var(--spring)}
.tile:active{transform:scale(.97)}
.tile .tag2{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile .cc{margin:2px 0}
.tile b{font-size:16px;font-weight:900;letter-spacing:-.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .m{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.tile .m span{font-size:12px;color:var(--muted);line-height:1.3}
.tile .m em{font-style:normal;font-weight:900;font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.tile.novo{justify-content:center;align-items:center;color:var(--muted);min-height:170px;border:1.5px dashed var(--sep);box-shadow:none;background:transparent;gap:4px}
.tile.novo .i{width:28px;height:28px}
.xhd{display:flex;align-items:center;gap:10px}
.xhd .back{border:0;background:var(--ctl);color:var(--ctl-fg);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.xhd h2{margin:0;font-size:20px;font-weight:900;letter-spacing:-.03em;flex:1}
.kp3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp3 div{background:var(--card);box-shadow:inset 0 0 0 1px var(--card-line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kp3 b{font-size:15px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kp3 span{font-size:11px;color:var(--muted)}
.row .ic{width:34px;height:34px;border-radius:12px;background:var(--ctl);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.gate .cc{margin:14px 6px 4px}
/* visuais de cartões reais (Caixa Platinum, Nu business, Nu roxo) */
.cc.v-caixa,.cc.v-nu,.cc.v-nuroxo{background:none}
.cc.v-caixa,.cc.v-nu,.cc.v-nuroxo{box-shadow:0 14px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.5)}
.cc.v-caixa .chip,.cc.v-nu .chip,.cc.v-nuroxo .chip{background:linear-gradient(135deg,#e9e9e6,#b9b9b4);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);border-radius:14%;aspect-ratio:1.28}
.cc.v-caixa .chip::after,.cc.v-nu .chip::after,.cc.v-nuroxo .chip::after{inset:28% 22%;border-color:rgba(0,0,0,.18);border-radius:40%}
.cc.v-caixa .lg,.cc.v-caixa .no,.cc.v-nu .lg,.cc.v-nu .no,.cc.v-nuroxo .lg,.cc.v-nuroxo .no{display:none}
.cc.v-caixa{background:linear-gradient(#DCDDDB,#D2D4D1);color:#3a3f44}
.cc.v-caixa::before{background:linear-gradient(118deg,transparent 0 46%,rgba(255,255,255,.55) 46.2%,rgba(255,255,255,.35) 100%)}
.cc.v-caixa .nm{left:7%;top:9%;bottom:auto;font-weight:500;letter-spacing:.08em;font-size:clamp(8px,4.2cqw,15px);max-width:60%;color:#3a3f44}
.cc.v-caixa .chip{left:9%;top:33%}
.cc.v-caixa .nfc{position:absolute;left:24.5%;top:36%;width:7%;aspect-ratio:1}.cc.v-caixa .nfc svg{width:100%;height:100%;stroke:#555;fill:none;stroke-width:1.6}
.cc.v-caixa .x{position:absolute;right:6%;top:8%;width:22%;aspect-ratio:1.1}.cc.v-caixa .x svg{width:100%;height:100%}
.cc.v-nu{background:linear-gradient(160deg,#FFFFFF,#ECECEC);color:#222}
.cc.v-nuroxo{background:linear-gradient(160deg,#9A2FE8,#7A0BC7);color:#FFFFFF}
.cc.v-nu .mc,.cc.v-nuroxo .mc{position:absolute;left:8%;top:11%;width:19%;aspect-ratio:1.6}
.cc.v-nu .mc i,.cc.v-nuroxo .mc i{position:absolute;top:0;width:62%;height:100%;border-radius:50%}
.cc.v-nu .mc i:first-child,.cc.v-nuroxo .mc i:first-child{left:0;background:#EB001B}.cc.v-nu .mc i:last-child,.cc.v-nuroxo .mc i:last-child{right:0;background:#F79E1B;opacity:.95}
.cc.v-nu .mc i:last-child{mix-blend-mode:multiply}
.cc.v-nu .chip,.cc.v-nuroxo .chip{left:auto;right:8%;top:12%}
.cc.v-nu .nm,.cc.v-nuroxo .nm{left:8%;top:50%;bottom:auto;font-weight:500;text-transform:none;letter-spacing:0;font-size:clamp(9px,4.4cqw,15px);max-width:80%}
.cc.v-nu .logo,.cc.v-nuroxo .logo{position:absolute;left:8%;bottom:10%;font-size:clamp(14px,9cqw,30px);font-weight:900;letter-spacing:-.06em;line-height:1;color:#820AD1}
.cc.v-nuroxo .logo{color:#fff}
.cc.v-nu .biz{position:absolute;right:8%;bottom:12%;font-size:clamp(8px,4.4cqw,15px);font-weight:700;color:#820AD1}
.cc.v-pix{background:#FFFFFF;box-shadow:0 10px 24px rgba(50,188,173,.25),inset 0 0 0 1px rgba(50,188,173,.25);display:flex;align-items:center;justify-content:center}
.cc.v-pix img{height:64%;width:auto}.cc.v-pix.mini img{height:78%}
.cc.v-pix svg{height:70%;width:auto}.cc.v-pix.mini svg{height:88%}
.rc .mini.cc.v-pix{background:#FFFFFF}.cc.v-pix::before{background:none}
.rc .mini.cc{width:62px;aspect-ratio:1.586;border-radius:7px}
.rc .mini.cc.v-nu{background:linear-gradient(160deg,#FFFFFF,#ECECEC)}.rc .mini.cc.v-nuroxo{background:linear-gradient(160deg,#9A2FE8,#7A0BC7)}.rc .mini.cc.v-caixa{background:linear-gradient(#DCDDDB,#D2D4D1)}
.cc.v-nuroxo::before{background:linear-gradient(120deg,rgba(255,255,255,.22),rgba(255,255,255,0) 45%)}
.cc.v-nu::before{background:linear-gradient(120deg,rgba(255,255,255,.6),rgba(255,255,255,0) 50%)}
.rc .mini.cc .nm,.rc .mini.cc .nfc,.rc .mini.cc .biz{display:none}
.rc .mini.cc .chip{width:14%}.rc .mini.cc .x{width:26%}
.rc .mini.cc::after{display:none}
.imp-prev{max-height:40dvh;overflow:auto;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1px var(--card-line)}
.imp-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--sep);font-size:14px}
.imp-row:first-child{border-top:0}
.imp-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--lime);flex:none}
.imp-row .d{color:var(--muted);font-size:12px;width:44px;flex:none}
.imp-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-row .t small{display:block;color:var(--muted);font-size:11.5px}
.imp-row .v{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.imp-row.off{opacity:.45}
/* arrastar para a esquerda para apagar (lista de gastos) */
.swp{position:relative;overflow:hidden;background:var(--bad)}
.swp+.swp{border-top:1px solid var(--sep)}
.swp .row{background:var(--card);transition:transform .22s var(--ease);will-change:transform;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.swp.drag .row{cursor:grabbing}
.swp.drag .row{transition:none}
.swp .row+.row{border-top:0}
.swp .del{position:absolute;top:0;bottom:0;right:0;width:96px;display:flex;align-items:center;justify-content:center;gap:4px;color:#0F1712;font-weight:800;font-size:13px;border:0;background:transparent;flex-direction:column}
.swp .del .i{width:20px;height:20px;stroke-width:2.2}
.swp.two .del{width:150px;flex-direction:row;gap:0}
.swp.two .del button{flex:1;height:100%;border:0;background:transparent;color:#0F1712;font-weight:800;font-size:12px;line-height:1.15;padding:0 4px}
.swp.two .del button+button{border-left:1px solid rgba(15,23,18,.25)}
.vis{display:flex;gap:8px;flex-wrap:wrap}
.vis button{border:0;background:var(--ctl);color:var(--ctl-fg);border-radius:12px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;width:76px}
.vis button.on{box-shadow:0 0 0 2px var(--fg)}
.vis .cc{width:56px;border-radius:5px;box-shadow:none}.vis .cc .nm,.vis .cc .nfc,.vis .cc .biz,.vis .cc .lg,.vis .cc .no{display:none}.vis .cc .chip{width:14%}.vis .cc .x{width:26%}
.orc{display:flex;flex-direction:column;gap:4px}
.orc .ln{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.orc .ln b{color:var(--fg);font-variant-numeric:tabular-nums}
.orc .ln.tot{border-top:1px solid var(--sep);padding-top:6px;margin-top:2px;font-weight:700;color:var(--fg)}
.prog{height:10px;border-radius:999px;background:var(--ctl);overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s var(--ease)}
.blk-rosa{--card:#FFD6E3;--fg:#0F1712;--muted:rgba(15,23,18,.68);--ctl:rgba(15,23,18,.1);--sep:rgba(15,23,18,.2);--ctl-fg:#0F1712;--accent:#0F1712;--on-accent:#FFD6E3;--card-line:transparent;--focus:#0F1712}
.blk-rosa .prog{background:rgba(15,23,18,.12)}.blk-rosa .prog i{background:#E0467C}
.blk-rosa.feito{--card:#FFB8CF}
.porco{font-size:30px;line-height:1;flex:none}
.blk-verde{--card:#1F5E3A;--fg:#F6F5EF;--muted:rgba(246,245,239,.72);--ctl:rgba(246,245,239,.14);--sep:rgba(246,245,239,.22);--ctl-fg:#F6F5EF;--card-line:transparent}
.blk-verde .cta .l1 .ic{background:rgba(246,245,239,.14)}
.blk-verde .conta-st.ok{background:var(--ok);color:#0F1712}
.min-btn{border:0;background:var(--ctl);color:var(--ctl-fg);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;transition:transform .2s}
.min-btn .i{width:18px;height:18px}.min-btn.aberto{transform:rotate(180deg)}
#v-ajustes .card > .hd{cursor:pointer}
#v-ajustes .card.recolhido{gap:0}
#v-ajustes .card.recolhido > :not(.hd){display:none !important}
#v-ajustes .card.recolhido > .hd > :not(h2):not(.min-btn){display:none}
/* Ajustes: painel de blocos azul-marinho */
.ajp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ajp .tl{border:0;font:inherit;text-align:left;background:#14233B;color:#F6F5EF;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:4px;min-height:124px;min-width:0;transition:transform .2s var(--spring)}
.ajp .tl:active{transform:scale(.97)}
.ajp .tl b{font-weight:800;font-size:15px;letter-spacing:-.02em}
.ajp .tl .s{font-size:12px;color:rgba(246,245,239,.68);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ajp .tl .v{font-size:23px;font-weight:900;letter-spacing:-.04em;margin-top:auto;color:#C8F542;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ajp .tl .v.sm{font-size:15px}
.ajp .ib{width:42px;height:42px;border-radius:50%;background:rgba(200,245,66,.14);color:#C8F542;display:flex;align-items:center;justify-content:center;margin-bottom:6px;flex:none}
.ajp .span2{grid-column:span 2;min-height:auto;flex-direction:row;align-items:center;gap:12px}
.ajp .span2 .ib{margin:0}
.ajp .perfil{background:#C8F542;color:#0F1712}.ajp .perfil .s{color:rgba(15,23,18,.7)}
.ajp .av{width:44px;height:44px;border-radius:50%;background:#0F1712;color:#C8F542;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;flex:none}
.ajp .seg{background:rgba(255,255,255,.12);width:178px;flex:none}.ajp .seg button{color:#F6F5EF}.ajp .seg button.on{background:#C8F542;color:#0F1712}
.ajp .chev{margin-left:auto;opacity:.5;width:20px;height:20px}
svg.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ico .f{fill:currentColor;stroke:none;opacity:.2}svg.ico .s{fill:currentColor;stroke:none}
.ajv{display:flex;align-items:center;gap:10px}
#v-ajustes .aj-det > .hd > h2,#v-ajustes .aj-det > h2{display:none}
#v-ajustes .aj-det > .hd{justify-content:flex-end}
#v-ajustes .aj-det > .hd > .min-btn{display:none}
.ajv .back{border:0;background:#14233B;color:#C8F542;height:40px;padding:0 14px 0 10px;border-radius:999px;display:flex;align-items:center;gap:4px;font:inherit;font-weight:800;font-size:14px}
.ajv h2{margin:0;font-size:20px;font-weight:900;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.ajv h2 .ib{width:34px;height:34px;border-radius:50%;background:#14233B;color:#C8F542;display:flex;align-items:center;justify-content:center}
.ajv h2 .ib svg.ico{width:20px;height:20px}
.conta-st{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--ctl);color:var(--fg);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.conta-st.ok{background:var(--ok);color:#0F1712}.conta-st.bad{background:var(--bad);color:#0F1712}.conta-st.warn{background:var(--warn);color:#0F1712}
.row .btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.cta{display:flex;flex-direction:column;gap:8px;padding:12px 16px}
.cta+.cta{border-top:1px solid var(--sep)}
.cta .l1{display:flex;align-items:center;gap:10px}.cta .l1 b{flex:1;font-weight:800;font-size:15px;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cta .l1 .val{font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.cta .l2{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}.cta .l2 span.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* lista de cartões com miniatura (design C) */
.rc{display:flex;align-items:center;gap:14px;padding:12px 16px;width:100%;border:0;background:none;color:var(--fg);text-align:left;font:inherit;min-height:66px}
.rc+.rc{border-top:1px solid var(--sep)}
button.rc:active{background:var(--ctl)}
.rc .mini{width:58px;aspect-ratio:1.586;border-radius:7px;background:linear-gradient(140deg,var(--ga),var(--gb));position:relative;flex:none;box-shadow:0 4px 10px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.5)}
.rc .mini::after{content:"";position:absolute;left:12%;top:30%;width:18%;aspect-ratio:1.15;border-radius:2px;background:linear-gradient(135deg,#F7DC8F,#D9AE3C)}
.rc .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rc .tx b{font-weight:800;font-size:15.5px;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc .tx span{font-size:12px;color:var(--muted);line-height:1.3}

<script>
(() => {
'use strict';
/* ========== utilidades ========== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL = new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL' });
const fmt = c => BRL.format((c || 0) / 100);
const fmtBig = c => { const s = fmt(c); return '<small>R$</small>' + esc(s.replace(/^R\$\s?/, '')); };
const p2 = n => String(n).padStart(2, '0');
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36);
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); };
const nowKey = () => todayISO().slice(0, 7);
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d || 1); };
const addMonths = (iso, k) => { const [y, m, d] = iso.split('-').map(Number); const t = new Date(y, m - 1 + k, 1); const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate(); return t.getFullYear() + '-' + p2(t.getMonth() + 1) + '-' + p2(Math.min(d || 1, last)); };
const monthLabel = key => { const d = parseISO(key + '-01'); const t = d.toLocaleDateString('pt-BR', { month:'long', year:'numeric' }); return t.charAt(0).toUpperCase() + t.slice(1); };
const dayLabel = iso => {
  const t = todayISO(); if (iso === t) return 'Hoje';
  const y = new Date(); y.setDate(y.getDate() - 1); if (iso === y.getFullYear() + '-' + p2(y.getMonth() + 1) + '-' + p2(y.getDate())) return 'Ontem';
  return parseISO(iso).toLocaleDateString('pt-BR', { weekday:'short', day:'numeric', month:'short' }).replace('.', '');
};
const shortDate = iso => iso.slice(8, 10) + '/' + iso.slice(5, 7);
const whenLabel = ms => { const d = new Date(ms); return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + ' às ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); };
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);
const toast = (() => { let t; return msg => { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(t); t = setTimeout(() => el.classList.remove('show'), 2400); }; })();
const I = {
  plus:'<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  back:'<svg class="i" viewBox="0 0 24 24"><path d="M20 12H8m0 0l4-4m-4 4l4 4M4 5v14"/></svg>',
  chev:'<svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  copy:'<svg class="i" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>',
  zap:'<svg class="i" viewBox="0 0 24 24"><path d="M4 20l1.3-3.9A8 8 0 1 1 8.2 19z"/><path d="M9 10a4 4 0 0 0 5 5"/></svg>',
  trash:'<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  eye:'<svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  wallet:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/></svg>',
  mic:'<svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6"/></svg>',
  refresh:'<svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8"/><path d="M20 3v5h-5"/></svg>'
};
function logo(){
  const arc = (d, c) => '<path d="' + d + '" fill="none" stroke="' + c + '" stroke-width="3.8"/>';
  return '<svg viewBox="-50 -50 100 100" role="img" aria-label="Simplificando" width="100%" height="100%"><circle r="50" fill="#0F1712"/>' +
    arc('M0 -44.3A44.3 44.3 0 0 1 44.3 0.31', '#B794FF') + arc('M44.3 0A44.3 44.3 0 0 1 -0.31 44.3', '#C8F542') +
    arc('M0 44.3A44.3 44.3 0 0 1 -44.3 -0.31', '#5AB8FF') + arc('M-44.3 0A44.3 44.3 0 0 1 0.31 -44.3', '#FF4646') +
    '<text x="0" y="12" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="900" font-size="34" fill="#F6F5EF">R$</text></svg>';
}
$('#logo').innerHTML = logo(); document.querySelector('.top .mic').innerHTML = I.mic;

/* ========== estado ========== */
const FINV = '13 nov · 45'; // Versão do Finanças: 13 nov · 45
const DONO = { nome:'Eduardo Matias', iniciais:'EM' }; // perfil único desta página
const LS = 'simplificando-financas', LST = 'simplificando-financas-tema';
const CATS = ['Mercado', 'Comida', 'Transporte', 'Casa', 'Lazer', 'Saúde', 'Roupas', 'Assinaturas', 'Outros'];
function fresh(){
  return {
    v:1, em:0,
    fontes:[{ id:'f1', nome:'Emprego 1' }, { id:'f2', nome:'Emprego 2' }],
    cartoes:[{ id:'c1', nome:'Cartão 1', cor:0, tipo:'credito', fecha:null }, { id:'c2', nome:'Cartão 2', cor:1, tipo:'credito', fecha:null }, { id:'conta', nome:'Conta (débito / Pix)', cor:4, tipo:'conta', fecha:null }],
    receitas:[], gastos:[], pagamentos:[], saldos:[], favs:[], fixos:[], fixosFeitos:{}, guardados:[], pagFatura:[], meta:{ tipo:'valor', valor:0, pct:10 },
    irmao:{ nome:'Irmão', zap:'', pix:'' },
    cats:CATS.slice(), ult:{ cartao:'c1' }
  };
}
let S = fresh();
function normalize(o){
  const d = fresh(); if (!o || typeof o !== 'object') return d;
  for (const k of ['fontes', 'cartoes', 'receitas', 'gastos', 'pagamentos', 'saldos', 'cats', 'fixos', 'guardados', 'pagFatura', 'favs']) if (!Array.isArray(o[k])) o[k] = d[k];
  if (!o.fixosFeitos || typeof o.fixosFeitos !== 'object') o.fixosFeitos = {};
  o.meta = Object.assign({}, d.meta, o.meta || {});
  o.irmao = Object.assign({}, d.irmao, o.irmao || {}); o.ult = Object.assign({}, d.ult, o.ult || {});
  o.em = +o.em || 0; o.v = 1;
  if (!o.fontes.length) o.fontes = d.fontes; if (!o.cartoes.length) o.cartoes = d.cartoes;
  return o;
}
const ls = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };
try { S = normalize(JSON.parse(ls.get(LS) || 'null')); } catch(e){ S = fresh(); }
const theme = ls.get(LST); if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;

const UI = { ajSec:null, verMov:false, tab:'resumo', mes:nowKey(), fCart:'', fQuem:'', cartao:'', xQuem:'' };
const cartao = id => S.cartoes.find(c => c.id === id) || { id, nome:'(cartão apagado)', cor:7, tipo:'credito' };
const fonte = id => S.fontes.find(f => f.id === id) || { id, nome:'(fonte apagada)' };
const swOf = c => 'var(--c' + ((c.cor ?? 7) % 8) + ')';
const inMes = x => (x.data || '').slice(0, 7) === UI.mes;
const gastosMes = () => S.gastos.filter(inMes);
const PIX_SVG = '<img src="pix.png" alt="Pix">';
const CAIXA_X = '<span class="x"><svg viewBox="0 0 100 90"><polygon points="0,0 28,0 100,90 72,90" fill="#1F3B61"/><polygon points="72,0 100,0 58,52 44,34" fill="#F38B00"/><polygon points="0,90 28,90 46,66 32,50" fill="#F38B00"/></svg></span>';
const NFC = '<span class="nfc"><svg viewBox="0 0 24 24"><path d="M6 8a8 8 0 0 1 0 8M9.5 9.5a4.5 4.5 0 0 1 0 5M13 7a11 11 0 0 1 0 10"/></svg></span>';
const VISUAIS = { liso:'Cor lisa', caixa:'Caixa Platinum', nu:'Nu business', nuroxo:'Nu roxo' };
const corVis = c => c.visual === 'caixa' ? '#1F3B61' : (c.visual === 'nu' || c.visual === 'nuroxo') ? '#820AD1' : `var(--h${(c.cor ?? 7) % 8})`;
const ccHTML = (c, extra, cls) => {
  const v = VISUAIS[c.visual] && c.visual !== 'liso' ? c.visual : '', nome = esc(c.nome.replace(/\s*\(.*?\)\s*/g, ' ').trim());
  if (c.tipo === 'conta' && !v) return `<div class="cc v-pix ${cls || ''}">${PIX_SVG}</div>`;
  if (v === 'caixa') return `<div class="cc v-caixa ${cls || ''}"><div class="nm">${nome}</div><div class="chip"></div>${NFC}${CAIXA_X}</div>`;
  if (v === 'nu' || v === 'nuroxo') return `<div class="cc v-${v} ${cls || ''}"><span class="mc"><i></i><i></i></span><div class="chip"></div><div class="nm">${esc(DONO.nome)}</div><span class="logo">nu</span>${v === 'nu' ? '<span class="biz">business</span>' : ''}</div>`;
  return `<div class="cc ${cls || ''}" style="--ga:var(--g${(c.cor ?? 7) % 8});--gb:var(--h${(c.cor ?? 7) % 8})"><div class="chip"></div><div class="lg">${c.tipo === 'conta' ? 'Conta' : 'Crédito'}</div><div class="nm">${nome}</div><div class="no">${extra || (c.tipo === 'conta' ? 'Débito · Pix' : c.fecha ? 'Fecha dia ' + c.fecha : '')}</div></div>`;
};
const EMO = { mercado:'🛒', comida:'🍔', transporte:'🚗', casa:'🏠', lazer:'🎉', saude:'💊', roupas:'👕', assinaturas:'📺', outros:'💳' };
const emoji = g => EMO[String(g.cat || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()] || (g.fixo ? '🔁' : '💳');
const contaId = () => { // a conta (débito/Pix) de onde saem boletos; cria uma se não existir
  let c = S.cartoes.find(k => k.tipo === 'conta'); if (c) return c.id;
  c = { id:uid(), nome:'Pix / conta', cor:4, tipo:'conta', fecha:null }; S.cartoes.push(c); return c.id;
};
const needsSetup = () => S.fontes.some(f => /^Emprego \d$/.test(f.nome)) || S.cartoes.some(c => /^Cartão \d$/.test(c.nome));

/* ========== nuvem ========== */
const Cloud = (() => {
  const cfg = window.SIMPLIFICANDO_FIREBASE, fb = window.firebase;
  if (!cfg || !fb || !fb.initializeApp) return null;
  try { fb.initializeApp(cfg); } catch(e){ return null; }
  const auth = fb.auth(), db = fb.firestore();
  let ref = null, unsub = null, timer = null, dirty = false, saving = false;

/* ========== contas ========== */
function saldoAtual(){
  // conta só o que aconteceu DEPOIS do saldo informado: lançado depois (cr) E com data a partir do dia informado.
  // Assim gastos antigos importados ou lançados atrasados (que o banco já descontou) não mexem no saldo.
  if (!S.saldos.length) return null;
  const last = S.saldos[S.saldos.length - 1], dia = last.data || isoDe(last.cr);
  const depois = x => (x.cr || 0) > last.cr && (x.data || '') >= dia;
  const itens = [];
  for (const r of S.receitas.filter(depois)) itens.push({ t:'rec', sinal:1, valor:r.valor, data:r.data, nome:fonte(r.fonte).nome + (r.obs ? ' · ' + r.obs : ''), a:'ed-receita', id:r.id });
  for (const p of S.pagamentos.filter(depois)) itens.push({ t:'pag', sinal:1, valor:p.valor, data:p.data, nome:S.irmao.nome + ' pagou', a:'ed-pag', id:p.id });
  for (const g of S.gastos.filter(g => depois(g) && cartao(g.cartao).tipo === 'conta')) itens.push({ t:'gas', sinal:-1, valor:g.valor, data:g.data, nome:g.desc || g.cat || 'Pix', a:'ed-gasto', id:g.id });
  for (const x of S.guardados.filter(depois)) itens.push({ t:'gua', sinal:-1, valor:x.valor, data:x.data, nome:'Cofrinho' + (x.obs ? ' · ' + x.obs : ''), a:'ed-guardado', id:x.id });
  for (const x of S.pagFatura.filter(x => depois(x) && x.conta !== false)) itens.push({ t:'fat', sinal:-1, valor:x.valor, data:x.data, nome:'Fatura ' + cartao(x.cartao).nome, a:'ed-pagfat', id:x.id });
  const tot = t => sum(itens.filter(i => i.t === t), i => i.valor);
  const rec = tot('rec'), pag = tot('pag'), gas = tot('gas'), gua = tot('gua'), fat = tot('fat');
  itens.sort((a, b) => b.data.localeCompare(a.data));
  return { last, dia, itens, rec, pag, gas, gua, fat, est:last.valor + rec + pag - gas - gua - fat };
}
// depois de salvar: diz o saldo novo, ou por que ele não mudou
let SALDO_ANTES, LIVRE_ANTES;
function saldoLivre(){
  const sa = saldoAtual(); if (!sa) return null;
  const mesSalvo = UI.mes; UI.mes = nowKey();
  try {
    const o = orcamento();
    const boletosAbertos = sum(contasMes().filter(x => !x.pago && x.f.quem !== 'irmao'), x => x.f.valor);
    return { faturas:o.faturas, boletos:boletosAbertos, livre:sa.est - o.faturas - boletosAbertos };
  } finally { UI.mes = mesSalvo; }
}
function notaSaldo(data, ehConta){

  if (sl && LIVRE_ANTES !== undefined && sl.livre !== LIVRE_ANTES) return (ehConta === false ? ' Saldo na conta não muda (cartão).' : ' Saldo na conta não muda (data antiga).') + livre;

const isoDe = ms => { const d = new Date(ms); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); };
function irmaoPendente(){
  const gasto = sum(S.gastos.filter(g => g.quem === 'irmao'), g => g.valor);
  const pago = sum(S.pagamentos, p => p.valor);
  return { gasto, pago, deve:gasto - pago };
}
function faturaDe(c){ // a fatura ABERTA na data de referência: hoje (no mês atual) ou o dia 15 do mês escolhido.
  // Regra do Nubank: compra feita no dia do fechamento já entra na fatura seguinte.
  // Ex.: fecha dia 2 e hoje é 10/11 -> fatura de 02/11 a 01/12
  if (!c.fecha) return null;
  const hoje = todayISO(), ref = UI.mes === nowKey() ? hoje : UI.mes + '-15';
  const ultimo = m => new Date(+m.slice(0, 4), +m.slice(5, 7), 0).getDate();
  const fechaEm = m => m + '-' + p2(Math.min(c.fecha, ultimo(m)));
  let ini = fechaEm(UI.mes);
  if (ref < ini) ini = fechaEm(addMonths(UI.mes + '-01', -1).slice(0, 7));
  const d = parseISO(fechaEm(addMonths(ini, 1).slice(0, 7))); d.setDate(d.getDate() - 1);
  const fim = d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
  const itens = S.gastos.filter(g => g.cartao === c.id && g.data >= ini && g.data <= fim);
  return { ini, fim, total:sum(itens, g => g.valor), irmao:sum(itens.filter(g => g.quem === 'irmao'), g => g.valor) };
}
function pagosFatura(c, f){ // pagamentos da fatura do cartão no período (fatura, ou o mês escolhido se não tiver fechamento)
  const todos = S.pagFatura.filter(x => x.cartao === c.id && (f ? x.data >= f.ini && x.data <= f.fim : (x.data || '').slice(0, 7) === UI.mes)).sort((a, b) => b.data.localeCompare(a.data));
  const its = todos.filter(x => x.qual !== 'anterior'), ant = todos.filter(x => x.qual === 'anterior');
  return { itens:its, total:sum(its, x => x.valor), anteriores:ant, totalAnt:sum(ant, x => x.valor) };
}
function aplicarFixos(){ // cria o gasto de cada fixo no dia certo do mês atual (uma vez só, mesmo que depois seja apagado)
  const mes = nowKey(), hoje = todayISO(), ultimo = new Date(+mes.slice(0, 4), +mes.slice(5, 7), 0).getDate();
  let n = 0;
  // cartões com o mesmo código (a conta antiga renomeada + a conta criada depois): dá código novo ao segundo e aponta os boletos para ele
  const vistos = new Set();
  for (const c of S.cartoes) { if (vistos.has(c.id)) { const novo = uid(), velho = c.id; c.id = novo; if (c.tipo === 'conta') { for (const f of S.fixos) if (f.forma === 'boleto') f.cartao = novo; for (const g of S.gastos) if (g.boleto && g.cartao === velho) g.cartao = novo; for (const x of S.guardados) if (x.cartao === velho) x.cartao = novo; } n++; } vistos.add(c.id); }
  // contas no boleto/Pix sempre saem da conta corrente (corrige as salvas antes apontando para um cartão)
  for (const f of S.fixos) if (f.forma === 'boleto' && cartao(f.cartao).tipo !== 'conta') { f.cartao = contaId(); n++; }
  for (const f of S.fixos) {
    if (f.ativo === false || f.forma === 'boleto') continue;
    const key = f.id + '|' + mes; if (S.fixosFeitos[key]) continue;
    const data = mes + '-' + p2(Math.min(Math.max(1, f.dia || 1), ultimo)); if (data > hoje) continue;
    S.gastos.push({ id:uid(), cr:Date.now() + n, valor:f.valor, data, cartao:f.cartao, quem:f.quem === 'irmao' ? 'irmao' : 'eu', desc:f.nome, cat:f.cat || '', fixo:f.id });
    S.fixosFeitos[key] = true; n++;
  }
  return n;
}

function diasRestantes(){ // dias que faltam no mês escolhido, contando hoje (meses passados: 0; futuros: o mês inteiro)
  const [y, m] = UI.mes.split('-').map(Number), ultimo = new Date(y, m, 0).getDate();
  if (UI.mes < nowKey()) return 0; if (UI.mes > nowKey()) return ultimo;
  return ultimo - new Date().getDate() + 1;
}
function metaGuardar(prevista){ const m = S.meta || {}; return m.tipo === 'pct' ? Math.round(prevista * (m.pct || 0) / 100) : (m.valor || 0); }
function orcamento(){
  const rm = S.receitas.filter(inMes), recebido = sum(rm, r => r.valor), prevConf = sum(S.fontes, f => f.prev || 0);
  const prevista = Math.max(prevConf, recebido);
  // faturas dos cartões de crédito: só a minha parte, já descontando o que paguei
  let faturas = 0; const cartoesF = [];
  for (const c of S.cartoes) { if (c.tipo === 'conta') continue; const f = faturaDe(c), pf = pagosFatura(c, f); const gm = gastosMes().filter(g => g.cartao === c.id); const tot = f ? f.total : sum(gm, g => g.valor), ir = f ? f.irmao : sum(gm.filter(g => g.quem === 'irmao'), g => g.valor); const minha = Math.max(0, tot - ir - pf.total); faturas += minha; cartoesF.push({ c, minha }); }
  const boletosL = S.fixos.filter(f => f.ativo !== false && f.quem !== 'irmao' && f.forma === 'boleto'), boletos = sum(boletosL, f => f.valor);
  const meta = metaGuardar(prevista);
  const gm = gastosMes().filter(g => g.quem !== 'irmao');
  const variavel = sum(gm.filter(g => !g.fixo), g => g.valor);
  const pixVar = sum(gm.filter(g => !g.fixo && cartao(g.cartao).tipo === 'conta'), g => g.valor);
  // Posso gastar só cai com o cartão de crédito (pelas faturas); Pix não mexe nele
  const fixosTotal = faturas + boletos, orc = prevista - fixosTotal - meta, restante = orc, dias = diasRestantes();
  const guardado = sum(S.guardados.filter(inMes), x => x.valor);
  return { prevista, prevConf, recebido, faturas, boletos, boletosL, fixosTotal, meta, variavel, pixVar, orc, restante, dias, porDia:dias ? Math.floor(restante / dias) : 0, guardado };
}
function contasMes(){ // boletos e Pix fixos do mês escolhido, com situação
  const [y, m] = UI.mes.split('-').map(Number), ultimo = new Date(y, m, 0).getDate(), hoje = todayISO();
  return S.fixos.filter(f => f.ativo !== false && f.forma === 'boleto').map(f => {
    const venc = UI.mes + '-' + p2(Math.min(Math.max(1, f.dia || 1), ultimo)), key = f.id + '|' + UI.mes;
    const pago = S.gastos.find(g => g.fixo === f.id && (g.data || '').slice(0, 7) === UI.mes);

  }).sort((a, b) => (a.pago ? 1 : 0) - (b.pago ? 1 : 0) || a.venc.localeCompare(b.venc));
}

/* ========== atualizar a página (atualizar.php desta pasta baixa só /financas do GitHub) ========== */
const ATU = { st:'', nova:'', msg:'' };
function atuCheck(){
  if (ATU.st || !Cloud) return; ATU.st = 'vendo';
  fetch('atualizar.php?acao=ver', { cache:'no-store' }).then(r => r.ok ? r.json() : Promise.reject()).then(j => { ATU.st = 'ok'; ATU.nova = (j && j.nova) || ''; if (UI.tab === 'ajustes') render(); })
    .catch(() => { ATU.st = 'sem'; if (UI.tab === 'ajustes') render(); });
}
function atuCard(){
  atuCheck();
  if (!Cloud || ATU.st === 'sem') return '';
  const vnum = v => +((String(v || '').match(/·\s*(\d+)/) || [])[1] || 0), nova = ATU.nova && vnum(ATU.nova) > vnum(FINV), indo = ATU.st === 'indo';
  return `<div class="card ${nova ? 'blk-lime' : ''}"><h2>Atualizar esta página</h2><p class="sub">Versão no ar: <b>${esc(FINV)}</b>${ATU.st === 'vendo' ? ' · procurando versão nova…' : nova ? ' · <b>versão nova pronta: ' + esc(ATU.nova) + '</b>' : ATU.nova ? ' · já é a mais nova' : ''}</p>
    <div class="btns"><button type="button" class="btn ${nova ? 'primary' : ''}" data-a="atu-go" ${indo ? 'disabled' : ''}>${I.refresh}${indo ? 'Atualizando…' : 'Atualizar agora'}</button></div>
    ${ATU.msg ? `<p class="sub" style="color:var(--danger)">${esc(ATU.msg)}</p>` : ''}<p class="sub">Baixa do GitHub só a pasta do Finanças e coloca no ar. Não mexe no app nem no painel do personal.</p></div>`;
}
async function atuGo(){
  if (ATU.st === 'indo' || !Cloud || !Cloud.auth.currentUser) return; ATU.st = 'indo'; ATU.msg = ''; render();
  try {
    const t = await Cloud.auth.currentUser.getIdToken(); const f = new FormData(); f.append('token', t);
    const r = await fetch('atualizar.php?acao=atualizar', { method:'POST', cache:'no-store', body:f, headers:{ Authorization:'Bearer ' + t } });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.erro || 'Não deu para atualizar agora.');
    toast('Atualizado: ' + (j.arquivos || 0) + ' arquivos. Recarregando…'); setTimeout(() => location.reload(), 1500);
  } catch(e){ ATU.st = 'ok'; ATU.msg = e.message || 'Não deu para atualizar agora.'; render(); }
}

/* Ajustes: todo cartão ganha uma seta para recolher; a escolha fica guardada neste aparelho */
function recolhiveis(root){
  for (const card of root.querySelectorAll(':scope > .card')) {
    const h2 = card.querySelector('h2'); if (!h2) continue;
    const key = 'simplificando-financas-aj-' + semAcento(h2.textContent).replace(/[^a-z0-9]/g, '').slice(0, 30);

    if (head === card) { head = document.createElement('div'); head.className = 'hd'; card.insertBefore(head, h2); head.appendChild(h2); }
    head.dataset.a = 'aj-rec'; head.dataset.k = key;

const CAT_KW = [[/ifood|restaurante|lanche|burger|pizza|padaria|cafe|bar\b|sushi|mcdonald|subway|rappi/, 'Comida'], [/uber|99 ?pop|99app|99\*|^99\b|taxi|posto|combust|gasolina|shell|ipiranga|estacion|metro|onibus|pedagio|sem parar/, 'Transporte'], [/mercado|supermerc|carrefour|assai|atacad|extra|pao de acucar|hortifruti|sacolao|dia\b/, 'Mercado'], [/farmac|drogar|droga ?raia|pague menos|medic|consulta|dentist|academia|smart ?fit/, 'Saúde'], [/netflix|spotify|amazon prime|prime video|disney|hbo|max\b|globoplay|youtube|icloud|google one|apple\.com|microsoft|canva|chatgpt|openai/, 'Assinaturas'], [/renner|riachuelo|c&a|zara|shein|shopee|centauro|nike|adidas|calcad/, 'Roupas'], [/aluguel|condominio|luz|enel|energia|agua|sabesp|internet|vivo|claro|tim\b|oi\b|gas\b|iptu/, 'Casa'], [/cinema|ingresso|show|steam|playstation|xbox|bar\b|viagem|hotel|airbnb/, 'Lazer']];

      const v = parseFloat(String(c[iV] || '').replace(/[^\d,.-]/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.'));
      if (!isFinite(v) || !v) continue;

      if (!/^\d{4}-\d{2}-\d{2}/.test(d)) d = hoje; else d = d.slice(0, 10);
      const desc = (iT >= 0 ? c[iT] : c.filter((_, i) => i !== iD && i !== iV).join(' ')) || 'Gasto';
      if (/pagamento recebido|pagamento de fatura|estorno/i.test(desc)) continue;
      out.push({ data:d, valor:Math.round(Math.abs(v) * 100), desc:desc.replace(/\s+/g, ' ').trim(), cat:iC >= 0 && S.cats.includes(c[iC]) ? c[iC] : '', on:v > 0 });
    }

  }
  // texto livre: uma linha por gasto, com data e valor em qualquer ordem
  const reVal = /-?\s*(?:R\$\s*)?\d{1,3}(?:\.\d{3})+,\d{2}\s?[DC]?\b|-?\s*(?:R\$\s*)?\d+,\d{2}\s?[DC]?\b|-?\s*(?:R\$\s*)?\d+\.\d{2}(?!\d)/g;

    const vs = vals[vals.length - 1], v = dinheiro(vs.replace(/[^\d,.]/g, '')); if (!v) continue;

    const MESES = { jan:1, fev:2, mar:3, abr:4, mai:5, jun:6, jul:7, ago:8, set:9, out:10, nov:11, dez:12 };
    const m3 = semAcento(l).match(/\b(\d{1,2})\s+(?:de\s+)?(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-z]*\b/);
    if (m2) data = m2[0]; else if (m1) data = (m1[3] ? (m1[3].length === 2 ? '20' + m1[3] : m1[3]) : ano) + '-' + p2(+m1[2]) + '-' + p2(+m1[1]); else if (m3) data = ano + '-' + p2(MESES[m3[2]]) + '-' + p2(+m3[1]);
    if (data > hoje && !m1?.[3] && !m2) data = addMonths(data, -12); // "28/12" lido em janeiro é do ano passado
    let desc = l.replace(/\b(\d{2}) DE (\d{2})\b/i, '(parc. $1/$2)').replace(/\b(SAO PAULO|UBERLANDIA|LIMEIRA|BELO HORIZONTE|RIO DE JANEIRO|BRASILIA|CURITIBA|OSASCO|BARUERI)\b/gi, ' ').replace(vs, ' ').replace(m2 ? m2[0] : m1 ? m1[0] : m3 ? m3[0] : '', ' ').replace(/R\$/g, ' ').replace(/\b(de|em|no|na|compra|debito|credito|cartao|parcela)\b/gi, ' ').replace(/[|;•·*\-–]+/g, ' ').replace(/\s+/g, ' ').trim();
    if (!desc) desc = 'Gasto';
    if (/pagamento recebido|pagamento de fatura|pagamento fatura|estorno|saldo anterior|total|obrigado pelo pagamento|fatura anterior|ajuste cred/i.test(desc)) continue;

}

/* Extrato de conta (OFX): separa o que é gasto do que não é.
   - transferência entre as suas contas (o próprio nome no memo): não é gasto nem renda
   - pagamento de fatura de cartão: já está nos cartões
   - boleto/Pix que bate com uma conta fixa do boleto: marca a conta como paga
   - aplicação/resgate de investimento: vai para o cofrinho (aplicação) ou fica de fora (resgate)
   - entradas: viram receita (salário) ou pagamento do irmão; ficam desmarcadas para você conferir
   O saldo do fim do extrato (LEDGERBAL) pode virar o saldo da conta. */
function lerOFX(t){
  const out = [], tag = (b, k) => { const x = b.match(new RegExp('<' + k + '>([^<\\r\\n]*)', 'i')); return x ? x[1].trim() : ''; };
  const iso = d => d.slice(0, 4) + '-' + d.slice(4, 6) + '-' + d.slice(6, 8);
  const meu = semAcento(DONO.nome).split(' ').filter(w => w.length > 2), nomeIr = semAcento(S.irmao.nome || '');
  const ehMeu = m => { const n = semAcento(m); return meu.length >= 2 && meu.every(w => n.includes(w)); };
  const limpa = m => m.replace(/\s+/g, ' ').replace(/^(Compra no d[eé]bito|Transfer[eê]ncia enviada pelo Pix|Transfer[eê]ncia recebida pelo Pix|Transfer[eê]ncia Recebida|Pagamento de boleto efetuado)\s*-\s*/i, '').replace(/\s+-\s+(•|\d{2}\.\d{3}|[\d.]{8,}).*$/, '').replace(/\s+-\s+[A-Z0-9 .()]*(IP|S\.A\.|LTDA)[^-]*(Ag[eê]ncia.*)?$/i, '').trim();
  const re = /<STMTTRN>([\s\S]*?)<\/STMTTRN>/gi; let m;
  while ((m = re.exec(t))) {
    const b = m[1], data = iso(tag(b, 'DTPOSTED')), amt = parseFloat(tag(b, 'TRNAMT').replace(',', '.')), memo = tag(b, 'MEMO') || tag(b, 'NAME'), fitid = tag(b, 'FITID');
    if (!isFinite(amt) || !amt) continue;
    const valor = Math.round(Math.abs(amt) * 100), nm = semAcento(memo), desc = limpa(memo) || memo;
    const x = { data, valor, desc, fitid, on:false, tipo:'gasto', nota:'' };

    else if (/pagamento de fatura/.test(nm)) { x.tipo = 'nada'; x.nota = 'pagamento de fatura (já está nos cartões)'; }
    else if (/aplicacao rdb|aplicacao|caixinha|guardar/.test(nm) && amt < 0) { x.tipo = 'guardar'; x.on = true; x.nota = 'investimento: vai para o cofrinho'; x.desc = 'Investimento (' + desc + ')'; }
    else if (/resgate/.test(nm)) { x.tipo = 'nada'; x.nota = 'resgate de investimento'; }
    else if (amt > 0) {
      x.tipo = nomeIr && nomeIr.length > 2 && nm.includes(nomeIr) ? 'pag' : 'receita';
      x.nota = x.tipo === 'pag' ? S.irmao.nome + ' pagou' : 'entrada: vira receita (confira)';
    } else {
      x.on = true;
      const fx = S.fixos.find(f => f.ativo !== false && f.forma === 'boleto' && (Math.abs(f.valor - valor) <= 100 || nm.includes(semAcento(f.nome))));
      if (fx) { x.tipo = 'conta'; x.fixo = fx.id; x.nota = 'conta fixa: ' + fx.nome + ' (marca como paga)'; x.desc = fx.nome; }

  out.conta = tag(t, 'ACCTID');

}
function lerImp(){

function textoCobranca(){
  const n = S.irmao.nome, gm = S.gastos.filter(g => g.quem === 'irmao' && inMes(g)).sort((a, b) => a.data.localeCompare(b.data)), p = irmaoPendente();
  const L = [`Oi, ${n}! Seus gastos no meu cartão em ${monthLabel(UI.mes)}:`];
  for (const g of gm) L.push(`• ${shortDate(g.data)} · ${g.desc || g.cat || 'Gasto'} (${cartao(g.cartao).nome}) · ${fmt(g.valor)}`);
  if (!gm.length) L.push('• (nenhum gasto neste mês)');
  L.push(`Total do mês: ${fmt(sum(gm, g => g.valor))}`);
  if (p.pago) L.push(`Já pago até agora: ${fmt(p.pago)}`);
  L.push(`Total pendente (contando meses anteriores): ${fmt(Math.max(0, p.deve))}`);

}

  if (a === 'nova-receita') sheetReceita();
  if (a === 'ed-receita') { const r = S.receitas.find(x => x.id === k); if (r) sheetReceita(r); }
  if (a === 'saldo') sheetSaldo();
  if (a === 'novo-pag') sheetPag();
  if (a === 'ed-pag') { const x = S.pagamentos.find(y => y.id === k); if (x) sheetPag(x); }
  if (a === 'pagar-fatura') sheetPagFatura(null, k);
  if (a === 'ed-pagfat') { const x = S.pagFatura.find(y => y.id === k); if (x) sheetPagFatura(x, x.cartao); }
  if (a === 'cobranca') sheetCobranca();
  if (a === 'zap') window.open(zapURL(textoCobranca()), '_blank', 'noopener');
  if (a === 'ver-cartao') { UI.tab = 'cartao'; UI.cartao = k; UI.xQuem = ''; window.scrollTo({ top:0 }); render(); }
  if (a === 'x-quem') { UI.xQuem = k; render(); }
  if (a === 'novo-gasto-cartao') sheetGasto({ cartao:k });
  if (a === 'add-cartao-resumo') { UI.tab = 'ajustes'; UI.ajSec = 'cartoeseconta'; S.cartoes.push({ id:uid(), nome:'Novo cartão', cor:S.cartoes.length % 8, tipo:'credito', fecha:null }); save(); window.scrollTo({ top:0 }); render(); toast('Cartão criado. Dê o nome e a cor aqui embaixo.'); }
  if (a === 'f-cart') { UI.fCart = k; render(); }
  if (a === 'f-quem') { UI.fQuem = k; render(); }
  if (a === 'scroll') { const el = $('#sec-rec'); if (el) el.scrollIntoView({ behavior:'smooth', block:'start' }); }
  // ajustes
  if (a === 'add-fonte') { S.fontes.push({ id:uid(), nome:'Nova fonte' }); save(); render(); }
  if (a === 'del-fonte') { if (S.fontes.length <= 1) return toast('Deixe pelo menos uma fonte.'); const used = S.receitas.some(r => r.fonte === k); if (used && !confirm('Há receitas lançadas nessa fonte. Apagar mesmo assim? (as receitas continuam, sem nome)')) return; S.fontes = S.fontes.filter(f => f.id !== k); save(); render(); }
  if (a === 'add-cartao') { S.cartoes.push({ id:uid(), nome:'Novo cartão', cor:S.cartoes.length % 8, tipo:'credito', fecha:null }); save(); render(); }
  if (a === 'del-cartao') { if (S.cartoes.length <= 1) return toast('Deixe pelo menos um cartão.'); const used = S.gastos.some(g => g.cartao === k); if (used && !confirm('Há gastos lançados nesse cartão. Apagar mesmo assim? (os gastos continuam, sem nome)')) return; S.cartoes = S.cartoes.filter(c => c.id !== k); if (S.ult.cartao === k) S.ult.cartao = S.cartoes[0].id; save(); render(); }
  if (a === 'tipo-cartao') { const c = cartao(k); c.tipo = b.dataset.v; if (c.tipo === 'conta') c.fecha = null; save(); render(); }
  if (a === 'cor-cartao') { cartao(k).cor = +b.dataset.v; save(); render(); }
  if (a === 'visual-cartao') { cartao(k).visual = b.dataset.v; save(); render(); }
  if (a === 'add-cat') { const n = prompt('Nome da categoria:'); if (n && n.trim()) { if (!S.cats.includes(n.trim())) S.cats.push(n.trim()); save(); render(); } }
  if (a === 'del-cat') { if (!confirm('Apagar a categoria "' + k + '"?')) return; S.cats = S.cats.filter(c => c !== k); save(); render(); }
  if (a === 'tema') { if (k === 'auto') { delete document.documentElement.dataset.theme; ls.set(LST, ''); } else { document.documentElement.dataset.theme = k; ls.set(LST, k); } render(); }
  if (a === 'exportar') { const blob = new Blob([JSON.stringify(S, null, 1)], { type:'application/json' }); const u = URL.createObjectURL(blob); const l = document.createElement('a'); l.href = u; l.download = 'financas-' + todayISO() + '.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); }
  if (a === 'atu-go') atuGo();
  if (a === 'sair' && Cloud) { if (confirm('Sair da conta neste aparelho?')) Cloud.auth.signOut().finally(() => location.reload()); }
});
// campos dos ajustes: salva ao digitar (sem perder o foco)
let typing;
document.addEventListener('input', ev => {
  const el = ev.target.closest('[data-f]'); if (!el) return;
  const f = el.dataset.f, k = el.dataset.k, v = el.value;
  const money = t => { const n = parseFloat(String(t).replace(/\./g, '').replace(',', '.')); return isFinite(n) && n >= 0 ? Math.round(n * 100) : 0; };
  if (f === 'fonte') { const x = S.fontes.find(y => y.id === k); if (x) x.nome = v; }
  if (f === 'prev') { const x = S.fontes.find(y => y.id === k); if (x) x.prev = money(v); }
  if (f === 'meta-valor') { S.meta = Object.assign({ tipo:'valor', pct:10 }, S.meta || {}, { valor:money(v) }); }
  if (f === 'meta-pct') { S.meta = Object.assign({ tipo:'pct', valor:0 }, S.meta || {}, { pct:Math.min(90, Math.max(0, parseInt(v, 10) || 0)) }); }

  if (f === 'irmao-nome') S.irmao.nome = v.trim() || 'Irmão';
  if (f === 'irmao-zap') S.irmao.zap = v.trim();

});
document.addEventListener('change', ev => {
  const el = ev.target.closest('[data-f="importar"]'); if (!el || !el.files[0]) return;
  const fr = new FileReader();
  fr.onload = () => { try { const o = normalize(JSON.parse(fr.result)); if (!confirm('Substituir tudo pela cópia (' + o.gastos.length + ' gastos, ' + o.receitas.length + ' receitas)?')) return; S = o; save(); render(); toast('Cópia restaurada.'); } catch(e){ toast('Esse arquivo não é uma cópia válida.'); } el.value = ''; };
  fr.readAsText(el.files[0]);
});
/* arrastar para a esquerda: revela "Apagar" */
const Swipe = (() => { // dedo ou mouse: arrastar a linha para a esquerda revela Apagar
  let el = null, x0 = 0, y0 = 0, dx = 0, w = 0, horiz = null, aberto = null, pid = null;
  const row = e => e.querySelector('.row');
  function fechar(){ if (aberto) { aberto.classList.remove('drag'); row(aberto).style.transform = ''; aberto = null; } }
  document.addEventListener('pointerdown', ev => {
    if (ev.button !== undefined && ev.button !== 0) return;
    const t = ev.target.closest('.swp'); if (!t) { if (!ev.target.closest('.sheet')) fechar(); return; }
    if (ev.target.closest('.del')) return;
    if (aberto && aberto !== t) fechar();
    el = t; pid = ev.pointerId; x0 = ev.clientX; y0 = ev.clientY; dx = 0; horiz = null; w = t.classList.contains('two') ? 150 : 96;
  });
  document.addEventListener('pointermove', ev => {
    if (!el || ev.pointerId !== pid) return; const x = ev.clientX - x0, y = ev.clientY - y0;
    if (horiz === null) { if (Math.abs(x) < 6 && Math.abs(y) < 6) return; horiz = Math.abs(x) > Math.abs(y); if (horiz) { el.classList.add('drag'); try { el.setPointerCapture(pid); } catch(e){} } }
    if (!horiz) return;
    if (ev.cancelable) ev.preventDefault();
    const base = aberto === el ? -w : 0; dx = Math.max(-w - 20, Math.min(0, base + x));
    row(el).style.transform = 'translateX(' + dx + 'px)';
  });
  function fim(ev){
    if (!el || (ev && ev.pointerId !== pid)) return; const e = el; el = null;
    if (!horiz) return;
    e.classList.remove('drag');
    if (dx < -w / 2) { row(e).style.transform = 'translateX(-' + w + 'px)'; aberto = e; e.dataset.swiped = '1'; setTimeout(() => { delete e.dataset.swiped; }, 400); }
    else { row(e).style.transform = ''; if (aberto === e) aberto = null; }
  }
  document.addEventListener('pointerup', fim); document.addEventListener('pointercancel', fim);
  document.addEventListener('click', ev => { const r = ev.target.closest('.swp'); if (r && r.dataset.swiped && !ev.target.closest('.del')) { ev.stopPropagation(); ev.preventDefault(); } }, true);
  document.addEventListener('dragstart', ev => { if (ev.target.closest && ev.target.closest('.swp')) ev.preventDefault(); });
  return { fechar };
})();
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#sheet').hidden) Sheet.close(); });

/* ========== porta de entrada (conta própria desta página; a primeira a entrar vira a dona) ========== */
function gate(){
  const g = $('#gate'); if (!Cloud) { $('#banner').hidden = false; $('#banner').textContent = 'Modo local: os dados ficam só neste aparelho. No site, com seu login, tudo vai para a nuvem.'; render(); return; }
  const A = Cloud.auth, P_ = window.firebase.auth.Auth.Persistence; const st = { first:false, busy:false, show:false, msg:'' };
  const within = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code:'timeout' }), ms))]);
  const okMail = u => /^\S+@\S+\.\S+$/.test(u);
  function msgOf(e){
    const k = e && e.code || '';
    if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(k)) return 'E-mail ou senha incorretos.';
    if (k === 'auth/too-many-requests') return 'Muitas tentativas. Espere alguns minutos e tente de novo.';
    if (k === 'auth/network-request-failed') return 'Sem internet. Confira a conexão e tente de novo.';
    if (k === 'auth/weak-password') return 'Senha fraca: use pelo menos 6 caracteres.';
    if (k === 'auth/invalid-email') return 'Esse e-mail não parece válido.';
    if (k === 'auth/operation-not-allowed') return 'No Firebase, ative o login por E-mail/senha (Authentication, Método de login).';
    if (k === 'permission-denied') return 'O banco recusou o acesso. Publique o REGRAS-FIRESTORE.txt (bloco "financas") no Firebase.';
    if (k === 'timeout' || k === 'unavailable') return 'O banco online não respondeu. Confira a internet.';
    return 'Não deu para entrar agora (' + (k || 'erro') + '). Tente de novo.';
  }
  const say = (m, ok) => { const el = g.querySelector('.gate-msg'); if (el) { el.textContent = m; el.classList.toggle('ok', !!ok); } };
  function open(){
    g.hidden = false; document.body.classList.add('locked');
    g.innerHTML = `<div class="gate-in"><span class="gate-logo">${logo()}</span><p class="gate-eb">Simplificando · área pessoal</p><h1>Finanças<span class="pt"></span></h1>
      <div class="cc dark tilt"><div class="chip"></div><div class="lg">R$</div><div class="nm">${esc(DONO.nome)}</div><div class="no">${st.first ? 'Primeiro acesso' : 'Perfil único'}</div></div>
      <p class="gate-sub">${st.first ? 'Crie o e-mail e a senha de ' + esc(DONO.nome) + '. Este é o único perfil da página: depois de criado, ninguém mais consegue entrar.' : 'Entre com o e-mail e a senha de ' + esc(DONO.nome) + '.'}</p>
      <form novalidate><label>E-mail<span class="gate-f"><input id="g-u" type="email" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" value="${esc(ls.get('simplificando-financas-mail') || '')}" required></span></label>
      <label>Senha<span class="gate-f"><input id="g-p" type="password" autocomplete="${st.first ? 'new-password' : 'current-password'}" required><button type="button" class="gate-eye" data-gate="eye" aria-label="Mostrar senha">${I.eye}</button></span></label>
      ${st.first ? `<label>Repita a senha<span class="gate-f"><input id="g-p2" type="password" autocomplete="new-password" required></span></label>` : ''}
      <label class="gate-keep"><input id="g-keep" type="checkbox" checked>Continuar conectado neste aparelho</label>
      <p class="gate-msg" role="alert">${esc(st.msg || '')}</p>
      <button type="submit" class="btn primary gate-go">${st.first ? 'Criar o acesso de ' + esc(DONO.nome) : 'Entrar como ' + esc(DONO.nome)}</button>
      ${st.first ? '' : `<button type="button" class="gate-link" data-gate="forgot">Esqueci a senha</button>`}</form>
      <p class="gate-note">Os dados ficam na nuvem do Simplificando, visíveis só para a conta dona desta página. O login, os dados e a atualização são separados do painel do personal.</p></div>`;
  }
  function loading(){ g.hidden = false; g.innerHTML = `<div class="gate-in"><span class="gate-logo">${logo()}</span><p class="gate-sub" role="status">Conectando…</p></div>`; }
  function close(){ g.hidden = true; g.innerHTML = ''; document.body.classList.remove('locked'); }
  async function enter(user, fresh){
    let owner = null;
    try { owner = await within(Cloud.ownerUid(), 12000); if (!owner) { await within(Cloud.claim(user.uid), 12000); owner = user.uid; } }
    catch(e){ st.msg = msgOf(e); try { await A.signOut(); } catch(e2){} open(); return; }
    if (owner !== user.uid) { try { await A.signOut(); } catch(e){} st.first = false; st.msg = 'Esta conta não é a de ' + DONO.nome + '. Só o perfil dele entra aqui.'; open(); return; }
    ls.set('simplificando-financas-mail', user.email || ''); st.msg = ''; close(); render(); Cloud.connect(user); if (fresh) toast(st.first ? 'Acesso criado. Bem-vindo, ' + DONO.nome.split(' ')[0] + '.' : 'Bem-vindo de volta, ' + DONO.nome.split(' ')[0] + '.');
  }
  g.addEventListener('click', async ev => {
    const b = ev.target.closest('[data-gate]'); if (!b) return;
    if (b.dataset.gate === 'eye') { st.show = !st.show; g.querySelectorAll('#g-p,#g-p2').forEach(i => { i.type = st.show ? 'text' : 'password'; }); }
    if (b.dataset.gate === 'forgot') { const u = ($('#g-u') || {}).value || ''; if (!okMail(u)) { say('Digite seu e-mail acima e toque em "Esqueci a senha" de novo.'); return; } try { await A.sendPasswordResetEmail(u.trim()); say('Pronto. Se este e-mail for o desta página, chega um link para criar uma senha nova.', true); } catch(e){ say(msgOf(e)); } }
  });
  g.addEventListener('submit', async ev => {
    ev.preventDefault(); if (st.busy) return;
    const u = $('#g-u').value.trim(), p = $('#g-p').value, keep = $('#g-keep').checked;
    if (!okMail(u)) { say('Digite um e-mail válido.'); return; }
    if (st.first) { const p2 = ($('#g-p2') || {}).value || ''; if (p.length < 6) { say('A senha precisa ter pelo menos 6 caracteres.'); return; } if (p !== p2) { say('As duas senhas não são iguais.'); return; } }
    else if (!p) { say('Digite sua senha.'); return; }
    st.busy = true; const go = g.querySelector('.gate-go'); go.disabled = true; say('Entrando…', true);
    try {
      await A.setPersistence(keep ? P_.LOCAL : P_.SESSION);
      let cred;
      if (st.first) { try { cred = await A.createUserWithEmailAndPassword(u, p); } catch(e){ if (e && e.code === 'auth/email-already-in-use') cred = await A.signInWithEmailAndPassword(u, p); else throw e; } }
      else cred = await A.signInWithEmailAndPassword(u, p);
      await enter(cred.user, true);
    } catch(e){ say(msgOf(e)); }
    finally { st.busy = false; if (go.isConnected) go.disabled = false; }
  });
  loading();
  within(Cloud.ownerUid(), 10000).then(o => { st.first = !o; }).catch(e => { st.first = false; st.msg = msgOf(e); }).finally(() => {
    const un = A.onAuthStateChanged(u => { un(); if (u) enter(u, false); else open(); });
  });
}
window.__fin = { entender, estado:() => S }; // para testes
render(); gate();
})();
