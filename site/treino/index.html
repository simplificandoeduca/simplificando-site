<style>
/* Simplificando Pro: o visual Feed (fundo preto, blocos de cor cheia, onda no topo) com treino guiado de verdade. */
:root{--ci-blue:#7FB2FF;--ci-yel:#FFD23F;--ci-red:#FF6B6B;
  --ink:#0F1712;--cream:#F6F5EF;--lime:#C8F542;--brand:#FF4646;--coral:#FF7A72;--water:#5AB8FF;--cardio:#8EE85F;
  --on-brand:#0F1712;--neutral:#F6F5EF;--on-neutral:#0F1712;
  --bg:#0F1712;--fg:#F6F5EF;--muted:#A9B0AA;--card:#172019;--card-line:transparent;--sep:#2E3931;--ctl:#253028;--ctl-fg:#F6F5EF;
  --seg-on:#F6F5EF;--input:#0F1712;--accent:var(--brand);--on-accent:var(--on-brand);--focus:#F6F5EF;--danger:#FF7A72;
  --tab-bg:#F6F5EF;--tab-fg:#5B625D;--tab-on:#0F1712;--tab-on-fg:#F6F5EF;--tab-shadow:0 14px 40px rgba(0,0,0,.55);
  --rest-bg:#0F1712;--rest-fg:#F6F5EF;--rest-ctl:rgba(246,245,239,.16);--rest-line:#2E3931;
  --toast-bg:#F6F5EF;--toast-fg:#0F1712;
  --panel:#13201A;--a-dim:#3A463D;--a-bld:#1C2820;--a-crown:#2A3A2E;--a-shadow:#0B110D;--a-back:#7E8780;--a-hback:#5E7A4F;--cardio-line:var(--cardio);
  --a-eq:#2B3830;--a-dk:#0A110D;--a-skin:#D9A47F;--a-skin2:#A8775A;--a-top:#F6F5EF;--a-top2:#BCC2BB;--a-short:#4A5B50;--a-short2:#33413A;--a-shoe:#F6F5EF;--a-shoe2:#A9B0A8;--a-hair:#5E402D;
  --scrim:rgba(0,0,0,.62);--r:30px;
  --spring:cubic-bezier(.3,1.5,.5,1);--ease:cubic-bezier(.2,.9,.25,1);
  color-scheme:dark;
}
/* modo claro: segue o aparelho quando não há escolha salva, ou a escolha do botão sol/lua */
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--ci-blue:#1F4FB8;--ci-yel:#B07A00;--ci-red:#D62F2F;
  --bg:#FFFFFF;--fg:#0F1712;--muted:#5B625D;--card:#F4F4F1;--card-line:rgba(15,23,18,.08);--sep:#E0E0DA;--ctl:#E8E8E3;--ctl-fg:#0F1712;
  --seg-on:#FFFFFF;--input:#FFFFFF;--focus:#0F1712;--danger:#C8302F;
  --tab-bg:#FFFFFF;--tab-shadow:0 10px 30px rgba(15,23,18,.14),0 0 0 1px rgba(15,23,18,.07);
  --neutral:#0F1712;--on-neutral:#FFFFFF;
  --rest-bg:#FFFFFF;--rest-fg:#0F1712;--rest-ctl:rgba(15,23,18,.07);--rest-line:rgba(15,23,18,.1);
  --toast-bg:#0F1712;--toast-fg:#FFFFFF;
  --panel:#F4F4F1;--a-dim:#C9CDC6;--a-bld:#E6E8E2;--a-crown:#D3DCCD;--a-shadow:#E2E4DE;--a-back:#9AA29B;--a-hback:#9CC68A;--cardio-line:#3E9E2E;
  --a-eq:#D3D8D0;--a-dk:#6E776F;--a-top:#0F1712;--a-top2:#4A544D;--a-short:#56655B;--a-short2:#86928A;--a-shoe:#0F1712;--a-shoe2:#5A645C;
  --scrim:rgba(15,23,18,.38);
  color-scheme:light;
}}
:root[data-theme="light"]{--ci-blue:#1F4FB8;--ci-yel:#B07A00;--ci-red:#D62F2F;
  --bg:#FFFFFF;--fg:#0F1712;--muted:#5B625D;--card:#F4F4F1;--card-line:rgba(15,23,18,.08);--sep:#E0E0DA;--ctl:#E8E8E3;--ctl-fg:#0F1712;
  --seg-on:#FFFFFF;--input:#FFFFFF;--focus:#0F1712;--danger:#C8302F;
  --tab-bg:#FFFFFF;--tab-shadow:0 10px 30px rgba(15,23,18,.14),0 0 0 1px rgba(15,23,18,.07);
  --neutral:#0F1712;--on-neutral:#FFFFFF;
  --rest-bg:#FFFFFF;--rest-fg:#0F1712;--rest-ctl:rgba(15,23,18,.07);--rest-line:rgba(15,23,18,.1);
  --toast-bg:#0F1712;--toast-fg:#FFFFFF;
  --panel:#F4F4F1;--a-dim:#C9CDC6;--a-bld:#E6E8E2;--a-crown:#D3DCCD;--a-shadow:#E2E4DE;--a-back:#9AA29B;--a-hback:#9CC68A;--cardio-line:#3E9E2E;
  --a-eq:#D3D8D0;--a-dk:#6E776F;--a-top:#0F1712;--a-top2:#4A544D;--a-short:#56655B;--a-short2:#86928A;--a-shoe:#0F1712;--a-shoe2:#5A645C;
  --scrim:rgba(15,23,18,.38);
  color-scheme:light;
}
/* blocos de cor: dentro deles o texto é sempre preto */
.blk-lime,.blk-water,.blk-cardio{--card-line:transparent;--fg:#0F1712;--muted:rgba(15,23,18,.72);--ctl:rgba(15,23,18,.12);--sep:rgba(15,23,18,.26);--ctl-fg:#0F1712;--accent:#0F1712;--on-accent:#F6F5EF;--seg-on:#F6F5EF;--focus:#0F1712;--input:rgba(246,245,239,.6);--danger:#0F1712}
.blk-brand{--card:var(--brand);--card-line:transparent;--fg:var(--on-brand);--muted:color-mix(in srgb,var(--on-brand) 72%,transparent);--ctl:color-mix(in srgb,var(--on-brand) 13%,transparent);--sep:color-mix(in srgb,var(--on-brand) 26%,transparent);--ctl-fg:var(--on-brand);--accent:var(--on-brand);--on-accent:var(--brand);--seg-on:#F6F5EF;--focus:var(--on-brand);--input:rgba(246,245,239,.6);--danger:var(--on-brand)}
.blk-lime{--card:var(--lime)}
.blk-water{--card:var(--water)}
.blk-cardio{--card:var(--cardio)}
/* água é sempre azul e cardio é sempre verde, em qualquer objetivo */
.app[data-tab="agua"]{--brand:var(--water);--on-brand:#0F1712;--accent:var(--water);--on-accent:#0F1712}
.app[data-tab="cardio"]{--brand:var(--cardio);--on-brand:#0F1712;--accent:var(--cardio);--on-accent:#0F1712}
.blk-cream,.sheet{--card:#F6F5EF;--fg:#0F1712;--muted:#5B625D;--ctl:#E7E5DC;--sep:#D6D5CC;--ctl-fg:#0F1712;--seg-on:#FFFFFF;--input:#FFFFFF;--focus:#0F1712;--danger:#C8302F;--accent:var(--brand);--on-accent:var(--on-brand)}
:root[data-theme="light"] .sheet{--card:#FFFFFF;--ctl:#F0F0EB;--sep:#E0E0DA;--input:#FAFAF8}
:root[data-theme="light"] .eyebrow{color:color-mix(in srgb,var(--brand) 55%,#0F1712)}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
button{font:inherit;cursor:pointer}
button,a,label,input,select,textarea,[role="button"]{touch-action:manipulation}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dot{display:inline-block;width:.2em;height:.2em;border-radius:50%;background:var(--brand);margin-left:.05em}

.app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(8px + env(safe-area-inset-top,0px)) calc(124px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.app.enter>*{animation:rise .5s var(--ease) both}
.app.enter>*:nth-child(3){animation-delay:.04s}.app.enter>*:nth-child(4){animation-delay:.08s}.app.enter>*:nth-child(5){animation-delay:.12s}.app.enter>*:nth-child(6){animation-delay:.16s}.app.enter>*:nth-child(n+7){animation-delay:.2s}

/* topo */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:26px}
.top-txt{min-width:0}
.eyebrow{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.card .eyebrow,.sheet .eyebrow{color:var(--muted)}
h1{margin:4px 0 0;font-size:58px;font-weight:900;letter-spacing:-.05em;line-height:1}
.top-txt{min-width:0}
@media (max-width:430px){.top h1{font-size:clamp(40px,12.5vw,58px);white-space:nowrap}}
.avatar{width:48px;height:48px;flex:none;padding:0;border:0;background:none;border-radius:50%;transition:transform .2s var(--spring)}
.avatar:active{transform:scale(.9)}
.av-ph{display:block;width:100%;height:100%;border-radius:50%;padding:3px;background:conic-gradient(#B794FF 0 25%,#C8F542 0 50%,#FF9A2E 0 75%,#FF4646 0)}
.av-ph img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--bg)}
.foto-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:-4px}
.foto-row label.btn{cursor:pointer}
.sr-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.sr-file:focus-visible+label{outline:3px solid var(--focus);outline-offset:2px}

.logo{width:100%;height:100%;display:block}
.wave-strip{display:block;height:64px;margin:-8px calc(-1 * max(16px,env(safe-area-inset-right,0px))) -4px calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.wave-strip{overflow-x:clip;overflow-y:visible;position:relative;z-index:-1;pointer-events:none}
.app,.lg-in,:has(>.wave-strip){isolation:isolate}
.wave-strip svg{width:100%;height:100%;display:block;overflow:visible}
.wave-svg path{stroke:var(--brand)}
.wave-strip path{stroke-width:16}
.wave-strip path{stroke-dasharray:1600;stroke-dashoffset:0}
@keyframes draw{from{stroke-dashoffset:1600}}

/* cartões */
.card{background:var(--card);color:var(--fg);box-shadow:inset 0 0 0 1px var(--card-line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;position:relative}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.label{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--fg);opacity:.85}
.label .i{width:16px;height:16px}
.pill{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--ctl);color:var(--fg);white-space:nowrap}
.pill .i{width:14px;height:14px}
.pill.ok{background:var(--accent);color:var(--on-accent)}
h2.big{margin:0;font-size:32px;font-weight:900;letter-spacing:-.04em;line-height:1.02;text-wrap:balance}
.muted{margin:4px 0 0;color:var(--muted);font-size:14px;line-height:1.4}
.sm{margin:0;font-size:13px}
.foot0{margin:0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.ob-c{box-shadow:inset 0 0 0 2px var(--cardio,#8EE85F)}.ob-r{display:grid;grid-template-columns:40px minmax(0,1fr);column-gap:12px;row-gap:8px;align-items:start;padding:10px 0;border-top:1px solid var(--line,rgba(0,0,0,.08))}.ob-r:first-of-type{border-top:0}.ob-i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--chip,rgba(0,0,0,.06));flex:none}.ob-i .i{width:22px;height:22px}.ob-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.ob-t b{font-size:16px}.ob-t span{font-size:13px;color:var(--muted)}.ob-t .ob-o{font-style:italic}.ob-a{grid-column:2;display:flex;align-items:center;justify-content:space-between;gap:8px}.ob-a .btn{margin-left:auto}
.ac-list{list-style:none;margin:4px 0 14px;padding:0;display:flex;flex-direction:column;gap:10px}.ac-list li{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.4;font-weight:600}.ac-list li svg{width:20px;height:20px;flex:none;margin-top:1px;color:var(--brand,#FF4646)}
.st-cores{display:flex;justify-content:space-between;gap:8px;padding:2px 4px}
.st-cores button{width:40px;height:40px;border-radius:50%;border:0;background:var(--c);box-shadow:inset 0 0 0 1px rgba(15,23,18,.18);cursor:pointer;transition:transform .2s var(--spring),box-shadow .2s}
.st-cores button.on{box-shadow:0 0 0 3px var(--card,var(--bg)),0 0 0 5px var(--fg);transform:scale(1.06)}
.st-cores button:active{transform:scale(.92)}
.st-prev{align-self:center;width:min(62vw,300px);aspect-ratio:9/16;border-radius:18px;overflow:hidden;background:var(--ctl);box-shadow:0 8px 28px rgba(15,23,18,.18)}
.st-prev canvas{display:block;width:100%;height:100%;opacity:0;transition:opacity .25s}
.st-prev canvas.on{opacity:1}
.st-foto .btn{cursor:pointer}
.stm{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stm-c{border:0;background:var(--ctl);border-radius:18px;padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--fg);font:inherit;cursor:pointer;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .2s,transform .2s var(--spring)}
.stm-c .stp-th{width:54px;border-radius:9px;box-shadow:0 4px 10px rgba(15,23,18,.18)}.stm-c b{font-size:12.5px;font-weight:800}
.stm-c.on{box-shadow:inset 0 0 0 2.5px var(--fg);background:var(--card)}.stm-c:active{transform:scale(.95)}
.stp{position:fixed;inset:0;z-index:45;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;padding:calc(22px + env(safe-area-inset-top,0px)) 18px calc(22px + env(safe-area-inset-bottom,0px));overflow-y:auto;animation:fade .3s ease;outline:none}
.stp-x{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;opacity:0;pointer-events:none;transform:scale(.6);transition:opacity .35s,transform .35s var(--spring)}
.stp-x.on{opacity:1;pointer-events:auto;transform:none}
.stp-h{margin-top:34px;max-width:520px}.stp-h h2{margin:6px 0 0;font-size:40px;line-height:1;font-weight:900;letter-spacing:-1.5px}.stp-h p:last-child{margin:12px 0 0;font-size:16px;line-height:1.4;color:var(--muted);max-width:320px}
.stp-cards{margin:auto 0;padding:26px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:560px;width:100%;align-self:center}
.stp-c{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--fg);font:inherit;cursor:pointer;animation:up .6s var(--spring) both;animation-delay:var(--d);transition:transform .2s var(--spring)}
.stp-c:active{transform:scale(.94)}
.stp-th{position:relative;display:block;width:100%;aspect-ratio:9/16;border-radius:16px;overflow:hidden;background:var(--ctl);box-shadow:0 10px 26px rgba(15,23,18,.22)}
.stp-th canvas{display:block;width:100%;height:100%;opacity:0;transition:opacity .3s}.stp-th canvas.on{opacity:1}
.stp-th i{position:absolute;right:6px;bottom:6px;width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;justify-content:center}.stp-th i .i{width:16px;height:16px}
.stp-c b{margin-top:4px;font-size:15px;font-weight:900;letter-spacing:-.3px}.stp-c small{font-size:11.5px;line-height:1.3;color:var(--muted);text-align:center;max-width:110px}
.stp-f{display:flex;align-items:center;justify-content:center;gap:6px;margin:0;font-size:13px;color:var(--muted)}.stp-f .i{width:15px;height:15px}
.stj{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:22px;padding:14px 16px;margin:12px 0;background:var(--brand);color:var(--on-brand);font:inherit;text-align:left;cursor:pointer}
.stj-i{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex:none}
.stj b{display:block;font-size:15px;font-weight:800}.stj small{display:block;font-size:12.5px;opacity:.85}.stj .chev{margin-left:auto}

.foot{margin:0;padding:0 4px;font-size:13px;line-height:1.45;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:500;padding:6px 11px;border-radius:999px;background:var(--ctl)}
.chip .i{width:14px;height:14px}
.bar{height:10px;border-radius:99px;background:var(--ctl);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .6s var(--ease)}
.note{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;padding:8px 8px 8px 14px;border-radius:20px;background:var(--ctl);color:var(--fg)}
.note b{display:block;font-size:13px}
.note span{color:var(--muted)}
h3.sec{margin:10px 4px -4px;font-size:26px;font-weight:900;letter-spacing:-.04em}
.self-start{align-self:flex-start}
.warn{margin:0;padding:12px 14px;border-radius:16px;background:var(--ctl);font-size:14px;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
.warn b{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.warn>.i{margin-top:1px}

/* botões estilo iPhone */
.btn{height:46px;padding:0 18px;border:0;border-radius:999px;background:var(--ctl);color:var(--ctl-fg);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700;letter-spacing:-.01em;transition:transform .2s var(--spring),background .2s,opacity .2s;user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.block{width:100%;height:54px;font-size:16px}
.btn.small{height:36px;padding:0 14px;font-size:13px}
.btn.small .i{width:16px;height:16px}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--sep)}
.btn.round{width:46px;padding:0}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--coral);color:#0F1712;box-shadow:none}
.row-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;padding:3px;gap:2px;border-radius:999px;background:var(--ctl)}
.seg button{flex:1;min-width:0;height:36px;padding:0 4px;border:0;border-radius:999px;background:transparent;color:var(--fg);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .25s,box-shadow .25s,transform .2s var(--spring)}
.seg button:active{transform:scale(.94)}
.seg button.on{background:var(--seg-on);color:#0F1712;box-shadow:0 2px 8px rgba(15,23,18,.16);font-weight:800}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:-4px;padding:0 6px}
.field{display:flex;flex-direction:column;gap:10px;min-width:0}
.flabel{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.flabel .i{width:16px;height:16px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{height:40px;padding:0 15px;border:0;border-radius:999px;background:var(--ctl);color:var(--fg);font-size:14px;font-weight:600;transition:transform .2s var(--spring),background .2s;white-space:nowrap}
.opt:active{transform:scale(.94)}
.opt.on{background:var(--accent);color:var(--on-accent);font-weight:800}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px;border-radius:999px;background:var(--ctl)}
.stepper .btn{background:var(--seg-on);color:#0F1712}
.stepper output{font-size:30px;font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stepper output small{font-size:15px;font-weight:700;color:var(--muted);letter-spacing:0}
.inp-wrap{display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;border-radius:16px;background:var(--input);border:1.5px solid var(--sep)}
.inp-wrap:focus-within{border-color:var(--fg)}
.inp{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:inherit;font-size:18px;font-weight:700;outline:none}
.inp-wrap span{color:var(--muted);font-weight:700}
textarea{width:100%;min-height:84px;resize:vertical;border-radius:16px;border:1.5px solid var(--sep);background:var(--input);color:var(--fg);font:inherit;font-size:16px;line-height:1.45;padding:12px 14px}
textarea:focus{outline:none;border-color:var(--fg)}
.switch{position:relative;flex:none;width:52px;height:32px}
.switch input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch .knob{position:absolute;inset:0;border-radius:99px;background:var(--ctl);transition:background .25s}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#F6F5EF;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .35s var(--spring)}
.switch input:checked+.knob{background:var(--brand)}
.switch input:checked+.knob::after{transform:translateX(20px)}
.switch input:focus-visible+.knob{outline:3px solid var(--focus);outline-offset:2px}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw-row b{display:block;font-size:16px;font-weight:800;letter-spacing:-.01em}
.sw-row span{font-size:13px;color:var(--muted)}

/* anéis */
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;display:block}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring-track{stroke:var(--ctl)}
.ring-fill{stroke:var(--accent);transition:stroke-dashoffset .9s var(--ease)}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:2px;text-align:center}
.ring-c b{font-size:23px;line-height:1;font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.ring-c span{font-size:12px;line-height:1.2;color:var(--muted);white-space:nowrap}

/* água */
.water-body{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.water-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.water-btns .btn{padding:0 8px;font-variant-numeric:tabular-nums}
.blk-water .water-btns .btn{background:rgba(246,245,239,.5)}
.water-btns .wide{grid-column:1/-1;background:transparent}
.tl{width:100%;height:auto;display:block}
.tl text{fill:var(--muted);font-size:10.5px;font-weight:700;font-family:inherit}
.tl .grid{stroke:var(--sep);stroke-width:1}
.tl .area{fill:var(--brand);opacity:.2}
.tl .ln{fill:none;stroke:var(--brand);stroke-width:3;stroke-linejoin:round}
.tl .ideal{stroke:var(--fg);stroke-width:1.5;stroke-dasharray:5 5;opacity:.7}
.tl .goal{stroke:var(--fg);stroke-width:1;stroke-dasharray:2 4;opacity:.6}
.tl .pt{fill:var(--brand);stroke:var(--card);stroke-width:2.5}
.tl .nowl{stroke:var(--muted);stroke-width:1}
.tl text.hl{fill:var(--fg)}
.leg{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{display:inline-block;width:18px;height:3px;border-radius:2px;background:var(--brand)}
.leg i.dash{background:repeating-linear-gradient(90deg,var(--fg) 0 4px,transparent 4px 8px);opacity:.7}
.drinks{display:flex;flex-wrap:wrap;gap:6px}
.drinks .chip{font-variant-numeric:tabular-nums;font-size:12px}

/* semana */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats>div{background:var(--ctl);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile.t-orange{background:#FF9A3C;color:#0F1712}.tile.t-orange span{color:rgba(15,23,18,.72)}
.stats>div.st-pr{background:#FF9A3C;color:#0F1712}.stats>div.st-red{background:#FF4646;color:#fff}.stats>div.st-green{background:#8EE85F;color:#0F1712}.stats>div.st-blue{background:#5AB8FF;color:#0F1712}
.stats>div:is(.st-pr,.st-green,.st-blue) span,.stats>div:is(.st-pr,.st-green,.st-blue) b small{color:rgba(15,23,18,.72)}.stats>div.st-red span,.stats>div.st-red b small{color:rgba(255,255,255,.85)}
.emp{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 12px}.emp>svg{width:120px;height:90px}.emp b{font-size:16px;font-weight:800;letter-spacing:-.2px}.emp span{font-size:13.5px;color:var(--muted);line-height:1.4;max-width:270px}.emp .btn{margin-top:6px}
.stats b,.sstats b{font-size:26px;font-weight:900;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums}
.stats b small,.sstats b small{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:0}
.stats span,.sstats span{font-size:12px;color:var(--muted);line-height:1.3}
.stats em{font-style:normal;font-weight:800;color:var(--fg)}
.week-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted)}
.day .d{width:34px;height:34px;border-radius:50%;background:var(--ctl);display:grid;place-items:center;color:var(--fg);font-size:13px;font-weight:800}
.day.t .d{background:var(--brand);color:var(--on-brand)}
.day.now>span{color:var(--fg)}
.day.now .d{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}
.day.fut .d{background:transparent;box-shadow:inset 0 0 0 1.5px var(--sep)}
.marks{display:flex;gap:2px}
.m{display:grid;opacity:.22}
.m.on{opacity:1}
.m .i{width:13px;height:13px}
.m-w.on{color:var(--water)}.m-c.on{color:var(--cardio)}

/* check-in */
.checkin h2.big{font-size:28px}

/* treino */
.timer{font-size:68px;font-weight:900;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.timer.muted-t{color:var(--muted);opacity:.6}
.sstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sstats>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--brand);animation:blink 1.4s ease-in-out infinite}
.live-dot.off{animation:none;opacity:.5}
@keyframes blink{50%{opacity:.25}}
.list{background:var(--card);box-shadow:inset 0 0 0 1px var(--card-line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;border:0;background:none;color:var(--fg);text-align:left;position:relative;transition:background .2s}
.row+.row{border-top:1px solid var(--sep)}
button.row:active{background:var(--ctl)}
.row .num{width:38px;height:38px;flex:none;border-radius:50%;background:var(--ctl);display:grid;place-items:center;font-size:15px;font-weight:800}
.row .num .i{width:18px;height:18px}
.row .num.done,.row .num.pr{background:var(--brand);color:var(--on-brand)}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .main b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.row .main>span{font-size:13px;color:var(--muted);line-height:1.35}
.row .chev{color:var(--muted);width:18px;height:18px}
.row .when{font-size:12px;color:var(--muted);flex:none}
.row .up{font-style:normal;font-size:11px;font-weight:800;padding:2px 7px;border-radius:99px;background:var(--brand);color:var(--on-brand);margin-left:4px;white-space:nowrap}
.tag{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--lime);color:#0F1712}
.tag .i{width:12px;height:12px}
.row.bs-a::before,.row.bs-b::before{content:"";position:absolute;left:5px;width:4px;border-radius:4px;background:var(--lime)}
.row.bs-a::before{top:24px;bottom:0}
.row.bs-b::before{top:0;bottom:calc(100% - 34px)}
.pips{display:flex;gap:3px;flex:none}
.pips i{width:6px;height:6px;border-radius:50%;background:var(--sep)}
.pips i.on{background:var(--brand)}

/* folha */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim);animation:fade .25s ease;transition:opacity .28s}
.sheet-wrap.still,.sheet-wrap.still .sheet{animation:none}
.sheet-wrap.closing{opacity:0;pointer-events:none}
.sheet-wrap.closing .sheet{transform:translateY(100%)!important;transition:transform .3s cubic-bezier(.4,0,.8,.4)}
.sheet{width:100%;max-width:520px;max-height:94%;max-height:min(94%,calc(100% - 12px - env(safe-area-inset-top,0px)));overflow-y:auto;overscroll-behavior:contain;background:var(--card);color:var(--fg);border-radius:34px 34px 0 0;padding:0 max(18px,env(safe-area-inset-left,0px)) calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:up .6s cubic-bezier(.2,1.12,.35,1);box-shadow:0 80px 0 0 var(--card);transition:transform .35s var(--ease);outline:none}
.sheet-top{position:sticky;top:0;z-index:2;background:var(--card);padding:10px 0 8px;margin-bottom:-8px;touch-action:none;cursor:grab}
.grabber{width:40px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto 6px}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sheet-h h2{margin:4px 0 0;font-size:30px;font-weight:900;letter-spacing:-.04em;line-height:1.02}
.sheet h3{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
.presc{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.presc div{background:var(--ctl);border-radius:18px;padding:10px 4px;text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0}
.presc b{font-size:17px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.presc span{font-size:11px;color:var(--muted)}
.pane{display:flex;flex-direction:column;gap:16px;animation:fade .25s ease}
.sug{background:#0F1712;color:#F6F5EF;border-radius:24px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;--muted:#A9B0AA;--fg:#F6F5EF;--focus:#F6F5EF}
.sug .card-h{margin-bottom:2px}
.sug-kg{font-size:46px;font-weight:900;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.sug-kg small{font-size:18px;letter-spacing:0;color:#A9B0AA}
.sug p{margin:0;font-size:14px;line-height:1.45}
.sug .sug-last{font-size:13px;color:#A9B0AA}
.tagc{font-size:12px;font-weight:800;padding:5px 10px;border-radius:99px;background:var(--brand);color:var(--on-brand)}
.tone-hold .tagc,.tone-new .tagc{background:#F6F5EF}
.warm{display:flex;flex-direction:column;gap:8px}
.warm-row{display:flex;gap:8px;flex-wrap:wrap}
.wpill{height:38px;padding:0 14px;border:0;border-radius:99px;background:var(--ctl);color:var(--fg);font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;transition:transform .2s var(--spring),background .2s}
.wpill:active{transform:scale(.94)}
.wpill.on{background:#0F1712;color:#F6F5EF}
.wpill .i{width:16px;height:16px}
/* academia do dia */
.gym-list{display:flex;flex-direction:column;gap:8px}
.gym-opt{display:flex;align-items:center;gap:10px;min-height:54px;padding:0 16px;border:0;border-radius:16px;background:var(--ctl);color:var(--fg);font-size:16px;font-weight:800;text-align:left;transition:transform .2s var(--spring),background .2s}
.gym-opt:active{transform:scale(.98)}
.gym-opt.on{background:var(--brand);color:var(--on-brand)}
.gym-opt .i{width:18px;height:18px;flex:none}
.gym-new{display:flex;gap:8px;align-items:center}
.gym-new .inp-wrap{flex:1;min-width:0}
.gym-new .inp{font-size:16px}
.gym-new .btn{flex:none;height:48px}
.gym-chip{display:flex;align-items:center;gap:8px;width:100%;margin-top:8px;padding:9px 14px;border:0;border-radius:14px;background:var(--ctl);color:var(--fg);font-size:14px;font-weight:700;text-align:left}
.gym-chip span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gym-chip .i{width:16px;height:16px;flex:none}
.gym-chip.empty{color:var(--muted)}
/* como foi o exercício e observação do personal */
.exq{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.exq textarea{min-height:64px}
.pobs{margin:0;padding:12px 14px;border-radius:16px;background:var(--ctl);font-size:14px;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
.pobs b{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.pobs .i{flex:none;margin-top:1px}
.tp-foot{display:flex;justify-content:center;margin-top:-4px}
.fex-f{display:flex;gap:16px;align-items:center}
.linkbtn.on{color:var(--fg)}
.linkbtn.on .i{width:14px;height:14px;margin-right:3px;vertical-align:-2px}
.gib.on{background:var(--fg);color:var(--bg)}
.sets-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sets{display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:30px 1fr 1fr 46px;gap:8px;align-items:center}
.set-head{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:center}
.set .n{width:30px;height:30px;display:grid;place-items:center;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;border-radius:50%}
.set .n .i{width:16px;height:16px}
.set.pr .n{background:var(--brand);color:var(--on-brand)}
.set input{width:100%;min-width:0;height:46px;border-radius:14px;border:1.5px solid var(--sep);background:var(--input);color:var(--fg);font:inherit;font-size:18px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;transition:border-color .2s,background .2s}
.set input::placeholder{color:var(--muted);opacity:.6;font-weight:600}
.set input:focus{outline:none;border-color:var(--fg)}
.check{width:46px;height:46px;border-radius:50%;border:2px solid var(--sep);background:transparent;color:transparent;display:grid;place-items:center;transition:transform .25s var(--spring),background .2s}
.check:active{transform:scale(.86)}
.set.ok .check{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.set.ok input{border-color:transparent;background:var(--ctl)}
.rir{grid-column:2/-1;display:flex;align-items:center;gap:6px;animation:fade .3s ease}
.rir span{flex:1;font-size:12px;font-weight:600;color:var(--muted)}
.rb{width:36px;height:32px;border:0;border-radius:99px;background:var(--ctl);color:var(--fg);font-size:13px;font-weight:800;transition:transform .2s var(--spring)}
.rb:active{transform:scale(.9)}
.rb.on{background:#0F1712;color:#F6F5EF}
.nextex{background:var(--ctl);border-radius:22px}
.nextex .main span{font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.exa{border-radius:22px;overflow:hidden;background:#FFFFFF;box-shadow:inset 0 0 0 1px rgba(15,23,18,.08)}.exa svg{display:block;width:100%;height:auto;aspect-ratio:480/420}
.video{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:22px;overflow:hidden;background:#0F1712;color:#F6F5EF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.video .wave-svg{position:absolute;inset:auto 0 -6% 0;width:100%;height:60%;opacity:.9}
.video .play{position:relative;width:56px;height:56px;border-radius:50%;background:rgba(246,245,239,.16);display:grid;place-items:center;margin-bottom:6px}
.video b,.video span{position:relative}
.video>span:last-child{font-size:12px;opacity:.75}
.cues{margin:0;padding:0;list-style:none;counter-reset:c;display:flex;flex-direction:column;gap:12px}
.cues li{counter-increment:c;display:grid;grid-template-columns:28px 1fr;gap:12px;font-size:15px;line-height:1.45}
.cues li::before{content:counter(c);width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:800;font-size:13px}
.sheet .list{background:var(--ctl)}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum-grid>div{background:var(--ctl);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0;color:var(--fg)}
.sum-grid>div.blk-brand{background:var(--brand)}
.sum-grid>div.blk-lime{background:var(--lime)}
.sum-grid b{font-size:34px;font-weight:900;letter-spacing:-.045em;line-height:1.05;font-variant-numeric:tabular-nums}
.sum-grid span{font-size:12.5px;line-height:1.3;color:var(--muted)}
.rpe{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rpe button{height:42px;min-width:0;border:0;border-radius:12px;background:var(--ctl);color:var(--fg);font-size:14px;font-weight:800;padding:0;transition:transform .2s var(--spring),background .2s}
.rpe button:active{transform:scale(.9)}
.rpe button.on{background:var(--brand);color:var(--on-brand)}

/* cardio */
.cw-body{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.minis{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mini{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted)}
.mini .bx{height:50px;width:20px;border-radius:7px;background:var(--ctl);display:flex;align-items:flex-end;overflow:hidden}
.mini .bx i{display:block;width:100%;background:#0F1712;border-radius:7px;transition:height .6s var(--ease)}
.mini.now span{color:var(--fg)}
.mini.fut .bx{background:transparent;box-shadow:inset 0 0 0 1.5px var(--sep)}
.stack{display:flex;gap:3px;height:12px;border-radius:99px;overflow:hidden}
.stack i{display:block;min-width:4px}
.z0{background:rgba(15,23,18,.28)}.z1{background:rgba(15,23,18,.6)}.z2{background:#0F1712}
.legend3{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;font-weight:600}
.legend3 span{display:inline-flex;align-items:center;gap:6px}
.legend3 i{width:10px;height:10px;border-radius:50%}
.zone{margin:0;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.zone b{color:var(--fg)}
.calc{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.calc>div{background:var(--ctl);border-radius:16px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0}
.calc b{font-size:19px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.calc span{font-size:11px;color:var(--muted)}
.calc p{grid-column:1/-1;margin:0;font-size:13px;color:var(--muted);padding:10px 12px;border-radius:16px;background:var(--ctl)}

/* evolução */
.st-big{display:flex;align-items:flex-end;gap:12px}
.st-big b{font-size:96px;font-weight:900;letter-spacing:-.06em;line-height:.85;font-variant-numeric:tabular-nums}
.st-big span{font-size:15px;font-weight:700;line-height:1.3;padding-bottom:6px}
.stk-card{--card:#FFFFFF;background:#FFFFFF;color:#0F1712;border:2px solid #FF4646}
.stk-card .label .i{color:#FF4646}
.stk-card .wk8 .on i{background:#FF4646;color:#0F1712}
.wk8{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.wk8>div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--muted)}
.wk8 i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800;background:var(--ctl);color:var(--fg)}
.wk8 .on i{background:var(--fg);color:var(--card)}
.wk8 .cur i{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--fg)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);box-shadow:inset 0 0 0 1px var(--card-line);border-radius:22px;padding:14px 12px;display:flex;flex-direction:column;gap:4px;min-width:0;color:var(--fg)}
.tile .i{width:18px;height:18px;color:var(--muted)}
.tile b{font-size:28px;font-weight:900;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;line-height:1.3;color:var(--muted)}
.cal-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-h b{font-size:20px;font-weight:900;letter-spacing:-.03em}
.cal-h .btn{width:38px;height:38px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.cd{position:relative;aspect-ratio:1;border-radius:12px;background:var(--ctl);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.cd.empty{background:transparent}
.cd.tr{background:var(--brand);color:var(--on-brand)}
/* cardio é anel (forma), treino é preenchido: distingue mesmo quando o objetivo é Corrida */
.cd.ca{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 3px var(--cardio)}
.cd.both{box-shadow:inset 0 0 0 3px var(--cardio),inset 0 0 0 5px var(--card)}
.cd.fut{background:transparent;box-shadow:inset 0 0 0 1px var(--sep);opacity:.55}
.cd.now{outline:2px solid var(--fg);outline-offset:2px}
.cd i{position:absolute;bottom:4px;width:6px;height:6px;border-radius:50%;background:var(--water);box-shadow:0 0 0 1.5px var(--card)}
.cal-leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.cal-leg span{display:inline-flex;align-items:center;gap:6px}
.cal-leg i{width:12px;height:12px;border-radius:4px;background:var(--brand)}
.cal-leg i.c{background:transparent;box-shadow:inset 0 0 0 2.5px var(--cardio)}
.cal-leg i.b{background:var(--brand);box-shadow:inset 0 0 0 2.5px var(--cardio),inset 0 0 0 4px var(--card)}
.cal-leg i.w{width:7px;height:7px;border-radius:50%;background:var(--water)}
.scroller{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 4px;scroll-padding-inline:18px}
.scroller::-webkit-scrollbar{display:none}
.scroller .opt{flex:none;height:36px;font-size:13px}
.lchart{width:100%;height:auto;display:block}
.lchart text{fill:var(--muted);font-size:10.5px;font-weight:700;font-family:inherit}
.lchart .grid{stroke:var(--sep);stroke-width:1}
.lchart .area{fill:var(--brand);opacity:.28}
.lchart .ln{fill:none;stroke:var(--fg);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.lchart .pt{fill:var(--card);stroke:var(--fg);stroke-width:2}
.lchart .last{fill:var(--brand);stroke:var(--fg);stroke-width:2.5}
.lchart .lab{fill:var(--fg)}
.lchart text.labt{fill:var(--card);font-size:12px;font-weight:800}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv>div{background:var(--ctl);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv b{font-size:17px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kv span{font-size:11.5px;color:var(--muted)}
.bars{width:100%;height:auto;display:block}
.bars text{fill:var(--muted);font-size:11px;font-weight:700;font-family:inherit}
.bars text.v{fill:var(--fg);font-size:10px}
.bars .b{fill:var(--ctl)}
.bars .b.hit{fill:var(--brand)}
.bars .base{stroke:var(--sep);stroke-width:1}
.bars .goal{stroke:var(--fg);stroke-width:1.5;stroke-dasharray:4 4}
.bars text.gl{fill:var(--fg)}
.citab{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed;font-variant-numeric:tabular-nums}
.citab th{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:0}
.citab tbody th{text-align:left;width:62px;font-size:12px;color:var(--fg)}
.citab td{text-align:center;padding:0}
.cv{display:grid;place-items:center;height:30px;border-radius:10px;background:var(--ctl);font-size:13px;font-weight:800}
.cv.flag{background:var(--coral);color:#0F1712}
.cv.none{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--sep)}

/* barra de abas flutuante */
.tabbar{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(448px,calc(100% - 32px));display:grid;grid-template-columns:repeat(5,1fr);padding:6px;border-radius:999px;background:var(--tab-bg);box-shadow:var(--tab-shadow)}
.tab-ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px) / 5);border-radius:999px;background:var(--tab-on);transform:translateX(calc(var(--ti,0) * 100%));transition:transform .5s var(--spring)}
.tab{position:relative;z-index:1;border:0;background:transparent;color:var(--tab-fg);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:999px;font-size:11px;font-weight:700;transition:color .25s,transform .2s var(--spring);min-width:0}
.tab:active{transform:scale(.9)}
.tab .i{width:23px;height:23px}
.tab.on{color:var(--tab-on-fg)}
.tab.on .i{color:var(--brand)}
.tab[data-v="hoje"].on .i{color:#B794FF}
.tab[data-v="agua"].on .i{color:var(--water)}
.tab[data-v="cardio"].on .i{color:var(--cardio)}
:root[data-accent="branco"][data-theme="light"] .tab.on:not([data-v="agua"]):not([data-v="cardio"]) .i{color:var(--tab-on-fg)}
.tab:focus-visible{outline-color:#0F1712}

/* descanso: cápsula no topo, como uma atividade ao vivo */
.rest{position:fixed;z-index:60;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;border-radius:999px;background:var(--rest-bg);color:var(--rest-fg);box-shadow:0 0 0 1px var(--rest-line),0 12px 32px rgba(0,0,0,.3);font-size:14px;animation:drop .5s cubic-bezier(.2,1.2,.35,1);white-space:nowrap;--focus:var(--rest-fg)}
.rest.out{transform:translate(-50%,-160%);transition:transform .25s ease-in}
.rest svg{width:26px;height:26px}
.rest circle{fill:none;stroke-width:3}
.rest .rt{stroke:var(--rest-ctl)}
.rest .rf{stroke:var(--brand);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.rest b{font-variant-numeric:tabular-nums;font-weight:800;display:inline-block;min-width:3.2ch}
.rest button{height:34px;padding:0 13px;border:0;border-radius:999px;background:var(--rest-ctl);color:var(--rest-fg);font-size:13px;font-weight:700;transition:transform .2s var(--spring)}
.rest button:active{transform:scale(.92)}
.rest button.go{background:var(--brand);color:var(--on-brand)}

.toast{position:fixed;z-index:70;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);width:max-content;max-width:calc(100% - 32px);padding:12px 18px;border-radius:22px;background:var(--toast-bg);color:var(--toast-fg);font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s,transform .4s var(--spring);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* comemoração de recorde */
.fx{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;background:rgba(15,23,18,.45);animation:fade .2s ease;transition:opacity .35s}
.fx.out{opacity:0}
.fx-burst{position:absolute;left:50%;top:50%;width:0;height:0}
.fx-burst i{position:absolute;left:-5px;top:-7px;width:10px;height:14px;border-radius:3px;background:var(--c);opacity:0;animation:burst 1.4s var(--d) cubic-bezier(.15,.7,.3,1) forwards}
.fx-burst i:nth-child(3n){width:11px;height:11px;border-radius:50%}
@keyframes burst{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.4)}75%{opacity:1}100%{opacity:0;transform:translate(var(--x),calc(var(--y) + 90px)) rotate(var(--r)) scale(1)}}
.fx-card{position:relative;max-width:320px;background:var(--brand);color:var(--on-brand);border-radius:32px;padding:24px 24px 22px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5);animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.fx-card .dot{background:var(--on-brand)}
.fx-card.c-water{--brand:var(--water);--on-brand:#0F1712}
.fx-card.c-cardio{--brand:var(--cardio);--on-brand:#0F1712}
.fx-ic{width:56px;height:56px;border-radius:50%;background:var(--on-brand);color:var(--brand);display:grid;place-items:center}
.fx-ic .i{width:28px;height:28px}
.fx-card b{font-size:32px;font-weight:900;letter-spacing:-.045em;line-height:1}
.fx-card span{font-size:14px;line-height:1.45;font-weight:600}
.fx-card small{font-size:12px;opacity:.7}


/* garrafinha da água */
.wh-body{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.bottle svg{width:150px;height:auto;display:block;overflow:visible}
.b-glass{fill:color-mix(in srgb,var(--fg) 6%,transparent)}
.b-line{fill:none;stroke:var(--fg);stroke-width:4;stroke-linejoin:round}
.b-cap{fill:var(--fg)}
.b-neck{fill:none;stroke:var(--fg);stroke-width:3}
.b-lvl{transition:transform 1.1s cubic-bezier(.2,.9,.25,1)}
.b-w1{fill:var(--water);animation:wv1 3.2s linear infinite}
.b-w2{fill:var(--water);opacity:.42;transform:translate(0,-6px);animation:wv2 4.8s linear infinite}
@keyframes wv1{from{transform:translateX(0)}to{transform:translateX(100px)}}
@keyframes wv2{from{transform:translate(100px,-6px)}to{transform:translate(0,-6px)}}
.b-shine{fill:none;stroke:color-mix(in srgb,var(--fg) 22%,transparent);stroke-width:7;stroke-linecap:round}
.b-tick{stroke:color-mix(in srgb,var(--fg) 45%,transparent);stroke-width:2}
.b-goal{stroke:var(--fg);stroke-width:2;stroke-dasharray:6 5}
.bottle text{fill:var(--muted);font-size:12px;font-weight:800;font-family:inherit}
.bottle text.gl{fill:var(--fg)}
.b-badge circle{fill:var(--water)}
.b-badge path{fill:none;stroke:#0F1712;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.b-badge{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.b-spark path{fill:var(--water);transform-box:fill-box;transform-origin:center;animation:twinkle 1.8s ease-in-out infinite}
.b-spark path:nth-child(2){animation-delay:.5s}.b-spark path:nth-child(3){animation-delay:1s}
@keyframes twinkle{0%,100%{transform:scale(.5);opacity:.4}50%{transform:scale(1.1);opacity:1}}
.wh-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.wh-pct{font-size:64px;font-weight:900;letter-spacing:-.06em;line-height:.9;font-variant-numeric:tabular-nums}
.wh-ml{font-size:22px;font-weight:900;letter-spacing:-.03em;margin-top:10px;font-variant-numeric:tabular-nums}
.wh-txt span{font-size:13px;color:var(--muted)}
.wh-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rm-h{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rm-h label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}.rm-h .inp{background:var(--ctl);border-radius:14px;flex:none;width:100%;height:44px;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;padding:0 12px;color:var(--fg)}
.wh-btns .btn{padding:0 4px;font-size:14px;font-variant-numeric:tabular-nums}

/* cena do cardio */
.scene{width:100%;height:auto;display:block}
.sc-sky{fill:#13201A}
.sc-m2{fill:#1E2A22}
.sc-m1{fill:#253028}
.sc-road{fill:none;stroke:#3A463D;stroke-width:5;stroke-linecap:round;stroke-dasharray:1 3}
.sc-prog{fill:none;stroke:var(--cardio);stroke-width:5;stroke-linecap:round;transition:stroke-dasharray 1.6s cubic-bezier(.2,.9,.25,1)}
.sc-pole{stroke:#F6F5EF;stroke-width:2.5;stroke-linecap:round}
.sc-flag{fill:var(--cardio);transform-box:fill-box;transform-origin:left center;animation:flag 1.6s ease-in-out infinite}
@keyframes flag{50%{transform:skewY(-8deg) scaleX(.9)}}
.scene text{fill:#A9B0AA;font-size:11px;font-weight:800;font-family:inherit}
.rider .wheel circle{fill:none;stroke:var(--cardio);stroke-width:2.6}
.rider .spokes{stroke:var(--cardio);stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.scene.stopped .spokes{animation-play-state:paused}
.rider .frame{fill:none;stroke:var(--cardio);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.rider .body,.rider .leg{fill:none;stroke:#F6F5EF;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.rider .leg.l2{stroke:#A9B0AA}
.rider .head{fill:#F6F5EF}
.sc-spark{opacity:0}
.scene.done .sc-spark{opacity:1}
.sc-spark circle{fill:var(--cardio);transform-box:fill-box;transform-origin:center;animation:twinkle 1.4s ease-in-out infinite}
.sc-spark circle:nth-child(2n){fill:#F6F5EF;animation-delay:.4s}
.sc-spark circle:nth-child(3n){animation-delay:.8s}

/* perfil */
.prof-id{display:flex;align-items:center;gap:14px}
.prof-id .avatar{width:64px;height:64px}
.prof-id b{display:block;font-size:24px;font-weight:900;letter-spacing:-.03em}
.prof-id span{font-size:13px;color:var(--muted)}
.prefs{background:var(--ctl);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.glass-demo{display:flex;gap:10px;align-items:center}
.glass-demo .num{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#0F1712;color:#F6F5EF}
.glass-demo .num .i{width:20px;height:20px}

/* Ícones em Liquid Glass: vidro translúcido com borda de luz, brilho interno e sombra suave */
html.glass{--glass-bg:rgba(246,245,239,.12);--rim-a:rgba(255,255,255,.75);--rim-b:rgba(255,255,255,.06);--rim-c:rgba(255,255,255,.3);--hi:rgba(255,255,255,.35)}
html.glass .blk-brand,html.glass .blk-lime,html.glass .blk-water,html.glass .blk-cardio,html.glass .blk-cream,html.glass .sheet{--glass-bg:rgba(255,255,255,.38);--rim-a:rgba(255,255,255,.95);--rim-b:rgba(15,23,18,.1);--rim-c:rgba(15,23,18,.22);--hi:rgba(255,255,255,.8)}
html.glass .btn.round,html.glass .row .num:not(.done):not(.pr),html.glass .glass-demo .num,html.glass .fx-ic{position:relative;isolation:isolate}
html.glass .tabbar{isolation:isolate}
html.glass .tabbar::before,html.glass .btn.round::before,html.glass .row .num:not(.done):not(.pr)::before,html.glass .glass-demo .num::before,html.glass .tab-ind::before,html.glass .row .num.done::before,html.glass .row .num.pr::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(160deg,var(--rim-a),var(--rim-b) 42%,var(--rim-c));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
html.glass .row .num.done,html.glass .row .num.pr{position:relative;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),0 4px 12px rgba(0,0,0,.25)}
html.glass .tabbar{--tab-fg:rgba(246,245,239,.78);--tab-on-fg:#F6F5EF;background:rgba(40,52,44,.42);-webkit-backdrop-filter:blur(24px) saturate(1.9);backdrop-filter:blur(24px) saturate(1.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 18px 44px rgba(0,0,0,.5)}
html.glass .tabbar::before{--rim-a:rgba(255,255,255,.7);--rim-b:rgba(255,255,255,.05);--rim-c:rgba(255,255,255,.28)}
html.glass .tab-ind{background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(8px) saturate(2.2) brightness(1.15);backdrop-filter:blur(8px) saturate(2.2) brightness(1.15);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -6px 12px rgba(255,255,255,.06),0 6px 18px rgba(0,0,0,.3)}
html.glass .tab-ind::before{--rim-a:rgba(255,255,255,.9);--rim-b:rgba(255,255,255,.1);--rim-c:rgba(255,255,255,.45)}
html.glass .tab:focus-visible{outline-color:#F6F5EF}
html.glass .btn.round,html.glass .row .num:not(.done):not(.pr),html.glass .glass-demo .num{background:var(--glass-bg);color:var(--fg);-webkit-backdrop-filter:blur(14px) saturate(1.8);backdrop-filter:blur(14px) saturate(1.8);box-shadow:inset 0 1.5px 0 var(--hi),0 6px 16px rgba(0,0,0,.18)}
html.glass .stepper .btn.round{color:#0F1712;background:rgba(255,255,255,.55)}
html.glass .glass-demo .num{background:rgba(246,245,239,.5);color:#0F1712}
html.glass .avatar{border-radius:50%;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 0 1px rgba(255,255,255,.35),0 8px 20px rgba(0,0,0,.4)}
html.glass .fx-ic{background:rgba(15,23,18,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35)}

/* metas batidas */
.goal-hit .ring-fill{filter:drop-shadow(0 0 6px rgba(15,23,18,.35))}

html.glass[data-theme="light"]{--glass-bg:rgba(15,23,18,.05);--rim-a:rgba(255,255,255,.95);--rim-b:rgba(15,23,18,.1);--rim-c:rgba(15,23,18,.2);--hi:rgba(255,255,255,.9)}
html.glass[data-theme="light"] .tabbar{--tab-fg:#3E4540;--tab-on-fg:#0F1712;background:rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 12px 32px rgba(15,23,18,.16)}
html.glass[data-theme="light"] .tabbar::before{--rim-a:rgba(255,255,255,1);--rim-b:rgba(15,23,18,.08);--rim-c:rgba(15,23,18,.18)}
html.glass[data-theme="light"] .tab-ind{background:rgba(255,255,255,.7);box-shadow:inset 0 1.5px 0 #fff,0 6px 18px rgba(15,23,18,.14)}
html.glass[data-theme="light"] .tab-ind::before{--rim-a:#fff;--rim-b:rgba(15,23,18,.08);--rim-c:rgba(15,23,18,.22)}
html.glass[data-theme="light"] .tab:focus-visible{outline-color:#0F1712}
html.glass[data-theme="light"] .avatar{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 0 1px rgba(15,23,18,.12),0 8px 20px rgba(15,23,18,.18)}
/* topo: botão sol/lua ao lado do perfil */
.top-act{display:flex;align-items:center;gap:8px;flex:none}
.theme-btn{width:42px;height:42px}
/* cores do app */
.dots{display:flex;gap:12px;flex-wrap:wrap}
.cdot{width:46px;height:46px;border-radius:50%;border:0;padding:0;background:var(--c);color:#0F1712;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(15,23,18,.14);transition:transform .2s var(--spring),box-shadow .2s}
.cdot:active{transform:scale(.88)}
.cdot.on{box-shadow:inset 0 0 0 1px rgba(15,23,18,.14),0 0 0 3px var(--card),0 0 0 5.5px var(--fg)}
.cdot .i{width:20px;height:20px;stroke-width:2.6}
.cdot.neutral{background:linear-gradient(135deg,#FFFFFF 0 50%,#0F1712 50% 100%)}
.cdot.neutral .i{background:#FFFFFF;border-radius:50%;padding:2px;width:22px;height:22px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes drop{from{transform:translate(-50%,-160%)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
/* ===== Treino em grade: caderno de academia, uma bolha por série ===== */
:root{--stick-shadow:0 10px 24px rgba(0,0,0,.45);--bub-plan:#1C2620;--gpop-line:rgba(15,23,18,.10)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--stick-shadow:0 10px 24px rgba(15,23,18,.10);--bub-plan:#FFFFFF;--gpop-line:rgba(15,23,18,.14)}}
:root[data-theme="light"]{--stick-shadow:0 10px 24px rgba(15,23,18,.10);--bub-plan:#FFFFFF;--gpop-line:rgba(15,23,18,.14)}
.gstick{position:sticky;top:0;z-index:6;margin:0 -16px;padding:calc(6px + env(safe-area-inset-top,0px)) 16px 8px;background:var(--bg)}
.gsum{padding:12px 14px;gap:10px;border-radius:24px;box-shadow:inset 0 0 0 1px var(--card-line),var(--stick-shadow)}
.gs-top{display:flex;align-items:center;gap:8px}
.gs-clock{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.gs-clock>span{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.07em;line-height:1.25;text-transform:uppercase;color:var(--muted)}
.gs-clock>b{font-size:34px;font-weight:900;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.gs-clock>b.idle{color:var(--muted);opacity:.6}
.gs-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gs-stats>div{background:var(--ctl);border-radius:14px;padding:6px 10px;display:flex;flex-direction:column;min-width:0}
.gs-stats b{font-size:18px;font-weight:900;letter-spacing:-.03em;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.gs-stats b small{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:0}
.gs-stats span{font-size:11px;color:var(--muted)}
.gs-mus{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px 12px}
.gm{display:flex;flex-direction:column;gap:3px;min-width:0}
.gm>span{display:flex;justify-content:space-between;gap:4px;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.gm em{font-style:normal;color:var(--fg);font-variant-numeric:tabular-nums}
.gm>i{display:block;height:5px;border-radius:9px;background:var(--ctl);overflow:hidden}
.gm>i>u{display:block;height:100%;background:var(--brand);border-radius:inherit;text-decoration:none;transition:width .5s var(--ease)}
.gm.full>span{color:var(--fg)}
.gs-hint{margin:0;font-size:13px;font-weight:600;color:var(--fg)}
.gtools{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.gleg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.gleg i{width:14px;height:14px;border-radius:5px;background:var(--bub-plan);box-shadow:inset 0 0 0 1.5px var(--sep)}
.gleg i.o{background:var(--brand);box-shadow:none;margin-left:6px}
.ggrid{display:flex;flex-direction:column;gap:10px}
.gex{position:relative;background:var(--card);box-shadow:inset 0 0 0 1px var(--card-line);border-radius:24px;padding:6px 10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.gex.bs-a{border-bottom-left-radius:10px;border-bottom-right-radius:10px}
.gex.bs-b{margin-top:-7px;border-top-left-radius:10px;border-top-right-radius:10px}
.gex.bs-a::before,.gex.bs-b::before{content:"";position:absolute;left:4px;width:4px;border-radius:4px;background:var(--lime)}
.gex.bs-a::before{top:18px;bottom:-3px}.gex.bs-b::before{top:-4px;bottom:18px}
.gex-h{display:flex;align-items:center;gap:2px}
.gex-n{flex:1;min-width:0;min-height:44px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;padding:2px;border:0;border-radius:12px;background:none;color:var(--fg);text-align:left}
.gex-n b{max-width:100%;font-size:16px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gex-n>span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.gex-n em.up{font-style:normal;font-size:11px;font-weight:800;padding:1px 6px;border-radius:99px;background:var(--brand);color:var(--on-brand)}
.gex .tag{margin:-4px 0 0 2px}
.gib{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center;transition:background .2s,transform .2s var(--spring)}
.gib:active{transform:scale(.9)}
.gib[aria-pressed="true"]{background:var(--ctl);color:var(--fg)}
.gbubs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.gbub{position:relative;height:56px;min-width:0;padding:0 2px;border:0;border-radius:16px;background:var(--bub-plan);box-shadow:inset 0 0 0 1.5px var(--sep);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;transition:transform .2s var(--spring),background .2s,box-shadow .2s;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.gbub b{font-size:15px;font-weight:800;letter-spacing:-.03em;line-height:1.15;color:var(--fg);opacity:.62;white-space:nowrap}
.gbub small{font-size:11px;font-weight:700;white-space:nowrap}
.gbub:active{transform:scale(.92)}
.gbub.nx{box-shadow:inset 0 0 0 2px var(--fg)}
.gbub.nx b{opacity:1}
.gbub.ok{background:var(--brand);color:var(--on-brand);box-shadow:none}
.gbub.ok b{color:var(--on-brand);opacity:1}
.gbub.open{box-shadow:inset 0 0 0 2px var(--fg),0 0 0 3px var(--card),0 0 0 5px var(--fg)}
.gbub.just{animation:bfill .5s var(--spring)}
@keyframes bfill{0%{transform:scale(.78)}100%{transform:scale(1)}}
.gbub:disabled{opacity:.35}
.gbub.add{background:transparent;box-shadow:none;border:1.5px dashed var(--sep);color:var(--muted)}
.gtr{position:absolute;top:-6px;right:-5px;width:20px;height:20px;border-radius:50%;background:var(--lime);color:#0F1712;display:grid;place-items:center;box-shadow:0 0 0 2px var(--card)}
.gtr .i{width:12px;height:12px;stroke-width:2.4}
.gex.skip .gex-n b{text-decoration:line-through;text-decoration-thickness:2px;opacity:.6}
.gpop{scroll-margin:230px 0 110px;position:relative;margin-top:4px;padding:10px 12px 12px;border-radius:20px;background:var(--card);color:var(--fg);box-shadow:0 0 0 1px var(--gpop-line),0 14px 30px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:10px;animation:gpin .28s var(--spring)}
.gpop::before{content:"";position:absolute;top:-7px;left:var(--cx);width:14px;height:14px;margin-left:-7px;background:inherit;transform:rotate(45deg);border-radius:3px 0 0 0}
@keyframes gpin{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.gp-h{display:flex;align-items:center;gap:8px}
.gp-h div{flex:1;min-width:0;display:flex;flex-direction:column}
.gp-h b{font-size:16px;font-weight:800;letter-spacing:-.02em}
.gp-h span{font-size:12px;color:var(--muted)}
.gp-st{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gp-l{display:block;font-size:11px;font-weight:700;color:var(--muted);text-align:center;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.gstep{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;padding:3px;border-radius:999px;background:var(--ctl)}
.gstep button{width:44px;height:44px;border:0;border-radius:50%;background:var(--seg-on);color:#0F1712;display:grid;place-items:center;transition:transform .2s var(--spring)}
.gstep button:active{transform:scale(.88)}
.gstep input{width:100%;min-width:0;height:44px;border:0;background:transparent;color:var(--fg);font:inherit;font-size:20px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums}
.gstep input:focus{outline:none}
.gstep:focus-within{box-shadow:inset 0 0 0 2px var(--fg)}
.gpop .rir{display:flex;align-items:center;gap:6px}
.gpop .rb{width:44px;height:44px}
/* descanso imersivo em tela cheia */
.grest{position:fixed;inset:0;z-index:60;background:var(--rest-bg);color:var(--rest-fg);display:flex;flex-direction:column;align-items:center;gap:14px;padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));overflow-y:auto;overscroll-behavior:contain;animation:up .5s var(--ease);--fg:var(--rest-fg);--focus:var(--rest-fg);--ctl:var(--rest-ctl);--ctl-fg:var(--rest-fg)}
.grest[hidden]{display:none}
.grest.out{transform:translateY(100%);transition:transform .32s cubic-bezier(.4,0,.8,.4)}
.grest.done{animation:grflash .9s ease}
@keyframes grflash{0%{background:var(--brand)}100%{background:var(--rest-bg)}}
.gr-top{width:100%;max-width:440px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:24px}
.gr-top .eyebrow{color:var(--rest-fg);opacity:.7}
.gr-title{margin:0;font-size:52px;font-weight:900;letter-spacing:-.05em;line-height:1;text-align:center}
.gr-stage{position:relative;flex:none;width:min(300px,76vw);aspect-ratio:1;display:grid;place-items:center}
.gr-stage svg{position:absolute;inset:0;width:100%;height:100%}
.gr-trk{fill:none;stroke:var(--rest-ctl);stroke-width:5}
.gr-prog{fill:none;stroke:var(--brand);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.gr-breath{position:absolute;inset:11%;border-radius:50%;background:color-mix(in srgb,var(--brand) 22%,transparent);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--brand) 45%,transparent);transform:scale(.62);animation:breathe 8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.62)}50%{transform:scale(1)}}
.gr-c{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.gr-t{font-size:76px;font-weight:900;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.gr-ph{font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.8;min-height:1.3em}
.grest.rm .gr-breath{animation:none;transform:none}
.grest.rm .gr-ph{display:none}
.gr-next{width:100%;max-width:440px;background:var(--rest-ctl);border-radius:24px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.gr-next .eyebrow{color:var(--rest-fg);opacity:.7}
.gr-next b{font-size:20px;font-weight:900;letter-spacing:-.03em}
.gr-next span:last-child{font-size:14px;opacity:.8;font-variant-numeric:tabular-nums}
.gr-btns{width:100%;max-width:440px;display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:auto}
.gr-btns .btn{height:58px;font-size:17px}
@media (max-width:380px){
  h1{font-size:46px}
  .water-body,.cw-body{grid-template-columns:1fr;justify-items:center}
  .water-btns{width:100%}
  .tiles b{font-size:24px}
  .tab span{font-size:10px}
}
/* arrastar para começar */
.slide{--p:0;position:relative;height:64px;border-radius:999px;background:var(--ctl);overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.slide-fill{position:absolute;inset:0;width:calc(56px + 8px + (100% - 64px) * var(--p));border-radius:inherit;background:var(--accent);opacity:calc(.25 + .75 * var(--p));transition:width .45s var(--spring),opacity .3s}
.slide-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;padding-left:56px;font-size:16px;font-weight:800;letter-spacing:-.01em;color:var(--fg);opacity:calc(1 - var(--p) * 1.4);transform:translateX(calc(var(--p) * 40px));transition:opacity .3s,transform .45s var(--spring);
  background:linear-gradient(100deg,var(--fg) 40%,color-mix(in srgb,var(--fg) 35%,transparent) 50%,var(--fg) 60%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:slideShine 2.4s linear infinite}
.slide-arrows{display:inline-flex}
.slide-arrows .i{width:16px;height:16px;margin-left:-8px;color:var(--fg);-webkit-text-fill-color:initial;animation:slideNudge 1.4s ease-in-out infinite}
.slide-arrows .i:nth-child(2){animation-delay:.15s}.slide-arrows .i:nth-child(3){animation-delay:.3s}
.slide-knob{position:absolute;top:4px;left:4px;width:56px;height:56px;border:0;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;cursor:grab;box-shadow:0 6px 18px rgba(0,0,0,.28);
  transform:translateX(calc((100cqw - 64px) * var(--p))) scale(calc(1 + var(--p) * .08));transition:transform .45s var(--spring)}
.slide{container-type:inline-size}
.slide-knob .i{width:30px;height:30px;stroke-width:2.4;grid-area:1/1;transition:opacity .2s,transform .3s var(--spring)}
.slide-knob .k-ok{opacity:0;transform:scale(.4)}
.slide.drag .slide-fill,.slide.drag .slide-txt,.slide.drag .slide-knob{transition:none}
.slide.drag .slide-knob{cursor:grabbing;box-shadow:0 10px 26px rgba(0,0,0,.35),0 0 0 6px color-mix(in srgb,var(--accent) 30%,transparent)}
.slide.ok .slide-knob .k-play{opacity:0;transform:scale(.4)}
.slide.ok .slide-knob .k-ok{opacity:1;transform:none}
.slide.ok .slide-fill{opacity:1}
.slide.ok{animation:slidePop .42s var(--spring)}
@keyframes slideShine{to{background-position:-250% 0}}
@keyframes slideNudge{0%,100%{transform:translateX(0);opacity:.35}50%{transform:translateX(4px);opacity:1}}
@keyframes slidePop{50%{transform:scale(1.03)}}
/* ===== Cardio: boneco, três layouts, escolha no primeiro acesso ===== */
:root{--a-skin:#C98E6A;--a-hair:#2A1B14;--a-hair2:#5B3B2A;--fig-top:var(--cardio);--fig-top2:#7BCB52;--fig-short:#3A4640;--fig-short2:#2E3833;--fig-shoe:#F6F5EF;--fig-sole:#0F1712;--fig-lace:#9AA39C;--fig-band:var(--cardio);--fig-eye:#14100D;--fig-lip:#8E5A3E;--fig-ear:#B87B58;
  --eq-1:#2E3931;--eq-2:#46524A;--eq-3:#5B665E;--floor:#2E3931;--live-scn:rgba(15,23,18,.08);--th-fr:#0F1712;--th-blk:#253028;--th-white:#F6F5EF;--chip-on:#F6F5EF;--chip-on-fg:#0F1712}

.sheet{--panel:#ECEAE2;--eq-1:#C9CDC4;--eq-2:#9AA39C;--eq-3:#7E877F;--floor:#D6D5CC;--a-eq:#C9CDC4;--a-dk:#6E776F;--a-dim:#C2C6BF;--a-bld:#E0DED5;--a-crown:#CFD8C8;--a-shadow:#DEDCD3;--a-hback:#9CC68A;--cardio-line:#3E9E2E;--fig-top:#0F1712;--fig-top2:#2E3931;--fig-short:#46524A;--fig-short2:#3A4640}
:root[data-theme="light"] .sheet{--panel:#F0F0EB}
.live{--panel:transparent;--eq-1:rgba(15,23,18,.14);--eq-2:rgba(15,23,18,.26);--eq-3:rgba(15,23,18,.38);--floor:rgba(15,23,18,.28);--a-eq:rgba(15,23,18,.1);--a-dk:rgba(15,23,18,.42);--a-dim:rgba(15,23,18,.2);--a-bld:rgba(15,23,18,.06);--a-crown:rgba(15,23,18,.12);--a-shadow:rgba(15,23,18,.14);--a-hback:rgba(15,23,18,.3);--cardio-line:#0F1712;--fig-top:#0F1712;--fig-top2:#253028;--fig-short:#2E3931;--fig-short2:#253028;--fig-band:#F6F5EF}
canvas.anim{display:block;width:100%;height:100%}
.sheet>*{flex-shrink:0}
.mring{width:42px;height:42px;flex:none;display:block}
.mring svg{width:100%;height:100%;display:block}
.mring circle{fill:none;stroke-width:6;stroke-linecap:round}

.tsbar{display:flex;align-items:center;gap:8px}
.tsb-c{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tsb-c b{display:flex;align-items:center;gap:8px;font-size:30px;font-weight:900;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.tsb-c>span{font-size:12.5px;color:var(--muted);font-weight:700}
.tprog{height:6px;border-radius:99px;background:var(--ctl);overflow:hidden}
.tprog i{display:block;height:100%;background:var(--brand);border-radius:inherit;transition:width .5s var(--ease)}
.lrow-w{position:relative;border-radius:20px;overflow:hidden}
.lrow-under{position:absolute;inset:0;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;gap:6px;padding-left:18px;font-weight:800;font-size:14px;opacity:0;transition:opacity .15s}
.lrow-w.sw .lrow-under{opacity:1}
.lrow{position:relative;background:var(--card);box-shadow:inset 0 0 0 1px var(--card-line);border-radius:20px;touch-action:pan-y;transition:transform .3s var(--spring)}
.lrow.drag{transition:none;box-shadow:-10px 0 20px rgba(0,0,0,.3)}
.lrow-m{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:62px;border:0;background:none;color:var(--fg);text-align:left;border-radius:20px}

.lnum .i{width:18px;height:18px}
.lrow-w.done .lnum{background:var(--brand);color:var(--on-brand)}
.lrow-w.done .lrow{opacity:.75}
.lmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lmain b{font-size:15.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lmain span{font-size:12.5px;color:var(--muted)}
.sr-f:focus{position:static;width:auto;height:auto;clip:auto;margin:0 14px 12px;padding:10px 14px;border-radius:99px;border:0;background:var(--brand);color:var(--on-brand);font-weight:800;white-space:normal}
.tdots{display:flex;gap:4px;flex:none}
.tdots s{width:8px;height:8px;border-radius:50%;background:var(--ctl)}
.tdots s.f{background:var(--brand)}

/* senhas trocadas neste aparelho (modo de teste): a senha nova substitui o código original */
const PWKEY = 'simplificando-senhas', RSKEY = 'simplificando-reset';
function pwOverrides(){ try { return JSON.parse(localStorage.getItem(PWKEY)||'{}') || {}; } catch(e){ return {}; } }
function findAlunoByPassword(pw){ const ov = pwOverrides(); const a = DEMO_ALUNOS.find(x => ov[x.codigo] ? ov[x.codigo]===pw : x.codigo===pw); return a ? JSON.parse(JSON.stringify(a)) : null; }
/* trocar por chamadas ao servidor: requestPasswordReset(email) e resetPassword(token, novaSenha) */
function requestPasswordReset(email){
  const e = String(email||'').trim().toLowerCase(), a = DEMO_ALUNOS.find(x => (x.email||'').toLowerCase()===e);
  if(!a) return { ok:true, preview:null };
  const token = Array.from({length:4}, () => Math.random().toString(36).slice(2,8)).join('');
  try { localStorage.setItem(RSKEY, JSON.stringify({token, code:a.codigo, exp:Date.now()+3600e3})); } catch(err){ /* sem armazenamento */ }
  return { ok:true, preview:{ nome:firstName(a.perfil.nome), email:a.email } };
}
function readReset(){ try { const v = JSON.parse(localStorage.getItem(RSKEY)||'null'); return v && v.token && v.exp>Date.now() ? v : null; } catch(e){ return null; } }
function resetPassword(token, pw){
  const r = readReset(); if(!r || r.token!==token) return { ok:false, err:'Link inválido ou expirado. Peça um novo.' };
  if(String(pw).length<8) return { ok:false, err:'A senha precisa de pelo menos 8 caracteres.' };
  const ov = pwOverrides(); ov[r.code] = String(pw);
  try { localStorage.setItem(PWKEY, JSON.stringify(ov)); localStorage.removeItem(RSKEY); } catch(e){ return { ok:false, err:'Não deu para salvar neste navegador.' }; }
  return { ok:true, code:r.code };
}
function getAlunoByCode(code){ const a = DEMO_ALUNOS.find(x => x.codigo===String(code)); return a ? JSON.parse(JSON.stringify(a)) : null; }
/* ===== conta online (Firebase): só no site (pasta /treino), quando a página carrega o SDK =====
   O aluno entra com a senha de 6 números que o personal gerou no painel e o app lê o treino dele. */
const FB = (() => {
  const cfg = window.SIMPLIFICANDO_FIREBASE, fb = window.firebase;
  if(!cfg || !fb || typeof fb.initializeApp!=='function') return null;
  let app = null;
  try { app = fb.apps.find(x => x.name==='[DEFAULT]') || fb.initializeApp(cfg); } catch(e){ return null; }

// e-mail de "esqueci a senha" com o design do Simplificando (recuperar.php no site); sem a chave lá, usa o e-mail padrão do Firebase
async function siteReset(email, aluno){
  try { const r = await fetch('/recuperar.php', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ email, aluno:!!aluno }) });
    const j = await r.json(); if(j && j.ok) return { ok:true, proprio:true }; if(j && j.erro) return { err:j.erro }; } catch(e){ /* sem o arquivo no site */ }
  return FB.resetMail(email, aluno);
}

async function novoSalvar(){
  const n = LG.nv, a = (document.getElementById('nv-a')||{}).value||'', b = (document.getElementById('nv-b')||{}).value||''; n.a = a; n.b = b;
  const bad = m => { n.err = m; const e = document.getElementById('nv-err'); if(e) e.textContent = m; vibrate([40,40,40]); };
  if(n.aluno && !/^\d{6}$/.test(a)) return bad('A senha tem que ter exatamente 6 números.');
  if(!n.aluno && a.length<8) return bad('A senha precisa de pelo menos 8 caracteres.');
  if(a!==b) return bad('As duas senhas não são iguais.');
  n.busy = true; renderLogin();
  const r = await FB.resetSave(n.oob, a, n.aluno);
  n.busy = false;
  if(r.err){ n.err = r.err; renderLogin('#nv-a'); return; }
  try { history.replaceState(null, '', location.pathname); } catch(e){ /* sem histórico */ }
  if(n.aluno && r.p){ writeSess({mode:'personal', code:r.p.aid}); LG.view = 'login'; LG.nv = null; welcome(firstName(r.p.perfil.nome), r.p.perfil.sexo, 'Senha nova salva. Seu treino está pronto.'); return; }
  LG.view = 'entrar'; LG.en = {email:r.email||'', senha:'', show:false, msg:'Senha nova salva. Entre com ela.'}; LG.nv = null; renderLogin('#en-senha');
}

function lgFail(msg){

async function tryLoginFB(){
  const code = String(LG.code||'').replace(/\D/g,'');
  if(!code){ lgFail('Digite sua senha.'); return; }
  if(code.length!==6){ lgFail('A senha do app tem 6 números. Confira com seu personal.'); return; }
  const go = document.querySelector('#login .lg-go'); if(go){ go.disabled = true; go.classList.add('busy'); }
  const em = LG.forgot ? String(LG.email||'').trim() : '';
  if(em && !/^\S+@\S+\.\S+$/.test(em)){ lgFail('Confira o e-mail. Ex.: voce@email.com'); return; }
  const r = await FB.login(code, em);
  if(go){ go.disabled = false; go.classList.remove('busy'); }
  if(r.err){ lgFail(r.err); return; }
  writeSess({mode:'personal', code:r.p.aid});
  const inp = document.getElementById('lg-pw'); if(inp) inp.blur();
  welcome(firstName(r.p.perfil.nome), r.p.perfil.sexo);
}
function tryLogin(){
  if(FB){ tryLoginFB(); return; }
  const a = LG.code ? findAlunoByPassword(LG.code) : null;
  if(!a){ lgFail(!LG.code ? 'Digite sua senha.' : 'Senha não encontrada. Confira com seu personal.'); return; }
  writeSess({mode:'personal', code:a.codigo});
  const inp = document.getElementById('lg-pw'); if(inp) inp.blur();
  welcome(firstName(a.perfil.nome), a.perfil.sexo);
}

const pwRules = (a,b) => ({ len:a.length>=8, match:!!a && a===b });
function pwStrength(a){ if(!a) return ['','']; let k = 0; if(/[a-zA-Z]/.test(a)) k++; if(/\d/.test(a)) k++; if(/[^a-zA-Z0-9]/.test(a)) k++; if(a.length>=12) k++; return a.length<8 ? ['fraca','w1'] : k>=3 ? ['forte','w3'] : ['média','w2']; }
function vReset(){
  const r = LG.rs, tk = readReset();
  if(r.done) return `<div class="lg-in su lg-ok"><span class="lg-okc" aria-hidden="true">${ic('check')}</span><h1 class="lg-h">Senha alterada<span class="dot" aria-hidden="true"></span></h1><p class="muted" role="status">Pronto. Use a nova senha para entrar. A antiga não funciona mais neste aparelho.</p><button type="button" class="btn primary block" data-a="lg-back">Ir para o login${ic('chev')}</button></div>`;
  if(!tk) return `<div class="lg-in su"><h1 class="lg-h">Link inválido<span class="dot" aria-hidden="true"></span></h1><p class="muted">Esse link expirou ou já foi usado. Peça um novo em “Esqueci a senha”.</p><button type="button" class="btn primary block" data-a="lg-forgot">Pedir novo link</button><button type="button" class="btn block ghost" data-a="lg-back">Voltar ao login</button></div>`;
  const ru = pwRules(r.a,r.b), stg = pwStrength(r.a);
  const fld = (id,lab,v,show,k,ac) => `<label class="flabel" for="${id}">${lab}</label><div class="lg-field sm"><input id="${id}" class="lg-inp" type="${show?'text':'password'}" maxlength="64" autocomplete="${ac}" autocapitalize="off" spellcheck="false" value="${esc(v)}" aria-describedby="rs-rules"><button type="button" class="lg-eye" data-a="lg-eye${k}" aria-pressed="${show}" aria-label="${show?'Esconder':'Mostrar'} ${lab.toLowerCase()}">${ic(show?'eyeOff':'eye')}</button></div>`;
  return `<div class="lg-in su"><div class="lg-hero"><span class="lg-logo sm">${bigLogo()}</span></div><p class="eyebrow">Nova senha</p><h1 class="lg-h">Crie sua nova senha<span class="dot" aria-hidden="true"></span></h1>
    <form class="lg-form" data-lg="reset" novalidate>${fld('rs-1','Nova senha',r.a,r.s1,1,'new-password')}
      <p class="rs-str ${stg[1]}" data-rs-str aria-live="polite">${stg[0]?'Força da senha: <b>'+stg[0]+'</b>':''}</p>
