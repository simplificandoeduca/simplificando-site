      <p class="lg-err" id="rs-err" role="alert">${r.err}</p>
      <button type="submit" class="btn primary block lg-go"${ru.len&&ru.match?'':' disabled'}>Salvar nova senha</button></form></div>`;
}
function rsInput(){
  const a = document.getElementById('rs-1'), b = document.getElementById('rs-2'); if(!a || !b) return;
  LG.rs.a = a.value; LG.rs.b = b.value; LG.rs.err = '';
  const ru = pwRules(a.value,b.value), stg = pwStrength(a.value);
  document.querySelectorAll('#login [data-rule]').forEach(li => li.classList.toggle('ok', !!ru[li.dataset.rule]));
  const st = document.querySelector('#login [data-rs-str]'); if(st){ st.className = 'rs-str '+stg[1]; st.innerHTML = stg[0] ? 'Força da senha: <b>'+stg[0]+'</b>' : ''; }
  const go = document.querySelector('#login .lg-go'); if(go) go.disabled = !(ru.len && ru.match);
  const e = document.getElementById('rs-err'); if(e) e.textContent = '';
}
function openReset(){ LG.view = 'reset'; LG.rs = {a:'', b:'', s1:false, s2:false, err:'', done:false}; renderLogin('#rs-1'); }
function lgSubmit(kind){
  if(kind==='form') return tryLogin();
  if(kind==='novo') return novoSalvar();
  if(kind==='conta') return suConta();
  if(kind==='entrar') return suEntrar();
  if(kind==='forgot'){
    const v = (document.getElementById('fg-email')||{}).value || '';
    if(!/^\S+@\S+\.\S+$/.test(v.trim())){ const e = document.getElementById('fg-err'); if(e) e.textContent = 'Confira o e-mail. Ex.: voce@email.com'; return; }
    const r = requestPasswordReset(v); LG.fg = {email:v, sent:true, preview:r.preview}; renderLogin(); return;
  }
  if(kind==='reset'){
    const tk = readReset(), res = resetPassword(tk && tk.token, LG.rs.a);
    if(!res.ok){ LG.rs.err = res.err; renderLogin('#rs-1'); return; }
    const ss = readSess(); if(ss && ss.code===res.code) writeSess(null);
    LG.rs.done = true; renderLogin('.lg-ok .btn');
  }
}
function lgCopy(){
  const ta = document.getElementById('fg-msg'); if(!ta) return;
  const ok = () => toast('Mensagem copiada. Agora é só colar na conversa.');
  const fb = () => { try { ta.focus(); ta.select(); const r = document.execCommand && document.execCommand('copy'); if(r) ok(); else toast('Selecione o texto e copie.'); } catch(e){ toast('Selecione o texto e copie.'); } };
  try { if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(ok, fb); else fb(); } catch(e){ fb(); }
}

const TERMOS_V = 1; // subir este número quando os textos mudarem: o app pede um novo aceite
const DOC_HTML = { termos:`<section class="doc" id="doc-termos">
<h2>Termos de Uso</h2>
<p class="doc-meta">Versão 1 · em vigor desde 2 de novembro de 2026</p>
<p>Estes termos valem para o app Simplificando (endereço /treino) e para o painel do personal (endereço /personal). Ao marcar “Li e aceito”, você concorda com eles. Se não concordar, não use o app.</p>

<h3>1. O que é o Simplificando</h3>
<p>O Simplificando é um app para registrar treinos, água e cardio. Ele pode ser usado de dois jeitos:</p>
<ul>
<li><b>Com personal:</b> um profissional de Educação Física monta o seu treino no painel do personal e libera o seu acesso com uma senha de 6 números.</li>
<li><b>Sem personal:</b> você cria a sua conta e o treino é gerado automaticamente pelo app (“IA”) ou montado por você mesmo.</li>
</ul>
<p>O responsável pelo Simplificando é Eduardo Matias Marques.</p>

<h3>2. Quem pode usar</h3>
<p>O app é para maiores de 18 anos. Menores só podem usar com autorização e acompanhamento dos pais ou responsáveis.</p>

<h3>3. Saúde e riscos do exercício</h3>
<p>Atividade física envolve riscos, como dores, lesões musculares e articulares e, em casos raros, problemas cardíacos. Antes de começar, procure avaliação médica, principalmente se você:</p>
<ul>
<li>tem ou já teve problema no coração, pressão alta, diabetes ou outra doença crônica;</li>
<li>sente dor no peito, tontura ou falta de ar ao fazer esforço;</li>
<li>tem lesão, dor nas articulações ou na coluna, ou passou por cirurgia recente;</li>
<li>está grávida, voltando de um parto ou parado há muito tempo.</li>
</ul>

const FOCO_G = { pernas:['glut','quad'], peito:['peito'], costas:['costas'], ombro:['ombro'], bracos:['bic','tri'], abd:['abd'] };
const LIMS = [['j','Joelho'],['o','Ombro'],['l','Lombar']];
const IQ0 = () => ({ nivel:'ini', local:'a', n:3, dias:[], tempo:45, foco:[], lim:[] });
// quantos treinos por semana: os dias marcados (se marcou) ou o número escolhido; marcar os dias é opcional
const iqN = q => (q.dias||[]).length || +q.n || 3;
let IQ = IQ0();
const TPL = {
  corpo1:['Corpo todo 1',['quad','peito','costas','post','ombro','abd','tri','bic']],
  corpo2:['Corpo todo 2',['glut','costas','peito','quad','ombro','abd','bic','tri']],
  corpo3:['Corpo todo 3',['quad','costas','peito','glut','ombro','abd','tri','pant']],
  inf:['Pernas e glúteo',['quad','glut','post','quad','glut','pant','abd','post']],
  inf2:['Glúteo e posterior',['glut','post','quad','glut','post','pant','abd','quad']],
  sup:['Superiores 1',['peito','costas','ombro','peito','costas','tri','bic','abd']],
  sup2:['Superiores 2',['costas','peito','ombro','costas','ombro','bic','tri','abd']],
  emp:['Peito, ombro e tríceps',['peito','peito','ombro','ombro','tri','peito','tri','abd']],
  pux:['Costas e bíceps',['costas','costas','costas','ombro','bic','bic','abd','costas']]
};
function iaSplit(n, nivel, legs){
  if(n<=1) return ['corpo1'];
  if(n===2) return ['corpo1','corpo2'];
  if(n===3) return nivel==='ini' ? ['corpo1','corpo2','corpo3'] : legs ? ['inf','sup','inf2'] : ['inf','emp','pux'];
  if(n===4) return ['inf','sup','inf2','sup2'];
  if(n===5) return legs ? ['inf','emp','inf2','pux','sup2'] : ['inf','emp','pux','inf2','sup2'];
  return ['inf','emp','pux']; // 6 ou 7 dias: A B C duas vezes
}
function iaPlan(q, ed){
  const limHit = x => q.lim.some(k => x.lim.includes(k));
  let pri = [...new Set(q.foco.flatMap(k => FOCO_G[k]||[]))];
  if(ed==='corrida' && !pri.length) pri = ['glut','abd'];
  const split = iaSplit(iqN(q), q.nivel, q.foco.includes('pernas')), used = {}, out = {}, N = {30:4, 45:5, 60:6, 75:7}[q.tempo] || 5;
  split.forEach((key, ti) => {
    const [nome, gs] = TPL[key], body = key.indexOf('corpo')===0, slots = gs.slice(0, N);
    // prioridade: mais um exercício do grupo escolhido, no lugar do último que não é prioridade
    pri.forEach(g => {
      if((!body && !gs.includes(g)) || slots.filter(x => x===g).length>=2) return;
      let j = -1; for(let i=slots.length-1; i>0; i--) if(!pri.includes(slots[i])){ j = i; break; }
      if(j<0) return; slots.splice(j,1); slots.splice(Math.min(2, slots.length), 0, g);
    });
    const ex = [], seen = {};
    slots.forEach(g => {
      const nth = seen[g] = (seen[g]||0)+1, ok = x => x.eq.includes(q.local) && !x.noIa && !limHit(x) && !ex.some(e => e.id===x.id);
      let cand = CAT.filter(x => x.g===g && ok(x));
      if(!cand.length) cand = CAT.filter(x => x.g2===g && ok(x));
      if(!cand.length) return;
      const want = nth===1 ? 'c' : 'i'; // primeiro do grupo: composto; o segundo, isolado. Entre os treinos, varia.
      cand.sort((a,b) => ((a.anim==='none'?1:0)-(b.anim==='none'?1:0)) || ((a.t===want?0:1)-(b.t===want?0:1)) || ((used[a.id]||0)-(used[b.id]||0)) || (CAT.indexOf(a)-CAT.indexOf(b)));
      const x = cand[0]; used[x.id] = (used[x.id]||0)+1;
      const e = exFromCat(x, ed, q.nivel);
      if(nth===1 && pri.includes(g) && ed!=='corrida' && q.nivel!=='ini') e.s = Math.min(5, e.s+1);
      ex.push(e);
    });
    // completa o tempo escolhido com os próximos grupos do modelo (até 8 exercícios)
    const pick = g => { const ok = x => x.eq.includes(q.local) && !x.noIa && !limHit(x) && !ex.some(e => e.id===x.id);
      let c = CAT.filter(x => x.g===g && ok(x)); if(!c.length) c = CAT.filter(x => x.g2===g && ok(x)); if(!c.length) return null;
      c.sort((a,b) => ((a.anim==='none'?1:0)-(b.anim==='none'?1:0)) || ((a.t==='i'?0:1)-(b.t==='i'?0:1)) || ((used[a.id]||0)-(used[b.id]||0)) || (CAT.indexOf(a)-CAT.indexOf(b))); return c[0]; };
    const extra = gs.slice(N).concat(pri, gs);
    for(let k=0; k<extra.length && ex.length<8 && (estMin(ex)<q.tempo-9 || ex.length<4); k++){ const x = pick(extra[k]); if(!x) continue; used[x.id] = (used[x.id]||0)+1; ex.push(exFromCat(x, ed, q.nivel)); slots.push(extra[k]); }
    for(let k=0; k<ex.length && estMin(ex)<q.tempo-7; k++){ const c = catOf(ex[k].id); if(c && c.t==='c' && ex[k].s<(q.nivel==='ini'?3:5)) ex[k].s++; }
    // cabe no tempo escolhido: tira séries dos acessórios, depois o último exercício
    const lim = q.tempo + 8;
    for(let guard=0; estMin(ex)>lim && guard<60; guard++){
      const k = ex.findIndex((e,i) => i>0 && e.s>3);
      if(k>0){ ex[k].s--; continue; }
      if(ex.length>4){ ex.pop(); continue; }
      const j = ex.findIndex(e => e.s>2); if(j>=0){ ex[j].s--; continue; }
      break;
    }
    const c0 = ex.find(e => (catOf(e.id)||{}).t==='c'); if(c0 && ed!=='emagrecer') c0.aq = true;
    const g = [...new Set(slots)].filter(x => ex.some(e => e.alvo===GNOME[x]));
    out['ABCDEF'[ti]] = { nome, foco:focoTxt(g.slice(0,3)), g, min:estMin(ex), dias:[], ex };
  });
  // dias: na ordem dos treinos, repetindo quando há mais dias que treinos
  const ls = Object.keys(out);
  q.dias.slice().sort((a,b) => a-b).forEach((d,i) => out[ls[i % ls.length]].dias.push(d));
  return out;
}
function iaNotes(q, ed){
  const n = [];
  if(q.lim.includes('j')) n.push('Joelho: ficaram de fora os agachamentos, os afundos e a cadeira extensora.');
  if(q.lim.includes('o')) n.push('Ombro: sem supino com barra e sem exercícios acima da cabeça.');
  if(q.lim.includes('l')) n.push('Lombar: sem agachamento com barra, remada curvada e stiff.');
  if(q.lim.length) n.push('Se algum exercício doer, pare e procure um profissional.');
  if(q.nivel==='ini') n.push('Começando: termine cada série com 2 ou 3 repetições sobrando. O app sugere quando subir a carga.');
  if(ed==='emagrecer') n.push('Para emagrecer, junte o treino com o cardio da semana (meta de 150 min).');
  if(ed==='corrida') n.push('Força para quem corre: menos séries e mais glúteo e abdômen, para sobrar perna para a corrida.');
  return n;
}

}
function iqClick(a,d,b){
  const q = IQ, v = d.v;
  switch(a){
    case 'iq-nivel': q.nivel = v; break;
    case 'iq-local': q.local = v; break;
    case 'iq-n': q.n = +v; if(q.dias.length && q.dias.length!==q.n) q.dias = []; break;
    case 'iq-day': { const n = +v, k = q.dias.indexOf(n); if(k>=0) q.dias.splice(k,1); else q.dias.push(n); q.dias.sort((x,y) => x-y); if(q.dias.length) q.n = q.dias.length; break; }
    case 'iq-tempo': q.tempo = +v; break;
    case 'iq-foco': if(v==='eq') q.foco = []; else { const k = q.foco.indexOf(v); if(k>=0) q.foco.splice(k,1); else { q.foco.push(v); if(q.foco.length>2) q.foco.shift(); } } break;
    case 'iq-lim': if(v==='no') q.lim = []; else { const k = q.lim.indexOf(v); if(k>=0) q.lim.splice(k,1); else q.lim.push(v); } break;
  }
  const sel = `[data-a="${a}"][data-v="${v}"]`;
  if(document.getElementById('login')) renderLogin(sel); else { renderSheet(); refocus(sel); }
}

async function suConta(){
  const f = LG.f, email = f.email.trim().toLowerCase();
  if(!cleanName(f.nome)) return suErr('Digite seu nome.');
  if(!mailOk(email)) return suErr('Confira o e-mail. Ex.: voce@email.com');
  if(f.senha.length<8) return suErr('A senha precisa de pelo menos 8 caracteres.');
  if(!ckOk(f.ck, true)) return suErr('Para criar a conta, marque as três caixas de aceite.');
  if(LG.uid && LG.uidMail===email){ LG.step = 2; renderLogin(); suTop(); return; }
  suBusy(true);
  const r = FB ? await FB.signUp(email, f.senha, cleanName(f.nome)) : localSignUp(email, f.senha);
  suBusy(false);
  if(r.err) return suErr(r.err);
  LG.uid = r.uid; LG.uidMail = email; LG.serr = ''; LG.step = 2; renderLogin(); suTop();
}
async function suEntrar(){
  const e = LG.en, email = e.email.trim().toLowerCase();
  if(!mailOk(email)) return suErr('Confira o e-mail. Ex.: voce@email.com', 'en-err');
  if(!e.senha) return suErr('Digite sua senha.', 'en-err');
  suBusy(true);
  const r = FB ? await FB.signIn(email, e.senha) : localSignIn(email, e.senha);
  if(r.err){ suBusy(false); return suErr(r.err, 'en-err'); }
  let data = autoLocal(r.uid);
  if(FB){
    const rm = await FB.autoLoad();
    if(rm.err || rm.out){ suBusy(false); await FB.logout(); return suErr('Não deu para carregar seus dados agora. Confira a internet e tente de novo.', 'en-err'); }
    if(rm.s && rm.s.v===2 && (!data || (rm.s._em||0)>=(data._em||0))) data = rm.s;
  }
  suBusy(false);
  if(data && data.conta){
    try { localStorage.setItem(autoKey(r.uid), JSON.stringify(data)); } catch(err){ /* sem armazenamento */ }
    writeSess({mode:'self', uid:r.uid}); LG.view = 'login'; LG.serr = '';
    const inp = document.activeElement; if(inp && inp.blur) inp.blur();
    welcome(firstName(data.nome)||'de volta', data.conta.sexo); return;
  }
  // conta criada, mas o perfil ficou pela metade: segue o cadastro
  LG.uid = r.uid; LG.uidMail = email; LG.f.email = email; if(!LG.f.nome) LG.f.nome = r.nome || '';
  LG.view = 'setup'; LG.step = 2; LG.serr = ''; renderLogin(); suTop();
}
async function suForgot(){
  const email = String(LG.en.email||'').trim();
  if(!FB){ LG.en.msg = 'No modo de teste a conta fica só neste aparelho. Se esqueceu a senha, crie uma conta nova.'; renderLogin(); return; }
  if(!mailOk(email)) return suErr('Digite seu e-mail acima para receber o link.', 'en-err');
  const r = await siteReset(email, false);
  if(r.err) return suErr(r.err, 'en-err');
  LG.serr = ''; LG.en.msg = 'Pronto. Se esse e-mail tiver conta, chega um link para criar uma senha nova. Olhe também a caixa de spam.'; renderLogin();
}
function suNext(){
  const st = LG.step;
  if(st===6){
    LG.step = 7; LG.gen = true; LG.f.plan = null; renderLogin(); suTop();
    setTimeout(() => { LG.f.plan = iaPlan(IQ, LG.f.ed); LG.gen = false; if(LG.view==='setup' && LG.step===7){ renderLogin('[data-a="su-done"]'); suTop(); } }, RM() ? 300 : 1700);
    return;
  }
  LG.step = Math.min(6, st+1); renderLogin(); suTop();
}
function suFinish(mode){
  const f = LG.f, nome = cleanName(f.nome) || 'Você', uid = LG.uid, sexo = f.sexo==='M' ? 'M' : 'F';
  if(!uid){ LG.step = 1; renderLogin(); return; }
  const s = fresh(false); s.nome = nome; s.ed = f.ed; s.waterGoal = waterSug(); s.cardioGoal = f.ed==='emagrecer' ? 150 : 120;
  s.conta = { sexo, peso:num(f.peso)||null, email:LG.uidMail||'', plan:mode, treinos: mode==='ia' && f.plan ? f.plan : {}, ia: mode==='ia' ? JSON.parse(JSON.stringify(IQ)) : null, semana: mode==='ia' ? iqN(IQ) : 0, dias:[] };
  s.aceite = aceiteNovo(true); s._em = Date.now();
  try { localStorage.setItem(autoKey(uid), JSON.stringify(s)); } catch(e){ /* sem armazenamento */ }
  if(FB){ FB.autoSave(uid, s, true); FB.perfil({ tipo:'autonomo', nome, email:LG.uidMail||'', sexo, objetivo:f.ed, plano:mode, treinos:mode==='ia' && f.plan ? Object.keys(f.plan).length : 0, criadoEm:Date.now(), ultimoAcesso:Date.now(), aceite:{ v:s.aceite.v, em:s.aceite.em }, ver:APPV }); }
  writeSess({mode:'self', uid}); LG.view = 'login'; LG.step = 1; LG.f = LGF0(); LG.uid = null; LG.uidMail = '';
  if(mode==='meu') AFTER = 'meus';
  welcome(firstName(nome), sexo, mode==='meu' ? 'Agora é só montar seu treino.' : 'Seu treino está pronto.');
}

/* "Meus treinos": o aluno monta, nomeia e distribui os treinos na semana */
const ownPlan = () => !!ACCT && ACCT.mode==='self' && !!S.conta && (S.conta.plan==='meu' || S.conta.plan==='ia');
function toOwn(){
  const c = S.conta; if(!c || ownPlan()) return;
  const base = JSON.parse(JSON.stringify(c.plan==='ab' ? PLAN_AB : PLAN_ABC)), ls = Object.keys(base).sort();
  ls.forEach(l => { base[l].dias = []; base[l].g = []; (base[l].ex||[]).forEach(x => { delete x.cad; delete x.tec; delete x.sup; }); });
  (c.dias||[]).forEach((d,i) => base[ls[i % ls.length]].dias.push(d));
  c.treinos = base; c.plan = 'meu';
}
function mtFix(){
  const c = S.conta;
  Object.keys(c.treinos||{}).forEach(l => {
    const t = c.treinos[l]; t.ex = t.ex||[]; t.dias = t.dias||[]; t.g = (t.g||[]).filter(x => GNOME[x]); t.min = estMin(t.ex);
    t.foco = t.g.length ? focoTxt(t.g.slice(0,4)) : (joinPt([...new Set(t.ex.map(e => e.alvo).filter(Boolean))].slice(0,3)) || 'Treino livre');
  });
  applyAccount(); if(ui.t && !PLAN[ui.t]) ui.t = null; ui.tsel = null; ui.pop = null; save();
}
function mtOpen(){ if(!ACCT || ACCT.mode!=='self') return; toOwn(); mtFix(); ui.sheet = { k:'meus', ed:null, pick:false, q:'', pg:'', cn:'', cg:'' }; renderSheet(true); }
function iaOpen(){
  if(!ACCT || ACCT.mode!=='self') return;
  const c = S.conta || {};

}

function mtPickRows(sh, t){
  const q = normTx(sh.q.trim());
  const AP = { quad:'perna coxa', post:'perna coxa posterior', glut:'gluteo bumbum perna quadril', pant:'perna batata', peito:'peitoral', costas:'dorsal', ombro:'deltoide', bic:'braco', tri:'braco', abd:'abdomen abs core barriga' }, tk = q.split(/\s+/).filter(Boolean);
  const L = CAT.filter(x => q ? tk.every(w => normTx(x.nome+' '+GNOME[x.g]+' '+(AP[x.g]||'')+' '+eqTxt(x.eq)).includes(w)) : !sh.pg || x.g===sh.pg || x.g2===sh.pg); // digitou: busca em todos os grupos
  if(!L.length) return '<p class="muted mt-none">Nada com esse nome. Crie o seu logo abaixo.</p>';
  const GI = g => GRUPOS.findIndex(x => x[0]===g); L.sort((a,b) => GI(a.g)-GI(b.g) || a.nome.localeCompare(b.nome,'pt-BR'));
  return L.map((x,i) => { const has = t.ex.some(e => e.id===x.id);
    return `<button type="button" class="row mt-prow${has?' has':''}" data-a="mt-pick" data-v="${x.id}" aria-pressed="${has}">${exThumb(x,'p'+i)}<span class="main"><b>${esc(x.nome)}</b><span>${GNOME[x.g]} · ${eqTxt(x.eq)}</span></span><span class="mt-plus" aria-hidden="true">${ic(has?'check':'plus')}</span></button>`; }).join('');
}

function refocus(sel){ if(!sel) return; const n = $sheet.querySelector(sel); if(n && !n.disabled){ try { n.focus({preventScroll:true}); } catch(e){ /* foco opcional */ } } }
const selOf = b => '[data-a="'+b.dataset.a+'"]'+(b.dataset.v!=null?'[data-v="'+b.dataset.v+'"]':'')+(b.dataset.i!=null?'[data-i="'+b.dataset.i+'"]':'')+(b.dataset.d!=null?'[data-d="'+b.dataset.d+'"]':'');
/* toques no "Meus treinos" e na IA do perfil; devolve true quando tratou */
function mtClick(a, d, b, armed){
  const sh = ui.sheet;
  if(a==='mt-open-sheet'){ mtOpen(); return true; }
  if(a==='ia-open'){ iaOpen(); return true; }
  if(a.slice(0,3)==='ia-' && sh && sh.k==='ia'){
    if(a==='ia-gen'){ sh.busy = true; renderSheet(); setTimeout(() => { if(ui.sheet!==sh) return; sh.res = iaPlan(IQ, S.ed); sh.busy = false; renderSheet(); refocus('[data-a="ia-use"]'); }, RM() ? 300 : 1500); return true; }
    if(a==='ia-redo'){ sh.res = null; renderSheet(); return true; }
    if(a==='ia-use'){
      if(S.session){ toast('Finalize o treino em andamento antes de trocar.'); return true; }
      S.conta.treinos = sh.res; S.conta.plan = 'ia'; S.conta.ia = JSON.parse(JSON.stringify(IQ)); S.conta.semana = iqN(IQ);
      mtFix(); ui.t = null; closeSheet(); toast('Treino novo no ar. Seu histórico continua.'); return true;
    }
    return true;
  }
  if(a.slice(0,3)!=='mt-' || !sh || sh.k!=='meus') return false;
  const T = S.conta.treinos, t = sh.ed && T[sh.ed], i = +d.i;
  switch(a){
    case 'mt-new': { const l = 'ABCDEF'.split('').find(x => !T[x]); if(!l) break;
      T[l] = { nome:'', foco:'', g:[], min:0, dias:[], ex:[] };
      sh.ed = l; sh.pick = false; mtFix(); renderSheet(true); refocus('#mt-nome'); return true; }
    case 'mt-open': sh.ed = d.v; sh.pick = false; renderSheet(true); return true;
    case 'mt-back': sh.ed = null; sh.pick = false; mtFix(); renderSheet(true); return true;
    case 'mt-pback': sh.pick = false; renderSheet(true); refocus('[data-a="mt-add"]'); return true;
    case 'mt-add': sh.pick = true; sh.q = ''; sh.pg = t && t.g[0] || ''; renderSheet(true); return true;
    case 'mt-pg': sh.pg = d.v; renderSheet(); refocus(selOf(b)); return true;
    case 'mt-cg': sh.cg = sh.cg===d.v ? '' : d.v; renderSheet(); refocus(selOf(b)); return true;
  }
  if(!t) return true;
  switch(a){
    case 'mt-day': { const v = +d.v, k = t.dias.indexOf(v);
      if(k>=0) t.dias.splice(k,1);
      else { const o = Object.keys(T).find(x => x!==sh.ed && (T[x].dias||[]).includes(v)); if(o){ T[o].dias = T[o].dias.filter(x => x!==v); toast(TDAYS_L[v]+' saiu do treino '+o+'.'); } t.dias.push(v); t.dias.sort((x,y) => x-y); }
      break; }
    case 'mt-g': { const k = t.g.indexOf(d.v); if(k>=0) t.g.splice(k,1); else t.g.push(d.v); break; }
    case 'mt-s': { const e = t.ex[i]; if(e) e.s = Math.max(1, Math.min(8, e.s + +d.d)); break; }
    case 'mt-d': { const e = t.ex[i]; if(e) e.d = Math.max(15, Math.min(300, (+e.d||60) + +d.d)); break; }
    case 'mt-mv': { const j = i + +d.d; if(j>=0 && j<t.ex.length){ const x = t.ex[i]; t.ex[i] = t.ex[j]; t.ex[j] = x; } mtFix(); renderSheet(); refocus(`[data-a="mt-mv"][data-i="${j}"][data-d="${d.d}"]`); return true; }
    case 'mt-rm': { const x = t.ex.splice(i,1)[0]; if(x) toast(x.nome+' saiu do treino.'); break; }
    case 'mt-pick': { const k = t.ex.findIndex(e => e.id===d.v);
      if(k>=0){ t.ex.splice(k,1); }

function suggest(id){
  const e = findEx(id).e, L = lastFor(id), rg = range(e.r);
  if(!L) return e.kg ? {kg:e.kg, tone:'new', why:'Carga indicada pelo seu personal para começar. Se sobrar muito ou faltar, ajuste.'} : {kg:null, tone:'new', why:'Primeira vez: escolha uma carga em que sobrem 2 ou 3 repetições no fim da série.'};
  if(lowReady(S.checkin[today()])) return {kg:L.kg, tone:'hold', why:'Seu check-in de hoje pede um dia mais leve. Repita a carga da última vez e deixe 2 repetições sobrando.'};
  const mn = Math.min(...L.reps), rir = L.rir && L.rir.length ? L.rir.reduce((a,b)=>a+b,0)/L.rir.length : 1, st = step(L.kg);
  if(mn>=rg[1]){
    const up = rir>=3 ? 2*st : st;
    return {kg:L.kg+up, up, tone:'up', why:'Você fechou '+rg[1]+' repetições em todas as séries'+(rir>=3?' e ainda sobrou bastante':'')+'. Suba '+fmtKg(up)+' kg e volte para '+rg[0]+' repetições.'};
  }
  if(mn<rg[0]) return {kg:L.kg, tone:'keep', why:'Uma série ficou abaixo de '+rg[0]+' repetições. Repita '+fmtKg(L.kg)+' kg até fechar a faixa inteira.'};

}

function wireTSwipe(){
  let sw = null;
  document.addEventListener('pointerdown', ev => {
    if(ev.target.closest('.slide-knob') || ev.target.closest('input')) return;
    const row = ev.target.closest('.lrow[data-swipe]'), fo = !row && ev.target.closest('[data-fswipe]');
    if(!row && !fo) return;
    sw = { row, fo, x0:ev.clientX, y0:ev.clientY, dx:0, on:false };
  });
  document.addEventListener('pointermove', ev => {
    if(!sw) return;
    const dx = ev.clientX-sw.x0, dy = ev.clientY-sw.y0;
    if(!sw.on){ if(Math.abs(dx)>12 && Math.abs(dx)>Math.abs(dy)*1.4) sw.on = true; else if(Math.abs(dy)>12){ sw = null; return; } else return; }
    sw.dx = dx;
    if(sw.row){ const v = Math.max(0, Math.min(150, dx)); sw.row.classList.add('drag'); sw.row.style.transform = `translateX(${v}px)`; sw.row.parentNode.classList.toggle('sw', v>4); }
  });
  const end = () => {
    if(!sw) return;
    const s = sw; sw = null;
    if(!s.on) return;
    lpAt = Date.now();
    if(s.row){ s.row.classList.remove('drag'); s.row.style.transform = ''; if(s.dx>96) markAll(s.row.dataset.swipe); else s.row.parentNode.classList.remove('sw'); }
    else if(Math.abs(s.dx)>70) fNav(s.dx<0 ? 1 : -1);
  };
  document.addEventListener('pointerup', end); document.addEventListener('pointercancel', end);
}

function niceTicks(mn,mx){
  if(mn===mx){ mn -= 5; mx += 5; }
  const raw = (mx-mn)/3, st = [1,2,2.5,5,10,20,25,50,100].find(s => s>=raw) || 200;
  const lo = Math.floor(mn/st)*st, hi = Math.ceil(mx/st)*st, r = [];
  for(let v=lo; v<=hi+1e-9; v+=st) r.push(Math.round(v*100)/100);
  if(r.length<2) r.push(lo+st);
  return r;
}
function loadChart(id){
  const a = S.loadHist[id] || [], f = findEx(id);
  if(a.length<2) return '<p class="muted sm">O gráfico aparece depois de dois treinos com este exercício.</p>';
  const W = 320, H = 184, Lm = 38, R = 20, T = 34, B = 24, vals = a.map(x => x.kg), tk = niceTicks(Math.min(...vals),Math.max(...vals));
  const lo = tk[0], hi = tk[tk.length-1];
  const X = i => Lm+i*(W-Lm-R)/(a.length-1), Y = v => T+(hi-v)/(hi-lo)*(H-T-B);
  const grid = tk.map(v => `<line class="grid" x1="${Lm}" x2="${W-R+8}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${Lm-7}" y="${(Y(v)+3.5).toFixed(1)}" text-anchor="end">${fmtKg(v)}</text>`).join('');
  const pts = a.map((x,i) => [X(i),Y(x.kg)]);
  const line = pts.map((p,i) => (i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const area = line+` L${pts[pts.length-1][0].toFixed(1)},${Y(lo).toFixed(1)} L${pts[0][0].toFixed(1)},${Y(lo).toFixed(1)} Z`;
  const xi = [...new Set([0, Math.floor((a.length-1)/2), a.length-1])];
  const xl = xi.map(i => `<text x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="${i===0?'start':i===a.length-1?'end':'middle'}">${dm(a[i].d)}</text>`).join('');
  const lp = pts[pts.length-1], lab = fmtKg(vals[vals.length-1])+' kg', lw = lab.length*7.4+16;
  const lx = Math.min(W-lw-2, lp[0]-lw/2), ly = lp[1]-34;
  return `<svg class="lchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Carga de ${f.e.nome}: de ${fmtKg(vals[0])} kg em ${dm(a[0].d)} para ${fmtKg(vals[vals.length-1])} kg em ${dm(a[a.length-1].d)}">${grid}
    <path class="area" d="${area}"/><path class="ln" d="${line}"/>
    ${pts.slice(0,-1).map(p => `<circle class="pt" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5"/>`).join('')}
    <circle class="last" cx="${lp[0].toFixed(1)}" cy="${lp[1].toFixed(1)}" r="7"/>
    <rect class="lab" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" width="${lw.toFixed(1)}" height="24" rx="12"/><text class="labt" x="${(lx+lw/2).toFixed(1)}" y="${(ly+16.5).toFixed(1)}" text-anchor="middle">${lab}</text>${xl}</svg>`;
}
function calendar(){

    if(kind==='csave'){ setTimeout(() => { logCardio(ui.cf.local, ui.cf.min, ui.cf.int); render(); }, RM() ? 0 : 380); return; }

  };

    const sl = k.closest('.slide'); if(sl.classList.contains('ok')) return;

    ev.preventDefault();
  });

  document.addEventListener('pointercancel', end);

    const k = ev.target.closest && ev.target.closest('.slide-knob');

async function pushEnable(){

  try {
    const perm = await Notification.requestPermission();
    if(perm!=='granted'){ toast('Avisos bloqueados. Libere as notificações do Simplificando nos ajustes do celular.'); return; }
    const reg = await navigator.serviceWorker.ready, k = await fetch('/push.php?acao=chave',{cache:'no-store'}).then(r => r.json());
    if(!k || !k.pub) throw new Error('sem chave');
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64u8(k.pub)});
    if(!PREF.pushId) PREF.pushId = Array.from(crypto.getRandomValues(new Uint8Array(12)), b => (b%36).toString(36)).join('')+Date.now().toString(36);
    const r = await pushPost('assinar', pushDados(sub.toJSON()));
    if(!r.ok) throw new Error('servidor');
    PREF.pushOn = true; savePref(); if(!S.remind.on){ S.remind.on = true; save(); }
    toast('Pronto. Os lembretes de água chegam no celular mesmo com o app fechado.'); render();

}
async function pushDisable(manter){

/* sem internet: o app fica guardado no celular (sw.js na pasta do app) e avisa quando o sinal cai ou volta */

    const box = document.querySelector('.exa');
    if(!box){ cur = null; return; }
    const hit = findEx(box.dataset.ex); if(!hit) return;
    if(cur !== box){ cur = box; t0 = now; last = 0; }
    const still = RM();
    if(still ? box.dataset.drawn === '1' : now - last < 33) return;
    last = now; box.dataset.drawn = '1';
    const html = XA.scene(hit.e, (now - t0) / 1000, still);
    box.hidden = !html; // exercício sem animação (escolhido pelo personal ou sem correspondência)
    if(html) box.firstElementChild.innerHTML = html;
  }
  requestAnimationFrame(tick);
})();
})();

/* lista de resultados com barrinha de rolagem própria (sobe e desce, dá para arrastar) e janela que acompanha o teclado */
function pkSync(box){
  const L = box.querySelector('.pk-res'), bar = box.querySelector('.pk-bar'), th = bar && bar.firstElementChild; if(!L || !th) return;
  const over = L.scrollHeight - L.clientHeight; bar.hidden = over < 4; if(over < 4) return;
  const tr = bar.clientHeight, h = Math.max(36, tr * L.clientHeight / L.scrollHeight);
  th.style.height = h + 'px'; th.style.transform = 'translateY(' + ((tr - h) * L.scrollTop / over) + 'px)';
}
const pkAll = () => document.querySelectorAll('.pk-box').forEach(pkSync);
let pkDrag = null;
function pkMove(e){ const { bar, L } = pkDrag, r = bar.getBoundingClientRect(), h = bar.firstElementChild.offsetHeight, y = Math.min(1, Math.max(0, (e.clientY - r.top - h / 2) / Math.max(1, r.height - h))); L.scrollTop = y * (L.scrollHeight - L.clientHeight); }
document.addEventListener('scroll', e => { const b = e.target && e.target.closest && e.target.closest('.pk-box'); if(b) pkSync(b); }, true);
document.addEventListener('pointerdown', e => { const bar = e.target.closest && e.target.closest('.pk-bar'); if(!bar) return; e.preventDefault(); pkDrag = { bar, L:bar.closest('.pk-box').querySelector('.pk-res') }; bar.classList.add('on'); pkMove(e); try { bar.setPointerCapture(e.pointerId); } catch(x){ /* sem captura */ } });
document.addEventListener('pointermove', e => { if(pkDrag) pkMove(e); });
['pointerup','pointercancel'].forEach(k => document.addEventListener(k, () => { if(pkDrag){ pkDrag.bar.classList.remove('on'); pkDrag = null; } }));
window.addEventListener('resize', pkAll);
(function(){ // com o teclado aberto, a folha encolhe para caber na parte visível da tela
  const vv = window.visualViewport; if(!vv) return;
  const set = () => { const r = document.documentElement.style; r.setProperty('--vvh', vv.height + 'px'); r.setProperty('--vvt', vv.offsetTop + 'px'); pkAll(); };
  vv.addEventListener('resize', set); vv.addEventListener('scroll', set); set();
})();
new MutationObserver(() => requestAnimationFrame(pkAll)).observe(document.body, { childList:true, subtree:true });
</script>
