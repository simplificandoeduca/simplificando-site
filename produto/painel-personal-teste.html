<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1712">
<title>Simplificando · Painel do personal (teste)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&display=swap">
<style>
/* Painel do personal: mesma família visual do Simplificando Pro (fundo tinta, blocos de cor cheia, onda, cápsulas).
   Layout: barra lateral + conteúdo no computador; barra de abas flutuante no celular; lista de alunos ao lado do detalhe em telas largas. */
:root{
  --ink:#0F1712;--cream:#F6F5EF;--lime:#C8F542;--brand:#FF4646;--on-brand:#0F1712;--coral:#FF7A72;--water:#5AB8FF;--cardio:#8EE85F;
  --neutral:#F6F5EF;--on-neutral:#0F1712;
  --ok:#8EE85F;--warn:#FF9A2E;--bad:#FF7A72;--on-sem:#0F1712;
  --ed-hipertrofia:#FF4646;--ed-emagrecer:#FF9A2E;--ed-corrida:#C8F542;--ed-elas:#B794FF;
  --bg:#0C120E;--fg:#F6F5EF;--muted:#A3ACA6;--card:#141C17;--card-line:#212B25;--sep:#26302A;--ctl:#1E2822;--ctl-fg:#F6F5EF;--line2:#2E3931;--shadow:none;
  --seg-on:#F6F5EF;--seg-on-fg:#0F1712;--input:#0F1712;--accent:var(--brand);--on-accent:var(--on-brand);--focus:#F6F5EF;--danger:#FF7A72;
  --side:#0F1612;--tab-bg:#F6F5EF;--tab-fg:#5B625D;--tab-on:#0F1712;--tab-on-fg:#F6F5EF;--tab-shadow:0 14px 40px rgba(0,0,0,.55);
  --toast-bg:#F6F5EF;--toast-fg:#0F1712;--sheet:#141C17;--scrim:rgba(0,0,0,.62);--r:22px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --spring:cubic-bezier(.3,1.5,.5,1);--ease:cubic-bezier(.2,.9,.25,1);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#FFFFFF;--fg:#0F1712;--muted:#5E6762;--card:#FFFFFF;--card-line:#E4E8E5;--sep:#E9EDEA;--ctl:#F1F4F2;--ctl-fg:#0F1712;--line2:#D9DFDB;--shadow:0 1px 2px rgba(15,23,18,.04),0 8px 24px rgba(15,23,18,.05);
  --seg-on:#FFFFFF;--seg-on-fg:#0F1712;--input:#FFFFFF;--focus:#0F1712;--danger:#C8302F;
  --side:#FFFFFF;--tab-bg:#FFFFFF;--tab-shadow:0 10px 30px rgba(15,23,18,.14),0 0 0 1px rgba(15,23,18,.07);
  --neutral:#0F1712;--on-neutral:#FFFFFF;--toast-bg:#0F1712;--toast-fg:#FFFFFF;--sheet:#FFFFFF;--scrim:rgba(15,23,18,.38);
  color-scheme:light;
}}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .eyebrow{color:color-mix(in srgb,var(--brand) 55%,#0F1712)}}
:root[data-theme="light"]{
  --bg:#FFFFFF;--fg:#0F1712;--muted:#5E6762;--card:#FFFFFF;--card-line:#E4E8E5;--sep:#E9EDEA;--ctl:#F1F4F2;--ctl-fg:#0F1712;--line2:#D9DFDB;--shadow:0 1px 2px rgba(15,23,18,.04),0 8px 24px rgba(15,23,18,.05);
  --seg-on:#FFFFFF;--seg-on-fg:#0F1712;--input:#FFFFFF;--focus:#0F1712;--danger:#C8302F;
  --side:#FFFFFF;--tab-bg:#FFFFFF;--tab-shadow:0 10px 30px rgba(15,23,18,.14),0 0 0 1px rgba(15,23,18,.07);
  --neutral:#0F1712;--on-neutral:#FFFFFF;--toast-bg:#0F1712;--toast-fg:#FFFFFF;--sheet:#FFFFFF;--scrim:rgba(15,23,18,.38);
  color-scheme:light;
}
/* blocos de cor cheia: texto sempre tinta */
.blk-brand,.blk-water,.blk-cardio,.blk-lime,.blk-ok,.blk-warn,.blk-bad{--card-line:transparent;--fg:#0F1712;--muted:rgba(15,23,18,.72);--ctl:rgba(15,23,18,.12);--sep:rgba(15,23,18,.26);--ctl-fg:#0F1712;--accent:#0F1712;--on-accent:#F6F5EF;--seg-on:#F6F5EF;--seg-on-fg:#0F1712;--focus:#0F1712;--input:rgba(246,245,239,.62);--danger:#0F1712}
.blk-brand{--card:var(--brand);--fg:var(--on-brand);--muted:color-mix(in srgb,var(--on-brand) 72%,transparent);--ctl:color-mix(in srgb,var(--on-brand) 13%,transparent);--sep:color-mix(in srgb,var(--on-brand) 26%,transparent);--ctl-fg:var(--on-brand);--accent:var(--on-brand);--on-accent:var(--brand);--focus:var(--on-brand)}
.blk-water{--card:var(--water)}.blk-cardio{--card:var(--cardio)}.blk-lime{--card:var(--lime)}
.blk-ok{--card:var(--ok)}.blk-warn{--card:var(--warn)}.blk-bad{--card:var(--bad)}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,summary,label,select,input,textarea,a,[data-a]{touch-action:manipulation}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a{color:inherit}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dot{display:inline-block;width:.2em;height:.2em;border-radius:50%;background:var(--brand);margin-left:.05em}
.blk-brand .dot{background:var(--on-brand)}

/* casca */
.shell{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.main{min-width:0;width:100%;max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(6px + env(safe-area-inset-top,0px)) calc(124px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:960px){
  .shell{grid-template-columns:244px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;height:100dvh;padding:calc(22px + env(safe-area-inset-top,0px)) 14px 18px max(14px,env(safe-area-inset-left,0px));background:var(--side);border-right:1px solid var(--sep);overflow-y:auto}
  .main{padding-left:32px;padding-bottom:48px}
  .tabbar{display:none!important}
  .top .avatar{display:none}
  .toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
}
.brand-row{display:flex;align-items:center;gap:10px;padding:0 6px 16px}
.brand-row .avatar{width:42px;height:42px}
.brand-row b{display:block;font-size:17px;font-weight:900;letter-spacing:-.03em}
.brand-row span{display:block;font-size:12px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--fg);font-size:15px;font-weight:700;text-align:left;transition:background .2s}
.nav:hover{background:var(--ctl)}
.nav.on{background:var(--fg);color:var(--bg)}
.nav.on .i{color:var(--brand)}
:root[data-accent="branco"] .nav.on .i{color:var(--bg)}
.nav .cnt{margin-left:auto;font-size:12px;font-weight:800;opacity:.7;font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:12px 6px 0}

/* topo */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:22px;flex-wrap:wrap}
.top-txt{min-width:0;flex:1 1 260px}
.top-act{display:flex;align-items:center;gap:8px;flex:none}
@media (max-width:600px){.top{flex-wrap:nowrap}.top-txt{flex:1 1 auto}.top-act .hb{width:44px;padding:0}.top-act .hb .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
.eyebrow{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
:root[data-theme="light"] .eyebrow{color:color-mix(in srgb,var(--brand) 55%,#0F1712)}
.card .eyebrow,.sheet .eyebrow,:root .card .eyebrow,:root .sheet .eyebrow{color:var(--muted)}
h1{margin:4px 0 0;font-size:clamp(44px,7vw,62px);font-weight:900;letter-spacing:-.05em;line-height:1;text-wrap:balance}
.avatar{width:46px;height:46px;flex:none;padding:0;border:0;background:none;border-radius:50%}button.avatar{cursor:pointer;font:inherit;color:inherit}button.avatar:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tp-op{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;font:inherit;color:inherit;background:var(--ctl);border-radius:18px;padding:14px 16px;cursor:pointer;margin-top:10px}.tp-op b{display:block;font-size:16px}.tp-op span{font-size:13px;color:var(--muted)}.tp-op .i{width:22px;height:22px;flex:none}.tp-op .chev{margin-left:auto;width:18px;height:18px;opacity:.5}
.logo{width:100%;height:100%;display:block}
.wave-strip{display:block;height:56px;margin:-10px 0 -6px}
.wave-strip{overflow-x:clip;overflow-y:visible;position:relative;z-index:-1;pointer-events:none}
.main,:has(>.wave-strip){isolation:isolate}
.wave-strip svg{width:100%;height:100%;display:block;overflow:visible}
.wave-strip path{stroke-linecap:butt}
.wave-svg path{stroke:var(--brand);stroke-width:14}
.savest{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.savest i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.savest.saving i{background:var(--warn)}
.savest.err{color:var(--danger)}.savest.err i{background:var(--bad)}

/* cartões e texto */
.card{background:var(--card);color:var(--fg);box-shadow:inset 0 0 0 1px var(--card-line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;position:relative;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.label{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--fg);opacity:.85}
.label .i{width:16px;height:16px}
h2.big{margin:0;font-size:30px;font-weight:900;letter-spacing:-.04em;line-height:1.04;text-wrap:balance}
h3.sec{margin:10px 2px -4px;font-size:24px;font-weight:900;letter-spacing:-.04em;text-wrap:balance}
h4{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em}
.muted{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.foot{margin:0;font-size:12.5px;line-height:1.45;color:var(--muted)}
.pill{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--ctl);color:var(--fg);white-space:nowrap}
.pill .i{width:14px;height:14px}
.pill.ok{background:var(--ok);color:var(--on-sem)}.pill.warn{background:var(--warn);color:var(--on-sem)}.pill.bad{background:var(--bad);color:var(--on-sem)}
.pill.acc{background:var(--accent);color:var(--on-accent)}
.pill.line{background:transparent;box-shadow:inset 0 0 0 1.5px var(--sep)}
.edot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;background:var(--c,var(--muted))}
.callout{margin:0;padding:12px 14px;border-radius:16px;background:var(--ctl);font-size:14px;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
.callout b{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}
.callout>.i{margin-top:1px}
.callout.bad{background:var(--bad);color:var(--on-sem)}
.local-note{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:8px 14px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--sep);align-self:flex-start}
.local-note .i{width:16px;height:16px}

/* botões */
.btn{min-height:44px;padding:0 18px;border:0;border-radius:999px;background:var(--ctl);color:var(--ctl-fg);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700;letter-spacing:-.01em;transition:transform .2s var(--spring),background .2s,opacity .2s;user-select:none;-webkit-user-select:none;text-decoration:none;white-space:nowrap}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ink{background:var(--ink);color:var(--cream)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--sep)}
.btn.round{width:44px;padding:0}
.btn.small{min-height:44px;padding:0 14px;font-size:13px}
.btn.small .i{width:16px;height:16px}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--bad);color:var(--on-sem);box-shadow:none}
.btn.block{width:100%;min-height:52px}
.ibtn{width:44px;height:44px;flex:none;border:0;border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center;transition:background .2s}
.ibtn:hover{background:var(--ctl);color:var(--fg)}
.ibtn:disabled{opacity:.3;pointer-events:none}
.ibtn.armed{background:var(--bad);color:var(--on-sem)}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;padding:3px;gap:2px;border-radius:999px;background:var(--ctl);flex-wrap:nowrap;min-width:0}
.seg button{flex:1 1 auto;min-width:0;min-height:38px;padding:0 4px;border:0;border-radius:999px;background:transparent;color:var(--fg);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .25s,box-shadow .25s}
.seg button.on{background:var(--seg-on);color:var(--seg-on-fg);box-shadow:0 2px 8px rgba(15,23,18,.16);font-weight:800}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;padding:0 15px;border:0;border-radius:999px;background:var(--ctl);color:var(--fg);font-size:14px;font-weight:600;transition:transform .2s var(--spring),background .2s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.opt:active{transform:scale(.94)}
.opt.on{background:var(--accent);color:var(--on-accent);font-weight:800}
.opt .edot{box-shadow:0 0 0 2px rgba(246,245,239,.6)}
.opt.day{width:48px;padding:0;justify-content:center}

/* formulários */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 14px;align-items:start}
.form .wide{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.flabel{font-size:13px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.req{color:var(--danger)}
.inp-wrap{display:flex;align-items:center;gap:8px;min-height:46px;padding:0 14px;border-radius:14px;background:var(--input);border:1.5px solid var(--sep);transition:border-color .2s}
.inp-wrap:focus-within{border-color:var(--fg)}
.inp-wrap>span{color:var(--muted);font-weight:700;font-size:13px;white-space:nowrap}
.inp{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--fg);font-size:15px;font-weight:600;outline:none;padding:10px 0}
.inp::placeholder,textarea::placeholder{color:var(--muted);opacity:.7;font-weight:500}
select.inp{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:18px;background:transparent}
.sel-wrap{position:relative}
.sel-wrap::after{content:"";position:absolute;right:16px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
select.inp option{background:var(--sheet);color:var(--fg)}
textarea{width:100%;min-height:84px;resize:vertical;border-radius:14px;border:1.5px solid var(--sep);background:var(--input);color:var(--fg);font-size:15px;line-height:1.45;padding:11px 14px}
textarea:focus{outline:none;border-color:var(--fg)}
[aria-invalid="true"]{border-color:var(--danger)!important}
.inp-wrap:has(.inp[aria-invalid="true"]){border-color:var(--danger)}
.err{margin:0;font-size:12.5px;font-weight:600;color:var(--danger);min-height:0}
.err:empty{display:none}
.help{margin:0;font-size:12.5px;color:var(--muted);line-height:1.4}
.calc-v{font-size:13px;color:var(--muted)}
.calc-v b{color:var(--fg);font-weight:800}
.switch{position:relative;flex:none;width:52px;height:32px}
.switch input{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);opacity:0;margin:0;cursor:pointer;z-index:1}
.switch .knob{position:absolute;inset:0;border-radius:99px;background:var(--sep);transition:background .25s}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#F6F5EF;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .35s var(--spring)}
.switch input:checked+.knob{background:var(--accent)}
.switch input:checked+.knob::after{transform:translateX(20px)}
.switch input:focus-visible+.knob{outline:3px solid var(--focus);outline-offset:2px}
.sw-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.sw-row b{display:block;font-size:15px;font-weight:800;letter-spacing:-.01em}
.sw-row span{display:block;font-size:13px;color:var(--muted)}

/* listas */
.list{background:var(--card);box-shadow:inset 0 0 0 1px var(--card-line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:12px 16px;border:0;background:none;color:var(--fg);text-align:left;position:relative;transition:background .2s}
.row+.row{border-top:1px solid var(--sep)}
button.row:hover{background:var(--ctl)}
.row.on{background:var(--ctl)}
.row .main-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .main-t b{font-size:15.5px;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .main-t>span{font-size:13px;color:var(--muted);line-height:1.35}
.row .chev{color:var(--muted);width:18px;height:18px}
.row .end{display:flex;align-items:center;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.ini{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:900;letter-spacing:-.02em;background:var(--ctl);color:var(--fg);box-shadow:inset 0 0 0 3px var(--c,var(--sep))}
.ico{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--ctl)}
.ico.bad{background:var(--bad);color:var(--on-sem)}.ico.warn{background:var(--warn);color:var(--on-sem)}.ico.ok{background:var(--ok);color:var(--on-sem)}.ico.water{background:var(--water);color:var(--on-sem)}.ico.lime{background:var(--lime);color:var(--on-sem)}
.ico .i{width:18px;height:18px}
.flag{color:var(--bad)}

/* painel */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0;background:var(--card);box-shadow:inset 0 0 0 1px var(--card-line);color:var(--fg)}
.kpi .i{width:18px;height:18px;opacity:.8}
.kpi b{font-size:36px;font-weight:900;letter-spacing:-.05em;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b small{font-size:16px;letter-spacing:-.01em}
.kpi span{font-size:12.5px;line-height:1.3;color:var(--muted)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi b{font-size:30px}}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr)}}
.att-g{padding:12px 16px 4px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.att-g+.row{border-top:0}
.meter{display:grid;grid-template-columns:110px 1fr 28px;gap:10px;align-items:center;font-size:14px}
.meter span{display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter .bar{height:12px;border-radius:99px;background:var(--ctl);overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--fg))}
.meter b{text-align:right;font-variant-numeric:tabular-nums}

<div class="gate" id="gate" hidden></div>
<div class="shell">
  <aside class="side" id="side" aria-label="Navegação principal"></aside>
  <main class="main" id="main"></main>
</div>
<nav class="tabbar" id="tabs" aria-label="Seções do painel"></nav>
<div id="sheet"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ---------- animação da execução (boneco clássico) ---------- */
const XA = (() => {
  const f = n => (+n).toFixed(1), P = p => f(p[0]) + ',' + f(p[1]);
  const add = (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k], sub = (a, b) => [a[0] - b[0], a[1] - b[1]];
  const len = a => Math.hypot(a[0], a[1]), nrm = a => { const l = len(a) || 1; return [a[0] / l, a[1] / l]; };
  const R = d => d * Math.PI / 180, dir = a => [Math.sin(R(a)), Math.cos(R(a))], ang = v => Math.atan2(v[0], v[1]) * 180 / Math.PI;
  const lerp = (a, b, t) => a + (b - a) * t, mix = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
  const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
  // medidas do boneco (px): canela, coxa, quadril→ombro, braço, antebraço; chão em GY
  const LS = 76, LT = 76, LEG = LS + LT, LTOR = 92, LU = 52, LF = 46, GY = 392, AY = GY - 13, OFF = [-6, -2];
  let SFX = '', NOEQ = false; // sufixo dos ids de gradiente (várias animações na mesma página) · NOEQ: sem barra, halter ou anilha
  const INK = '#2E3933', FAR = '#B6BDB8', GHOST = '#E9ECE9', PROP = '#E2E6E3', PROP2 = '#C9D0CB', PLATE = '#A9B1AB', GRIP = '#5B665E', RED = '#FF4646';

  // 2 segmentos: raiz Rt, alvo T; a articulação do meio dobra para o lado de "pole"
  function ik(Rt, T, l1, l2, pole) {
    const d0 = sub(T, Rt), L = len(d0) || 1, u = [d0[0] / L, d0[1] / L], d = Math.min(L, (l1 + l2) * .999);
    const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    let n = [-u[1], u[0]]; if (n[0] * pole[0] + n[1] * pole[1] < 0) n = [-n[0], -n[1]];
    const M = add(add(Rt, u, a), n, h);
    return [M, add(M, nrm(sub(T, M)), l2)];
  }
  // tronco: tor = direção quadril→ombro (graus: 0 baixo, 90 direita, 180 cima, -90 esquerda); head = giro da cabeça
  function body(H, tor, head = 0) {
    const u = dir(tor), v = [-u[1], u[0]], hu = dir(tor + head), hv = [-hu[1], hu[0]], Nk = add(H, u, LTOR + 9);
    return { H, tor, u, v, S: add(add(H, u, LTOR), v, 2), Nk, hu, hv, Hd: add(add(Nk, hu, 25), hv, 2) };
  }
  const legTo = (H, A, pole, ft = 90) => { const [K, A2] = ik(H, A, LT, LS, pole); return { H, K, A: A2, ft }; };
  const legAng = (H, th, sh, ft) => { const K = add(H, dir(th), LT), A = add(K, dir(sh), LS); return { H, K, A, ft: ft == null ? sh + 90 : ft }; };
  const armTo = (S, W, pole, su = 1, sf = 1) => { const [E, W2] = ik(S, W, LU * su, LF * sf, pole); return { S, E, W: W2 }; };
  const armAng = (S, ua, fa, su = 1, sf = 1) => { const E = add(S, dir(ua), LU * su); return { S, E, W: add(E, dir(fa), LF * sf) }; };
  const far = p => add(p, OFF);
  // ponto da sola (x ao longo do pé, y para a sola) → posição do tornozelo
  // gira o ponto p em torno de c (graus, sentido horário na tela, como o rotate do SVG)
  const rotP = (p, c, deg) => { const r = R(deg), dx = p[0] - c[0], dy = p[1] - c[1]; return [c[0] + dx * Math.cos(r) - dy * Math.sin(r), c[1] + dx * Math.sin(r) + dy * Math.cos(r)]; };
  const ankleFrom = (pt, ft, x, y) => { const fd = dir(ft), n = [-fd[1], fd[0]]; return sub(sub(pt, [fd[0] * x, fd[1] * x]), [n[0] * y, n[1] * y]); };

  // ---------- desenho do boneco ----------
  function limb(A, B, r1, r2, bf = 0, bb = 0, pk = .42) {
    const d = nrm(sub(B, A)), n = [-d[1], d[0]], L = len(sub(B, A)), m = add(A, d, L * pk), rm = r1 + (r2 - r1) * pk;
    const a1 = add(A, n, r1), a2 = add(A, n, -r1), b1 = add(B, n, r2), b2 = add(B, n, -r2);
    return `M${P(a1)} Q${P(add(m, n, rm + 2 * bb))} ${P(b1)} A${f(r2)},${f(r2)} 0 0 0 ${P(b2)} Q${P(add(m, n, -(rm + 2 * bf)))} ${P(a2)} A${f(r1)},${f(r1)} 0 0 0 ${P(a1)} Z`;
  }
  function footPath(A, ftDeg) { // x = rumo dos dedos, y = lado da sola
    const fd = dir(ftDeg), n = [-fd[1], fd[0]], L = (x, y) => P(add(add(A, fd, x), n, y));
    return `M${L(-9, -3)} Q${L(-15, 2)} ${L(-14, 9)} Q${L(-13, 13)} ${L(-8, 13)} L${L(32, 13)} Q${L(38, 13)} ${L(37, 9)} Q${L(36, 5)} ${L(26, 3)} Q${L(12, -1)} ${L(6, -6)} Z`;
  }
  function man(B, flat, col) {
    const g = [], C = flat ? col : `url(#xaInk${SFX})`, FC = flat ? col : FAR;
    const st = fill => flat ? `fill="${fill}"` : `fill="${fill}" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" paint-order="stroke"`;
    const seg = (A, Bq, r1, r2, bf, bb, pk, c) => `<path d="${limb(A, Bq, r1, r2, bf, bb, pk)}" ${st(c)}/>`;
    const dot = (p, r, c) => flat ? '' : `<circle cx="${f(p[0])}" cy="${f(p[1])}" r="${r}" ${st(c)}/>`;
    const hand = (E, W, c) => { const h = add(W, nrm(sub(W, E)), 4); return `<circle cx="${f(h[0])}" cy="${f(h[1])}" r="6" ${st(c)}/>`; };
    const legD = (L, c, isFar) => seg(L.H, L.K, 14.5, 9.5, 3.5, 2.2, .42, c) + seg(L.K, L.A, 9.5, 6, 0, 3.4, .3, c) + `<path d="${footPath(L.A, L.ft)}" ${st(c)}/>` +
      (isFar ? dot(L.K, 6, FAR) : dot(L.H, 9, INK) + dot(L.K, 7.2, INK) + dot(L.A, 5.2, INK));
    const armD = (Ar, c, isFar) => seg(Ar.S, Ar.E, 8, 6.2, 1, 1.2, .42, c) + seg(Ar.E, Ar.W, 6.2, 4.6, .6, .8, .3, c) + hand(Ar.E, Ar.W, c) + (isFar ? '' : dot(Ar.S, 8.2, INK) + dot(Ar.E, 5.8, INK) + dot(Ar.W, 4.2, INK));
    g.push(armD(B.fA, FC, true), legD(B.fL, FC, true));
    const T = (a, b) => P(add(add(B.H, B.u, a), B.v, b));
    g.push(seg(add(B.H, B.u, LTOR - 6), add(B.Nk, B.hu, 8), 7.5, 7, 0, 0, .42, C));
    let hd = ''; for (let i = 0; i <= 36; i++) { const t = i / 36 * Math.PI * 2, e = [17.5 * Math.sin(t), -20.5 * Math.cos(t)]; hd += (i ? 'L' : 'M') + P(add(add(B.Hd, B.hv, e[0]), B.hu, -e[1])); }
    g.push(`<path d="${hd}Z" ${st(C)}/>`);
    if (!flat) g.push(`<path d="M${P(add(add(B.Hd, B.hv, 16.5), B.hu, 2))} l${f(B.hv[0] * 4 - B.hu[0] * 3)},${f(B.hv[1] * 4 - B.hu[1] * 3)}" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity=".7"/>`);
    g.push(`<path d="M${T(34, 14)} Q${T(30, 23)} ${T(10, 22)} Q${T(-10, 21)} ${T(-15, 6)} Q${T(-17, -12)} ${T(-6, -22)} Q${T(8, -27)} ${T(26, -21)} Q${T(38, -16)} ${T(34, 14)} Z" ${st(C)}/>`);
    g.push(`<path d="M${T(48, -15)} Q${T(46, 4)} ${T(50, 16)} Q${T(62, 27)} ${T(82, 24)} Q${T(100, 20)} ${T(101, 2)} Q${T(103, -16)} ${T(94, -21)} Q${T(74, -27)} ${T(56, -22)} Q${T(48, -20)} ${T(48, -15)} Z" ${st(C)}/>`);
    g.push(dot(add(add(B.H, B.u, 42), B.v, -1), 8, INK));
    g.push(legD(B.nL, C, false), armD(B.nA, C, false));
    return g.join('');
  }
  // boneco de frente: F = {cx, a (abdução do braço, graus), el (dobra do cotovelo)} ou F.W(s, ombro) = onde fica a mão;
  // F.seat = sentado (coxas vindo na direção de quem olha), F.kx = afastamento dos joelhos sentado
  function manFront(F, flat, col) {
    const C = flat ? col : `url(#xaInk${SFX})`, st = fill => flat ? `fill="${fill}"` : `fill="${fill}" stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" paint-order="stroke"`;
    const dot = (p, r) => flat ? '' : `<circle cx="${f(p[0])}" cy="${f(p[1])}" r="${r}" ${st(INK)}/>`, x = F.cx, g = [];
    const hipY = F.seat ? 300 : AY - LEG + 2, shY = hipY - 86, neckY = shY - 6, headC = [x, neckY - 26], kx = F.kx == null ? 20 : F.kx;
    let ank = null;
    for (const s of [-1, 1]) {
      const H = [x + s * 13, hipY], ab = F.abd && F.abd.s === s ? F.abd.a : 0;
      let K = F.seat ? [x + s * kx, hipY + 16] : [x + s * 15, hipY + LT], A = F.seat ? [x + s * (kx + 1), AY] : [x + s * 16, AY];
      if (ab) { const d = dir(s * ab); K = add(H, d, LT); A = add(K, d, AY - hipY - LT); ank = add(A, d, -10); }
      const sh = [[A[0] - 9, A[1] + 3], [A[0], A[1] - 6], [A[0] + 9, A[1] + 3], [A[0] + s * 4 + 8, A[1] + 13], [A[0] + s * 4 - 8, A[1] + 13]].map(p => ab ? rotP(p, A, -s * ab) : p);
      g.push(`<path d="${limb(H, K, 14, 9.5)}" ${st(C)}/><path d="${limb(K, A, 9.5, 6)}" ${st(C)}/><path d="M${P(sh[0])} Q${P(sh[1])} ${P(sh[2])} L${P(sh[3])} L${P(sh[4])} Z" ${st(C)}/>`);
      g.push(dot(H, 8.5), dot(K, 7), dot(A, 5));
    }
    g.push(`<path d="M${f(x - 25)},${f(hipY - 26)} Q${f(x)},${f(hipY - 32)} ${f(x + 25)},${f(hipY - 26)} Q${f(x + 30)},${f(hipY + 8)} ${f(x + 18)},${f(hipY + 14)} Q${f(x)},${f(hipY + 20)} ${f(x - 18)},${f(hipY + 14)} Q${f(x - 30)},${f(hipY + 8)} ${f(x - 25)},${f(hipY - 26)} Z" ${st(C)}/>`);
    g.push(`<path d="M${f(x - 21)},${f(shY + 50)} Q${f(x - 35)},${f(shY + 8)} ${f(x - 30)},${f(shY - 3)} Q${f(x)},${f(shY - 12)} ${f(x + 30)},${f(shY - 3)} Q${f(x + 35)},${f(shY + 8)} ${f(x + 21)},${f(shY + 50)} Q${f(x)},${f(shY + 58)} ${f(x - 21)},${f(shY + 50)} Z" ${st(C)}/>`);
    g.push(dot([x, shY + 60], 7.5));
    g.push(`<path d="${limb([x, shY + 2], [x, neckY - 8], 7.5, 7)}" ${st(C)}/><ellipse cx="${f(headC[0])}" cy="${f(headC[1])}" rx="17" ry="20.5" ${st(C)}/>`);
    const arms = [];
    for (const s of [-1, 1]) {
      const S = [x + s * 31, shY + 4]; let E, W;
      let T = F.W ? F.W(s, S) : null;
      if (T && T.a == null && F.lean) T = rotP(T, F.piv, -F.lean); // alvo dado na cena já inclinada
      if (T && T.a == null) { const k = Math.min(1, Math.max(.5, len(sub(T, S)) / ((LU + LF) * .96))); [E, W] = ik(S, T, LU * k, LF * k, [s, .7]); }
      else { const q = T || F; E = add(S, dir(s * q.a), LU); W = add(E, dir(s * (q.a + q.el)), LF); }
      g.push(`<path d="${limb(S, E, 8, 6.2)}" ${st(C)}/><path d="${limb(E, W, 6.2, 4.6)}" ${st(C)}/><circle cx="${f(add(W, nrm(sub(W, E)), 4)[0])}" cy="${f(add(W, nrm(sub(W, E)), 4)[1])}" r="6" ${st(C)}/>`);
      g.push(dot(S, 8.2), dot(E, 5.8), dot(W, 4.2)); arms.push(add(W, nrm(sub(W, E)), 6));
    }
    if (F.lean) { const R = p => p && rotP(p, F.piv, F.lean); return { svg: `<g transform="rotate(${f(F.lean)} ${P(F.piv)})">${g.join('')}</g>`, hands: arms.map(R), ank: R(ank), hipY, shY, kx, cx: x }; }
    return { svg: g.join(''), hands: arms, ank, hipY, shY, kx, cx: x };
  }

  // ---------- acessórios ----------
  const rect = (x, y, w, h, r = 4, c = PROP) => `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="${r}" fill="${c}"/>`;
  const bar = (a, b, w, c = PROP) => `<path d="M${P(a)} L${P(b)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
  const plate = (p, r = 34) => `<circle cx="${f(p[0])}" cy="${f(p[1])}" r="${r}" fill="${PROP}" stroke="${PROP2}" stroke-width="2"/><circle cx="${f(p[0])}" cy="${f(p[1])}" r="${f(r * .58)}" fill="none" stroke="${PROP2}" stroke-width="1.5"/><circle cx="${f(p[0])}" cy="${f(p[1])}" r="5" fill="${PLATE}"/>`;
  const plateRing = (p, r = 34) => `<circle cx="${f(p[0])}" cy="${f(p[1])}" r="${r}" fill="none" stroke="${PROP2}" stroke-width="2.2"/><circle cx="${f(p[0])}" cy="${f(p[1])}" r="5" fill="${GRIP}"/>`;
  const dbEnd = p => `<circle cx="${f(p[0])}" cy="${f(p[1])}" r="10" fill="${PLATE}" stroke="#FFFFFF" stroke-width="1.6"/><circle cx="${f(p[0])}" cy="${f(p[1])}" r="4" fill="${GRIP}"/>`;
  const dbSide = (p, axis = [1, 0]) => { const a = nrm(axis), n = [-a[1], a[0]], q = k => add(p, a, k);
    return `<path d="M${P(q(-15))} L${P(q(15))}" stroke="${GRIP}" stroke-width="4" stroke-linecap="round"/>` + [-15, 15].map(k => { const c = q(k); return `<path d="M${P(add(c, n, -10))} L${P(add(c, n, 10))}" stroke="${PLATE}" stroke-width="9" stroke-linecap="round"/>`; }).join(''); };
  const kettle = p => `<path d="M${f(p[0] - 8)},${f(p[1] + 3)} q8,-15 16,0" fill="none" stroke="${GRIP}" stroke-width="3.4"/><circle cx="${f(p[0])}" cy="${f(p[1] + 15)}" r="13" fill="${PLATE}" stroke="#FFFFFF" stroke-width="1.6"/>`;
  const cable = (a, b) => `<path d="M${P(a)} L${P(b)}" stroke="#8C958F" stroke-width="1.8"/>`;
  const pulley = p => `<circle cx="${f(p[0])}" cy="${f(p[1])}" r="7.5" fill="${PROP}" stroke="${PROP2}" stroke-width="2.4"/>`;
  const bench = (x1, x2, top) => rect(x1, top, x2 - x1, 12, 6, PROP2) + rect(x1 + 12, top + 10, 9, GY - top - 10, 2) + rect(x2 - 21, top + 10, 9, GY - top - 10, 2);

  // ---------- acessórios das máquinas ----------
  const CX = 158;
  const grip = (W, round) => round ? `<circle cx="${f(W[0])}" cy="${f(W[1])}" r="5.5" fill="${GRIP}"/>` : `<path d="M${f(W[0])},${f(W[1] - 9)} L${f(W[0])},${f(W[1] + 9)}" stroke="${GRIP}" stroke-width="6" stroke-linecap="round"/>`;
  const grips = F => F.hands.map(h => `<circle cx="${f(h[0])}" cy="${f(h[1])}" r="5.5" fill="${GRIP}"/>`).join('');
  const stack = () => rect(262, 64, 12, GY - 64, 3) + rect(274, 238, 26, 130, 3, PROP2) + [0, 1, 2, 3, 4, 5].map(i => rect(276, 242 + i * 20, 22, 16, 2, PLATE)).join('');
  const seatBack = b => rect(b.H[0] - 26, b.H[1] + 11, 70, 12, 6, PROP2) + bar(add(b.H, [-26, 4]), add(b.H, [-34, -102]), 17, PROP2) + rect(b.H[0] - 4, b.H[1] + 21, 10, GY - b.H[1] - 21, 2) + rect(b.H[0] - 40, GY - 8, 250, 8, 4);
  const seatFront = F => rect(CX - 36, F.shY - 52, 72, F.hipY - F.shY + 52, 14, PROP2) + rect(CX - 46, F.hipY + 4, 92, 14, 7, PROP2) + rect(CX - 6, F.hipY + 18, 12, GY - F.hipY - 18, 2) + rect(CX - 60, GY - 8, 120, 8, 4);
  const crossPose = (W0, W1, bulge) => t => ({ cx: CX, W: s => { const p = mix(W0(s), W1(s), t); return [p[0] + s * Math.sin(Math.PI * t) * bulge, p[1]]; } });
  const crossBack = (L, Rr) => F => rect(L[0] - 12, 58, 12, GY - 58, 3) + rect(Rr[0], 58, 12, GY - 58, 3) + pulley(L) + pulley(Rr) + cable(L, F.hands[0]) + cable(Rr, F.hands[1]);

  // ---------- exercícios (vista lateral, olhando para a direita) ----------
  // pose(t): t=0 posição inicial, t=1 fim do movimento. ord 'down' = começa descendo (pausa embaixo);
  // ord 'up' = começa fazendo força (pausa na contração). verbs = [ida, volta].
  const FWD = [1, 0], UP = [0, -1], DOWN = [0, 1], BACK = [-1, 0];
  // braço por posições-chave relativas ao ombro (cotovelo E e mão W no início e no fim)
  const armKF = (S, E0, W0, E1, W1, t) => ({ S, E: add(S, mix(E0, E1, t)), W: add(S, mix(W0, W1, t)) });
  const kf2 = (b, E0, W0, E1, W1, t) => [armKF(b.S, E0, W0, E1, W1, t), armKF(far(b.S), E0, W0, E1, W1, t)];
  const mk = (b, nL, fL, nA, fA) => Object.assign(b, { nL, fL: fL || nL, nA, fA: fA || nA });
  const EX = {
    // agachamento com barra nas costas: barra sempre sobre o meio do pé
    agach: { ord: 'down', verbs: ['Desce', 'Sobe'], eq: 'Barra', mus: [['quads', 'glutes'], ['hams', 'lowback']],
      pose: t => {
        const A = [150, AY], mid = A[0] + 10, lean = lerp(3, 40, t), u = dir(180 - lean), v = [-u[1], u[0]];
        const hx = mid - (u[0] * (LTOR + 4) - v[0] * 13), hy = lerp(230, 327, t), b = body([hx, hy], 180 - lean, lerp(0, 24, t));
        const barP = add(add(b.H, u, LTOR + 4), v, -13), W = add(barP, v, 3), E = add(add(barP, u, -34), v, -10);
        b.bar = barP;
        const arm = S => ({ S, E: add(E, sub(S, b.S)), W: add(W, sub(S, b.S)) });
        return mk(b, legTo(b.H, A, FWD), legTo(far(b.H), far(A), FWD), arm(b.S), arm(far(b.S)));
      },
      back: b => plate(b.bar, 34), front: b => `<circle cx="${f(b.bar[0])}" cy="${f(b.bar[1])}" r="5" fill="${GRIP}"/>`, mov: b => b.H },
    // goblet: peso junto ao peito, tronco mais em pé
    goblet: { ord: 'down', verbs: ['Desce', 'Sobe'], eq: 'Kettlebell', mus: [['quads', 'glutes'], ['hams', 'abs']],
      pose: t => {
        const A = [150, AY], lean = lerp(3, 24, t), u = dir(180 - lean), v = [-u[1], u[0]];
        const hb = 162 - (u[0] * (LTOR - 26) + v[0] * 28), hx = lerp(158, hb, t), hy = lerp(230, 330, t), b = body([hx, hy], 180 - lean, lerp(0, 10, t));
        const W = add(add(b.H, u, LTOR - 24), v, 26); b.kb = W;

/* ---------- armazenamento: banco do artefato ou, sem ele, este navegador ---------- */
/* ---------- banco online (Firebase) ----------
   Só no site (pasta /personal): a página carrega o SDK e define window.SIMPLIFICANDO_FIREBASE.
   Publicado no Claude, o painel continua usando o banco do próprio painel. */
const FBP = (() => {
  const cfg = window.SIMPLIFICANDO_FIREBASE, fb = window.firebase;
  if(!cfg || !fb || typeof fb.initializeApp!=='function') return null;
  let app = null;
  try { app = fb.apps.find(x => x.name==='[DEFAULT]') || fb.initializeApp(cfg); } catch(e){ return null; }
  const auth = app.auth(), db = app.firestore();
  if(cfg.emulador){ auth.useEmulator('http://'+cfg.emulador+':9099'); db.useEmulator(cfg.emulador, 8080); }
  let sec = null;
  async function secAuth(){ // segunda conexão: cria e apaga contas de aluno sem derrubar o login do personal
    if(!sec){ sec = fb.initializeApp(cfg, 'contas-alunos'); if(cfg.emulador) sec.auth().useEmulator('http://'+cfg.emulador+':9099'); await sec.auth().setPersistence(fb.auth.Auth.Persistence.NONE); }
    return sec.auth();
  }
  // o aluno entra só com a senha de 6 números; por trás, ela vira uma conta de e-mail interna
  const mail = code => 'a'+code+'@alunos.'+cfg.projectId+'.firebaseapp.com', pass = code => 'simp-'+code;
  async function ownerUid(){ const d = await db.collection('sistema').doc('dono').get(); return d.exists ? (d.data()||{}).uid || null : null; }
  async function claim(uid){ await db.collection('sistema').doc('dono').set({ uid, criadoEm:new Date().toISOString() }); }
  const okMail = e => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(e||'').trim());
  // conta do aluno: o e-mail dele + o código de 6 números (assim o "esqueci o código" chega no e-mail dele).
  // Sem e-mail, ou se o e-mail já tem outra conta, fica a conta interna antiga (só o código).
  async function account(code, email){
    const A = await secAuth(), em = okMail(email) ? String(email).trim().toLowerCase() : '';
    let uid = null, used = '';
    if(em){
      try { uid = (await A.createUserWithEmailAndPassword(em, pass(code))).user.uid; used = em; }
      catch(e){ if(e && e.code==='auth/email-already-in-use'){ try { uid = (await A.signInWithEmailAndPassword(em, pass(code))).user.uid; used = em; } catch(e2){ uid = null; } } else if(!e || e.code!=='auth/invalid-email') throw e; }
    }
    if(!uid){ used = mail(code);
      try { uid = (await A.createUserWithEmailAndPassword(used, pass(code))).user.uid; }
      catch(e){ if(e && e.code==='auth/email-already-in-use') uid = (await A.signInWithEmailAndPassword(used, pass(code))).user.uid; else throw e; } }
    try { await A.signOut(); } catch(e){ /* nada a fazer */ }
    return { uid, mail:used };
  }
  // código novo na mesma conta (o aluno não perde o histórico)
  async function rePass(em, oldCode, newCode){ const A = await secAuth(), r = await A.signInWithEmailAndPassword(em, pass(oldCode)); await r.user.updatePassword(pass(newCode)); try { await A.signOut(); } catch(e){ /* nada */ } return r.user.uid; }
  async function dropAccount(code, em){ // a senha antiga para de funcionar
    if(!code) return;
    try { const A = await secAuth(); const r = await A.signInWithEmailAndPassword(em || mail(code), pass(code)); await r.user.delete(); await A.signOut(); } catch(e){ /* a conta já não existe */ }
  }
  // códigos que os alunos escolheram pelo e-mail de "esqueci o código"
  async function listCodigos(){ const q = await db.collection('codigos').get(); return q.docs.map(d => Object.assign({ uid:d.id }, d.data())); }
  async function dropCodigo(uid){ if(uid) try { await db.collection('codigos').doc(uid).delete(); } catch(e){ /* nada */ } }
  // treinos já enviados pelo app passam para a conta nova
  async function moveProg(from, to){ if(!from || !to || from===to) return; try { const d = await db.collection('progresso').doc(from).get(); if(d.exists){ await db.collection('progresso').doc(to).set(d.data()); await db.collection('progresso').doc(from).delete(); } } catch(e){ /* sem treinos ainda */ } }
  // o que o app do aluno lê: sem notas, saúde, avaliações ou valores
  function projection(id, a){
    const p = a.perfil || {}, pl = JSON.parse(JSON.stringify(a.plano || {}));
    pl.treinos = pl.treinos || {};
    Object.keys(pl.treinos).forEach(L => { const t = pl.treinos[L] || {}; t.nome = String(t.nome||'').trim() || String(t.foco||'').trim() || 'Treino '+L; t.ex = (t.ex||[]).map(e => { const x = Object.assign({}, e); x.cues = (x.cues||[]).filter(c => c && String(c).trim()); x.erro = x.erro || ''; delete x.sup; delete x.tec; delete x.cad; return x; }); });
    return { aid:id, ativo:!!(a.acesso && a.acesso.ativo), perfil:{ nome:p.nome||'', sexo:p.sexo||'', objetivo:p.objetivo||'', dias:p.dias||[] },
      metas:a.metas||{}, plano:pl, financeiro:{ pagoAte:(a.financeiro||{}).pagoAte||null }, ajustes:(a.ajustes||[]).filter(x => x && x.de && x.t && x.para), atualizadoEm:new Date().toISOString() };
  }
  async function publish(id, a){ if(a && a.uid) await db.collection('appAlunos').doc(a.uid).set(projection(id, a)); }
  async function unpublish(uid){ if(uid) try { await db.collection('appAlunos').doc(uid).delete(); } catch(e){ /* já apagado */ } }
  async function listPerfis(){ const q = await db.collection('perfis').get(); return q.docs.map(d => Object.assign({ uid:d.id }, d.data())); }
  async function getAutonomo(uid){ const d = await db.collection('autonomos').doc(uid).get(); if(!d.exists) return null; const x = d.data(); let v = null; try { v = JSON.parse(x.s||'null'); } catch(e){ v = null; } return { em:x.em||0, s:v }; }
  async function dropPerfil(uid){ if(uid) try { await db.collection('perfis').doc(uid).delete(); } catch(e){ /* sem resumo */ } }
  // o que cada aluno com personal fez no app (o app grava em progresso/{uid}; só o dono lê todos)
  async function listProgresso(){ const q = await db.collection('progresso').get(); return q.docs.map(d => { const x = d.data(); let v = null; try { v = JSON.parse(x.s||'null'); } catch(e){ v = null; } return { uid:d.id, aid:x.aid||'', em:x.em||0, d:v }; }); }
  async function dropProgresso(uid){ if(uid) try { await db.collection('progresso').doc(uid).delete(); } catch(e){ /* nada para apagar */ } }
  // estatísticas: sugestões da caixinha do app e modelo de story que cada um postou
  async function listCol(name){ const q = await db.collection(name).orderBy('em','desc').limit(1500).get(); return q.docs.map(d => Object.assign({ id:d.id }, d.data())); }
  async function setLida(id, v){ await db.collection('sugestoes').doc(id).update({ lida:!!v }); }
  async function dropDoc(col, id){ await db.collection(col).doc(id).delete(); }
  return { auth, db, fb, ownerUid, claim, account, rePass, dropAccount, listCodigos, dropCodigo, moveProg, okMail, publish, unpublish, listPerfis, dropPerfil, getAutonomo, listProgresso, dropProgresso, listCol, setLida, dropDoc };
})();

  function saveLocal(){ try { localStorage.setItem(LKEY, JSON.stringify(C)); return true; } catch(e){ return false; } }

    const got = new Set();

})();

function lineChart(pts,unit,dec){

  const x0 = Math.min(...xs), x1 = Math.max(...xs) === x0 ? x0+864e5 : Math.max(...xs);
  const X = t => L + (t-x0)/(x1-x0)*(W-L-R), Y = v => T + (1-(v-y0)/(y1-y0))*(H-T-B);
  const ticks = [y0+(y1-y0)*.15, (y0+y1)/2, y1-(y1-y0)*.15];
  let g = ticks.map(v => '<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text x="'+(L-6)+'" y="'+(Y(v)+3.5).toFixed(1)+'" text-anchor="end">'+fmtN(v,dec)+'</text>').join('');
  const path = pts.map((p,i) => (i?'L':'M')+X(xs[i]).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const area = path+' L'+X(xs[xs.length-1]).toFixed(1)+' '+(H-B)+' L'+X(xs[0]).toFixed(1)+' '+(H-B)+'Z';
  g += '<path class="area" d="'+area+'"/><path class="ln" d="'+path+'"/>';
  g += '<text x="'+L+'" y="'+(H-8)+'">'+fmtDm(pts[0].d)+'/'+pts[0].d.slice(2,4)+'</text><text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+fmtDm(pts[pts.length-1].d)+'/'+pts[pts.length-1].d.slice(2,4)+'</text>';
  g += pts.map((p,i) => '<g class="p"><circle class="hit" cx="'+X(xs[i]).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="12"/><circle class="pt'+(i===pts.length-1?' last':'')+'" cx="'+X(xs[i]).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="4.5"/><title>'+fmtD(p.d)+': '+fmtN(p.v,dec)+' '+unit+'</title></g>').join('');
  const lp = pts[pts.length-1], lx = X(xs[xs.length-1]), ly = Y(lp.v);
  g += '<text class="lab" x="'+(lx-8).toFixed(1)+'" y="'+(ly<T+16 ? ly+18 : ly-10).toFixed(1)+'" text-anchor="end">'+fmtN(lp.v,dec)+' '+unit+'</text>';
  return '<svg class="lchart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolução de '+fmtN(pts[0].v,dec)+' para '+fmtN(lp.v,dec)+' '+unit+'">'+g+'</svg>';
}

function cicloResumo(a){
  const pl = a.plano || {}, ini = isDate(pl.inicio) ? pl.inicio : '', pg = typeof progDe==='function' ? progDe(a) : null, d = (pg && pg.d) || {};

  const sem = ini ? Math.max(1, Math.round(diffDays(today(), ini)/7)) : 0;
  const seq = {}; H.forEach(x => (x.ex||[]).forEach(e => { const top = Math.max(0, ...(e.s||[]).map(z => +z[0]||0)); if(!top) return; (seq[e.n||e.id] = seq[e.n||e.id] || []).push(top); }));
  const sobe = Object.keys(seq).map(n => { const q = seq[n]; return { n, de:q[0], para:Math.max(...q), dif:Math.max(...q)-q[0] }; }).filter(x => x.dif>0).sort((x,y) => y.dif/y.de - x.dif/x.de).slice(0,3);

}

/* ---------- evolução: o que cada aluno fez no app ---------- */
const PG = { by:null, loading:false, err:'', at:0 };
async function loadProg(force){
  if(!pfOnline() || PG.loading || ((PG.by || PG.err) && !force && Date.now()-PG.at < 60e3)) return;
  PG.loading = true; PG.err = '';
  try { const L = DEMO.listProgresso(), by = {}; L.forEach(x => { if(x.aid && x.d && (!by[x.aid] || x.em>by[x.aid].em)) by[x.aid] = x; }); PG.by = by; PG.at = Date.now(); }
  catch(e){ PG.err = e && e.code==='permission-denied' ? 'regras' : 'rede'; PG.at = Date.now(); }
  PG.loading = false; if(ui.view==='painel' || (ui.view==='alunos' && ui.aluno && (ui.tab==='evolucao' || ui.tab==='acesso'))) render();
  clearTimeout(PG.tm); if(!PG.err && PG.by) PG.tm = setTimeout(() => { if(ui.view==='painel') loadProg(true); }, 90e3);
}
/* treino gravado no dia errado (ex.: começou na segunda e finalizou na terça): o personal muda o dia no painel */
function ajAplica(H, aj){
  if(!(aj||[]).length) return H;
  const out = H.map(h => { const x = aj.find(j => j.de===h.d && j.t===h.t); return x ? Object.assign({}, h, { d:x.para, _de:h.d }) : h; });
  return out.sort((x,y) => x.d<y.d ? -1 : x.d>y.d ? 1 : 0);
}
const progDe = a => { const pg = a._pg || (PG.by && PG.by[a._id]) || null; if(!pg || !pg.d || a._pg || !(a.ajustes||[]).length) return pg; return Object.assign({}, pg, { d:Object.assign({}, pg.d, { h:ajAplica(pg.d.h||[], a.ajustes) }) }); };
const semIni = k => addDays(k, -((parse(k).getDay()+6)%7)); // segunda-feira
const DSEM = ['dom','seg','ter','qua','qui','sex','sáb'], dSem = k => DSEM[parse(k).getDay()];
function semanaDe(a, ini){
  const pg = progDe(a), d = pg && pg.d; if(!d) return null;
  const fim = addDays(ini, 6), inW = k => k>=ini && k<=fim;
  const H = (d.h||[]).filter(h => inW(h.d)), Cd = (d.c||[]).filter(c => inW(c.d)), W = Object.keys(d.w||{}).filter(inW).map(k => +d.w[k]||0);
  return { H, C:Cd, cardio:Cd.reduce((t,c) => t+(+c.min||0), 0), agua:W.length ? Math.round(W.reduce((t,v) => t+v, 0)/W.length) : 0, gyms:[...new Set(H.map(h => h.gym).filter(Boolean))] };

/* histórico do aluno: compara com o que o personal pediu no plano (séries e aquecimento) e com a vez anterior */
function evHist(a, H){

      const top = S.length ? Math.max(...S.map(z => +z[0]||0)) : 0, ant = top ? anterior(x, e) : null, dif = ant ? Math.round((top-ant.kg)*10)/10 : null;
      const delta = dif==null ? '' : '<span class="ev3-dl '+(dif>0?'up':dif<0?'dn':'eq')+'" title="Comparado com '+fmtDm(ant.d)+'">'+(dif>0 ? '▲ +'+fmtN(dif)+' kg' : dif<0 ? '▼ '+fmtN(Math.abs(dif))+' kg' : '= carga')+'</span>';
      const chips = S.map((z,j) => '<span class="ev3-c"><small>S'+(j+1)+'</small>'+fmtN(z[0])+'<em>kg</em> × '+z[1]+'</span>').join('')+Array.from({length:Math.max(0, n-S.length)},(_,j) => '<span class="ev3-c miss"><small>S'+(S.length+j+1)+'</small>não fez</span>').join('');
      return '<div class="ev3-r" style="--g:'+(GRUPO_COR[(pe||{}).alvo]||'var(--sep)')+'"><div class="ev3-n"><b>'+grpSq((pe||{}).alvo)+esc(e.n||(pe||{}).nome||'Exercício')+'</b>'+(n ? '<small>'+S.length+' de '+n+' séries</small>' : '')+'</div>'+
        ((aq || delta) ? '<div class="ev3-m">'+aq+delta+'</div>' : '')+
        '<div class="ev3-cs">'+(chips || '<span class="ev3-c miss">Nenhuma série marcada</span>')+'</div>'+
        (((e.q||[]).length || e.c) ? '<span class="evo-c">'+(e.q||[]).map(q => '<i class="evo-q'+(/dor/i.test(q) ? ' bad' : '')+'">'+esc(q)+'</i>').join('')+(e.c ? '<span>'+esc(e.c)+'</span>' : '')+'</span>' : '')+'</div>';
    });

    falt.forEach(pe => { ped += +pe.s||0; if(pe.aq) aqP += (pe.aqW||[]).length || AQ_PAD.length; });
    const pc = ped ? Math.round(fez/ped*100) : 0;

    return '<details class="ev3-h"'+(ix===0 ? ' open' : '')+'><summary><span class="lt">'+esc(x.t)+'</span><span class="mt"><b>'+dSem(x.d)+', '+fmtDm(x.d)+(x.nm ? ' · '+esc(x.nm) : '')+'</b><small>'+(info || 'Treino '+esc(x.t))+'</small></span>'+
      (ped ? '<span class="ev3-pc'+(fez>=ped?' ok':'')+'" title="Séries feitas de quantas o plano pede"><b>'+fez+'/'+ped+'</b>séries</span>' : x.sets ? '<span class="ev3-pc"><b>'+x.sets+'</b>séries</span>' : '')+(x.note ? ic('msg') : '')+ic('chev','chev')+'</summary>'+
      (ped ? '<div class="ev3-bar"><i style="width:'+pc+'%"></i></div>' : '')+

      (a._pg ? '' : '<div class="btn-row ev3-mv">'+(x._de ? '<span class="foot">'+ic('cal')+'Dia mudado por você (era '+dSem(x._de)+', '+fmtDm(x._de)+')</span>' : '')+'<button type="button" class="btn small ghost" data-a="evMover" data-d="'+esc(x._de||x.d)+'" data-v="'+esc(x.d)+'" data-k="'+esc(x.t)+'">'+ic('cal')+'Mudar o dia</button></div>')+'</details>'; }).join('')+'</div>';
}
const evoSets = x => (x.s||[]).length ? x.s.map(z => fmtN(z[0])+' kg × '+z[1]).join(' · ') : 'Sem séries marcadas';

function libMigra(){
  if(!Store.loaded || Store.readOnly || !Object.keys(C.exercicios).length) return;
  const g = C.config.geral || (C.config.geral = clone(DEF_CFG)), feitos = (g.libMig||[]).slice(), nomes = []; let n = 0;
  Object.keys(LIB_MIG).forEach(k => { if(feitos.includes(k)) return; feitos.push(k);
    LIB_MIG[k].forEach(id => { const r = LIB_PRONTA.find(x => x[0]===id); if(!r) return; const e = C.exercicios[id];
      if(!e){ C.exercicios[id] = { nome:r[1], grupo:r[2], equipamento:r[3], cues:r[4].slice(0,3), erro:r[5], video:'', anim:r[6]||'' }; Store.save('exercicios', id, 0); n++; nomes.push(r[1]); }
      else if(e.anim==='none' || (LIB_REN[id] && e.nome===LIB_REN[id])){ if(e.anim==='none') e.anim = r[6]||''; if(LIB_REN[id] && e.nome===LIB_REN[id]){ e.nome = r[1]; e.cues = r[4].slice(0,3); e.erro = r[5]; } Store.save('exercicios', id, 0); n++; nomes.push(r[1]); } }); });
  // animação nova no lugar de outra: biblioteca e treinos dos alunos (uma vez só)
  Object.keys(ANIM_MIG).forEach(k => { if(feitos.includes(k)) return; feitos.push(k);
    Object.keys(ANIM_MIG[k]).forEach(id => { const [de, para] = ANIM_MIG[k][id], e = C.exercicios[id];
      if(e && (e.anim===de || !e.anim || e.anim==='none')){ e.anim = para; Store.save('exercicios', id, 0); n++; nomes.push(e.nome); }
      Object.keys(C.alunos).forEach(aid => { const pl = C.alunos[aid].plano; let mud = false;
        Object.values((pl && pl.treinos) || {}).forEach(t => (t.ex||[]).forEach(x => { if(x.exId===id && (x.anim===de || !x.anim)){ x.anim = para; mud = true; } }));
        if(mud) Store.save('alunos', aid, 0); }); }); });
  if(!feitos.includes('7nov-rir-ana-luisa')){ feitos.push('7nov-rir-ana-luisa');
    Object.keys(C.alunos).forEach(aid => { const a = C.alunos[aid]; if(!/ana\s+lu[ií]sa/i.test(String((a.perfil||{}).nome||''))) return; let m = 0; Object.values((a.plano||{}).treinos||{}).forEach(t => (t.ex||[]).forEach(e => { e.rir = '0-1'; m++; })); if(m){ Store.save('alunos', aid, 0); n++; nomes.push('RIR 0–1 nos treinos de '+a.perfil.nome); } }); }
  if(feitos.length!==(g.libMig||[]).length){ g.libMig = feitos; Store.save('config','geral',0); }
  if(n) toast(n>6 ? n+' exercícios entraram ou foram atualizados na biblioteca, com a nota do ranking.' : 'Biblioteca atualizada: '+nomes.join(', '));
}

evagar até esticar."],"Balançar o tronco.","roscahalter"],["ex-roscapolia","Rosca na polia","Bíceps","Polia",["Polia baixa, barra reta ou corda, cotovelos colados no corpo.","Suba até perto dos ombros.","Desça devagar até esticar os braços."],"Levar os cotovelos para a frente.","roscapolia"],["ex-scott","Rosca Scott","Bíceps","Barra",["Braços apoiados no banco Scott, axilas encostadas no apoio.","Suba a barra sem tirar os braços do apoio.","Desça devagar até quase esticar."],"Soltar o peso de uma vez na descida.","scott"],["ex-concentrada","Rosca concentrada","Bíceps","Halteres",["Sentado, cotovelo apoiado na parte de dentro da coxa.","Suba o halter em direção ao ombro.","Desça devagar até esticar."],"Mexer o ombro para ajudar.","none"],["ex-tricepsbarra","Tríceps na polia com barra","Tríceps","Polia",["Cotovelos colados ao tronco, barra reta ou V.","Estenda os braços até o fim.","Volte até 90° sem mexer os ombros."],"Inclinar o tronco sobre a barra.","tricepsbarra"],["ex-testa","Tríceps testa","Tríceps","Barra",["Deitado, barra acima do peito, braços esticados.","Dobre só os cotovelos, levando a barra em direção à testa.","Estenda de volta sem abrir os cotovelos."],"Mexer os braços junto, virando um supino.","testa"],["ex-coicetri","Tríceps coice com halter","Tríceps","Halteres",["Tronco inclinado com apoio no banco, braço colado ao corpo.","Estenda o cotovelo levando o halter para trás.","Volte até 90° sem mexer o braço."],"Balançar o braço inteiro.","coicetri"],["ex-paralelas","Mergulho nas paralelas","Tríceps","Peso do corpo",["Mãos nas barras, corpo levemente inclinado.","Desça até os cotovelos ficarem perto de 90°.","Empurre de volta até esticar os braços."],"Descer demais e forçar os ombros.","mergulho"],["ex-infra","Abdominal infra (elevação de pernas)","Abdômen","Peso do corpo",["Deitado, mãos ao lado do corpo ou sob o quadril.","Suba as pernas esticadas até apontarem para o teto.","Desça devagar, sem encostar os pés no chão e sem tirar a lombar do chão."], /* Ajustes: cada cartão minimiza tocando no título (fica guardado neste aparelho) */
const ajKey = t => String(t).replace(/<[^>]*>/g,'').trim();
function ajFold(html){
  const min = PREF.ajMin || [], keys = [];
  const out = html.split('<section class="card').map((part, i) => {
    if(i===0) return part;
    const m = part.match(/<span class="label">([\s\S]*?)<\/span>/); if(!m) return '<section class="card'+part;
    const k = ajKey(m[1]); if(!k) return '<section class="card'+part; keys.push(k);
    const fech = min.includes(k), head = '<button type="button" class="aj-h" data-a="ajMin" data-k="'+esc(k)+'" aria-expanded="'+!fech+'"><span class="label">'+m[1]+'</span>'+ic('chev','aj-chev')+'</button>';
    return '<section class="card aj-c'+(fech?' aj-min':'')+part.replace(m[0], head);
  }).join('');
  const todas = keys.length && keys.every(k => min.includes(k));
  return '<div class="btn-row aj-all"><button type="button" class="btn small ghost" data-a="ajAll" data-v="'+(todas?'abrir':'min')+'">'+ic(todas?'down':'up')+(todas?'Abrir todos':'Minimizar todos')+'</button></div>'+out;
}

/* ---------- contas do app (banco online) ----------
   Cada aluno com senha de 6 números ganha uma conta para entrar no app.
   Senha nova: a conta da senha antiga é apagada e outra é criada. */
let syncBusy = false, syncT = 0;
function syncSoon(){ if(!FBP) return; clearTimeout(syncT); syncT = setTimeout(syncAccounts, 500); }
async function syncAccounts(){
  if(syncBusy || !FBP || Store.kind!=='firebase' || !Store.loaded) return;
  syncBusy = true;
  try {
    // 1. o aluno escolheu um código novo pelo e-mail: o painel passa a mostrar esse código
    try {
      (await FBP.listCodigos()).forEach(x => {
        const id = Object.keys(C.alunos).find(k => C.alunos[k] && C.alunos[k].uid===x.uid); if(!id || !/^\d{6}$/.test(String(x.codigo||''))) return;
        const a = C.alunos[id], ac = a.acesso || (a.acesso = { ativo:true });
        if(+x.em <= (+ac.em || 0) || (ac.codigo===x.codigo && a.acessoCod===x.codigo)) return;
        a.acesso = Object.assign(ac, { codigo:x.codigo, geradoEm:today(), em:+x.em, peloAluno:today() }); a.acessoCod = x.codigo; Store.save('alunos', id, 0);
        toast(curto(Object.assign({_id:id}, a))+' escolheu um código novo: '+x.codigo);
        if(ui.aluno===id) scheduleRender(true);
      });
    } catch(e){ /* regras antigas ou sem internet: tenta na próxima */ }
    // 2. contas do app: criar, trocar o código ou passar a conta antiga para o e-mail do aluno
    for(const id of Object.keys(C.alunos)){
      const a = C.alunos[id], code = a && a.acesso && a.acesso.codigo; if(!a || !code) continue;
      const em = FBP.okMail(P(a).email) ? String(P(a).email).trim().toLowerCase() : '';
      const velha = a.uid && em && (!a.acessoMail || /@alunos\./.test(a.acessoMail)) && a.acessoTentou!==em; // conta interna e o aluno agora tem e-mail
      if(a.uid && a.acessoCod===code && !velha) continue;
      try {
        if(a.uid && a.acessoCod!==code && a.acessoMail && !/@alunos\./.test(a.acessoMail)){
          // conta com e-mail: só troca a senha (o histórico continua)
          try { await FBP.rePass(a.acessoMail, a.acessoCod, code); if(C.alunos[id]){ C.alunos[id].acessoCod = code; Store.save('alunos', id, 0); } if(ui.aluno===id && ui.tab==='acesso') scheduleRender(true); continue; }
          catch(e){ /* não deu para entrar com o código antigo: recria a conta abaixo */ }
        }
        const oldUid = a.uid, oldCode = a.acessoCod, oldMail = a.acessoMail;
        if(oldUid && oldCode!==code){ await FBP.unpublish(oldUid); await FBP.dropAccount(oldCode, oldMail); }
        const r = await FBP.account(code, em); if(!C.alunos[id]) continue;
        const c2 = C.alunos[id];
        if(em) c2.acessoTentou = em;
        if(velha && r.uid===oldUid){ c2.acessoMail = r.mail; Store.save('alunos', id, 0); continue; } // o e-mail já tinha outra conta: segue com o código
        c2.uid = r.uid; c2.acessoCod = code; c2.acessoMail = r.mail; Store.save('alunos', id, 0);
        if(oldUid && oldUid!==r.uid){ if(oldCode===code){ await FBP.unpublish(oldUid); await FBP.dropAccount(oldCode, oldMail); } await FBP.moveProg(oldUid, r.uid); FBP.dropPerfil(oldUid); FBP.dropCodigo(oldUid); }
        if(ui.aluno===id && ui.tab==='acesso') scheduleRender(true);
      } catch(e){ toast('Não deu para liberar o app de '+curto(Object.assign({_id:id}, a))+'. Confira a internet.'); }
    }
  } finally { syncBusy = false; }
}

/* ---------- validação ---------- */
function validate(el){
  const v = el.dataset.v, val = el.value.trim(); let msg = '';
  if(v==='req' && !val) msg = 'Preencha este campo.';
  else if(v==='emailreq' && !val) msg = 'Digite o e-mail do aluno.';
  else if((v==='email'||v==='emailreq') && val && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(val)) msg = 'Confira o e-mail: falta o @ ou o domínio.';
  else if(v==='tel' && val){ const d = val.replace(/\D/g,''); if(d.length<10 || d.length>13) msg = 'Use DDD e número, como (11) 98765-4321.'; }
  else if(v==='url' && val && !/^https?:\/\/\S+\.\S+/.test(val)) msg = 'O link precisa começar com https://';
  else if(v==='date' && val && !isDate(val)) msg = 'Data inválida.';
  else if(v==='month' && val && !/^\d{4}-\d{2}$/.test(val)) msg = 'Use o formato aaaa-mm.';
  else if(v==='range' && val){ const n = num(val), mn = el.dataset.min, mx = el.dataset.max; if(n==null) msg = 'Digite só números.'; else if(mn!=null && n<+mn || mx!=null && n>+mx) msg = 'Use um valor entre '+fmtN(mn)+' e '+fmtN(mx)+'.'; }
  el.setAttribute('aria-invalid', msg ? 'true' : 'false');
  const e = document.getElementById(el.id+'-err'); if(e) e.textContent = msg;
  return !msg;
}
function coerce(el){ const t = el.dataset.t, raw = el.type==='checkbox' ? el.checked : el.value; if(t==='b') return el.type==='checkbox' ? raw : raw==='true'; if(t==='n'){ return num(raw); } if(t==='i'){ const n = num(raw); return n==null ? null : Math.round(n); } return raw; }

function importaAlunos(txt){
  let j = null; try { j = JSON.parse(txt); } catch(e){ /* tratado abaixo */ }
  if(!j || j.tipo!=='simplificando-alunos' || !Array.isArray(j.alunos)){ toast('Esse arquivo não é um arquivo de alunos do Simplificando.'); return; }
  if(Store.readOnly){ toast('O painel está em modo somente leitura.'); return; }

  j.alunos.forEach(x => {
    const p = x.perfil || {}, nome = String(p.nome||'').trim(), em = String(p.email||'').trim().toLowerCase(); if(!nome) return;
    const dup = alunos().find(a => semAc(P(a).nome||'')===semAc(nome) || (em && String(P(a).email||'').toLowerCase()===em));
    if(dup){ const st = P(dup).status||'ativo'; ja.push(nome.split(' ')[0]+(semAc(P(dup).nome||'')!==semAc(nome) ? ' (mesmo e-mail de '+nomeDe(dup)+')' : '')+(st==='inativo' ? ' (arquivada: veja no filtro Status: Inativo)' : st==='pausado' ? ' (pausada)' : '')); return; }

    if(+p.peso) a.perfil.peso = +p.peso;
    const pl = x.plano || {};
    Object.assign(a.plano, { nome:pl.nome||'', objetivoCiclo:pl.objetivoCiclo||'', inicio:t, semanas:+pl.semanas||a.plano.semanas, frequencia:+pl.frequencia||a.plano.frequencia, deload:false, treinos:{} });
    Object.keys(pl.treinos||{}).filter(L => LETRAS.includes(L)).slice(0,5).forEach(L => { const tr = pl.treinos[L] || {}; a.plano.treinos[L] = { nome:tr.nome||'', foco:tr.foco||'', min:+tr.min||0, ex:(tr.ex||[]).map(impEx) }; });
    const m = x.metas || {}; ['waterGoal','cardioGoal','semanaTreinos'].forEach(k => { if(m[k]!=null) a.metas[k] = +m[k]; });
    a.notas = (x.notas||[]).filter(n => n && n.texto).map(n => ({ id:String(n.id||uid('n')), data:t, texto:String(n.texto) }));
    const id = 'a-'+uid(); C.alunos[id] = a; Store.save('alunos', id, 0); last = id;
    ok.push(nome.split(' ')[0]+' (código '+a.acesso.codigo+')');
  });
  if(ok.length){ ui.view = 'alunos'; ui.aluno = ok.length===1 ? last : null; ui.tab = 'treino'; render(); window.scrollTo(0,0); }
  toast((ok.length ? 'Importados: '+ok.join(', ')+'.' : 'Ninguém novo para importar.')+(ja.length ? ' Já estavam no painel: '+ja.join(', ')+'.' : ''));
}

const IA_LOC = [['academia','Academia'],['halteres','Casa com halteres'],['corpo','Sem equipamento']];
const IA_EQ = { halteres:['Halteres','Peso do corpo','Banco/Step','Kettlebell'], corpo:['Peso do corpo','Banco/Step'] };

const IA_COMP = /agach|leg ?press|supino|remada|puxada|terra|stiff|desenv|barra fixa|hack|passada|bulgar|afundo|pelvica|mergulho|paralela|pendulo|militar|hiperext|step|flexao/;
const IA_TPL = {
  corpo1:['Corpo todo 1',['Quadríceps','Peito','Costas','Posterior','Ombro','Abdômen','Tríceps','Bíceps']],
  corpo2:['Corpo todo 2',['Glúteo','Costas','Peito','Quadríceps','Ombro','Abdômen','Bíceps','Tríceps']],
  corpo3:['Corpo todo 3',['Quadríceps','Costas','Peito','Glúteo','Ombro','Abdômen','Tríceps','Panturrilha']],
  inf:['Pernas e glúteo',['Quadríceps','Glúteo','Posterior','Quadríceps','Glúteo','Panturrilha','Abdômen','Posterior']],
  inf2:['Glúteo e posterior',['Glúteo','Posterior','Quadríceps','Glúteo','Posterior','Panturrilha','Abdômen','Quadríceps']],
  sup:['Superiores 1',['Peito','Costas','Ombro','Peito','Costas','Tríceps','Bíceps','Abdômen']],
  sup2:['Superiores 2',['Costas','Peito','Ombro','Costas','Ombro','Bíceps','Tríceps','Abdômen']],
  emp:['Peito, ombro e tríceps',['Peito','Peito','Ombro','Ombro','Tríceps','Peito','Tríceps','Abdômen']],
  pux:['Costas e bíceps',['Costas','Costas','Costas','Ombro','Bíceps','Bíceps','Abdômen','Costas']]

function iaSplit(n, nivel, legs){
  if(n<=1) return ['corpo1'];
  if(n===2) return ['corpo1','corpo2'];
  if(n===3) return nivel==='iniciante' ? ['corpo1','corpo2','corpo3'] : legs ? ['inf','sup','inf2'] : ['inf','emp','pux'];
  if(n===4) return ['inf','sup','inf2','sup2'];
  if(n===5) return legs ? ['inf','emp','inf2','pux','sup2'] : ['inf','emp','pux','inf2','sup2'];
  return ['inf','emp','pux'];
}
const iaHash = s => { let h = 2166136261; for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h>>>0)%1000)/1000; };

function iaPresc(comp, obj, nivel){
  const ini = nivel==='iniciante', ava = nivel==='avancado';
  if(obj==='emagrecer') return {s:3, r:comp?'12':'15', d:comp?60:45, rir:ini?3:2};
  if(obj==='corrida') return {s:ini?2:3, r:'10–12', d:60, rir:ini?3:2};
  return {s:ini||!comp?3:4, r:ini||!comp?'10–12':(ava?'6–10':'8–10'), d:comp?(ini?75:90):60, rir:ini?3:(comp?2:1)};
}
function iaDraft(A){

function iaPlan(q){
  const lib = Object.keys(C.exercicios).map(id => Object.assign({_id:id, exId:id}, C.exercicios[id])).filter(x => x.nome && x.grupo);
  const eqOk = x => !IA_EQ[q.local] || IA_EQ[q.local].includes(x.equipamento);
  const limOk = x => { const n = semAc(x.nome).toLowerCase(); return !q.lim.some(k => (IA_LIM.find(z => z[0]===k)||[])[2].test(n)); };
  const comp = x => IA_COMP.test(semAc(x.nome).toLowerCase());
  const pri = [...new Set(q.foco.flatMap(k => (IA_FOCO.find(z => z[0]===k)||[,,[]])[2]))];
  const split = iaSplit(q.n, q.nivel, q.foco.includes('pernas')), used = {}, out = {}, N = {30:4,45:5,60:6,75:7}[q.tempo] || 6;
  const pick = (g, want, ex) => {
    const c = lib.filter(x => x.grupo===g && eqOk(x) && limOk(x) && !ex.some(e => e.exId===x._id)); if(!c.length) return null;
    const key = x => { const r = rankIdx(x); return (r===99 ? 7 : r) + (want && (comp(x) ? 'c' : 'i')!==want ? 2.5 : 0) + (used[x._id]||0)*3 + iaHash(x._id+':'+q.seed)*(q.seed ? 1.6 : .3); };
    return c.sort((a,b) => key(a)-key(b))[0];
  };
  split.forEach((k, ti) => {
    const [nome, gs] = IA_TPL[k], body = k.indexOf('corpo')===0, slots = gs.slice(0, N);
    pri.forEach(g => {
      if((!body && !gs.includes(g)) || slots.filter(x => x===g).length>=2) return;
      let j = -1; for(let i=slots.length-1; i>0; i--) if(!pri.includes(slots[i])){ j = i; break; }
      if(j<0) return; slots.splice(j,1); slots.splice(Math.min(2, slots.length), 0, g);
    });
    const ex = [], seen = {};
    const add = (g, want) => { const x = pick(g, want, ex); if(!x) return false; used[x._id] = (used[x._id]||0)+1;
      const pr = iaPresc(comp(x), q.obj, q.nivel), e = Object.assign(exFromLib(x._id), {s:pr.s, r:pr.r, d:pr.d, rir:pr.rir});
      if(pri.includes(g) && !seen[g+'+'] && q.nivel!=='iniciante' && q.obj!=='corrida' && comp(x)){ e.s = Math.min(5, e.s+1); seen[g+'+'] = 1; }
      ex.push(e); return true; };
    slots.forEach(g => { const nth = seen[g] = (seen[g]||0)+1; add(g, ['Abdômen','Panturrilha','Bíceps','Tríceps'].includes(g) ? null : nth===1 ? 'c' : 'i'); });
    const extra = gs.slice(N).concat(pri, gs);
    for(let i=0; i<extra.length && ex.length<8 && (iaMin(ex)<q.tempo-9 || ex.length<4); i++) add(extra[i], 'i');
    for(let guard=0; iaMin(ex)>q.tempo+8 && guard<60; guard++){
      const i = ex.findIndex((e,j) => j>0 && e.s>3); if(i>0){ ex[i].s--; continue; }
      if(ex.length>4){ ex.pop(); continue; }
      const j = ex.findIndex(e => e.s>2); if(j>=0){ ex[j].s--; continue; } break;
    }
    if(ex[0] && q.obj!=='emagrecer') ex[0].aq = true;
    const gr = [...new Set(ex.map(e => e.alvo))].slice(0,3);
    out[LETRAS[ti]] = { nome, foco:gr.length>1 ? gr.slice(0,-1).join(', ')+' e '+gr[gr.length-1] : (gr[0]||''), min:iaMin(ex), ex };
  });
  return out;
}

/* ---------- montar o treino falando: ditado (reconhecimento de voz do navegador) que vira treinos e exercícios ---------- */
const VOZ_NUM = {um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,quatorze:14,catorze:14,quinze:15,dezesseis:16,dezessete:17,dezoito:18,dezenove:19,vinte:20,trinta:30,quarenta:40,cinquenta:50,sessenta:60,noventa:90,cem:100};
const vozSR = () => window.SpeechRecognition || window.webkitSpeechRecognition;
let VOZREC = null;
function vozNorm(t){
  let s = semAc(t).replace(/[“”"!?]/g,' ');
  s = s.replace(/\b(vinte|trinta|quarenta|cinquenta|sessenta)\s+e\s+(um|dois|tres|quatro|cinco|seis|sete|oito|nove)\b/g, (m,a,b) => String(VOZ_NUM[a]+VOZ_NUM[b]));

  s = s.replace(/\b(dois|duas|tres|quatro|cinco|seis|sete|oito|nove|dez|onze|doze|treze|quatorze|catorze|quinze|dezesseis|dezessete|dezoito|dezenove|vinte|trinta|quarenta|cinquenta|sessenta|noventa|cem)\b/g, m => String(VOZ_NUM[m]));

function vozAcha(nome){
  const W = t => semAc(t).replace(/[^a-z0-9 ]/g,' ').split(' ').filter(w => w.length>2 && !['com','para','the','dos','das','nos','nas'].includes(w));
  const q = W(nome); if(!q.length) return null;

  Object.keys(C.exercicios).forEach(id => { const e = C.exercicios[id]; if(!e || !e.nome) return; const w = W(e.nome); if(!w.length) return;
    const inter = q.filter(x => w.some(y => y===x || (x.length>4 && (y.startsWith(x.slice(0,5)) || x.startsWith(y.slice(0,5)))))).length;

function vozParse(txt){

(() => {

  const clear = () => { if(!P) return; clearTimeout(P.tm); cancelAnimationFrame(P.raf); if(P.box) P.box.classList.remove('sorting'); if(P.el) { P.el.classList.remove('dragging'); P.el.style.transform = ''; } P.items && P.items.forEach(x => { x.style.transform = ''; x.classList.remove('drag-sib'); }); document.body.classList.remove('is-dragging'); P = null; };

    if(e.button>0) return; const el = e.target.closest('[data-drag]'); if(!el || (el.dataset.drag==='ex' && isField(e.target))) return;
    const kind = el.dataset.drag, box = el.parentElement, items = [...box.querySelectorAll(':scope > [data-drag="'+kind+'"]')]; if(items.length<2) return;
    P = { el, kind, items, from:+el.dataset.i, to:+el.dataset.i, x0:e.clientX, y0:e.clientY, cx:e.clientX, cy:e.clientY, sy:window.scrollY, on:false, id:e.pointerId };
    P.tm = setTimeout(() => { if(!P) return; P.on = true;
      if(kind==='ex'){ box.classList.add('sorting'); const r = el.getBoundingClientRect(); window.scrollBy(0, (r.top + r.height/2) - P.cy); P.y0 = P.cy; } // recolhe tudo enquanto arrasta e deixa o cartão embaixo do dedo
      P.box = box; P.rects = items.map(x => x.getBoundingClientRect()); P.sy = window.scrollY; el.classList.add('dragging'); items.forEach(x => x !== el && x.classList.add('drag-sib')); document.body.classList.add('is-dragging'); P.raf = requestAnimationFrame(rolar); try { navigator.vibrate && navigator.vibrate(15); } catch(_){} }, 350);
  }, true);
  // posição do dedo na página (conta a rolagem) contra a borda de cada cartão: passou 40 px da borda do vizinho, troca
  const mover = () => {
    if(!P || !P.on) return; const hz = P.kind==='tl', R = P.rects, me = R[P.from];
    const sY = hz ? 0 : window.scrollY - P.sy, cx = hz ? P.cx : P.cy + sY, d = hz ? P.cx - P.x0 : P.cy - P.y0 + sY;
    let to = P.from;
    R.forEach((r,k) => { const a = hz ? r.left : r.top, z = hz ? r.right : r.bottom, m = Math.min(40, (z-a)/2);
      if(k>P.from && cx > a + m) to = Math.max(to,k); if(k<P.from && cx < z - m) to = Math.min(to,k); });
    P.to = to; P.el.style.transform = hz ? 'translateX('+d+'px) scale(1.06)' : 'translateY('+d+'px) scale(1.02)';
    const gap = hz ? me.width+8 : me.height+12;
    P.items.forEach((x,k) => { if(x===P.el) return; const sh = (k>P.from && k<=to) ? -gap : (k<P.from && k>=to) ? gap : 0; x.style.transform = sh ? (hz ? 'translateX('+sh+'px)' : 'translateY('+sh+'px)') : ''; });
  };
  const rolar = () => { if(!P || !P.on || P.kind==='tl') return; const y = P.cy, h = window.innerHeight, v = y < 90 ? -Math.ceil((90-y)/6) : y > h-110 ? Math.ceil((y-(h-110))/6) : 0; if(v){ window.scrollBy(0, v); mover(); } P.raf = requestAnimationFrame(rolar); };

    e.preventDefault(); mover();
  }, { passive:false });
  document.addEventListener('touchmove', e => { if(P && P.on) e.preventDefault(); }, { passive:false });
  const end = e => { if(!P) return; const was = P.on, kind = P.kind, from = P.from, to = P.to; clear();
    if(was){ blockClick = true; setTimeout(() => blockClick = false, 400); if(from!==to){ act(kind==='tl' ? 'dragTl' : 'dragEx', { from:String(from), to:String(to) }); render(); } } };
  document.addEventListener('pointerup', end, true); document.addEventListener('pointercancel', () => clear(), true);
  document.addEventListener('click', e => { if(blockClick){ e.preventDefault(); e.stopPropagation(); blockClick = false; } }, true);
  document.addEventListener('contextmenu', e => { if(e.target.closest && e.target.closest('[data-drag]') && !isField(e.target)) e.preventDefault(); });
