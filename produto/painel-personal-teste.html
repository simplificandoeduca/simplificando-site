      say(st.teste ? 'Usuário ou senha de teste incorretos.' : 'Digite um e-mail válido.'); return; }
    if(!okMail(u)){ say('Digite um e-mail válido.'); document.getElementById('g-u').focus(); return; }
    if(st.first){
      const p2 = document.getElementById('g-p2').value;
      if(p.length<6){ say('A senha precisa ter pelo menos 6 caracteres.'); return; }
      if(p!==p2){ say('As duas senhas não são iguais.'); return; }
    } else if(!p){ say('Digite sua senha.'); return; }
    st.busy = true; const go = g.querySelector('.gate-go'); go.disabled = true; say('Entrando…', true);
    try {
      await A.setPersistence(keep ? P_.LOCAL : P_.SESSION);
      let cred;
      if(st.first){ try { cred = await A.createUserWithEmailAndPassword(u, p); } catch(e){ if(e && e.code==='auth/email-already-in-use') cred = await A.signInWithEmailAndPassword(u, p); else throw e; } }
      else cred = await A.signInWithEmailAndPassword(u, p);
      await enter(cred.user, true);
    } catch(e){ say(msgOf(e)); document.getElementById('g-p') && document.getElementById('g-p').select(); }
    finally { st.busy = false; if(go.isConnected) go.disabled = false; }
  });
  document.addEventListener('click', ev => { const b = ev.target.closest('[data-gate-out]'); if(!b) return; A.signOut().finally(() => location.reload()); });
  return {
    start(){
      loading();
      within(FBP.ownerUid(), 10000).then(o => { st.first = !o; }).catch(e => { st.first = false; st.msg = msgOf(e); st.ok = false; }).finally(() => {
        const un = A.onAuthStateChanged(u => { un(); if(u) enter(u, false); else open(); });
      });
    },
    user(){ return A.currentUser ? A.currentUser.email || '' : ''; }
  };
}
const Gate = FBP ? gateFirebase() : (() => {
  const AK = 'simp-teste-auth', SK = 'simp-teste-sess';
  const g = document.getElementById('gate');
  const ls = { get:k => { try { return localStorage.getItem(k); } catch(e){ return null; } }, set:(k,v) => { try { localStorage.setItem(k,v); } catch(e){} }, del:k => { try { localStorage.removeItem(k); } catch(e){} } };
  const ss = { get:k => { try { return sessionStorage.getItem(k); } catch(e){ return null; } }, set:(k,v) => { try { sessionStorage.setItem(k,v); } catch(e){} }, del:k => { try { sessionStorage.removeItem(k); } catch(e){} } };
  const auth = () => { try { return JSON.parse(ls.get(AK)||'null'); } catch(e){ return null; } };
  const norm = u => String(u||'').trim().toLowerCase().replace(/\s+/g,' ');
  async function hash(txt){
    try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join(''); }
    catch(e){ let h = 5381; for(let i=0;i<txt.length;i++) h = (h*33 ^ txt.charCodeAt(i))>>>0; return 'f'+h.toString(16); }
  }
  const salt = () => Array.from({length:16},() => Math.floor(Math.random()*16).toString(16)).join('');
  let st = { show:false, arm:false };
  const eye = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const pw = (id,ph,ac) => `<div class="gate-f"><input id="${id}" type="${st.show?'text':'password'}" autocomplete="${ac}" placeholder="${ph}" required><button type="button" class="gate-eye" data-gate="eye" aria-label="${st.show?'Esconder senha':'Mostrar senha'}">${eye}</button></div>`;
  function view(){
    const a = auth(), first = !a;
    g.innerHTML = `<div class="gate-in"><span class="gate-logo">${logo()}</span>
      <p class="gate-eb">${first?'Primeiro acesso':'Painel do personal'}</p>
      <h1>${first?'Crie seu acesso':'Entrar'}<span class="dot" aria-hidden="true"></span></h1>
      <p class="gate-sub">${first?'Escolha um nome de usuário e uma senha. Você vai usar os dois para abrir o painel.':'Use o nome e a senha que você criou.'}</p>
      <div class="wave-strip" aria-hidden="true">${WAVE}</div>
      <form data-gate="form" novalidate>
        <label for="g-u">Nome de usuário<div class="gate-f"><input id="g-u" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Ex.: gama" required></div></label>
        <label for="g-p">Senha${pw('g-p', first?'Mínimo de 6 caracteres':'Sua senha', first?'new-password':'current-password')}</label>
        ${first?`<label for="g-p2">Confirme a senha${pw('g-p2','Repita a senha','new-password')}</label>`:''}
        <label class="gate-chk"><input type="checkbox" id="g-keep" checked>Continuar conectado neste aparelho</label>
        <p class="gate-err" id="g-err" aria-live="polite"></p>
        <button type="submit" class="gate-go">${first?'Criar acesso e entrar':'Entrar'}</button>
      </form>
      ${first?'':`<button type="button" class="gate-link" data-gate="forgot">Esqueci a senha</button><div id="g-reset"></div>`}
      <p class="gate-note">O acesso fica guardado neste aparelho. Em outro celular ou computador, você cria o acesso de novo.</p></div>`;
  }
  function open(){ g.hidden = false; document.body.style.overflow = 'hidden'; view(); setTimeout(() => { const u = document.getElementById('g-u'); if(u && matchMedia('(pointer:fine)').matches) u.focus(); }, 50); }
  function close(){ g.hidden = true; document.body.style.overflow = ''; g.innerHTML = ''; try { fitWave(); } catch(e){} }
  const isIn = () => ss.get(SK)==='1' || ls.get(SK)==='1';
  g.addEventListener('click', ev => {
    const b = ev.target.closest('[data-gate]'); if(!b) return;
    const k = b.getAttribute('data-gate');
    if(k==='eye'){ st.show = !st.show; g.querySelectorAll('.gate-f input[type="password"],.gate-f input[data-pw]').forEach(i => {}); g.querySelectorAll('#g-p,#g-p2').forEach(i => { i.type = st.show ? 'text' : 'password'; }); g.querySelectorAll('.gate-eye').forEach(e => e.setAttribute('aria-label', st.show?'Esconder senha':'Mostrar senha')); }
    if(k==='forgot'){ st.arm = false; document.getElementById('g-reset').innerHTML = `<div class="gate-reset"><span>A senha fica só neste aparelho, então não dá para recuperar. Você pode apagar o acesso e criar outro. Seus alunos e treinos <b>não</b> são apagados.</span><button type="button" data-gate="reset">Apagar acesso e criar outro</button></div>`; }
    if(k==='reset'){ if(!st.arm){ st.arm = true; b.classList.add('armed'); b.textContent = 'Toque de novo para confirmar'; } else { ls.del(AK); ls.del(SK); ss.del(SK); st.arm = false; view(); } }
  });
  g.addEventListener('submit', async ev => {
    ev.preventDefault();
    const a = auth(), first = !a, err = document.getElementById('g-err');
    const u = norm(document.getElementById('g-u').value), p = document.getElementById('g-p').value, keep = document.getElementById('g-keep').checked;
    if(!u){ err.textContent = 'Digite seu nome de usuário.'; document.getElementById('g-u').focus(); return; }
    if(first){
      const p2 = document.getElementById('g-p2').value;
      if(p.length<6){ err.textContent = 'A senha precisa ter pelo menos 6 caracteres.'; return; }
      if(p!==p2){ err.textContent = 'As duas senhas não são iguais.'; return; }
      const sa = salt(); ls.set(AK, JSON.stringify({u, s:sa, h:await hash(sa+':'+p)}));
    } else {
      const ok = u===a.u && (await hash(a.s+':'+p))===a.h;
      if(!ok){ err.textContent = 'Nome ou senha incorretos.'; document.getElementById('g-p').select(); return; }
    }
    ss.set(SK,'1'); if(keep) ls.set(SK,'1'); else ls.del(SK);
    close(); try { toast(first ? 'Acesso criado. Bem-vindo ao painel.' : 'Bem-vindo de volta.'); } catch(e){}
  });
  document.addEventListener('click', ev => { const b = ev.target.closest('[data-gate-out]'); if(!b) return; ls.del(SK); ss.del(SK); open(); });
  return { start(){ if(!isIn()) open(); }, user(){ const a = auth(); return a ? a.u : ''; } };
})();

/* ---------- partida ---------- */
readHash();
render();
Store.init();
})();
/* lista de resultados com barrinha de rolagem própria (sobe e desce, dá para arrastar) e janela que acompanha o teclado */
function pkSync(box){
  const L = box.querySelector('.pk-res'), bar = box.querySelector('.pk-bar'), th = bar && bar.firstElementChild; if(!L || !th) return;
  const over = L.scrollHeight - L.clientHeight; bar.hidden = over < 4; if(over < 4) return;
  const tr = bar.clientHeight, h = Math.max(36, tr * L.clientHeight / L.scrollHeight);
  th.style.height = h + 'px'; th.style.transform = 'translateY(' + ((tr - h) * L.scrollTop / over) + 'px)';
}
const pkAll = () => document.querySelectorAll('.pk-box').forEach(pkSync);
let pkDrag = null;
function pkMove(e){ const { bar, L } = pkDrag, r = bar.getBoundingClientRect(), h = bar.firstElementChild.offsetHeight, y = Math.min(1, Math.max(0, (e.clientY - r.top - h / 2) / Math.max(1, r.height - h))); L.scrollTop = y * (L.scrollHeight - L.clientHeight); }
document.addEventListener('scroll', e => { const b = e.target && e.target.closest && e.target.closest('.pk-box'); if(b) pkSync(b); }, true);
document.addEventListener('pointerdown', e => { const bar = e.target.closest && e.target.closest('.pk-bar'); if(!bar) return; e.preventDefault(); pkDrag = { bar, L:bar.closest('.pk-box').querySelector('.pk-res') }; bar.classList.add('on'); pkMove(e); try { bar.setPointerCapture(e.pointerId); } catch(x){ /* sem captura */ } });
document.addEventListener('pointermove', e => { if(pkDrag) pkMove(e); });
['pointerup','pointercancel'].forEach(k => document.addEventListener(k, () => { if(pkDrag){ pkDrag.bar.classList.remove('on'); pkDrag = null; } }));
window.addEventListener('resize', pkAll);
(function(){ // com o teclado aberto, a folha encolhe para caber na parte visível da tela
  const vv = window.visualViewport; if(!vv) return;
  let maxH = 0;
  const set = () => { const r = document.documentElement.style; r.setProperty('--vvh', vv.height + 'px'); r.setProperty('--vvt', vv.offsetTop + 'px'); pkAll();
    // barra de abas: fica no pé da parte visível da tela (no iPhone ela às vezes ficava parada no meio depois de rolar ou fechar o teclado)
    maxH = Math.max(maxH, vv.height); const ed = document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    document.documentElement.classList.toggle('kb', !!ed && vv.height < maxH - 120);
    const tb = document.getElementById('tabs'); if(tb) r.setProperty('--tbh', tb.offsetHeight + 'px'); };
  window.addEventListener('orientationchange', () => { maxH = 0; setTimeout(set, 300); });
  document.addEventListener('focusout', () => setTimeout(set, 250));
  vv.addEventListener('resize', set); vv.addEventListener('scroll', set); set();
})();
new MutationObserver(() => requestAnimationFrame(pkAll)).observe(document.body, { childList:true, subtree:true });
