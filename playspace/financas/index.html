<style>
/* Play Space Finanças: a cara do Play Space (o creme, o coral, as letras Poppins e Nunito, os cartões com a borda fininha) */
:root {
  color-scheme: light;
  --bg: #FAF3E9; --card: #FFFBF4; --ink: #3B3B3B; --ink-2: #6B655E; --ink-3: #A39B91; --line: rgba(59, 59, 59, .10); --soft: #F4EDE2; --menta: #EEF3EA;
  --brand: #E25B3F; --brand-2: #C9472D; --brand-bg: #F9D9D0; --ok: #3F8F5E; --ok-bg: #DDEFE3; --warn: #A86A0A; --warn-bg: #FBECC8; --bad: #B8402A; --bad-bg: #F9D9D0;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s0: #A39B91;
  --r: 20px; --sombra: 0 1px 2px rgba(59, 59, 59, .04), 0 16px 40px rgba(120, 80, 50, .08);
  --display: "Poppins", "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --texto: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--texto); -webkit-font-smoothing: antialiased; }
h1, h2, h3, .kpi .val, .marca b { font-family: var(--display); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- entrar ---------- */
.auth { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.auth-marca { background: linear-gradient(160deg, #C9D0FB 0%, #B3BCF6 55%, #A7B1F3 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 40px 24px; text-align: center; }
.auth-marca img { width: 132px; height: 132px; border-radius: 30px; box-shadow: 0 12px 30px rgba(40, 40, 90, .18); }
.auth-marca b { font-size: 44px; font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
.auth-marca span { color: #3D3F66; font-size: 17px; }
.auth-lado { display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
.auth-card { width: 100%; max-width: 440px; }
.auth-card h2 { margin: 0 0 6px; font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
.auth-card p.dica { margin: 0 0 18px; color: var(--ink-2); }
.lbl { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 14px 0 6px; }
.inp { width: 100%; height: 50px; border: 1px solid rgba(59, 59, 59, .16); border-radius: 14px; background: var(--card); padding: 0 14px; outline: none; transition: border-color .15s, box-shadow .15s; }
.inp:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(226, 91, 63, .16); }
.btn { height: 50px; border: 0; border-radius: 999px; padding: 0 22px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn-brand { background: var(--brand); color: #fff; box-shadow: 0 8px 22px rgba(226, 91, 63, .25); width: 100%; margin-top: 20px; }
.btn-brand:hover { background: var(--brand-2); }
.btn-brand[disabled] { opacity: .6; cursor: default; }
.btn-ghost { background: var(--soft); color: var(--ink); height: 40px; padding: 0 16px; font-weight: 600; border: 1px solid var(--line); }
.btn-ghost:hover { background: var(--menta); }
.link { background: none; border: 0; color: var(--brand); font-weight: 600; padding: 12px 0 0; display: block; margin: 0 auto; }
.erro { margin: 14px 0 0; padding: 12px 14px; border-radius: 14px; background: var(--bad-bg); color: var(--bad); font-size: 14px; }
.sep { margin: 22px 0 4px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; font-weight: 700; color: var(--ink-2); }

/* ---------- o app ---------- */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
.lateral { position: sticky; top: 0; height: 100vh; padding: 22px 16px; display: flex; flex-direction: column; gap: 4px; border-right: 1px solid var(--line); background: var(--bg); }
.marca { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.marca img { width: 40px; height: 40px; border-radius: 11px; }
.marca b { font-size: 16px; font-weight: 800; line-height: 1.15; }
.marca small { display: block; color: var(--ink-3); font-size: 12px; font-weight: 600; margin-top: 2px; }
.tag-g { font: 800 10px/1 var(--texto); letter-spacing: .08em; text-transform: uppercase; background: var(--brand-bg); color: var(--bad); border-radius: 999px; padding: 3px 7px; margin-right: 4px; }
.aba { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 14px; border: 0; border-radius: 14px; background: none; color: var(--ink-2); font-weight: 600; text-align: left; width: 100%; }
.aba:hover { background: var(--soft); }
.aba.ativa { background: var(--card); color: var(--ink); box-shadow: var(--sombra); border: 1px solid var(--line); }
.aba svg { width: 20px; height: 20px; flex: none; }
.aba .cont { margin-left: auto; font-size: 12px; background: var(--bad-bg); color: var(--bad); border-radius: 999px; padding: 1px 8px; }
.quem { margin-top: auto; padding: 12px 10px 0; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.quem b { color: var(--ink); display: block; }
.principal { padding: 26px 28px 60px; min-width: 0; }
.topo { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.topo h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
.topo .sub { color: var(--ink-3); font-size: 13px; }
.topo-d { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; } .btn-pdf { display: inline-flex; align-items: center; gap: 6px; } .btn-pdf svg { width: 16px; height: 16px; }
.chk { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-weight: 600; cursor: pointer; } .chk input { width: 18px; height: 18px; accent-color: var(--brand); }
textarea.inp { resize: vertical; min-height: 64px; font-family: inherit; }
@media (max-width: 640px) { .topo-d { align-items: flex-start; } }
.filtros { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-weight: 600; font-size: 14px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 8px; }
.chip:hover { border-color: rgba(59, 59, 59, .25); }
.chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.chip i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.datas { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); font-size: 14px; flex-wrap: wrap; }
.datas input { height: 36px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; background: var(--card); }
.grade { display: grid; gap: 14px; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 18px 16px; box-shadow: var(--sombra); min-width: 0; }
.kpi .rot { font-size: 13px; color: var(--ink-2); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.kpi .val { font-size: 27px; font-weight: 800; letter-spacing: -.02em; margin-top: 6px; line-height: 1.15; overflow-wrap: anywhere; }
.kpi .det { font-size: 13px; color: var(--ink-3); margin-top: 4px; }
.kpi.alerta .val { color: var(--bad); }
.cartao { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; box-shadow: var(--sombra); margin-top: 16px; min-width: 0; }
.cartao h2 { margin: 0 0 4px; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
.cartao .expl { margin: 0 0 14px; color: var(--ink-3); font-size: 13px; }
.cab-cartao { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.dois { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.dois > .cartao { margin-top: 16px; }
.rolar { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; padding: 0 4px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.v, th.v { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
td small { display: block; color: var(--ink-3); font-size: 12.5px; }
td.q { white-space: nowrap; } td.q small { white-space: normal; }
tfoot td { font-weight: 800; border-top: 1px solid var(--line); border-bottom: 0; }
/* 1.53: o filtro de produto e o produto a produto */
select.chip { appearance: none; -webkit-appearance: none; padding-right: 30px; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 16px) 15px, calc(100% - 11px) 15px; background-size: 5px 5px; background-repeat: no-repeat; max-width: 280px; cursor: pointer; font-family: inherit; }
select.chip.on { background-color: var(--ink); color: #fff; }
.aviso-prod { margin: 0 0 14px; padding: 10px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); color: var(--ink-2); font-size: 14px; } .aviso-prod .link { display: inline; padding: 0; margin-left: 4px; }
table.pap tr.tipo td { font-weight: 800; background: rgba(226, 91, 63, .06); } table.pap tr.tipo .link { font-weight: 800; color: var(--ink); padding: 0; }
table.pap .link.item { color: var(--ink); font-weight: 600; padding: 0; text-align: left; } table.pap .link.item:hover { color: var(--brand); text-decoration: underline; }
table.pap tr.zero td { color: var(--ink-3); } table.pap td:first-child { padding-left: 14px; text-align: left; } table.pap .link { margin: 0; text-align: left; } table.pap tr.tipo td:first-child { padding-left: 8px; }
.barra { height: 8px; border-radius: 999px; background: var(--soft); overflow: hidden; min-width: 60px; margin-top: 6px; }
.barra i { display: block; height: 100%; border-radius: 999px; background: var(--brand); }
.selo { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.selo.ruim { background: var(--bad-bg); color: var(--bad); } .selo.aviso { background: var(--warn-bg); color: var(--warn); } .selo.neutro { background: var(--soft); color: var(--ink-2); } .selo.bom { background: var(--ok-bg); color: var(--ok); }
.uni-dot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; vertical-align: 0; }
.vazio { padding: 28px 10px; text-align: center; color: var(--ink-3); }
.lista-acoes { display: flex; gap: 8px; flex-wrap: wrap; }
.carregando { opacity: .55; pointer-events: none; transition: opacity .2s; }
/* o gráfico do faturado por dia */
.legenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.legenda i { width: 10px; height: 10px; border-radius: 3px; }
.grafico { position: relative; }
.grafico svg { display: block; width: 100%; height: 240px; overflow: visible; }
.grafico .eixo { font-size: 11px; fill: var(--ink-3); }
.grafico .grade-l { stroke: var(--line); stroke-width: 1; }
.grafico .alvo { fill: transparent; }
.grafico .alvo:hover + g rect, .grafico g.on rect { opacity: .82; }
.dica-g { position: absolute; pointer-events: none; background: var(--ink); color: #fff; border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.5; min-width: 150px; box-shadow: 0 10px 30px rgba(0, 0, 0, .18); transform: translate(-50%, calc(-100% - 10px)); white-space: nowrap; z-index: 5; }
.dica-g b { display: block; margin-bottom: 2px; }
.dica-g i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
/* 2.0: a gestão financeira (os lançamentos do financeiro e o relatório) */
.btn.g-novo { width: auto; margin: 0; height: 40px; }
.g-mes { font-family: var(--display); font-size: 15px; min-width: 150px; text-align: center; }
input.chip.g-busca { width: 190px; padding: 0 14px; outline: none; } input.chip.g-busca:focus { border-color: var(--brand); }
table.g-lanc tr[data-gl] { cursor: pointer; } table.g-lanc tr[data-gl]:hover td, table.g-lanc tr[data-gl]:focus td { background: var(--soft); } table.g-lanc tr[data-gl]:focus { outline: none; }
table.g-lanc td:nth-child(2) { max-width: 260px; } table.g-lanc td small { font-size: 11px; }
.g-folha { max-width: 620px; } .g-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; } .g-c.g-larg { grid-column: 1 / -1; } .g-c .lbl { margin-top: 12px; } .g-c .lbl small { font-weight: 600; color: var(--ink-3); }
.g-folha .acoes { flex-wrap: wrap; align-items: center; } .g-folha .acoes .btn { height: 46px; margin: 0; white-space: nowrap; padding: 0 16px; } .g-tirar { color: var(--bad); margin-top: 14px; }
.g-imp table { font-size: 13.5px; } .g-arq { height: auto; padding: 12px; }
.g-barras { display: flex; flex-direction: column; gap: 8px; } .g-b { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13.5px; }
.g-bn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); } .g-bt { height: 10px; border-radius: 999px; background: var(--soft); overflow: hidden; } .g-bt i { display: block; height: 100%; border-radius: 999px; }
.g-bv { white-space: nowrap; font-weight: 700; } .g-bv small { color: var(--ink-3); font-weight: 600; margin-left: 4px; }
tr.g-dest td { background: rgba(226, 91, 63, .07); font-weight: 700; } td.g-neg { color: var(--bad); }
#g-graf svg { height: 260px; }
/* 2.1: o menu em grupos, a despesa (paga ou a pagar), o painel, os fornecedores e as planilhas */
.lateral { overflow-y: auto; } .aba { height: 42px; flex: none; }
.grupo-menu { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: 14px 14px 4px; flex: none; }
tr.g-dia td { background: var(--soft); padding: 7px 10px; font-size: 13px; } tr.g-dia td span { color: var(--ink-2); margin-left: 10px; font-weight: 600; }
td small.g-obs { margin-top: 2px; } td .sub { font-size: 12.5px; color: var(--ink-3); }
.g-cards { margin-bottom: 0; }
.g-seg2 { display: inline-flex; background: var(--soft); border-radius: 999px; padding: 3px; gap: 2px; } .g-seg2 button { border: 0; background: none; height: 36px; padding: 0 20px; border-radius: 999px; font-weight: 700; color: var(--ink-2); cursor: pointer; } .g-seg2 button.on { background: var(--card); color: var(--ink); box-shadow: var(--sombra); }
.btn.g-mini { height: 32px; padding: 0 12px; font-size: 13px; margin: 0; width: auto; }
.link.g-ir { margin: 0; padding: 4px 0; }
.g-resumo-conta { background: var(--soft); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; margin: 10px 0 4px; } .g-resumo-conta span { color: var(--ink-2); font-size: 14px; }
.g-ficha { max-width: 760px; } .g-infos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; margin-top: 14px; } .g-info span { display: block; font-size: 11.5px; color: var(--ink-3); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; } .g-info b { font-weight: 600; overflow-wrap: anywhere; }
.g-mini-kpi { grid-template-columns: 1fr 1fr; margin-top: 12px; } .g-mini-kpi .kpi { padding: 12px 14px; } .g-mini-kpi .val { font-size: 21px; }
#g-pdias svg { height: 200px; }
table.g-lanc tr[data-gpl], table.g-lanc tr[data-gfv], table.g-lanc tr[data-gfd], table.g-lanc tr[data-pll] { cursor: pointer; }
table.g-lanc tr[data-gpl]:hover td, table.g-lanc tr[data-gfv]:hover td, table.g-lanc tr[data-gfd]:hover td, table.g-lanc tr[data-pll]:hover td { background: var(--soft); }
.pl-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.pl-card { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--sombra); display: flex; flex-direction: column; gap: 6px; cursor: pointer; font: inherit; color: var(--ink); min-height: 170px; }
.pl-card:hover { border-color: var(--brand); } .pl-card b { font-size: 17px; } .pl-quando { margin-top: auto; font-size: 12px; }
.pl-ic { width: 40px; height: 40px; border-radius: 12px; background: var(--brand-bg); color: var(--brand); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; } .pl-ic svg { width: 22px; height: 22px; }
.pl-cols { display: flex; flex-wrap: wrap; gap: 4px; } .pl-cols i { font-style: normal; font-size: 12px; background: var(--soft); border-radius: 999px; padding: 2px 8px; color: var(--ink-2); }
.pl-mais { border-style: dashed; box-shadow: none; background: transparent; justify-content: center; }
.pl-vazio { text-align: center; } .pl-passos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 6px 0 20px; text-align: left; } .pl-passos div { background: var(--soft); border-radius: 16px; padding: 14px; font-size: 14px; line-height: 1.45; }
.pl-passos div > b:first-child { display: flex; width: 26px; height: 26px; border-radius: 50%; background: var(--brand); color: #fff; align-items: center; justify-content: center; margin-bottom: 8px; }
.pl-volta { margin: 0 0 8px; padding: 0; text-align: left; display: inline-block; }
.pl-prev .pl-tab { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
.pl-tipos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-bottom: 10px; } .pl-tipos span { display: block; font-size: 12.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 3px; } .pl-tipos .inp { height: 38px; font-size: 13.5px; padding: 0 10px; }
table.pl-mini { font-size: 12.5px; } table.pl-mini td, table.pl-mini th { padding: 6px 8px; white-space: nowrap; }
.pl-tab-dados th[data-plo] { cursor: pointer; user-select: none; } .pl-tab-dados th[data-plo]:hover { color: var(--ink); }
.pl-col { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto auto auto; gap: 8px; align-items: center; margin-bottom: 8px; } .pl-col .chk { margin: 0; font-size: 13px; white-space: nowrap; } .pl-col .chip { height: 36px; padding: 0 12px; }
.pl-kpis { margin-bottom: 0; }
.kpi.devido .val { color: var(--warn); }
.g-devido { font-weight: 800; color: var(--warn); } .g-devido.atraso { color: var(--bad); } .g-devido.zero { font-weight: 600; color: var(--ink-3); }
tr.g-dia.atraso td { background: var(--bad-bg); color: var(--bad); } tr.g-dia.atraso td span { color: var(--bad); }
.g-tog { border: 0; background: none; padding: 2px 0; cursor: pointer; display: inline-flex; vertical-align: middle; } .g-tog i { width: 40px; height: 24px; border-radius: 999px; background: rgba(59, 59, 59, .2); position: relative; display: block; transition: background .15s; }
.g-tog i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: left .15s; }
.g-tog.on i { background: var(--ok); } .g-tog.on i::after { left: 19px; } .g-tog.pergunta i { background: var(--warn); } .g-tog:focus-visible i { outline: 3px solid rgba(63, 143, 94, .35); outline-offset: 2px; }
td .g-tog + .selo { display: block; width: max-content; margin-top: 4px; } td.g-tog-td { white-space: nowrap; } td.g-tog-td .g-mini { margin-left: 8px; vertical-align: middle; }
.g-rec { display: inline-flex; align-items: center; gap: 6px; margin: 4px 0 0; font-size: 12px; font-weight: 700; color: #4B3BC4; white-space: nowrap; } .g-rec i { font-style: normal; background: #6250D6; color: #fff; border-radius: 6px; padding: 1px 7px; font-size: 11.5px; }

.g-switch input:checked + i { background: #6250D6; } .g-switch input:checked + i::after { left: 21px; } .g-switch input:focus-visible + i { outline: 3px solid rgba(98, 80, 214, .35); outline-offset: 2px; }

/* folhas (criar acesso, nova senha) */

/* 3.0 (Play Space 1.69): a tela se adapta à janela: a página sem a barra de rolagem (rola com a roda do mouse, o dedo ou o teclado); as caixinhas rolam por dentro, com uma barra fina, sem arrastar a tela de trás */

.urso-login { position: absolute; left: 10px; top: 0; width: 124px; height: 96px; margin-left: 0; z-index: 0; translate: 0 var(--sobe); transition: translate .7s var(--spring); pointer-events: none; }
.urso-login svg, .patas-login svg, .passarinho-login svg, .coelho-login svg { width: 100%; height: 100%; overflow: visible; }
.urso-login .olho { transform-box: fill-box; transform-origin: center; transform: translate(calc(var(--olhar-x) * 3px), var(--olhar-y)); transition: transform .35s var(--ios); }
.urso-login .palpebra { transform-box: fill-box; transform-origin: 50% 0; animation: urso-pisca 4.6s ease-in-out infinite; }
.urso-login .palpebra.d { animation-delay: .02s; }
.palco.pisca .palpebra { animation: urso-pisca-ja .45s ease-in-out .55s both; }
@keyframes urso-pisca { 0%, 91%, 100% { transform: scaleY(0); } 94%, 96% { transform: scaleY(1); } }
@keyframes urso-pisca-ja { 0%, 100% { transform: scaleY(0); } 40%, 60% { transform: scaleY(1); } }
.patas-login { position: absolute; left: 10px; top: 0; width: 124px; height: 30px; margin-left: 0; z-index: 2; translate: 0 -12px; transition: translate .7s var(--spring); pointer-events: none; }
.patas-login .pata { transform-box: fill-box; transform-origin: 50% 50%; transition: transform .55s var(--spring); }
.palco[data-olha="senha"] .patas-login { translate: 0 calc(var(--sobe) + 38px); }   /* as patinhas sobem e tapam os olhos */
.palco[data-olha="senha"] .pata.e { transform: translateX(14px); }
.palco[data-olha="senha"] .pata.d { transform: translateX(-14px); animation: espiadinha 5s ease-in-out 1.2s infinite; }
@keyframes espiadinha { 0%, 78%, 100% { transform: translateX(-14px); } 84%, 93% { transform: translate(-9px, 12px) rotate(10deg); } }
.palco[data-olha="senha"] .olho { transform: translate(calc(var(--olhar-x) * 2px), 4px); }
.palco.feliz .patas-login { translate: 0 calc(var(--sobe) + 52px); }   /* bracinhos para cima, ao lado da cabeça */
.palco.feliz .pata.e { transform: translate(-18px, -8px) rotate(-30deg); } .palco.feliz .pata.d { transform: translate(18px, -8px) rotate(30deg); animation: none; }
.palco.feliz .urso-login { animation: urso-pula .6s var(--spring); }
.palco.nao .urso-login, .palco.nao .patas-login { animation: nega .65s ease-in-out; }
@keyframes nega { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
@keyframes urso-pula { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-14px) scale(1.04); } }
.passarinho-login { position: absolute; right: 22px; top: -27px; width: 46px; height: 34px; z-index: 2; transform-origin: 50% 100%; transform: scaleX(-1); transition: transform .5s var(--spring); animation: passaro-vida 14s ease-in-out infinite; pointer-events: none; }
.palco.digitando .passarinho-login { transform: scaleX(-1) rotate(18deg); animation: none; }
/* a vida do passarinho (14 s, no mesmo relógio do coelhinho): pula pela borda, bica o cartão, olha para o outro lado, volta;
   quando o coelhinho aparece (70%), toma um susto e fica olhando para ele até sumir */
@keyframes passaro-vida {
  0%, 6% { transform: translate(0, 0) scaleX(-1) rotate(0); }
  9% { transform: translate(-7px, -9px) scaleX(-1) rotate(-6deg); } 12% { transform: translate(-14px, 0) scaleX(-1) rotate(0); }
  15% { transform: translate(-21px, -9px) scaleX(-1) rotate(-6deg); } 18% { transform: translate(-28px, 0) scaleX(-1) rotate(0); }
  21% { transform: translate(-28px, 0) scaleX(-1) rotate(30deg); } 23% { transform: translate(-28px, 0) scaleX(-1) rotate(4deg); }
  25% { transform: translate(-28px, 0) scaleX(-1) rotate(30deg); } 27%, 32% { transform: translate(-28px, 0) scaleX(-1) rotate(0); }
  34%, 44% { transform: translate(-28px, 0) scaleX(1) rotate(0); }
  46%, 50% { transform: translate(-28px, 0) scaleX(-1) rotate(0); }
  53% { transform: translate(-14px, -9px) scaleX(-1) rotate(-6deg); } 56%, 69% { transform: translate(0, 0) scaleX(-1) rotate(0); }
  71% { transform: translate(0, -12px) scaleX(-1) rotate(-14deg); } 73% { transform: translate(0, 0) scaleX(-1) rotate(0); }
  76%, 86% { transform: translate(0, 0) scaleX(-1) rotate(26deg); }
  89%, 100% { transform: translate(0, 0) scaleX(-1) rotate(0); }
}
.passarinho-login.pula { animation: pulinho .4s var(--spring); }
@keyframes pulinho { 0%, 100% { translate: 0 0; } 45% { translate: 0 -8px; } }
.coelho-login { position: absolute; left: 0; bottom: 64px; width: 46px; height: 60px; z-index: 0; translate: 10px 0; animation: coelho-espia 14s ease-in-out infinite; pointer-events: none; }
@keyframes coelho-espia { 0%, 64%, 100% { translate: 10px 0; } 70%, 86% { translate: -30px 0; } 74% { translate: -30px 0 rotate(0); } 78% { translate: -32px -3px; } }
.palco.feliz .passarinho-login { animation: passaro-festa .5s var(--spring) 2; }
@keyframes passaro-festa { 0%, 100% { transform: translate(0, 0) scaleX(-1); } 50% { transform: translate(0, -16px) scaleX(-1) rotate(-12deg); } }

/* 4.5 (1.94): o menu do lado como o vídeo "Glassy Sidebar" do dono: tocar na logo abre a barra escura num painel por cima da tela, com os
   nomes e os grupos entrando um depois do outro; o círculo claro do item aberto vira uma pílula e uma luz desliza atrás do item sob o mouse */
@keyframes rail-larga { from { width: 76px; } }
@keyframes rail-nome { from { opacity: 0; transform: translateX(-8px); filter: blur(4px); } }
@keyframes rail-fundo { from { opacity: 0; } }
@media (min-width: 821px) {
  .lateral .marca { cursor: pointer; border-radius: 16px; }
  .lateral .marca:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
  .lateral.aberta { z-index: 45; width: 260px; align-items: stretch; padding-left: 12px; padding-right: 12px; animation: rail-larga .34s cubic-bezier(.32, .72, 0, 1) both; }

/* o gráfico: barras empilhadas por unidade (cores fixas por unidade), com a dica ao passar o mouse e a tabela logo abaixo */
function serieGrafico() {
  const porMes = D.dias > 62, chave = d => porMes ? d.slice(0, 7) : d, us = (UNI === 'todas' ? unisComDados() : [+UNI]), M = new Map();

  for (let d = new Date(ini); d <= fim; d.setDate(d.getDate() + 1)) { const k = chave(iso(d)); if (!M.has(k)) M.set(k, {}); }
  for (const x of D.porDia) { if (!us.includes(x.u)) continue; const k = chave(x.d); if (!M.has(k)) M.set(k, {}); const o = M.get(k); o[x.u] = (o[x.u] || 0) + x.v; }
  return { us, porMes, L: [...M.entries()].map(([k, o]) => ({ k, o, t: us.reduce((t, u) => t + (o[u] || 0), 0) })) };
}
function rotX(k, porMes) { if (porMes) { const [a, m] = k.split('-'); return ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'][+m - 1] + '/' + a.slice(2); } return k.slice(8, 10) + '/' + k.slice(5, 7); }

  const passo = (() => { const bruto = max / 4, p10 = Math.pow(10, Math.floor(Math.log10(bruto))); return [1, 2, 2.5, 5, 10].map(m => m * p10).find(m => m >= bruto) || bruto; })(), topo = Math.ceil(max / passo) * passo, y = v => pt + (H - pt - pb) * (1 - v / topo);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Faturado por ${porMes ? 'mês' : 'dia'}">`;

  const cada = Math.ceil(L.length / Math.max(1, Math.floor((W - pl) / 52)));

    s += `<rect class="alvo" data-i="${i}" x="${pl + cw * i}" y="${pt}" width="${cw}" height="${H - pt - pb}"/><g data-g="${i}">`;
    segs.forEach((u, j) => { const hgt = Math.max(1, (H - pt - pb) * (x.o[u] / topo)), bot = base - (j ? 2 : 0), top = Math.min(bot - 1, base - hgt), r = Math.min(4, bw / 2, bot - top);   /* 2px de folga entre as unidades; a ponta de cima arredondada */

        : `<rect x="${cx - bw / 2}" y="${top}" width="${bw}" height="${bot - top}" fill="${corUni(u)}" style="pointer-events:none"/>`; base -= hgt; });
    s += '</g>'; if (i % cada === 0) s += `<text class="eixo" x="${cx}" y="${H - 8}" text-anchor="middle">${rotX(x.k, porMes)}</text>`; });

  box.innerHTML = leg + `<div class="grafico">${s}<div class="dica-g" hidden></div></div>` + tab;

      async () => { const s = $('#z-senha').value; if (!s) throw new Error('Digite a sua senha para confirmar.');
        const r = await api('fin_zerar', { senha: s, fornecedores: $('#z-forn').checked, freelas: $('#z-frel').checked }); D = null; aviso('Finanças zeradas ✓'); try { await carregar(); } catch (e) { /* a tela se acerta na próxima */ } mostra(); }); };
}
/* 1.54: o resumo do dia por e-mail (em Conta) */
async function ligarEmail() {
  const st = $('#em-status'), ta = $('#em-para'), cx = $('#em-auto'); if (!st || !ta || !cx) return;
  const mostra = E => { ta.value = (E.para || []).join('\n'); cx.checked = !!E.auto; st.innerHTML = emailStatus(E); };
  try { mostra((await api('email_ver')).email); } catch (e) { st.textContent = e.message; }
  const trava = on => ['em-salvar', 'em-hoje', 'em-ontem'].forEach(id => { const b = $('#' + id); if (b) b.disabled = on; });
  $('#em-salvar').onclick = async () => { trava(true); try { const r = await api('email_salvar', { para: ta.value, auto: cx.checked }); mostra(r.email); aviso('Salvo ✓'); } catch (e) { aviso(e.message); } trava(false); };
  const manda = async ontem => { trava(true); st.textContent = 'Mandando…'; const d = new Date(); if (ontem) d.setDate(d.getDate() - 1);
    try { const s = await api('email_salvar', { para: ta.value, auto: cx.checked }); mostra(s.email); const r = await api('email_enviar', { dia: isoDe(d) }); mostra(r.email); aviso('Mandado para ' + r.enviado.para.join(', ') + ' ✓'); }
    catch (e) { aviso(e.message); try { mostra((await api('email_ver')).email); } catch (x) { /* fica a mensagem */ } } trava(false); };
  $('#em-hoje').onclick = () => manda(false); $('#em-ontem').onclick = () => manda(true);
}

function tbHtml() {
  const it = (k, rot, ic) => `<button type="button" class="tb-it" data-aba="${k}">${ic}<span>${rot}</span></button>`;
  const grupos = []; ABAS.forEach(([k, n, ic, g0]) => { const g = g0 === 'conta' ? 'fin' : g0; let x = grupos.find(y => y.g === g);   /* (a Conta vai na última linha do Financeiro: o Menu cabe sem rolar) */ if (!x) { x = { g, itens: [] }; grupos.push(x); } x.itens.push([k, n, ic]); });

    <button type="button" class="tb-it" data-menu aria-expanded="false" aria-controls="tb-menu">${TB_IC.menu}<span>Menu</span></button>
    <button type="button" class="tb-fab" data-fab aria-label="Lançar" aria-expanded="false" aria-controls="tb-lancar">${TB_IC.mais}</button>
    <div class="tb-fundo-folha" hidden></div>

      <div class="tb-lancar">${lancar.map(([k, n, d, ic]) => `<button type="button" data-tbl="${k}">${ic}<b>${n}</b><small>${d}</small></button>`).join('')}</div></div>
    <div class="tb-folha" id="tb-menu" role="dialog" aria-label="Todas as telas" hidden>${grupos.map(x => `<div class="tb-grupo">${esc(nomeG[x.g] || '')}</div><div class="tb-menu">${x.itens.map(([k, n, ic]) => `<button type="button" data-aba="${k}" aria-label="${esc(n)}">${ic}<span>${TB_ROT[k] || n}</span></button>`).join('')}</div>`).join('')}</div>`;

function tbFechar() {
  const n = $('nav.tabbar'); if (!n) return;
  $$('.tb-folha, .tb-fundo-folha', n).forEach(x => { x.hidden = true; }); $$('[data-fab], [data-menu]', n).forEach(b => b.setAttribute('aria-expanded', 'false'));
}
function tbAbrir(qual) {
  const n = $('nav.tabbar'), f = $('#tb-' + qual); if (!n || !f) return; const ja = !f.hidden; tbFechar(); if (ja) return;
  f.hidden = false; $('.tb-fundo-folha', n).hidden = false; const b = $(qual === 'lancar' ? '[data-fab]' : '[data-menu]', n); if (b) b.setAttribute('aria-expanded', 'true');
}
async function tbLancar(o) {
  tbFechar();
  if (o === 'despesa' || o === 'receita') {   /* abre a tela dos lançamentos já no tipo certo, e o formulário do novo lançamento */
    GS.tipo = o; GS.dados = null; GS.pag = 0; gGuarda(); ABA = 'lanc'; desenhar(); window.scrollTo(0, 0);
    for (let i = 0; i < 80; i++) { const b = $('#tela [data-g="novo"]'); if (b && ABA === 'lanc' && GS.tipo === o) { b.click(); return; } await new Promise(r => setTimeout(r, 100)); }
    return;
  }
  ABA = o; desenhar(); window.scrollTo(0, 0);
}
function tbLigar() {
  const n = $('nav.tabbar'); if (!n) return;
  $('[data-fab]', n).onclick = () => tbAbrir('lancar'); $('[data-menu]', n).onclick = () => tbAbrir('menu');
  $('.tb-fundo-folha', n).onclick = tbFechar;
  $$('[data-tbl]', n).forEach(b => b.onclick = () => tbLancar(b.dataset.tbl));
  $$('#tb-menu [data-aba]', n).forEach(b => b.addEventListener('click', tbFechar));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') tbFechar(); });
}
function folha(titulo, corpo, rotOk, fazer) {
  const f = document.createElement('div'); f.className = 'fundo';
  f.innerHTML = `<form class="folha" novalidate role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><h3>${esc(titulo)}</h3>${corpo}<p class="erro" hidden></p><div class="acoes"><button type="button" class="btn btn-ghost" data-fechar>Cancelar</button><button class="btn btn-brand" type="submit">${esc(rotOk)}</button></div></form>`;
  document.body.appendChild(f); const fecha = () => f.remove(), er = $('.erro', f);
  let ini = null; f.addEventListener('pointerdown', e => { ini = e.target; });   // 1.5: arrastar para selecionar um texto e soltar no fundo não fecha
  f.addEventListener('click', e => { if ((e.target === f && ini === f && !String(getSelection() || '').trim()) || e.target.hasAttribute('data-fechar')) fecha(); });
  document.addEventListener('keydown', function k(e) { if (e.key === 'Escape') { fecha(); document.removeEventListener('keydown', k); } });
  $('form', f).onsubmit = async e => { e.preventDefault(); const b = $('[type="submit"]', f); b.disabled = true; er.hidden = true; try { await fazer(); fecha(); } catch (x) { er.textContent = x.message; er.hidden = false; b.disabled = false; } };
  setTimeout(() => { const i = $('input', f); if (i) i.focus(); }, 50);
}
