<!doctype html>
<html lang="pt-BR">
<head>

<style>
/* Play Space Insta (2.70): as conversas do Instagram e do WhatsApp da loja, para o gestor ver. A mesma cara do Play Space Notas: o creme,
   os cartões creme claro, o coral, a menta, Poppins nos títulos e Nunito nos textos, o menu de vidro no computador e a barra embaixo no celular */
:root { --bg: #FAF3E9; --card: #FFFBF4; --card2: #F5ECDF; --text: #3B3B3B; --muted: #6B655E; --line: #EADFD1; --brand: #E25B3F; --brand-d: #C9492E; --brand-soft: #F9D9D0;
  --mint: #DBE8DA; --green: #2F7F4E; --green-bg: #DDEFE3; --amber: #9A5F00; --amber-bg: #FBECC8; --red: #B8402A; --wa: #1FA855; --ig1: #F58529; --ig2: #DD2A7B; --ig3: #8134AF;
  --glass: rgba(255, 251, 244, .66); --glass-b: rgba(255, 255, 255, .9); --shadow: 0 1px 2px rgba(59, 59, 59, .04), 0 16px 40px rgba(120, 80, 50, .10);
  --font: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; --disp: "Poppins", "Nunito", -apple-system, sans-serif; color-scheme: light; }
* { box-sizing: border-box; } html, body { margin: 0; height: 100%; } [hidden] { display: none !important; }
body { background: var(--bg); color: var(--text); font: 16px/1.45 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
body::before { content: ""; position: fixed; inset: -20%; z-index: -1; background: radial-gradient(40% 35% at 12% 8%, rgba(240, 187, 95, .28), transparent 70%), radial-gradient(38% 34% at 92% 92%, rgba(143, 191, 176, .38), transparent 70%); }
button, input, textarea, select { font: inherit; color: inherit; } button { cursor: pointer; } a { color: var(--brand-d); }
.tap { transition: transform .15s cubic-bezier(.2, .8, .2, 1), background .15s; } .tap:active { transform: scale(.97); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 55%, transparent); outline-offset: 2px; border-radius: 10px; }

/* a moldura: menu (computador) | lista | conversa */
.app { display: grid; grid-template-columns: 250px minmax(320px, 400px) 1fr; gap: 16px; height: 100dvh; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); }
.menu { display: flex; flex-direction: column; gap: 6px; padding: 18px 14px; border-radius: 28px; background: var(--glass); border: 1px solid var(--glass-b); box-shadow: var(--shadow); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); min-height: 0; }
.marca { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; font: 700 18px/1.15 var(--disp); }
.marca-ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--ig1), var(--ig2) 55%, var(--ig3)); box-shadow: 0 6px 16px rgba(221, 42, 123, .28); flex: none; }
.marca small { display: block; font: 600 12px var(--font); color: var(--muted); }
.mi { display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 14px; border: 0; border-radius: 15px; background: transparent; font-weight: 700; text-align: left; color: var(--text); }
.mi:hover { background: rgba(255, 255, 255, .6); } .mi[aria-current="page"] { background: var(--brand-soft); color: var(--brand-d); }
.mi b { margin-left: auto; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; background: var(--brand); color: #fff; font: 700 12px/22px var(--font); text-align: center; }
.menu-pe { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 12px 8px 0; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.menu-pe a { font-weight: 700; text-decoration: none; }
.col { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.painel { background: var(--card); border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow); min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.titulo { display: flex; align-items: center; gap: 10px; padding: 6px 6px 12px; }
.titulo h1 { margin: 0; font: 800 30px/1.1 var(--disp); letter-spacing: -.02em; }
.titulo .sync { margin-left: auto; font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.ponto { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 rgba(47, 127, 78, .5); animation: pulsa 2.4s infinite; } .ponto.off { background: #C9BFB2; animation: none; }
@keyframes pulsa { 70% { box-shadow: 0 0 0 7px rgba(47, 127, 78, 0); } 100% { box-shadow: 0 0 0 0 rgba(47, 127, 78, 0); } }
.busca { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 15px; background: var(--card2); margin: 0 4px 10px; } .busca input { flex: 1; border: 0; background: none; outline: 0; min-width: 0; }
.seg { display: flex; gap: 6px; overflow-x: auto; padding: 0 4px 10px; scrollbar-width: none; } .seg::-webkit-scrollbar { display: none; }
.seg button { flex: none; height: 34px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-weight: 700; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--card); }
.lista { flex: 1; overflow-y: auto; padding: 4px 6px 10px; overscroll-behavior: contain; }
.cv { width: 100%; display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px; border: 0; border-radius: 18px; background: transparent; text-align: left; }
.cv:hover { background: rgba(245, 236, 223, .7); } .cv[aria-current="true"] { background: var(--brand-soft); }
.cv-t { display: flex; align-items: center; gap: 6px; min-width: 0; } .cv-t b { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cv-p { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; } .cv.nl .cv-p { color: var(--text); font-weight: 700; }
.cv-d { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; font-size: 12px; color: var(--muted); } .cv.nl .cv-d { color: var(--brand-d); font-weight: 800; }
.bolha-n { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 999px; background: var(--brand); color: #fff; font: 800 12px/22px var(--font); text-align: center; }
.tag { flex: none; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 999px; background: var(--green-bg); color: var(--green); } .tag.esp { background: var(--amber-bg); color: var(--amber); }
.av { position: relative; width: 52px; height: 52px; flex: none; } .av-i { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; font: 700 18px var(--disp); color: #fff; overflow: hidden; background: #C9A88E; }
.av-i img { width: 100%; height: 100%; object-fit: cover; }
.av .canal { position: absolute; right: -2px; bottom: -2px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; border: 2.5px solid var(--card); color: #fff; }
.canal.ig { background: linear-gradient(135deg, var(--ig1), var(--ig2) 55%, var(--ig3)); } .canal.wa { background: var(--wa); }
.vazio { text-align: center; color: var(--muted); padding: 40px 18px; } .vazio b { display: block; color: var(--text); font: 700 18px var(--disp); margin-bottom: 6px; }
.vazio .ilus { width: 76px; height: 76px; margin: 0 auto 14px; border-radius: 24px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--ig1), var(--ig2) 55%, var(--ig3)); }
.bt { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--card2); font-weight: 800; color: var(--text); text-decoration: none; }
.bt.forte { background: var(--brand); color: #fff; box-shadow: 0 8px 20px rgba(226, 91, 63, .28); } .bt.forte:hover { background: var(--brand-d); }
.bt.ink { background: var(--text); color: var(--card); } .bt.perigo { background: transparent; color: var(--red); border: 1.5px solid #EFC3B8; } .bt.peq { height: 36px; padding: 0 14px; font-size: 14px; }
.bt:disabled { opacity: .55; cursor: default; } .bt.largo { width: 100%; }

/* a conversa */
.cvs-cab { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); background: rgba(255, 251, 244, .9); }
.cvs-cab .av { width: 44px; height: 44px; } .cvs-cab .av-i { font-size: 15px; } .cvs-cab h2 { margin: 0; font: 700 18px/1.2 var(--disp); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cvs-cab .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .cvs-cab .txt { min-width: 0; flex: 1; }
.cvs-acoes { display: flex; gap: 8px; flex: none; }
.voltar { display: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--card2); place-items: center; flex: none; }
.cadastro { margin: 10px 18px 0; padding: 10px 14px; border-radius: 16px; background: var(--mint); font-size: 14px; display: flex; gap: 8px; align-items: center; }
.msgs { flex: 1; overflow-y: auto; padding: 18px 18px 8px; display: flex; flex-direction: column; gap: 4px; overscroll-behavior: contain;
  background: radial-gradient(circle at 1px 1px, rgba(120, 80, 50, .07) 1px, transparent 0) 0 0 / 22px 22px; }
.dia { align-self: center; margin: 12px 0 6px; padding: 4px 12px; border-radius: 999px; background: var(--card2); font-size: 12px; font-weight: 800; color: var(--muted); }
.m { max-width: min(78%, 560px); padding: 9px 13px 6px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 1px 1px rgba(59, 59, 59, .04); align-self: flex-start; word-wrap: break-word; white-space: pre-wrap; }
.m.loja { align-self: flex-end; background: #FCE3DB; border-color: #F4CBBE; } .m + .m.mesmo { margin-top: -1px; }
.m small { display: block; text-align: right; font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
.m .midia { display: block; max-width: 260px; max-height: 260px; border-radius: 12px; margin: 2px 0 4px; }
.m .tipo { font-weight: 700; color: var(--muted); }
.so-ver { padding: 12px 18px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.nada { flex: 1; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 30px; }
.nada .bolhas { width: 120px; height: 90px; margin: 0 auto 14px; position: relative; } .nada .bolhas i { position: absolute; border-radius: 18px; }
.nada .bolhas i:first-child { left: 0; top: 0; width: 84px; height: 46px; background: var(--card); border: 1px solid var(--line); } .nada .bolhas i:last-child { right: 0; bottom: 0; width: 72px; height: 40px; background: #FCE3DB; }

/* contas e avisos */
.folha { flex: 1; overflow-y: auto; padding: 4px 6px 30px; }
.caixa { background: var(--card); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); padding: 18px; margin-bottom: 16px; }
.caixa h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 4px; font: 700 20px var(--disp); } .caixa > p { margin: 0 0 12px; color: var(--muted); }
.caixa h2 .canal { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; color: #fff; }
.conta { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 4px 12px; align-items: center; padding: 12px; border-radius: 18px; background: var(--card2); margin-bottom: 8px; }
.conta .av { width: 44px; height: 44px; } .conta b { display: block; } .conta span { font-size: 13px; color: var(--muted); } .conta .erro { color: var(--red); }
.conta-bts { grid-column: 2; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
/* Contas e Avisos ocupam a largura da lista e da conversa (no computador) */
.app[data-tela="contas"] .lista-col, .app[data-tela="avisos"] .lista-col { grid-column: 2 / 4; width: 100%; max-width: 920px; }
.app[data-tela="contas"] .col.conversa, .app[data-tela="avisos"] .col.conversa { display: none; }
.est { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 13px; } .est::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.est.on { color: var(--green); } .est.off { color: var(--red); }
.campo { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; } .campo label { font-weight: 800; font-size: 14px; }
.campo input { height: 46px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line); background: #fff; outline: 0; } .campo input:focus { border-color: var(--brand); }
.dois { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.copia { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-radius: 12px; background: var(--card2); font: 600 13px/1.3 ui-monospace, Menlo, Consolas, monospace; word-break: break-all; }
.copia span { flex: 1; } .copia button { flex: none; height: 32px; padding: 0 12px; border-radius: 999px; border: 0; background: var(--text); color: var(--card); font: 800 12.5px var(--font); }
details.passos { border-radius: 18px; background: rgba(219, 232, 218, .55); padding: 0 14px; margin: 6px 0 14px; } details.passos summary { padding: 12px 0; font-weight: 800; cursor: pointer; }
details.passos ol { margin: 0 0 14px; padding-left: 20px; } details.passos li { margin: 0 0 10px; } details.passos li .copia { margin-top: 6px; }
.chave { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px; border-radius: 18px; background: var(--card2); }
.chave b { display: block; } .chave span { font-size: 14px; color: var(--muted); }
.switch { position: relative; width: 52px; height: 32px; flex: none; border: 0; border-radius: 999px; background: #D8CCBE; transition: background .2s; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .18); transition: transform .2s cubic-bezier(.2, .8, .2, 1); }
.switch[aria-checked="true"] { background: var(--green); } .switch[aria-checked="true"]::after { transform: translateX(20px); }
.aviso { padding: 12px 14px; border-radius: 16px; background: var(--amber-bg); color: #6E4600; font-size: 14px; margin: 10px 0; } .aviso.ok { background: var(--green-bg); color: var(--green); }

/* o QR Code e as janelas */
.fundo { position: fixed; inset: 0; z-index: 30; background: rgba(40, 30, 20, .38); display: grid; place-items: center; padding: 16px; animation: aparece .2s; }
.janela { width: min(440px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; background: var(--card); border-radius: 28px; padding: 22px; box-shadow: 0 30px 80px rgba(60, 30, 10, .25); animation: sobe .25s cubic-bezier(.2, .8, .2, 1); }
.janela h3 { margin: 0 0 6px; font: 700 21px var(--disp); } .janela p { margin: 0 0 12px; color: var(--muted); }
.qr { width: 260px; height: 260px; margin: 6px auto 14px; border-radius: 20px; background: #fff; border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; } .qr img { width: 100%; height: 100%; }
.janela-bts { display: flex; gap: 10px; justify-content: flex-end; margin-top: 12px; }
@keyframes aparece { from { opacity: 0; } } @keyframes sobe { from { transform: translateY(16px); opacity: 0; } }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 40; max-width: min(520px, calc(100% - 32px)); padding: 12px 18px; border-radius: 16px; background: var(--text); color: var(--card); font-weight: 700; box-shadow: 0 14px 30px rgba(0, 0, 0, .2); animation: sobe .25s; }
.carregando { display: grid; place-items: center; height: 100dvh; color: var(--muted); }
.barra { display: none; }

@media (max-width: 1100px) { .app { grid-template-columns: 84px minmax(300px, 360px) 1fr; } .menu { padding: 14px 10px; } .marca span, .mi span, .menu-pe { display: none; } .mi { justify-content: center; padding: 0; } .marca { justify-content: center; padding: 4px 0 14px; } .mi b { position: absolute; margin: -22px 0 0 26px; } .mi { position: relative; } }
@media (max-width: 760px) {
  body { overflow: auto; } .app { display: block; padding: 0; height: auto; min-height: 100dvh; } .menu { display: none; }
  .col { min-height: 100dvh; padding: max(12px, env(safe-area-inset-top)) 12px calc(86px + env(safe-area-inset-bottom)); }
  .col.conversa { position: fixed; inset: 0; z-index: 20; padding: 0; background: var(--bg); } .col.conversa .painel { border-radius: 0; border: 0; height: 100dvh; }
  .app[data-v="conversa"] .col.lista-col { display: none; } .app:not([data-v="conversa"]) .col.conversa { display: none; }
  .voltar { display: grid; } .cvs-cab { padding-top: max(12px, env(safe-area-inset-top)); } .cvs-acoes .bt span { display: none; }
  .lista { overflow: visible; } .painel.lista-p { overflow: visible; }
  .barra { display: flex; position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 15; gap: 4px; padding: 6px; border-radius: 999px; background: rgba(255, 251, 244, .82); border: 1px solid var(--glass-b); box-shadow: var(--shadow); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
  .barra button { position: relative; width: 62px; height: 50px; border: 0; border-radius: 999px; background: transparent; display: grid; place-items: center; color: var(--muted); }
  .barra button[aria-current="page"] { background: var(--brand-soft); color: var(--brand-d); } .barra b { position: absolute; top: 4px; right: 10px; min-width: 18px; height: 18px; border-radius: 999px; background: var(--brand); color: #fff; font: 800 11px/18px var(--font); }
  .dois { grid-template-columns: 1fr; } .conta-bts { grid-column: 1 / -1; }
  .titulo h1 { font-size: 28px; }
}
</style>
</head>

<div id="raiz"><div class="carregando">Carregando o Insta…</div></div>
<script>
'use strict';
/* ---------- o básico ---------- */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const IC = {
  conversas: '<path d="M21 12a8 8 0 0 1-11.8 7L4 20l1.1-4.4A8 8 0 1 1 21 12Z"/>', contas: '<path d="M10 14a3.5 3.5 0 0 0 5 0l3-3a3.5 3.5 0 0 0-5-5l-1 1"/><path d="M14 10a3.5 3.5 0 0 0-5 0l-3 3a3.5 3.5 0 0 0 5 5l1-1"/>',
  sino: '<path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/>', busca: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>', voltar: '<path d="m15 18-6-6 6-6"/>',
  ig: '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/>',
  wa: '<path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/><path d="M9.5 9.5c.3 1.5 1.5 3.2 3 4.2l1.2-.9 1.8.8-.4 1.6c-2.6.2-6.4-3.3-6.4-6l1.4-.6.8 1.8z" fill="currentColor" stroke="none"/>',
  ok: '<path d="m5 12 5 5L20 7"/>', copiar: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>', refaz: '<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>', fora: '<path d="M14 4h6v6"/><path d="M10 14 20 4"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>',
  casa: '<path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1Z"/>'
};
const ic = (p, n = 22, sw = 2) => `<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
async function api(acao, dados = {}, arquivo = '../api/conversas.php') {
  let r; try { r = await fetch(arquivo, { method: 'POST', credentials: 'same-origin', cache: 'no-store', headers: { 'Content-Type': 'application/json', 'X-Play': '1' }, body: JSON.stringify({ acao, ...dados }) }); }
  catch (e) { const x = new Error('Sem conexão. Confira a internet e tente de novo.'); x.status = 0; throw x; }
  let j = null; try { j = await r.json(); } catch (e) { }
  if (!r.ok || !j || j.ok === false) { const x = new Error((j && j.erro) || 'O servidor respondeu com erro ' + r.status + '.'); x.status = r.status; throw x; }
  return j;
}

}

  return `<div class="titulo"><h1>Avisos</h1></div><div class="folha"><div class="caixa"><h2>${ic(IC.sino, 22)} Aviso no celular</h2>
    <p>Quando um cliente começa uma conversa no Instagram ou no WhatsApp (a primeira mensagem, ou a primeira depois de um dia sem falar), o aviso chega no celular do gestor. Não apita a cada mensagem.</p>
    <div class="chave"><div><b>Avisar quando um cliente começar a conversar</b><span>Para todos os aparelhos do gestor com os avisos ligados.</span></div><button class="switch tap" role="switch" aria-checked="${E.avisos}" data-act="avisos" aria-label="Avisar quando um cliente começar a conversar"></button></div>
    <h3 style="font:700 16px var(--disp);margin:18px 0 8px">Este aparelho</h3>${htmlPush()}
    <p style="font-size:13.5px;color:var(--muted);margin-top:12px">São os mesmos avisos dos pedidos de autorização do Play Space: se este aparelho já recebe aqueles, já recebe estes também.</p></div></div>`;
}
async function pushLigar(el) {
  if (!pushPode()) return; el.disabled = true;
  try {
    if (await Notification.requestPermission() !== 'granted') { toast('Sem a permissão, os avisos não chegam.'); return; }
    const reg = await navigator.serviceWorker.register('../sw.js', { scope: '../' }); await navigator.serviceWorker.ready;
    const { chave } = await api('push_chave', {}, '../api/api.php'); let s = await reg.pushManager.getSubscription();
    if (!s) s = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: pushBytes(chave) });
    const j = s.toJSON(); await api('push_inscrever', { endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, aparelho: 'Insta · ' + (/iPhone/.test(navigator.userAgent) ? 'iPhone' : /Android/.test(navigator.userAgent) ? 'Android' : 'Computador') }, '../api/api.php');
    toast('Avisos ligados neste aparelho');
  } catch (e) { toast('Não deu para ligar os avisos: ' + e.message); }
  finally { el.disabled = false; pushEstado(); }
}

/* ---------- o QR Code do WhatsApp ---------- */
let QR = null;
function janela(html) { fecharJanela(); const f = document.createElement('div'); f.className = 'fundo'; f.innerHTML = `<div class="janela" role="dialog" aria-modal="true">${html}</div>`; f.addEventListener('click', e => { if (e.target === f) fecharJanela(); }); document.body.appendChild(f); return f; }
function fecharJanela() { const f = $('.fundo'); if (f) f.remove(); if (QR) { clearTimeout(QR.t); QR = null; } }
function mostrarQr(id, r) {
  if (!QR || QR.id !== id) { QR = { id, t: 0 }; janela(`<h3>Leia o QR Code</h3><p>No celular da loja: WhatsApp → <b>Aparelhos conectados</b> → <b>Conectar um aparelho</b> → aponte para o quadro.</p><div class="qr" id="qr"></div><p id="qr-txt" style="text-align:center;font-weight:700"></p><div class="janela-bts"><button class="bt tap" data-act="fechar">Fechar</button></div>`); }
  const q = $('#qr'), t = $('#qr-txt'); if (!q) return;
  if (r.estado === 'conectado') { fecharJanela(); toast('WhatsApp conectado. As conversas antigas estão chegando.'); carregar(); return; }
  q.innerHTML = r.qr ? `<img src="${esc(r.qr)}" alt="QR Code do WhatsApp">` : 'Gerando o QR Code…'; t.textContent = r.codigo ? 'Ou use o código: ' + r.codigo : 'O QR Code troca sozinho a cada poucos segundos.';
  QR.t = setTimeout(async () => { if (!QR || QR.id !== id) return; try { const d = await api('zap_qr', { conta: id }); E.contas = d.contas; mostrarQr(id, d.qr); } catch (e) { if (QR) { $('#qr-txt').textContent = e.message; QR.t = setTimeout(() => QR && mostrarQr(id, { estado: 'aguardando' }), 8000); } } }, 5000);
}
function pedirNome() {
  janela(`<h3>Conectar um número</h3><p>Um nome para reconhecer este número nas conversas.</p><div class="campo"><label for="zap-nome">Nome</label><input id="zap-nome" maxlength="40" placeholder="ex.: Morumbi" autocomplete="off"></div><div class="janela-bts"><button class="bt tap" data-act="fechar">Cancelar</button><button class="bt forte tap" data-act="zap-criar">Gerar o QR Code</button></div>`);
  setTimeout(() => { const i = $('#zap-nome'); if (i) { i.focus(); i.addEventListener('keydown', e => { if (e.key === 'Enter') $('[data-act="zap-criar"]').click(); }); } }, 50);
}

/* ---------- ao vivo: pergunta o que mudou a cada 12 s (parado com a aba escondida) ---------- */
let VIG = 0;
function vigiar() { clearInterval(VIG); VIG = setInterval(() => { if (!document.hidden) novidades(); }, 12000); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && E.carregou) novidades(); });
async function novidades() {
  try {
    const d = await api('novidades', { marca: E.marca }); if (!d.conversas.length) { E.marca = d.marca; return; } E.marca = d.marca;
    for (const c of d.conversas) { const i = E.conversas.findIndex(x => x.id === c.id); if (i >= 0) E.conversas.splice(i, 1); E.conversas.unshift(c); }
    E.conversas.sort((a, b) => String(b.em).localeCompare(String(a.em)));
    const aberta = E.aberta && d.conversas.find(c => c.id === E.aberta.id);
    if (E.tela === 'conversas') pintarLista();
    $$('.mi b, .barra b').forEach(b => b.remove()); const nl = naoLidasTotal(); if (nl) $$('[data-ir="conversas"]').forEach(b => b.insertAdjacentHTML('beforeend', `<b>${nl}</b>`));
    if (aberta) { const r = await api('conversa', { id: aberta.id }); E.msgs = r.mensagens; E.aberta = r.conversa; const c = E.conversas.find(x => x.id === aberta.id); if (c) c.naoLidas = 0; const m = $('#msgs'), noFim = m && m.scrollHeight - m.scrollTop - m.clientHeight < 80; const p = $('#conversa'); if (p) { p.innerHTML = htmlConversa(); if (noFim) rolarFim(); } pintarLista(); }
  } catch (e) { if (e.status === 401) semLogin(e.message); }
}

/* ---------- os toques ---------- */
function ir(t) { E.tela = t; if (t !== 'conversas') { E.aberta = null; history.replaceState(null, '', '#' + t); } else history.replaceState(null, '', E.aberta ? '#c=' + E.aberta.id : '#'); desenhar(); }
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-ir],[data-cv],[data-filtro],[data-conta],[data-act],[data-copiar]'); if (!el || el.disabled) return;
  if (el.dataset.ir) return ir(el.dataset.ir);
  if (el.dataset.cv) return abrir(+el.dataset.cv);
  if (el.dataset.filtro) { E.filtro = el.dataset.filtro; $$('[data-filtro]').forEach(b => b.setAttribute('aria-pressed', b === el)); return pintarLista(); }
  if (el.dataset.conta !== undefined && !el.dataset.act) { E.conta = el.dataset.conta; $$('[data-conta]').forEach(b => b.setAttribute('aria-pressed', b === el)); return pintarLista(); }
  if (el.dataset.copiar) return copiar(el.dataset.copiar);
  const a = el.dataset.act, id = el.dataset.id, ocupado = async f => { el.disabled = true; try { await f(); } catch (x) { toast(x.message); } finally { el.disabled = false; } };
  if (a === 'voltar') { E.aberta = null; history.replaceState(null, '', '#'); return desenhar(); }
  if (a === 'fechar') return fecharJanela();
  if (a === 'nao-lida') return ocupado(async () => { await api('lida', { id: E.aberta.id, naoLida: true }); const c = E.conversas.find(x => x.id === E.aberta.id); if (c) c.naoLidas = 1; E.aberta = null; history.replaceState(null, '', '#'); desenhar(); toast('Marcada como não lida'); });
  if (a === 'ig-salvar') return ocupado(async () => { const d = await api('ig_salvar', { appId: $('#ig-app').value, segredo: $('#ig-seg').value }); E.contas = d.contas; desenhar(); toast('Guardado. Agora toque em Conectar uma conta do Instagram.'); });
  if (a === 'ig-conectar') return ocupado(async () => { const d = await api('ig_conectar'); location.href = d.url; });
  if (a === 'ig-sync') return ocupado(async () => { const d = await api('ig_sincronizar', { conta: id }); E.contas = d.contas; toast(`Conferido: ${d.resultado.conversas} conversas com novidade, ${d.resultado.novas} mensagens novas`); await carregar(); });
  if (a === 'ig-sair') { if (!confirm('Desconectar esta conta do Instagram? As conversas guardadas continuam aqui.')) return; return ocupado(async () => { const d = await api('ig_sair', { conta: id }); E.contas = d.contas; desenhar(); }); }
  if (a === 'zap-salvar') return ocupado(async () => { const d = await api('zap_salvar', { url: $('#zap-url').value, chave: $('#zap-chave').value }); E.contas = d.contas; desenhar(); toast('O servidor do WhatsApp respondeu ✓ Agora toque em Conectar um número.'); });
  if (a === 'zap-novo') return pedirNome();
  if (a === 'zap-criar') return ocupado(async () => { const d = await api('zap_novo', { nome: $('#zap-nome').value }); E.contas = d.contas; QR = null; mostrarQr(d.conta, d.qr); });
  if (a === 'zap-qr') return ocupado(async () => { const d = await api('zap_qr', { conta: id }); E.contas = d.contas; mostrarQr(id, d.qr); });
  if (a === 'zap-hist') return ocupado(async () => { const d = await api('zap_historico', { conta: id }); E.contas = d.contas; toast(`Trazidas ${d.resultado.mensagens} mensagens de ${d.resultado.conversas} conversas`); await carregar(); });
  if (a === 'zap-sair') { if (!confirm('Desconectar este número? O celular da loja sai dos aparelhos conectados; as conversas guardadas continuam aqui.')) return; return ocupado(async () => { const d = await api('zap_sair', { conta: id }); E.contas = d.contas; desenhar(); }); }
  if (a === 'avisos') return ocupado(async () => { const d = await api('avisos', { ligar: !E.avisos }); E.avisos = d.avisos; el.setAttribute('aria-checked', E.avisos); toast(E.avisos ? 'Avisos de conversa nova ligados' : 'Avisos de conversa nova desligados'); });
  if (a === 'push-ligar') return pushLigar(el);
  if (a === 'push-teste') return ocupado(async () => { const d = await api('aviso_teste'); toast(d.enviados ? 'Aviso de teste enviado: deve chegar em instantes' : 'O aviso não saiu. Ligue os avisos de novo neste aparelho.'); });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('.fundo')) fecharJanela(); else if (E.aberta && innerWidth <= 760) $('[data-act="voltar"]')?.click(); } });

/* ---------- o endereço: #c=12 abre a conversa; #contas, #avisos; a volta do Instagram traz o resultado ---------- */
function rota() {
  const h = location.hash.slice(1), p = new URLSearchParams(h);
  if (p.has('contas')) { E.tela = 'contas'; desenhar(); toast(p.get('m') || (p.get('contas') === 'ok' ? 'Conta conectada' : 'Não deu para conectar'), 7000); history.replaceState(null, '', '#contas'); return; }
  if (h === 'contas' || h === 'avisos') { E.tela = h; desenhar(); return; }
  if (p.has('c')) abrir(+p.get('c'), true);
}
window.addEventListener('hashchange', rota);
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.ps === 'aviso' && e.data.url) { const u = new URL(e.data.url); if (u.pathname.endsWith('/insta/')) { location.hash = u.hash; novidades(); } } });
carregar();
</script>
</body>
